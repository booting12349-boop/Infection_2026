men is not recommended as a first-line treatment option in the DHHS treatment guidelines. Compared with other first line options, it is associated with a higher rate of virologic failure in patients with a baseline viral load greater than 100,000 copies/mL. This patient’s viral load is 195,000 copies/mL."], "ref": "1. U.S. Department of Health and Human Services. Guidelines for use of antiretroviral agents in adults and\nadolescents with HIV: what to start: initial combination regimens for people with HIV. https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/what-start-initial- combination-regimens?view=full (accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # 1.2 __________________________________________________________________________________________________", "level": 3, "stemKo": "HPI: 환자는 44세 남성 동성애자(men who have sex with men)로, 5년 전 정기 신체검사 중 HIV 감염을 진단받았다. 진단 당시 환자는 무증상이었다. 진단 이후 수년간 여러 차례 외래 진료 예약을 지키지 못했으나, 오늘 추적 관찰을 위해 내원하였고 HIV 치료제 시작을 준비하고 있다.\nPMH: 5년 전 진단된 HIV 감염, 고혈압, 이상지질혈증, 우울증, 제2형 당뇨병 SH: 흡연 없음, EtOH 주 1-2잔. 정규직으로 9시-5시 근무. 지난 1년간 2-3명의 파트너와 성관계를 가졌으며, 항상 콘돔을 사용한다.\n약물(모두 경구): hydrochlorothiazide 25 mg 1일 1회, atorvastatin 10 mg 1일 1회, sertraline 50 mg 1일 1회, metformin 500 mg 1일 2회, 그리고 간헐적인 속쓰림에 대해 필요시 제산제.\n알레르기: Sulfa\n신체검사는 특이 소견이 없다. VS: BP 127/84 mm Hg, HR 68 bpm, RR 18회/분, T 98.6°F, 체중 75 kg, 신장 5'9\"\n관련 검사치: SCr 0.8 mg/dL, AST 58 U/L, ALT 96 U/L, CD4 38 cells/mm3, HIV RNA 195,000 copies/mL, HIV 내성검사 음성, toxoplasmosis IgG 음성, G6PD 결핍 음성, HLA-B*5701 음성, HBsAg 양성, anti-HBs 음성, anti-HBc IgG 양성, anti-HBc IgM 음성, anti-HCV 음성, HBV 바이러스 부하 150,000 IU/mL.\n미국 보건복지부(U.S. Department of Health and Human Services, DHHS) 지침에 근거하여, 이 환자의 HIV 감염 치료를 위해 권장할 단일정 항레트로바이러스 요법으로 가장 적절한 것은?", "choicesKo": ["Dolutegravir/abacavir/lamivudine (Triumeq)", "Efavirenz/tenofovir disoproxil fumarate/emtricitabine (Atripla)", "Bictegravir/tenofovir alafenamide/emtricitabine (Biktarvy)", "Rilpivirine/tenofovir alafenamide/emtricitabine (Odefsey)"], "rationalesKo": ["이는 DHHS HIV 치료 지침에서 1차 치료 옵션으로 권장되는 단일정 요법이다. 환자의 HLA-B*5701 검사가 음성이므로 abacavir는 잠재적인 치료 선택지가 될 수 있다. 그러나 이 환자는 hepatitis B virus 감염도 동반하고 있는데, 이에 대해 lamivudine은 최적의 선택이 아니다. Tenofovir를 포함한 HIV 치료 요법이 선호된다.", "이 단일정 HIV 치료 요법은 DHHS 치료 지침에서 더 이상 1차 치료로 권장되지 않는다. 또한 이 환자는 우울증 병력이 있어, efavirenz와 자살 사고(suicidal ideation) 사이의 연관성을 고려할 때 이 HIV 치료 요법은 최적의 선택이 아니다.", "이 단일정 HIV 치료 요법은 DHHS HIV 치료 지침에서 1차 치료 옵션으로 권장된다. 이 요법은 tenofovir alafenamide를 포함하고 있으며, 이는 emtricitabine과 병용 시 이 환자의 hepatitis B virus 감염 치료에 권장되는 치료 옵션이다. Tenofovir alafenamide는 장기적인 신장 및 골 건강 측면에서 tenofovir disoproxil fumarate보다 선호될 수 있다. 환자 복약상담이 필요한 일부 약물상호작용 관련 우려가 있으나(예: 제산제 복용과 최소 2시간 간격을 두고 복용하거나 음식과 함께 동시에 복용해야 함), 이는 이 HIV 치료 요법 사용의 금기 사항은 아니다.", "이 단일정 HIV 치료 요법은 DHHS 치료 지침에서 1차 치료 옵션으로 권장되지 않는다. 다른 1차 치료 옵션과 비교할 때, 기저 바이러스 부하가 100,000 copies/mL를 초과하는 환자에서 바이러스학적 실패율이 더 높은 것과 연관되어 있다. 이 환자의 바이러스 부하는 195,000 copies/mL이다."]}, {"id": 32, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "HPI: The patient is a 44-year-old man who has sex with men who was diagnosed with HIV infection 5 years ago during a routine physical exam. At the time of diagnosis, the patient was asymptomatic. In the years following his diagnosis, he missed several clinic appointments, but he presents today for follow up and is ready to start HIV medications.\nPMH: HIV infection x 5 years, hypertension, dyslipidemia, depression, and type 2 diabetes mellitus SH: No tobacco, EtOH 1-2 drinks per week. Full time employed – works a 9-5 job. Sexually active with 2-3 partners in the last year; always uses condoms.\nMedications (all oral): hydrochlorothiazide 25 mg daily, atorvastatin 10 mg daily, sertraline 50 mg daily, metformin 500 mg twice daily, and antacids as needed for occasional heartburn.\nAllergy: Sulfa\nPhysical exam is unremarkable VS: BP 127/84 mm Hg, HR 68 bpm, RR 18 breaths/min, T 98.6°F, Wt 75 kg, Ht 5’9”\nPertinent Labs: SCr 0.8 mg/dL, AST 58 U/L, ALT 96 U/L, CD4 38 cells/mm3, HIV RNA 195,000 copies/mL, HIV resistance test negative, toxoplasmosis IgG negative, G6PD deficiency negative, HLA-B*5701 negative, HBsAg positive, anti-HBs negative, anti-HBc IgG positive, anti-HBc IgM negative, anti-HCV negative, HBV viral load 150,000 IU/mL.\nAlong with initiating antiretroviral therapy (ART), which of the following oral antimicrobial prophylaxis regimens for opportunistic infection would you recommend?", "choices": ["Dapsone 50 mg daily, pyrimethamine/leucovorin 50 mg/25 mg weekly, and azithromycin 1200 mg once weekly", "Dapsone 100 mg daily and azithromycin 1200 mg once weekly", "Dapsone 100 mg daily and fluconazole 100 mg daily", "Dapsone 100 mg daily alone"], "answer": 4, "rationales": ["This patient’s CD4 cell count is 38 cells/mm3, placing him at risk for several opportunistic infections, including oropharyngeal candidiasis, Pneumocystis pneumonia, toxoplasmosis, and disseminated Mycobacterium avium complex. Pneumocystis prophylaxis is required when the CD4 cell count drops below 200 cells/mm", "This patient’s CD4 cell count is 38 cells/mm3, placing him at risk for several opportunistic infections, including oropharyngeal candidiasis, Pneumocystis pneumonia, toxoplasmosis, and disseminated Mycobacterium avium complex. Pneumocystis prophylaxis is required when the CD4 cell count drops below 200 cells/mm", "The drug of choice is trimethoprim/sulfamethoxazole, but this patient is allergic to sulfa and may receive dapsone instead because his G6PD deficiency test is negative (the use of dapsone in patients with G6PD deficiency is associated with an increased risk for hemolysis). Because his CD4 cell count is also below 100 cells/mm3, this patient could be at risk for toxoplasmosis. However, his antibody test results indicate that he has never been exposed to toxoplasmosis, so he does not require prophylaxis. Lastly, because the patient’s CD4 cell count is below 50 cells/mm3, he is at risk for disseminated Mycobacterium avium complex, but does not require prophylaxis because he is initiating ART today. Therefore, this patient’s opportunistic infection prophylaxis regimen should consist of only dapsone 100 mg daily.", "This patient’s CD4 cell count is 38 cells/mm3, placing him at risk for several opportunistic infections, including oropharyngeal candidiasis, Pneumocystis pneumonia, toxoplasmosis, and disseminated Mycobacterium avium complex. Pneumocystis prophylaxis is required when the CD4 cell count drops below 200 cells/mm"], "ref": "1. Panel on Opportunistic Infections in HIV-Infected Adults and Adolescents. Guidelines for the prevention and\ntreatment of opportunistic infections in adults and adolescents with HIV: recommendations from the Centers for Disease Control and Prevention, the National Institutes of Health, and the HIV Medicine Association (HIVMA) of the Infectious Diseases Society of America Panel on Guidelines for the Prevention and Treatment of Opportunistic Infections in Adults and Adolescents with HIV—A Working Group of the Office of AIDS Research Advisory Council (OARAC). https://clinicalinfo.hiv.gov/sites/default/files/guidelines/documents/adult-adolescent-oi/guidelines-adult- adolescent-oi.pdf(accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.5 Knowledge # 1.16 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.5 Knowledge # 1.26 __________________________________________________________________________________________________", "level": 3, "stemKo": "HPI: 환자는 44세 남성 동성애자(men who have sex with men)로, 5년 전 정기 신체검사 중 HIV 감염을 진단받았다. 진단 당시 환자는 무증상이었다. 진단 이후 수년간 여러 차례 외래 진료 예약을 지키지 못했으나, 오늘 추적 관찰을 위해 내원하였고 HIV 치료제 시작을 준비하고 있다.\nPMH: HIV 감염 5년, 고혈압, 이상지질혈증, 우울증, 제2형 당뇨병 SH: 흡연 없음, EtOH 주 1-2잔. 정규직으로 9시-5시 근무. 지난 1년간 2-3명의 파트너와 성관계를 가졌으며, 항상 콘돔을 사용한다.\n약물(모두 경구): hydrochlorothiazide 25 mg 1일 1회, atorvastatin 10 mg 1일 1회, sertraline 50 mg 1일 1회, metformin 500 mg 1일 2회, 그리고 간헐적인 속쓰림에 대해 필요시 제산제.\n알레르기: Sulfa\n신체검사는 특이 소견이 없다. VS: BP 127/84 mm Hg, HR 68 bpm, RR 18회/분, T 98.6°F, 체중 75 kg, 신장 5'9\"\n관련 검사치: SCr 0.8 mg/dL, AST 58 U/L, ALT 96 U/L, CD4 38 cells/mm3, HIV RNA 195,000 copies/mL, HIV 내성검사 음성, toxoplasmosis IgG 음성, G6PD 결핍 음성, HLA-B*5701 음성, HBsAg 양성, anti-HBs 음성, anti-HBc IgG 양성, anti-HBc IgM 음성, anti-HCV 음성, HBV 바이러스 부하 150,000 IU/mL.\n항레트로바이러스 요법(ART) 시작과 함께, 기회감염 예방을 위해 권장할 경구 항균 예방요법으로 가장 적절한 것은?", "choicesKo": ["Dapsone 50 mg 1일 1회, pyrimethamine/leucovorin 50 mg/25 mg 주 1회, 그리고 azithromycin 1200 mg 주 1회", "Dapsone 100 mg 1일 1회 및 azithromycin 1200 mg 주 1회", "Dapsone 100 mg 1일 1회 및 fluconazole 100 mg 1일 1회", "Dapsone 100 mg 1일 1회 단독"], "rationalesKo": ["이 환자의 CD4 세포 수는 38 cells/mm3로, 구인두 칸디다증, Pneumocystis 폐렴, toxoplasmosis, 파종성 Mycobacterium avium complex를 포함한 여러 기회감염의 위험에 놓여 있다. CD4 세포 수가 200 cells/mm 미만으로 감소하면 Pneumocystis 예방요법이 필요하다", "이 환자의 CD4 세포 수는 38 cells/mm3로, 구인두 칸디다증, Pneumocystis 폐렴, toxoplasmosis, 파종성 Mycobacterium avium complex를 포함한 여러 기회감염의 위험에 놓여 있다. CD4 세포 수가 200 cells/mm 미만으로 감소하면 Pneumocystis 예방요법이 필요하다", "선택약은 trimethoprim/sulfamethoxazole이지만, 이 환자는 sulfa에 알레르기가 있으며 G6PD 결핍 검사가 음성이므로 대신 dapsone을 투여받을 수 있다(G6PD 결핍 환자에서 dapsone 사용은 용혈 위험 증가와 연관된다). 또한 CD4 세포 수가 100 cells/mm3 미만이므로 이 환자는 toxoplasmosis의 위험이 있을 수 있다. 그러나 항체 검사 결과는 그가 toxoplasmosis에 노출된 적이 없음을 시사하므로 예방요법이 필요하지 않다. 마지막으로, 환자의 CD4 세포 수가 50 cells/mm3 미만이므로 파종성 Mycobacterium avium complex의 위험이 있으나, 오늘 ART를 시작하기 때문에 예방요법은 필요하지 않다. 따라서 이 환자의 기회감염 예방요법은 dapsone 100 mg 1일 1회만으로 구성되어야 한다.", "이 환자의 CD4 세포 수는 38 cells/mm3로, 구인두 칸디다증, Pneumocystis 폐렴, toxoplasmosis, 파종성 Mycobacterium avium complex를 포함한 여러 기회감염의 위험에 놓여 있다. CD4 세포 수가 200 cells/mm 미만으로 감소하면 Pneumocystis 예방요법이 필요하다"]}, {"id": 33, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "A 55-year-old transgender woman (height 66 inches, weight 85 kg) with HIV infection recently initiated antiretroviral treatment (ART) with elvitegravir/cobicistat/tenofovir alafenamide/emtricitabine (Genvoya). After 4 weeks of ART, the patient’s HIV viral load is 12,000 copies/mL (baseline = 150,000 copies/mL) and the serum creatinine (SCr) has increased to 1.2 mg/dL (baseline 1.0 mg/dL). A repeat SCr measured 2 weeks later is also 1.2 mg/dL, and the urinalysis is negative for glucosuria and proteinuria. Which of the following recommendations should you make for this patient’s ART at this time?", "choices": ["Adjust the dose of ART based on renal insufficiency and reassess the renal function 2 weeks from now.", "Change the ART regimen due to tenofovir-associated nephrotoxicity and reassess the renal function 2 weeks from now.", "Change the ART regimen due to virologic failure and reassess the viral load for suppression 4 weeks from now.", "Continue the ART regimen and reassess the viral load for suppression 2 weeks from now."], "answer": 4, "rationales": ["This patient is not experiencing renal insufficiency. The rise in serum creatinine is caused only by the inhibition of active creatinine secretion in the proximal tubule by cobicistat. A change to this patient’s ART regimen would be needed because of renal insufficiency only if the estimated glomerular filtration rate (eGFR) was below 30 mL/min, but the eGFR in this patient is approximately 96 mL/min based on age, sex, weight, and serum creatinine using the Cockcroft-Gault formula. If dose adjustment was needed because of renal insufficiency, a different single-tablet combination product would be required because elvitegravir is available only coformulated with cobicistat/tenofovir alafenamide/emtricitabine (i.e., Genvoya) or cobicistat/tenofovir disoproxil fumarate/emtricitabine (Stribild).", "This patient is not experiencing tenofovir-associated nephrotoxicity. Although nephrotoxicity can result from the use of tenofovir disoproxil fumarate, it has not been associated with tenofovir alafenamide in clinical trials. This patient is taking tenofovir alafenamide. Patients with tenofovir-associated nephrotoxicity often present with evidence of proximal tubule injury (i.e., a positive urinalysis with glucosuria and proteinuria). This patient has a negative urinalysis for glucosuria and proteinuria.", "This patient is not experiencing virologic failure. The viral load has decreased more than 10-fold after 4 weeks of ART, which is the expected response to ART.", "A small (10-20%) increase in serum creatinine (SCr) is often seen after initiation of cobicistat-containing ART regimens because cobicistat inhibits active creatinine secretion in the proximal tubule. This increase occurs within 2 weeks after starting the agent, and the SCr reaches a plateau. A negative urinalysis for glucosuria and proteinuria can be helpful in confirming the lack of kidney injury. This patient’s viral load is responding appropriately to ART, decreasing more than 10-fold within 4 weeks after starting ART. Therefore, there is no reason to think this ART regimen is failing at this time. Continuing ART and rechecking the viral load 2 weeks from now are appropriate for this patient."], "ref": "1. U.S. Department of Health and Human Services. Guidelines for use of antiretroviral agents in adults and\nadolescents with HIV: what to start: initial combination regimens for the antiretroviral-naive patient. https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/what-start-initial- combination-regimens?view=full (accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.2 Knowledge # 1.22 __________________________________________________________________________________________________", "level": 3, "stemKo": "HIV 감염이 있는 55세 트랜스젠더 여성(신장 66인치, 체중 85 kg)이 최근 elvitegravir/cobicistat/tenofovir alafenamide/emtricitabine (Genvoya)로 항레트로바이러스 치료(ART)를 시작하였다. ART 4주 후 환자의 HIV 바이러스 부하는 12,000 copies/mL(기저치 = 150,000 copies/mL)이고, 혈청 크레아티닌(SCr)은 1.2 mg/dL(기저치 1.0 mg/dL)로 상승하였다. 2주 후 재측정한 SCr도 1.2 mg/dL이며, 소변검사에서 당뇨(glucosuria) 및 단백뇨(proteinuria)는 음성이다. 현시점에서 이 환자의 ART에 대해 권고할 사항으로 가장 적절한 것은?", "choicesKo": ["신기능 저하에 근거하여 ART 용량을 조절하고 2주 후 신기능을 재평가한다.", "Tenofovir 관련 신독성 때문에 ART 요법을 변경하고 2주 후 신기능을 재평가한다.", "바이러스학적 실패 때문에 ART 요법을 변경하고 4주 후 바이러스 부하의 억제 여부를 재평가한다.", "ART 요법을 지속하고 2주 후 바이러스 부하의 억제 여부를 재평가한다."], "rationalesKo": ["이 환자는 신기능 저하를 겪고 있지 않다. 혈청 크레아티닌의 상승은 오직 cobicistat에 의한 근위세뇨관에서의 능동적 크레아티닌 분비 억제로 인한 것이다. 이 환자의 ART 요법을 신기능 저하 때문에 변경해야 하는 경우는 추정 사구체여과율(eGFR)이 30 mL/min 미만일 때뿐인데, 이 환자의 eGFR은 Cockcroft-Gault 공식을 이용하여 연령, 성별, 체중, 혈청 크레아티닌에 근거할 때 약 96 mL/min이다. 만약 신기능 저하로 인해 용량 조절이 필요했다면, elvitegravir는 cobicistat/tenofovir alafenamide/emtricitabine(즉, Genvoya) 또는 cobicistat/tenofovir disoproxil fumarate/emtricitabine (Stribild)과의 복합제로만 이용 가능하기 때문에 다른 단일정 복합제제가 필요했을 것이다.", "이 환자는 tenofovir 관련 신독성을 겪고 있지 않다. Tenofovir disoproxil fumarate 사용으로 신독성이 발생할 수 있으나, 임상시험에서 tenofovir alafenamide와는 연관되지 않았다. 이 환자는 tenofovir alafenamide를 복용하고 있다. Tenofovir 관련 신독성이 있는 환자는 흔히 근위세뇨관 손상의 증거(즉, 당뇨 및 단백뇨를 동반한 양성 소변검사)를 보인다. 이 환자는 당뇨 및 단백뇨에 대해 소변검사가 음성이다.", "이 환자는 바이러스학적 실패를 겪고 있지 않다. ART 4주 후 바이러스 부하가 10배 이상 감소하였으며, 이는 ART에 대한 예상되는 반응이다.", "Cobicistat는 근위세뇨관에서 능동적 크레아티닌 분비를 억제하기 때문에 cobicistat를 포함한 ART 요법 시작 후 혈청 크레아티닌(SCr)의 소폭(10-20%) 상승이 흔히 관찰된다. 이러한 상승은 약제 시작 후 2주 이내에 발생하며, SCr은 이후 안정기(plateau)에 도달한다. 당뇨 및 단백뇨에 대한 음성 소변검사는 신손상이 없음을 확인하는 데 도움이 될 수 있다. 이 환자의 바이러스 부하는 ART 시작 후 4주 이내에 10배 이상 감소하여 ART에 적절히 반응하고 있다. 따라서 현시점에서 이 ART 요법이 실패하고 있다고 생각할 이유가 없다. ART를 지속하고 2주 후 바이러스 부하를 재검하는 것이 이 환자에게 적절하다."]}, {"id": 34, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "JB is a 34-year-old African American man who presents to the outpatient HIV clinic to review the results of his HIV testing. He is currently asymptomatic and on no medications, but 1 week ago he recovered from a cold with fevers and gastrointestinal upset. He is tested routinely for HIV and last received a negative result with a HIV ag/ab test 3 months ago. He is sexually active with one male partner who recently tested positive for HIV infection and is not yet on antiretroviral therapy (ART). They do not use protection consistently. JB was tested last week by his primary care doctor and had the following results:\nHIV ag/ab test = positive HIV-1/HIV-2 differentiation assay = negative\nWhich of the following statements best represents your assessment of JB’s HIV status?", "choices": ["JB could have acute HIV infection and should receive an HIV viral load test to confirm the diagnosis.", "JB does not have HIV infection, but he should receive counseling on risk-reduction strategies and be retested 3 months from now.", "JB has chronic HIV infection and should be initiated on ART as soon as possible.", "JB could have chronic HIV infection and should receive an HIV Western blot test to confirm the diagnosis."], "answer": 1, "rationales": ["JB is at high risk of HIV infection because he is sexually active with a known HIV-positive partner who is not on ART, and they are not consistently using protection. His HIV ag/ab test is positive, but his HIV-1/HIV-2 differentiation test is negative. These results in conjunction with JB’s recent flu-like illness are highly suspect and suggest the presence of acute HIV infection. The HIV ag/ab test can be positive shortly after HIV exposure and prior to the development of antibodies because it detects the HIV p24 antigen. The follow-up HIV-1/HIV- 2 differentiation assay can be negative during acute or early infection because it detects antibodies to HIV, which may not have formed yet following HIV exposure. According to the Centers for Disease Control and Prevention HIV testing guidelines, JB should undergo an HIV viral load test to determine whether he has acute or early infection.", "JB may have HIV infection given his positive ag/ab test. He should receive additional testing now (not 3 months from now) with an HIV viral load test to confirm his HIV status.", "It is unclear whether JB has HIV infection. If he does, he probably is in the acute phase of infection given the discordance between his ag/ab test and HIV-1/HIV-2 differentiation assay. If he does have HIV infection, he should receive ART as soon as possible.", "A Western blot test will not be helpful in confirming a diagnosis of HIV in JB. The test detects antibodies to HIV, which probably have not yet formed if JB is in the early or acute phase of infection."], "ref": "1. Centers for Disease Control and Prevention and Association of Public Health Laboratories. Laboratory testing for the diagnosis of HIV infection: updated recommendations. June 27, 2014. http://stacks.cdc.gov/view/cdc/23447 (accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 2.2 Task # Knowledge # 2.6 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # 1.16 RUBRIC #3: BCIDP - ID Domain # 1 Task # 1.4 Knowledge # 1.14 __________________________________________________________________________________________________", "level": 3, "stemKo": "JB는 34세 아프리카계 미국인 남성으로 HIV 검사 결과를 확인하기 위해 외래 HIV 클리닉에 내원하였다. 현재 무증상이며 복용 중인 약물은 없으나, 1주 전 발열과 위장관 장애를 동반한 감기에서 회복되었다. 그는 정기적으로 HIV 검사를 받고 있으며, 3개월 전 HIV ag/ab 검사에서 마지막으로 음성 결과를 받았다. 그는 최근 HIV 감염 양성 판정을 받았고 아직 항레트로바이러스 요법(ART)을 시작하지 않은 남성 파트너 1명과 성관계를 하고 있다. 이들은 일관되게 피임기구를 사용하지는 않는다. JB는 지난주 주치의에게 검사를 받았고 다음과 같은 결과를 얻었다.\nHIV ag/ab 검사 = 양성, HIV-1/HIV-2 감별검사(differentiation assay) = 음성\nJB의 HIV 상태에 대한 평가로 가장 적절한 것은?", "choicesKo": ["JB는 급성 HIV 감염일 수 있으며, 진단 확인을 위해 HIV 바이러스 부하 검사를 받아야 한다.", "JB는 HIV 감염이 아니지만, 위험 감소 전략에 대한 상담을 받고 지금부터 3개월 후에 재검사를 받아야 한다.", "JB는 만성 HIV 감염이며 가능한 한 빨리 ART를 시작해야 한다.", "JB는 만성 HIV 감염일 수 있으며, 진단 확인을 위해 HIV Western blot 검사를 받아야 한다."], "rationalesKo": ["JB는 ART를 받고 있지 않은 HIV 양성으로 알려진 파트너와 성관계를 하고 있고 일관되게 피임기구를 사용하지 않으므로 HIV 감염의 고위험군이다. 그의 HIV ag/ab 검사는 양성이지만 HIV-1/HIV-2 감별검사는 음성이다. 이러한 결과는 JB의 최근 독감 유사 질환과 함께 매우 의심스러우며 급성 HIV 감염의 존재를 시사한다. HIV ag/ab 검사는 HIV p24 항원을 검출하기 때문에 HIV 노출 직후 항체가 형성되기 전에도 양성일 수 있다. 후속 HIV-1/HIV-2 감별검사는 HIV에 대한 항체를 검출하는데, 이 항체는 HIV 노출 후 아직 형성되지 않았을 수 있으므로 급성 또는 초기 감염 시기에는 음성일 수 있다. 미국 질병통제예방센터(Centers for Disease Control and Prevention)의 HIV 검사 지침에 따르면, JB는 급성 또는 초기 감염 여부를 확인하기 위해 HIV 바이러스 부하 검사를 받아야 한다.", "JB는 ag/ab 검사가 양성이므로 HIV 감염일 수 있다. 그는 HIV 상태를 확인하기 위해 (3개월 후가 아니라) 지금 HIV 바이러스 부하 검사로 추가 검사를 받아야 한다.", "JB가 HIV 감염인지는 불확실하다. 만약 감염되었다면, ag/ab 검사와 HIV-1/HIV-2 감별검사 간의 불일치를 고려할 때 아마도 감염의 급성기에 있을 것이다. 만약 HIV 감염이 확인된다면 가능한 한 빨리 ART를 받아야 한다.", "Western blot 검사는 JB의 HIV 진단을 확인하는 데 도움이 되지 않는다. 이 검사는 HIV에 대한 항체를 검출하는데, JB가 감염의 초기 또는 급성기에 있다면 이 항체는 아직 형성되지 않았을 가능성이 높다."]}, {"id": 35, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "A male patient who is newly diagnosed with HIV infection and Pneumocystis jirovecii pneumonia has been receiving appropriate treatment for his opportunistic infection in the hospital’s intensive care unit for the last 5 days. His condition has improved considerably, and he will be transferred to a general medical floor shortly. Pertinent laboratory values include the following:\nSCr 0.8 mg/dL, AST 15 U/L, ALT 25 U/L, CD4 115 cells/mm3, HIV RNA 187,000 copies/mL, HIV resistance test negative, HLA-B*5701 positive, HBsAg negative, anti-HBs positive, anti-HBc IgG positive, anti-HCV negative\nWhich of the following antiretroviral therapy (ART) plans would you recommend for this patient at this time based on available data from clinical trials and recommendations from the Centers for Disease Control and Prevention (CDC), the National Institutes of Health (NIH), and HIV Medicine Association (HIVMA)?", "choices": ["Initiate dolutegravir (Tivicay) and tenofovir alafenamide/emtricitabine (Descovy) within 2 weeks after starting treatment for his opportunistic infection, if possible.", "Initiate dolutegravir/abacavir/lamivudine (Triumeq) 2 weeks before the treatment of his opportunistic infection is completed, if possible.", "Initiate dolutegravir/lamivudine (Dovato) 2 weeks after completion of treatment for his opportunistic infection.", "Initiate bictegravir/tenofovir alafenamide/emtricitabine (Biktarvy) 2 weeks after completion of treatment for his opportunistic infection."], "answer": 1, "rationales": ["If possible, this patient’s ART should be initiated within 2 weeks after starting treatment for Pneumocystis pneumonia based on data from clinical trials and recommendations from the CDC, NIH, and HIVMA. Initiating dolutegravir (Tivicay) and tenofovir alafenamide/emtricitabine (Descovy) within 2 weeks after starting treatment for this patient’s opportunistic infection is the only choice that is consistent with these data and recommendations and provides safe and appropriate treatment for this patient.", "Dolutegravir/abacavir/lamivudine (Triumeq) is not appropriate for this patient who is HLA-B*5701 positive, which increases the risk of a severe hypersensitivity reaction to abacavir.", "Dolutegravir/lamivudine (Dovato) is an appropriate ART recommendation, but the timing of initiation 2 weeks after completion of treatment for the opportunistic infection is suboptimal. Initiation of ART within 2 weeks after starting treatment for this patient’s opportunistic infection is preferred.", "Bictegravir/tenofovir alafenamide/emtricitabine (Biktarvy) is an appropriate ART recommendation, but the timing of initiation 2 weeks after completion of treatment for the opportunistic infection is suboptimal. Initiation of ART within 2 weeks after starting treatment for this patient’s opportunistic infection is preferred."], "ref": "1. Panel on Opportunistic Infections in HIV-Infected Adults and Adolescents with HIV. Guidelines for the prevention\nand treatment of opportunistic infections in adults and adolescents with HIV: recommendations from the Centers for Disease Control and Prevention, the National Institutes of Health, and the HIV Medicine Association (HIVMA) of the Infectious Diseases Society of America Panel on Guidelines for the Prevention and Treatment of Opportunistic Infections in Adults and Adolescents with HIV—A Working Group of the Office of AIDS Research Advisory Council (OARAC). https://clinicalinfo.hiv.gov/sites/default/files/guidelines/documents/adult- adolescent-oi/guidelines-adult-adolescent-oi.pdf (accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.6 Knowledge # 1.2 __________________________________________________________________________________________________", "level": 3, "stemKo": "HIV 감염과 Pneumocystis jirovecii 폐렴을 새로 진단받은 남성 환자가 지난 5일간 병원 중환자실에서 자신의 기회감염에 대해 적절한 치료를 받아 왔다. 그의 상태는 상당히 호전되었으며 곧 일반 병동으로 전실될 예정이다. 관련 검사치는 다음과 같다.\nSCr 0.8 mg/dL, AST 15 U/L, ALT 25 U/L, CD4 115 cells/mm3, HIV RNA 187,000 copies/mL, HIV 내성검사 음성, HLA-B*5701 양성, HBsAg 음성, anti-HBs 양성, anti-HBc IgG 양성, anti-HCV 음성\n임상시험에서 이용 가능한 자료와 미국 질병통제예방센터(CDC), 국립보건원(NIH), 미국 HIV 의학회(HIVMA)의 권고에 근거할 때, 현시점에서 이 환자에게 권장할 항레트로바이러스 치료(ART) 계획으로 가장 적절한 것은?", "choicesKo": ["가능하다면 기회감염 치료 시작 후 2주 이내에 dolutegravir (Tivicay)와 tenofovir alafenamide/emtricitabine (Descovy)을 시작한다.", "가능하다면 기회감염 치료가 완료되기 2주 전에 dolutegravir/abacavir/lamivudine (Triumeq)을 시작한다.", "기회감염 치료 완료 2주 후에 dolutegravir/lamivudine (Dovato)을 시작한다.", "기회감염 치료 완료 2주 후에 bictegravir/tenofovir alafenamide/emtricitabine (Biktarvy)을 시작한다."], "rationalesKo": ["임상시험 자료와 CDC, NIH, HIVMA의 권고에 근거할 때, 가능하다면 이 환자의 ART는 Pneumocystis 폐렴 치료 시작 후 2주 이내에 시작해야 한다. 이 환자의 기회감염 치료 시작 후 2주 이내에 dolutegravir (Tivicay)와 tenofovir alafenamide/emtricitabine (Descovy)을 시작하는 것이 이러한 자료 및 권고에 부합하면서 이 환자에게 안전하고 적절한 치료를 제공하는 유일한 선택지이다.", "Dolutegravir/abacavir/lamivudine (Triumeq)은 HLA-B*5701 양성인 이 환자에게 적절하지 않은데, 이는 abacavir에 대한 중증 과민반응의 위험을 증가시키기 때문이다.", "Dolutegravir/lamivudine (Dovato)은 적절한 ART 권고안이지만, 기회감염 치료 완료 2주 후라는 시작 시점은 최적이 아니다. 이 환자의 기회감염 치료 시작 후 2주 이내에 ART를 시작하는 것이 선호된다.", "Bictegravir/tenofovir alafenamide/emtricitabine (Biktarvy)은 적절한 ART 권고안이지만, 기회감염 치료 완료 2주 후라는 시작 시점은 최적이 아니다. 이 환자의 기회감염 치료 시작 후 2주 이내에 ART를 시작하는 것이 선호된다."]}, {"id": 36, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "A patient diagnosed with HIV infection and cryptococcal meningitis with a baseline CD4 cell count of 89 cells/mm3 received appropriate treatment for the acute opportunistic infection and is now receiving oral fluconazole 200 mg daily as maintenance therapy in addition to antiretroviral therapy (ART). He has received 14 months of treatment for his opportunistic infection and is also currently receiving prophylaxis for Pneumocystis pneumonia and toxoplasmosis with trimethoprim/sulfamethoxazole. His HIV viral load is now undetectable. His CD4 cell count is now 185 cells/mm3 and has been over 100 cells/mm3 for the last 3 months. What do you recommend regarding this patient’s opportunistic infection treatment and prophylaxis regimens?", "choices": ["Continue both fluconazole and trimethoprim/sulfamethoxazole until the CD4 cell count is greater than 200 cells/mm3 for at least 3 months.", "Continue both fluconazole and trimethoprim/sulfamethoxazole until the CD4 cell count is greater than 200 cells/mm3 for at least 6 months.", "Discontinue fluconazole, but continue trimethoprim/sulfamethoxazole until the CD4 cell count is greater than 200 cells/mm3 for at least 3 months.", "Discontinue trimethoprim/sulfamethoxazole, but continue fluconazole until the CD4 cell count is greater than 100 cells/mm3 for at least 6 months."], "answer": 3, "rationales": ["Fluconazole can be discontinued at this time since more than a year of treatment for cryptococcal meningitis has been completed, the patient is asymptomatic, and he has seen his CD4 cell count rise to above 100 cells/mm3 in response to ART for at least 3 months.", "Fluconazole can be discontinued at this time since more than a year of treatment for cryptococcal meningitis has been completed, the patient is asymptomatic, and he has seen his CD4 cell count rise to above 100 cells/mm3 in response to ART for at least 3 months.", "Fluconazole can be discontinued at this time because more than 1 year of treatment for cryptococcal meningitis has been completed, the patient is asymptomatic, and his CD4 cell count has risen above 100 cells/mm3 in response to ART for at least 3 months. Trimethoprim/sulfamethoxazole should be continued as prophylaxis for Pneumocystis pneumonia and toxoplasmosis as long as the patient’s CD4 cell count remains below 200 cells/mm3, according to opportunistic infection treatment guidelines.", "Fluconazole can be discontinued at this time because more than 1 year of treatment for cryptococcal meningitis has been completed, the patient is asymptomatic, and his CD4 cell count has risen above 100 cells/mm3 in response to ART for at least 3 months. Trimethoprim/sulfamethoxazole should be continued as prophylaxis for Pneumocystis pneumonia and toxoplasmosis as long as the patient’s CD4 cell count remains below 200 cells/mm3, according to opportunistic infection treatment guidelines."], "ref": "1. Panel on Opportunistic Infections in Adults and Adolescents with HIV. Guidelines for the prevention and\ntreatment of opportunistic infections in adults and adolescents with HIV: recommendations from the Centers for Disease Control and Prevention, the National Institutes of Health, and the HIV Medicine Association (HIVMA) of the Infectious Diseases Society of America Panel on Guidelines for the Prevention and Treatment of Opportunistic Infections in Adults and Adolescents with HIV—A Working Group of the Office of AIDS Research Advisory Council (OARAC). https://clinicalinfo.hiv.gov/sites/default/files/guidelines/documents/adult- adolescent-oi/guidelines-adult-adolescent-oi.pdf (accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.5 Knowledge # 1.22 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.5 Knowledge # 1.26 __________________________________________________________________________________________________", "level": 3, "stemKo": "HIV 감염과 cryptococcal meningitis를 진단받은 환자로 기저 CD4 세포 수는 89 cells/mm3였으며, 급성 기회감염에 대해 적절한 치료를 받았고 현재는 항레트로바이러스요법(ART)과 함께 유지요법으로 경구 fluconazole 200 mg을 매일 투여받고 있다. 이 환자는 기회감염에 대한 치료를 14개월간 받았으며, 현재 trimethoprim/sulfamethoxazole로 Pneumocystis pneumonia 및 toxoplasmosis에 대한 예방요법도 함께 받고 있다. 현재 HIV 바이러스 부하는 검출되지 않는다. CD4 세포 수는 현재 185 cells/mm3이며 지난 3개월간 100 cells/mm3를 초과하여 유지되었다. 이 환자의 기회감염 치료 및 예방요법에 대해 권고할 사항으로 가장 적절한 것은?", "choicesKo": ["CD4 세포 수가 최소 3개월간 200 cells/mm3를 초과할 때까지 fluconazole과 trimethoprim/sulfamethoxazole을 모두 지속한다.", "CD4 세포 수가 최소 6개월간 200 cells/mm3를 초과할 때까지 fluconazole과 trimethoprim/sulfamethoxazole을 모두 지속한다.", "fluconazole은 중단하되, CD4 세포 수가 최소 3개월간 200 cells/mm3를 초과할 때까지 trimethoprim/sulfamethoxazole은 지속한다.", "trimethoprim/sulfamethoxazole은 중단하되, CD4 세포 수가 최소 6개월간 100 cells/mm3를 초과할 때까지 fluconazole은 지속한다."], "rationalesKo": ["cryptococcal meningitis에 대한 치료를 1년 이상 완료하였고, 환자는 무증상이며, ART에 반응하여 CD4 세포 수가 최소 3개월간 100 cells/mm3를 초과하도록 상승하였으므로 현 시점에서 fluconazole은 중단할 수 있다.", "cryptococcal meningitis에 대한 치료를 1년 이상 완료하였고, 환자는 무증상이며, ART에 반응하여 CD4 세포 수가 최소 3개월간 100 cells/mm3를 초과하도록 상승하였으므로 현 시점에서 fluconazole은 중단할 수 있다.", "cryptococcal meningitis에 대한 치료를 1년 이상 완료하였고, 환자는 무증상이며, ART에 반응하여 CD4 세포 수가 최소 3개월간 100 cells/mm3를 초과하도록 상승하였으므로 현 시점에서 fluconazole은 중단할 수 있다. 기회감염 치료 지침에 따르면 trimethoprim/sulfamethoxazole은 환자의 CD4 세포 수가 200 cells/mm3 미만으로 유지되는 동안에는 Pneumocystis pneumonia 및 toxoplasmosis에 대한 예방요법으로 계속 투여해야 한다.", "cryptococcal meningitis에 대한 치료를 1년 이상 완료하였고, 환자는 무증상이며, ART에 반응하여 CD4 세포 수가 최소 3개월간 100 cells/mm3를 초과하도록 상승하였으므로 현 시점에서 fluconazole은 중단할 수 있다. 기회감염 치료 지침에 따르면 trimethoprim/sulfamethoxazole은 환자의 CD4 세포 수가 200 cells/mm3 미만으로 유지되는 동안에는 Pneumocystis pneumonia 및 toxoplasmosis에 대한 예방요법으로 계속 투여해야 한다."]}, {"id": 37, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "A 33-year-old transgender man with newly diagnosed HIV infection and a baseline CD4 cell count of 32 cells/mm3 was found to have disseminated Mycobacterium avium infection upon presentation. The patient is currently receiving treatment with azithromycin 600 mg daily, ethambutol 1200 mg daily, and rifabutin 300 mg daily and will begin antiretroviral therapy (ART) in the coming days. The patient’s current vital signs and pertinent laboratory values include the following:\nVital Signs: BP 129/84 mm Hg, HR 68 bpm, RR 17 breaths/min, T 98.6°F, Wt 80 kg, Ht 5’8”\nLabs: SCr 1.0 mg/dL, AST 18 U/L, ALT 26 U/L, CD4 38 cells/mm3, HIV RNA 515,000 copies/mL, HIV resistance test negative, toxoplasmosis IgG negative, G6PD deficiency negative, HLA-B*5701 negative, HBsAg negative, anti-HBs negative, anti-HBc IgG negative, anti-HCV negative\nWhich of the following represents the best pharmacotherapy plan for this patient’s ART and antimycobacterial therapy taking into consideration the potential for drug-drug interactions?", "choices": ["Initiate dolutegravir/lamivudine (Dovato) using a dolutegravir dosage of 50 mg twice daily instead of the 50 mg once daily recommended for patients not receiving antimycobacterial therapy.", "Initiate dolutegravir/abacavir/lamivudine (Triumeq) and make no adjustments to the patient’s antimycobacterial therapy.", "Initiate elvitegravir/cobicistat/tenofovir alafenamide/emtricitabine (Genvoya), but decrease rifabutin from 300 mg daily to 150 mg daily.", "Initiate bictegravir/tenofovir alafenamide/emtricitabine (Biktarvy) and make no adjustments to the patient’s antimycobacterial therapy."], "answer": 2, "rationales": ["None of the antimycobacterial agents taken by this patient interact with dolutegravir. There is no clinical evidence supporting a need to initiate dolutegravir/lamivudine (Dovato) as an ART regimen for a patient with an HIV RNA \\>500,000 copies/mL (this patient’s HIV RNA is 515,000 copies/mL). Also, Dovato is a coformulated single tablet containing 50 mg of dolutegravir and 300 mg of lamivudine that is administered once daily, not twice daily.", "Initiating dolutegravir/abacavir/lamivudine (Triumeq) without making adjustments to this patient’s antimycobacterial therapy is the best choice because the ART regimen provides a single-tablet HIV regimen with no significant drug-drug interactions. Although dolutegravir undergoes metabolism by CYP 3A4 enzymes, the enzyme induction by rifabutin and impact on dolutegravir metabolism are minimal (i.e., the interaction is not clinically relevant). Therefore, no adjustments are needed to this patient’s antimycobacterial therapy.", "Elvitegravir, cobicistat, and tenofovir alafenamide levels decline considerably when Genvoya (elvitegravir/cobicistat/tenofovir alafenamide/emtricitabine) is administered with rifabutin. The use of this combination is contraindicated.", "The coadministration of Biktarvy (bictegravir/tenofovir alafenamide/emtricitabine) and rifabutin is contraindicated. Rifabutin reduces the bictegravir maximum plasma concentration (Cmax), area under the curve (AUC), and minimum plasma concentration (Cmin) by 20%, 38%, and 56%, respectively. Rifabutin should not be coadministered with tenofovir alafenamide because concentrations of tenofovir will be considerably reduced."], "ref": "1. U.S. Department of Health and Human Services. Guidelines for use of antiretroviral agents in adults and\nadolescents with HIV: what to start: drug-drug interactions. initial combination regimens for people with HIV. https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent- arv/overview?view=full (accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.2 Knowledge # 1.8 __________________________________________________________________________________________________", "level": 3, "stemKo": "33세 트랜스젠더 남성이 HIV 감염을 새로 진단받았으며 기저 CD4 세포 수는 32 cells/mm3였고, 내원 시 파종성 Mycobacterium avium 감염이 확인되었다. 이 환자는 현재 azithromycin 600 mg 1일 1회, ethambutol 1200 mg 1일 1회, rifabutin 300 mg 1일 1회로 치료받고 있으며 수일 내에 항레트로바이러스요법(ART)을 시작할 예정이다. 환자의 현재 활력징후와 관련 검사 수치는 다음과 같다.\n활력징후: BP 129/84 mm Hg, HR 68 bpm, RR 17 breaths/min, T 98.6°F, Wt 80 kg, Ht 5'8\"\n검사: SCr 1.0 mg/dL, AST 18 U/L, ALT 26 U/L, CD4 38 cells/mm3, HIV RNA 515,000 copies/mL, HIV 내성 검사 음성, toxoplasmosis IgG 음성, G6PD 결핍 음성, HLA-B*5701 음성, HBsAg 음성, anti-HBs 음성, anti-HBc IgG 음성, anti-HCV 음성\n약물 상호작용 가능성을 고려할 때 이 환자의 ART 및 항마이코박테리아 치료를 위한 약물치료 계획으로 가장 적절한 것은?", "choicesKo": ["dolutegravir/lamivudine(Dovato)을 시작하되, 항마이코박테리아 치료를 받지 않는 환자에게 권장되는 dolutegravir 50 mg 1일 1회 대신 50 mg 1일 2회 용량으로 사용한다.", "dolutegravir/abacavir/lamivudine(Triumeq)을 시작하고 환자의 항마이코박테리아 치료는 조정하지 않는다.", "elvitegravir/cobicistat/tenofovir alafenamide/emtricitabine(Genvoya)을 시작하되, rifabutin을 1일 300 mg에서 1일 150 mg으로 감량한다.", "bictegravir/tenofovir alafenamide/emtricitabine(Biktarvy)을 시작하고 환자의 항마이코박테리아 치료는 조정하지 않는다."], "rationalesKo": ["이 환자가 복용 중인 항마이코박테리아 약제 중 dolutegravir와 상호작용하는 것은 없다. HIV RNA가 \\>500,000 copies/mL인 환자(이 환자의 HIV RNA는 515,000 copies/mL이다)에게 ART 요법으로 dolutegravir/lamivudine(Dovato)을 시작해야 한다는 임상적 근거는 없다. 또한 Dovato는 dolutegravir 50 mg과 lamivudine 300 mg을 함유한 복합 단일정제로 1일 2회가 아니라 1일 1회 투여한다.", "이 환자의 항마이코박테리아 치료를 조정하지 않고 dolutegravir/abacavir/lamivudine(Triumeq)을 시작하는 것이 최선의 선택이다. 이 ART 요법은 임상적으로 유의한 약물 상호작용이 없는 단일정제 HIV 요법을 제공하기 때문이다. dolutegravir는 CYP 3A4 효소에 의해 대사되지만, rifabutin에 의한 효소 유도 및 dolutegravir 대사에 미치는 영향은 미미하다(즉, 이 상호작용은 임상적으로 유의하지 않다). 따라서 이 환자의 항마이코박테리아 치료를 조정할 필요는 없다.", "Genvoya(elvitegravir/cobicistat/tenofovir alafenamide/emtricitabine)를 rifabutin과 함께 투여하면 elvitegravir, cobicistat, tenofovir alafenamide의 농도가 상당히 감소한다. 이 병용은 금기이다.", "Biktarvy(bictegravir/tenofovir alafenamide/emtricitabine)와 rifabutin의 병용 투여는 금기이다. rifabutin은 bictegravir의 최고 혈장 농도(Cmax), 곡선하면적(AUC), 최저 혈장 농도(Cmin)를 각각 20%, 38%, 56% 감소시킨다. tenofovir 농도가 상당히 감소하므로 rifabutin은 tenofovir alafenamide와 병용 투여해서는 안 된다."]}, {"id": 38, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "Which of the following is an advantage of tenofovir alafenamide (TAF) compared with tenofovir disoproxil fumarate (TDF)?", "choices": ["TAF is available as part of a single-tablet antiretroviral therapy (ART) product, but TDF is not.", "TAF has been associated with less renal and bone toxicity than TDF.", "TAF has been associated with lower total and LDL cholesterol levels than TDF.", "TAF is more effective for reducing HIV viral replication than TDF."], "answer": 2, "rationales": ["Both drugs are available in several single-tablet ART products.", "In clinical trials comparing the two agents, the risk of kidney injury and bone mineral density losses was lower with TAF than TDF.", "TAF has been associated with higher total and LDL cholesterol levels than TDF.", "There is no evidence that TAF has greater activity against the HIV virus than TDF."], "ref": "1. U.S. Department of Health and Human Services. Guidelines for use of antiretroviral agents in adults and\nadolescents with HIV: what to start: initial combination regimens for people with HIV. https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/what-start-initial- combination-regimens?view=full (accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.6 Knowledge # 1.9 __________________________________________________________________________________________________", "level": 3, "stemKo": "tenofovir disoproxil fumarate(TDF)와 비교할 때 tenofovir alafenamide(TAF)의 장점으로 가장 적절한 것은?", "choicesKo": ["TAF는 단일정제 항레트로바이러스요법(ART) 제품의 일부로 사용 가능하지만 TDF는 그렇지 않다.", "TAF는 TDF보다 신장 및 골 독성이 적은 것으로 알려져 있다.", "TAF는 TDF보다 총 콜레스테롤 및 LDL 콜레스테롤 수치가 더 낮은 것으로 알려져 있다.", "TAF는 TDF보다 HIV 바이러스 복제를 감소시키는 데 더 효과적이다."], "rationalesKo": ["두 약물 모두 여러 단일정제 ART 제품으로 사용 가능하다.", "두 약제를 비교한 임상시험에서 신장 손상 및 골밀도 감소의 위험은 TDF보다 TAF에서 더 낮았다.", "TAF는 TDF보다 총 콜레스테롤 및 LDL 콜레스테롤 수치가 더 높은 것으로 알려져 있다.", "TAF가 TDF보다 HIV 바이러스에 대해 더 큰 활성을 가진다는 근거는 없다."]}, {"id": 39, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "A 20-year-old man who has sex with men is referred to your HIV pre-exposure prophylaxis (PrEP) clinic following negative testing for HIV and sexually transmitted infections 2 months ago. He has about five male sexual partners each month and uses condoms most of the time, but not always. The results of a physical examination are unremarkable. He has no past medical history. His renal function is normal, and he is not taking any other medications currently. Which of the following is most appropriate in response to this patient’s request for PrEP?", "choices": ["Initiate bictegravir/tenofovir alafenamide/emtricitabine (Biktarvy) until confirming that the patient is HIV and hepatitis B virus negative, then initiate tenofovir disoproxil fumarate/emtricitabine (Truvada) daily.", "Initiate tenofovir disoproxil fumarate/emtricitabine (Truvada) or tenofovir alafenamide/emtricitabine (Descovy) as PrEP, but only after assessing the patient’s HIV and hepatitis B virus status.", "Initiate tenofovir disoproxil fumarate/emtricitabine (Truvada) or tenofovir alafenamide/emtricitabine (Descovy) as PrEP today and see the patient again 3 months from now for follow-up HIV testing.", "Initiate tenofovir disoproxil fumarate/emtricitabine (Truvada) or tenofovir alafenamide/emtricitabine (Descovy) as PrEP, but only after confirming that the patient is hepatitis B virus negative."], "answer": 2, "rationales": ["There is no evidence of a need to initiate a complete antiretroviral therapy regimen, such as bictegravir/tenofovir alafenamide/emtricitabine (Biktarvy), in this patient as a bridge to PrEP. Use of a complete antiretroviral regimen would be indicated only if the patient’s HIV test returns with positive results, and PrEP would be inappropriate in that situation.", "Before initiating PrEP, clinicians should assess the risk of HIV infection and eligibility for PrEP based on guidelines from the Centers for Disease Control and Prevention. This patient is at substantial risk for acquiring HIV and HBV because he is a man who has sex with men and uses condoms inconsistently. His eligibility for PrEP is unclear because he has not been tested for HIV in the past 2 months, and he may have been exposed to HIV during this period. Therefore, the patient’s negative HIV status must be confirmed prior to initiating PrEP. Because the PrEP medications are also active against hepatitis B virus, the patient’s hepatitis B status also should be confirmed.", "If the patient has HIV infection and PrEP is initiated without confirmatory testing of his HIV status, there is a considerable risk that resistance to the PrEP medications will develop resistance in the HIV strains in his body. The medications should not be started until the patient has confirmatory HIV-negative test results.", "Before initiating PrEP, clinicians should assess the risk of HIV infection and eligibility for PrEP based on the CDC guidelines from the Centers for Disease Control and Prevention. This patient is at substantial risk for acquiring HIV and HBV because he is a man who has sex with men and uses condoms inconsistently. His eligibility for PrEP is unclear because he has not been tested for HIV in the past 2 months, and he may have been exposed to HIV during this period. Therefore, the patient’s negative HIV status must be confirmed prior to initiating PrEP. Because the PrEP medications are also active against hepatitis B virus, the patient’s hepatitis B status also should be confirmed."], "ref": "1. Centers for Disease Control and Prevention, US Public Health Service. Preexposure prophylaxis for the\nprevention of HIV infection in the United States—2021 update: a clinical practice guideline. chrome- extension://efaidnbmnnnibpcajpcglclefindmkaj/https://www.cdc.gov/hiv/pdf/risk/prep/cdc-hiv-prep- guidelines-2021.pdf (accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 4 Task #2.2 Knowledge # 2.6 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.5 Knowledge # 1.26 __________________________________________________________________________________________________", "level": 3, "stemKo": "남성과 성관계를 하는 20세 남성이 2개월 전 HIV 및 성매개감염 검사에서 음성 판정을 받은 후 귀하의 HIV 노출 전 예방요법(PrEP) 클리닉에 의뢰되었다. 그는 매달 약 5명의 남성 성관계 상대가 있으며 대부분의 경우 콘돔을 사용하지만 항상 그런 것은 아니다. 신체검사 결과는 특이 소견이 없다. 과거 병력은 없다. 신기능은 정상이며 현재 다른 약물은 복용하고 있지 않다. 이 환자의 PrEP 요청에 대한 대응으로 가장 적절한 것은?", "choicesKo": ["환자가 HIV 및 B형간염 바이러스 음성임을 확인할 때까지 bictegravir/tenofovir alafenamide/emtricitabine(Biktarvy)을 시작한 후, tenofovir disoproxil fumarate/emtricitabine(Truvada)을 매일 투여하기 시작한다.", "환자의 HIV 및 B형간염 바이러스 상태를 평가한 후에만 PrEP로 tenofovir disoproxil fumarate/emtricitabine(Truvada) 또는 tenofovir alafenamide/emtricitabine(Descovy)을 시작한다.", "오늘 PrEP로 tenofovir disoproxil fumarate/emtricitabine(Truvada) 또는 tenofovir alafenamide/emtricitabine(Descovy)을 시작하고, 3개월 후에 추적 HIV 검사를 위해 환자를 다시 진료한다.", "환자가 B형간염 바이러스 음성임을 확인한 후에만 PrEP로 tenofovir disoproxil fumarate/emtricitabine(Truvada) 또는 tenofovir alafenamide/emtricitabine(Descovy)을 시작한다."], "rationalesKo": ["이 환자에게 PrEP로 넘어가기 위한 가교요법으로 bictegravir/tenofovir alafenamide/emtricitabine(Biktarvy)과 같은 완전한 항레트로바이러스요법을 시작해야 할 근거는 없다. 완전한 항레트로바이러스 요법의 사용은 환자의 HIV 검사가 양성으로 나온 경우에만 적응이 되며, 그러한 상황에서는 PrEP가 적절하지 않다.", "PrEP를 시작하기 전에 임상의는 Centers for Disease Control and Prevention의 지침에 근거하여 HIV 감염 위험과 PrEP 적합성을 평가해야 한다. 이 환자는 남성과 성관계를 하는 남성이며 콘돔을 일관되게 사용하지 않으므로 HIV 및 HBV 획득의 위험이 상당하다. 지난 2개월간 HIV 검사를 받지 않았고 이 기간 동안 HIV에 노출되었을 수 있으므로 PrEP 적합성이 불분명하다. 따라서 PrEP를 시작하기 전에 환자의 HIV 음성 상태를 반드시 확인해야 한다. PrEP 약물은 B형간염 바이러스에도 활성을 가지므로 환자의 B형간염 상태도 확인해야 한다.", "환자가 HIV에 감염되어 있는 상태에서 HIV 상태에 대한 확인 검사 없이 PrEP를 시작하면 체내 HIV 균주에 PrEP 약물에 대한 내성이 발생할 위험이 상당하다. 환자가 HIV 음성 확인 검사 결과를 받을 때까지 이 약물들을 시작해서는 안 된다.", "PrEP를 시작하기 전에 임상의는 Centers for Disease Control and Prevention의 CDC 지침에 근거하여 HIV 감염 위험과 PrEP 적합성을 평가해야 한다. 이 환자는 남성과 성관계를 하는 남성이며 콘돔을 일관되게 사용하지 않으므로 HIV 및 HBV 획득의 위험이 상당하다. 지난 2개월간 HIV 검사를 받지 않았고 이 기간 동안 HIV에 노출되었을 수 있으므로 PrEP 적합성이 불분명하다. 따라서 PrEP를 시작하기 전에 환자의 HIV 음성 상태를 반드시 확인해야 한다. PrEP 약물은 B형간염 바이러스에도 활성을 가지므로 환자의 B형간염 상태도 확인해야 한다."]}, {"id": 40, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "Which of the following is the most appropriate pneumococcal immunization plan for an adult living with HIV infection who is younger than 65 years old based on recommendations from the Centers for Disease Control and Prevention?", "choices": ["One dose of 15-valent pneumococcal conjugate vaccine (PCV15) followed by one dose of 23-valent pneumococcal polysaccharide vaccine (PPSV23)", "One dose of 20-valent pneumococcal conjugate vaccine (PCV20) followed by one dose of 23-valent pneumococcal polysaccharide vaccine (PPSV23)", "One dose of 15-valent pneumococcal conjugate vaccine (PCV15)", "Two doses of 23-valent pneumococcal polysaccharide vaccine (PPSV23)"], "answer": 1, "rationales": ["Patients living with HIV infection under the age of 65 are advised to receive one dose of PCV15 followed by one dose of PPSV23 OR one dose of PCV20, so the maximum number of pneumococcal immunizations is two.", "Patients living with HIV infection under the age of 65 are advised to receive one dose of PCV15 followed by one dose of PPSV23 OR one dose of PCV20, so the maximum number of pneumococcal immunizations is two.", "Patients living with HIV infection under the age of 65 are advised to receive one dose of PCV15 followed by one dose of PPSV23 OR one dose of PCV20, so the maximum number of pneumococcal immunizations is two.", "Patients living with HIV infection under the age of 65 are advised to receive one dose of PCV15 followed by one dose of PPSV23 OR one dose of PCV20, so the maximum number of pneumococcal immunizations is two."], "ref": "1. Centers for Disease Control and Prevention. Recommended immunization schedule for adults aged 19 years and\nolder, United States 2022. https://www.cdc.gov/vaccines/schedules/downloads/adult/adult-combined- schedule.pdf (accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.5 Knowledge # 1.26 RUBRIC #2: BCIDP - ID Domain # 4 Task # 1.5 Knowledge # 1.31 __________________________________________________________________________________________________", "level": 3, "stemKo": "Centers for Disease Control and Prevention의 권고에 근거할 때, 65세 미만의 HIV 감염 성인에게 가장 적절한 폐렴구균 예방접종 계획은?", "choicesKo": ["15가 폐렴구균 단백결합 백신(PCV15) 1회 접종 후 23가 폐렴구균 다당 백신(PPSV23) 1회 접종", "20가 폐렴구균 단백결합 백신(PCV20) 1회 접종 후 23가 폐렴구균 다당 백신(PPSV23) 1회 접종", "15가 폐렴구균 단백결합 백신(PCV15) 1회 접종", "23가 폐렴구균 다당 백신(PPSV23) 2회 접종"], "rationalesKo": ["65세 미만의 HIV 감염 환자에게는 PCV15 1회 접종 후 PPSV23 1회 접종, 또는 PCV20 1회 접종이 권고되므로 폐렴구균 예방접종의 최대 횟수는 2회이다.", "65세 미만의 HIV 감염 환자에게는 PCV15 1회 접종 후 PPSV23 1회 접종, 또는 PCV20 1회 접종이 권고되므로 폐렴구균 예방접종의 최대 횟수는 2회이다.", "65세 미만의 HIV 감염 환자에게는 PCV15 1회 접종 후 PPSV23 1회 접종, 또는 PCV20 1회 접종이 권고되므로 폐렴구균 예방접종의 최대 횟수는 2회이다.", "65세 미만의 HIV 감염 환자에게는 PCV15 1회 접종 후 PPSV23 1회 접종, 또는 PCV20 1회 접종이 권고되므로 폐렴구균 예방접종의 최대 횟수는 2회이다."]}, {"id": 41, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "How soon after the initiation of antiretroviral therapy (ART) should a patient’s viral load first be measured to evaluate the treatment response?", "choices": ["1 month", "3 months", "6 months", "12 months"], "answer": 1, "rationales": ["The HIV viral load is the primary laboratory value that should be monitored closely following ART initiation. A typical response to treatment is rapid, and patients should achieve at least a 10-fold decline in their viral loads within 2-8 weeks of treatment.", "Many patients will have achieved an undetectable viral load within 3 months after starting ART. However, for patients experiencing side effects and/or not maintaining proper adherence to therapy, treatment failure can occur prior to 3 months with the development of resistance. Therefore, the response to ART should be evaluated within 2-8 weeks.", "The response to ART can be assessed within 2-8 weeks after initiating therapy. Delaying this assessment can prevent clinicians from identifying early treatment failures and the development of resistance.", "All patients should have achieved virologic suppression within 12 months after starting ART with the response to therapy measured 2-4 times in this period. The frequency of measurement of both viral loads and CD4 cell counts can decline over time once patients demonstrate a durable virologic and immunologic response to treatment."], "ref": "1. U.S. Department of Health and Human Services. Guidelines for use of antiretroviral agents in adults and\nadolescents with HIV: what to start: initial combination regimens for people with HIV. https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/what-start-initial- combination-regimens?view=full (accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # 1.22 __________________________________________________________________________________________________", "level": 3, "stemKo": "항레트로바이러스요법(ART) 시작 후 치료 반응을 평가하기 위해 환자의 바이러스 부하를 처음 측정해야 하는 시점으로 가장 적절한 것은?", "choicesKo": ["1개월", "3개월", "6개월", "12개월"], "rationalesKo": ["HIV 바이러스 부하는 ART 시작 후 면밀히 모니터링해야 하는 주요 검사 수치이다. 전형적인 치료 반응은 빠르게 나타나며, 환자는 치료 2-8주 이내에 바이러스 부하가 최소 10배 감소해야 한다.", "많은 환자가 ART 시작 후 3개월 이내에 검출되지 않는 바이러스 부하에 도달한다. 그러나 부작용을 경험하거나 치료 순응도를 적절히 유지하지 못하는 환자에서는 3개월 이전에 내성이 발생하면서 치료 실패가 일어날 수 있다. 따라서 ART에 대한 반응은 2-8주 이내에 평가해야 한다.", "ART에 대한 반응은 치료 시작 후 2-8주 이내에 평가할 수 있다. 이 평가를 지연하면 임상의가 조기 치료 실패와 내성 발생을 확인하지 못할 수 있다.", "모든 환자는 ART 시작 후 12개월 이내에 바이러스학적 억제에 도달해야 하며, 이 기간 동안 치료 반응을 2-4회 측정한다. 환자가 지속적인 바이러스학적 및 면역학적 치료 반응을 보이면 바이러스 부하와 CD4 세포 수의 측정 빈도는 시간이 지남에 따라 줄일 수 있다."]}, {"id": 42, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "A 61-year-old white man who was diagnosed with HIV infection 5 years ago but was never treated presents to the clinic today to initiate antiretroviral therapy (ART). His current CD4 cell count is 378 cells/mm3, his HIV RNA level is 115,000 copies/mL, he is hepatitis B and C negative, his HLA-B*5701 testing is negative, and his HIV resistance testing is negative. One week ago, he was seen by his primary care physician and started on simvastatin 20 mg orally daily because of his elevated risk for cardiovascular disease. He also has hypertension, chronic kidney disease (with an estimated glomerular filtration rate \\[GFR\\] of 60 mL/min), and type 2 diabetes mellitus (with a recent A1c level of 7.2%). In addition to the simvastatin, he also is receiving lisinopril 20 mg orally daily, hydrochlorothiazide 12.5 mg orally daily, aspirin 81 mg orally daily, subcutaneous insulin glargine every evening, and subcutaneous insulin lispro three times daily with meals. Which of the following is the most appropriate antiretroviral therapy regimen to initiate in this patient?", "choices": ["Dolutegravir/abacavir/lamivudine (Triumeq)", "Bictegravir/tenofovir alafenamide/emtricitabine (Biktarvy)", "Elvitegravir/cobicistat/tenofovir alafenamide/emtricitabine (Genvoya)", "Raltegravir (Isentress) plus tenofovir disoproxil fumarate and emtricitabine (Truvada)"], "answer": 2, "rationales": ["Although there are no substantial drug interactions between this ART regimen and the patient’s medications, the U.S. Department of Health and Human Services HIV treatment guidelines recommend considering avoiding abacavir in patients like this one with a high risk for cardiovascular events.", "This ART regimen is the most appropriate choice for this patient. It is safe and effective, will have minimal impact on his cholesterol levels, and will not interact with his medications.", "Simvastatin is a CYP 3A4 substrate that has significant drug interactions with a number of antiretroviral agents, including ritonavir-boosted protease inhibitors (i.e., darunavir/ritonavir) and boosted integrase inhibitors (i.e., elvitegravir/cobicistat). Cobicistat is contraindicated with simvastatin because cobicistat is a strong CYP 3A4 inhibitor that inhibits the metabolism of simvastatin.", "This ART regimen does not interact with this patient’s medications. However, this patient should not be started on tenofovir disoproxil fumarate because of his chronic kidney disease and the potential adverse impact of the drug on renal function."], "ref": "1. U.S. Department of Health and Human Services. Guidelines for use of antiretroviral agents in HIV-1−infected\nadults and adolescents with HIV: what to start: initial combination regimens for people with HIV. https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/what-start-initial- combination-regimens?view=full (accessed 2022 Dec 29). 2. U.S. Department of Health and Human Services. Guidelines for use of antiretroviral agents in adults and\nadolescents with HIV: what to start: drug-drug interactions. https://clinicalinfo.hiv.gov/en/guidelines/hiv- clinical-guidelines-adult-and-adolescent-arv/overview?view=full (accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # 1.8 __________________________________________________________________________________________________", "level": 3, "stemKo": "5년 전 HIV 감염을 진단받았으나 치료를 받은 적이 없는 61세 백인 남성이 오늘 항레트로바이러스요법(ART)을 시작하기 위해 클리닉에 내원하였다. 현재 CD4 세포 수는 378 cells/mm3, HIV RNA 수치는 115,000 copies/mL이며, B형 및 C형 간염은 음성, HLA-B*5701 검사는 음성, HIV 내성 검사는 음성이다. 1주일 전 주치의에게 진료를 받고 심혈관질환 위험이 높다는 이유로 simvastatin 20 mg을 1일 1회 경구 투여하기 시작하였다. 그는 또한 고혈압, 만성 신장질환(추정 사구체여과율 \\[GFR\\] 60 mL/min), 제2형 당뇨병(최근 A1c 수치 7.2%)이 있다. simvastatin 외에도 lisinopril 20 mg 1일 1회 경구, hydrochlorothiazide 12.5 mg 1일 1회 경구, aspirin 81 mg 1일 1회 경구, 매일 저녁 insulin glargine 피하주사, 식사와 함께 1일 3회 insulin lispro 피하주사를 투여받고 있다. 이 환자에게 시작할 항레트로바이러스요법 요법으로 가장 적절한 것은?", "choicesKo": ["Dolutegravir/abacavir/lamivudine(Triumeq)", "Bictegravir/tenofovir alafenamide/emtricitabine(Biktarvy)", "Elvitegravir/cobicistat/tenofovir alafenamide/emtricitabine(Genvoya)", "Raltegravir(Isentress)와 tenofovir disoproxil fumarate 및 emtricitabine(Truvada) 병용"], "rationalesKo": ["이 ART 요법과 환자의 약물 사이에 유의한 약물 상호작용은 없지만, U.S. Department of Health and Human Services의 HIV 치료 지침은 이 환자와 같이 심혈관 사건의 위험이 높은 환자에서는 abacavir를 피하는 것을 고려하도록 권고한다.", "이 ART 요법이 이 환자에게 가장 적절한 선택이다. 안전하고 효과적이며, 환자의 콜레스테롤 수치에 미치는 영향이 최소이고, 환자의 약물과 상호작용하지 않는다.", "simvastatin은 CYP 3A4 기질로서 ritonavir로 부스팅된 protease inhibitor(예: darunavir/ritonavir) 및 부스팅된 integrase inhibitor(예: elvitegravir/cobicistat)를 포함한 여러 항레트로바이러스 약제와 유의한 약물 상호작용이 있다. cobicistat은 강력한 CYP 3A4 억제제로 simvastatin의 대사를 억제하므로 simvastatin과의 병용은 금기이다.", "이 ART 요법은 환자의 약물과 상호작용하지 않는다. 그러나 이 환자는 만성 신장질환이 있고 이 약물이 신기능에 미칠 수 있는 악영향 때문에 tenofovir disoproxil fumarate를 시작해서는 안 된다."]}, {"id": 43, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "A 29-year-old African American cisgender woman was recently diagnosed with HIV infection and presents to the clinic today to discuss antiretroviral therapy (ART). She is asymptomatic, her CD4 cell count is 678 cells/mm3, her HIV RNA level is 55,000 copies/mL, she is hepatitis B and C negative, her renal and liver function are within normal limits, her HLA-B*5701 allele test is negative, and her HIV resistance test is negative. When would you recommend starting ART in this patient?", "choices": ["Not until she develops symptoms of HIV infection", "Not until her CD4 cell count falls to below 500 cells/mm3", "Not until her HIV RNA is greater than 100,000 copies/mL", "Today, if possible"], "answer": 4, "rationales": ["Patients without symptoms of HIV infection should be started on ART to reduce their risk of both AIDS- and non- AIDS-defining conditions as well as the risk of transmitting HIV infection to others.", "The CD4 cell count should no longer influence decisions about when to initiate ART. Delaying therapy can increase the risk for both AIDS- and non-AIDS-defining conditions as well as the risk of transmitting HIV infection to others.", "Compared with delayed ART initiation, patients in the early initiation arm had significantly lower rates of both AIDS- and non-AIDS-defining conditions, including deaths from all causes. As a result of this study and others showing a significant reduction in HIV transmission when HIV viral loads are undetectable in infected partners receiving treatment, the current Department of Health and Human Services treatment guidelines recommend initiating ART in all patients with HIV infection regardless of symptoms, CD4 cell count, and HIV RNA level.", "In the INSIGHT START study, patients living with HIV infection were randomly assigned either to initiate ART early at CD4 cell counts above 500 cells/mm3 or to delay ART until CD4 cell counts fell below 350 cells/mm"], "ref": "1. U.S. Department of Health and Human Services. Guidelines for use of antiretroviral agents in adults and\nadolescents with HIV: what to start: initial combination regimens for people with HIV. https://clinicalinfo.hiv.gov/en/guidelines/hiv-clinical-guidelines-adult-and-adolescent-arv/what-start-initial- combination-regimens?view=full (accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.5 Knowledge # 1.26 __________________________________________________________________________________________________", "level": 3, "stemKo": "29세 아프리카계 미국인 시스젠더 여성이 최근 HIV 감염으로 진단받았고, 오늘 항레트로바이러스 치료(ART)를 상의하기 위해 클리닉에 내원하였다. 환자는 무증상이며, CD4 세포수는 678 cells/mm3, HIV RNA 수치는 55,000 copies/mL, B형 및 C형 간염은 음성이고, 신기능과 간기능은 정상 범위이며, HLA-B*5701 대립유전자 검사는 음성이고, HIV 내성 검사도 음성이다. 이 환자에게 ART를 언제 시작하도록 권고하겠는가?", "choicesKo": ["HIV 감염 증상이 나타날 때까지 시작하지 않는다", "CD4 세포수가 500 cells/mm3 미만으로 떨어질 때까지 시작하지 않는다", "HIV RNA가 100,000 copies/mL를 초과할 때까지 시작하지 않는다", "가능하다면 오늘 시작한다"], "rationalesKo": ["HIV 감염 증상이 없는 환자도 AIDS 정의 질환 및 비(非)AIDS 정의 질환의 위험과 타인에게 HIV 감염을 전파할 위험을 낮추기 위해 ART를 시작해야 한다.", "CD4 세포수는 더 이상 ART 시작 시점에 관한 결정에 영향을 주어서는 안 된다. 치료를 지연시키면 AIDS 정의 질환 및 비AIDS 정의 질환의 위험과 타인에게 HIV 감염을 전파할 위험이 증가할 수 있다.", "ART를 지연 시작한 군과 비교하여 조기 시작군의 환자들은 모든 원인에 의한 사망을 포함하여 AIDS 정의 질환과 비AIDS 정의 질환의 발생률이 유의하게 낮았다. 이 연구와, 치료를 받는 감염된 파트너에서 HIV 바이러스 부하가 검출되지 않을 때 HIV 전파가 유의하게 감소함을 보여준 다른 연구들의 결과로, 현행 Department of Health and Human Services 치료 지침은 증상, CD4 세포수, HIV RNA 수치와 관계없이 모든 HIV 감염 환자에서 ART를 시작할 것을 권고한다.", "INSIGHT START 연구에서 HIV 감염인은 CD4 세포수가 500 cells/mm3를 초과하는 시점에 ART를 조기 시작하는 군, 또는 CD4 세포수가 350 cells/mm 미만으로 떨어질 때까지 ART를 지연하는 군으로 무작위 배정되었다"]}, {"id": 44, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "A 45-year-old cisgender man with HIV infection that is well controlled on elvitegravir/cobicistat/tenofovir alafenamide/emtricitabine was admitted to the hospital and diagnosed with deep vein thrombosis (DVT) following a transcontinental flight. At the time of admission, his antiretroviral therapy (ART) was withheld by the medical team, and his DVT was initially managed with enoxaparin 90 mg subcutaneously twice daily. The patient is now scheduled for hospital discharge and will resume his ART and transition to apixaban 5 mg orally twice daily to complete his DVT treatment at home. Which of the following recommendations would you make for managing this patient’s medications during his transition of care based on the U.S. Department of Health and Human Services (DHHS) HIV treatment guidelines?", "choices": ["Change the ART to bictegravir/tenofovir alafenamide/emtricitabine.", "Change the apixaban to dabigatran.", "Change the apixaban to warfarin.", "Reduce the apixaban dose to 2.5 mg orally twice daily."], "answer": 1, "rationales": ["Apixaban and cobicistat should not be used together because of a drug interaction. Apixaban is a P- glycoprotein and CYP 3A4 substrate, and cobicistat is a P-glycoprotein and strong CYP 3A4 inhibitor. Changing the antiretroviral therapy to bictegravir/tenofovir alafenamide/emtricitabine will eliminate the risk of the drug interaction, while maintaining the patient on a single-tablet ART regimen containing an integrase inhibitor and the same nucleoside reverse transcriptase inhibitors.", "Dabigatran is a CYP 3A4 substrate. Its use with cobicistat, a strong 3A4 inhibitor, is contraindicated.", "Apixaban and cobicistat should not be used together because of a drug interaction. Apixaban is a P-glycoprotein and CYP 3A4 substrate, and cobicistat is a P-glycoprotein and strong CYP 3A4 inhibitor. Warfarin can also interact with elvitegravir and cobicistat because warfarin is metabolized by CYP 2C19 and CYP 3A4 enzymes, elvitegravir is a mild CYP 2C19 inducer, and cobicistat inhibits CYP 3A", "Apixaban and cobicistat should not be used together because of a drug interaction. Apixaban is a P-glycoprotein and CYP 3A4 substrate, and cobicistat is a P-glycoprotein and strong CYP 3A4 inhibitor. Reducing the apixaban dosage to 2.5 mg twice daily is an option for managing the interaction between cobicistat and apixaban, but changing apixaban to warfarin and monitoring the international normalized ratio is preferred, according to the U.S. Department of Health and Human Services HIV treatment guidelines. Changing the antiretroviral therapy to bictegravir/tenofovir alafenamide/emtricitabine is an even better choice for this patient because it will eliminate the risk of the drug interaction using a single-tablet ART regimen containing an integrase inhibitor and the same nucleoside reverse transcriptase inhibitors."], "ref": "1. U.S. Department of Health and Human Services. Guidelines for use of antiretroviral agents in adults and\nadolescents with HIV: what to start: drug-drug interactions. https://clinicalinfo.hiv.gov/en/guidelines/hiv- clinical-guidelines-adult-and-adolescent-arv/overview?view=full (accessed 2022 Dec 29).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.2 Knowledge # 1.8 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.3 Knowledge # 1.29 __________________________________________________________________________________________________\nPresentation Title: Infections of Reproductive Organs and Sexually Transmitted Diseases\nLEARNING OBJECTIVES\nLO#1: Assess pharmacotherapies for infections of reproductive organs and sexually-transmitted diseases.\nLO#2: Select the most appropriate pharmacotherapeutic plan and monitoring based on patient- and disease-specific information, antibiogram data, and best available evidence.\nLO#3: Identify recommended screening guidelines for sexually-transmitted diseases.\nLO#4: Recommend modifications of patient-specific treatment plans based on efficacy, immunologic response, and adverse effects.\nLO#5: Interpret signs, symptoms, and laboratory and other relevant diagnostic test results.\nLO#6: Summarize key considerations in effective patient and caregiver education and counseling techniques.", "level": 3, "stemKo": "elvitegravir/cobicistat/tenofovir alafenamide/emtricitabine으로 HIV 감염이 잘 조절되고 있는 45세 시스젠더 남성이 대륙 횡단 비행 후 심부정맥혈전증(DVT)으로 진단되어 입원하였다. 입원 시 의료진은 그의 항레트로바이러스 치료(ART)를 중단하였고, DVT는 처음에 enoxaparin 90 mg을 하루 2회 피하 투여하여 관리하였다. 환자는 이제 퇴원이 예정되어 있으며, ART를 재개하고 apixaban 5 mg 경구 하루 2회로 전환하여 가정에서 DVT 치료를 완료할 예정이다. U.S. Department of Health and Human Services(DHHS) HIV 치료 지침에 근거할 때, 이 환자의 치료 이행(transition of care) 과정에서 약물 관리를 위해 다음 중 어떤 권고를 하겠는가?", "choicesKo": ["ART를 bictegravir/tenofovir alafenamide/emtricitabine으로 변경한다.", "apixaban을 dabigatran으로 변경한다.", "apixaban을 warfarin으로 변경한다.", "apixaban 용량을 2.5 mg 경구 하루 2회로 감량한다."], "rationalesKo": ["약물 상호작용 때문에 apixaban과 cobicistat은 병용해서는 안 된다. Apixaban은 P-glycoprotein 및 CYP 3A4 기질이고, cobicistat은 P-glycoprotein 및 강력한 CYP 3A4 억제제이다. 항레트로바이러스 치료를 bictegravir/tenofovir alafenamide/emtricitabine으로 변경하면 약물 상호작용의 위험을 없애면서도 integrase inhibitor와 동일한 nucleoside reverse transcriptase inhibitor를 포함한 단일정 ART 요법을 유지할 수 있다.", "Dabigatran은 CYP 3A4 기질이다. 강력한 3A4 억제제인 cobicistat과 함께 사용하는 것은 금기이다.", "약물 상호작용 때문에 apixaban과 cobicistat은 병용해서는 안 된다. Apixaban은 P-glycoprotein 및 CYP 3A4 기질이고, cobicistat은 P-glycoprotein 및 강력한 CYP 3A4 억제제이다. Warfarin 또한 elvitegravir 및 cobicistat과 상호작용할 수 있는데, 이는 warfarin이 CYP 2C19 및 CYP 3A4 효소로 대사되고, elvitegravir는 약한 CYP 2C19 유도제이며, cobicistat은 CYP 3A를 억제하기 때문이다", "약물 상호작용 때문에 apixaban과 cobicistat은 병용해서는 안 된다. Apixaban은 P-glycoprotein 및 CYP 3A4 기질이고, cobicistat은 P-glycoprotein 및 강력한 CYP 3A4 억제제이다. Apixaban 용량을 하루 2회 2.5 mg으로 감량하는 것은 cobicistat과 apixaban 간 상호작용을 관리하는 하나의 방법이지만, U.S. Department of Health and Human Services HIV 치료 지침에 따르면 apixaban을 warfarin으로 변경하고 international normalized ratio를 모니터링하는 것이 선호된다. 이 환자에게는 항레트로바이러스 치료를 bictegravir/tenofovir alafenamide/emtricitabine으로 변경하는 것이 더욱 좋은 선택인데, 이는 integrase inhibitor와 동일한 nucleoside reverse transcriptase inhibitor를 포함한 단일정 ART 요법을 사용하면서 약물 상호작용의 위험을 없앨 수 있기 때문이다."]}, {"id": 45, "section": "Infections of Reproductive Organs and Sexually Transmitted Diseases", "sectionKo": "생식기 감염·STD", "stem": "A sexually active 24-year-old non-pregnant female was treated with benzathine penicillin G 2.4 million units as a one-time intramuscular (IM) dose after a diagnosis of primary syphilis 6 months ago. She is now asymptomatic and presents to the STD clinic for a follow-up visit to review the results of recent lab tests. The laboratory test results from 6 months, 3 weeks, and 1 week ago are as follows: 6 months ago: rapid plasma reagin (RPR) 1:64 , Fluorescent treponemal antibody absorbed (FTA-abs) reactive HIV fourth-generation test 1 week ago: negative RPR 3 weeks ago and 1 week ago: 1:256\nWhich is the most appropriate course of action at this time based on these findings and current Centers for Disease Control and Prevention (CDC) treatment guidelines for sexually transmitted diseases (STDs)?", "choices": ["Perform a cerebrospinal fluid (CSF) evaluation to rule out neurosyphilis, and if the results are negative, give benzathine penicillin G 2.4 million units intramuscularly (IM) as a one-time dose.", "Perform a cerebrospinal fluid (CSF) evaluation to rule out neurosyphilis, and if the results are negative, give three benzathine penicillin G 2.4-million-unit intramuscular (IM) doses at 1-week intervals (i.e., a total of 7.2 million units).", "Give benzathine penicillin G 2.4 million units intramuscularly (IM) as a one-time dose.", "Give three benzathine penicillin G 2.4-million-unit intramuscular (IM) doses at 1-week intervals (i.e., a total of 7.2 million units)."], "answer": 2, "rationales": ["The current (2021) CDC STD treatment guidelines recommend that a persistent fourfold or more increase in RPR for more than 2 weeks should be considered a treatment failure in patients with syphilis. This patient’s increase in RPR from 1:64 6 months ago to 1:256 1 week and 3 weeks ago is a fourfold increase, so her treatment is considered a failure. Evaluation of cerebrospinal fluid (CSF) for possible neurosyphilis is recommended. If this evaluation is negative, retreatment with three 2.4-million-unit IM doses of benzathine penicillin G at 1-week intervals is recommended.", "The current (2021) CDC STD treatment guidelines recommend that a persistent fourfold or more increase in RPR for more than 2 weeks should be considered a treatment failure in patients with syphilis. This patient’s increase in RPR from 1:64 6 months ago to 1:256 1 week and 3 weeks ago is a fourfold increase, so her treatment is considered a failure. Evaluation of cerebrospinal fluid (CSF) for possible neurosyphilis is recommended. If this evaluation is negative, retreatment with three 2.4-million-unit IM doses of benzathine penicillin G at 1-week intervals is recommended. If the results are positive, a regimen for the treatment of neurosyphilis (e.g., crystalline penicillin G 18-24 million units/day IV) is appropriate.", "The current (2021) CDC STD treatment guidelines recommend that a persistent fourfold or more increase in RPR for more than 2 weeks should be considered a treatment failure in patients with syphilis. This patient’s increase in RPR from 1:64 6 months ago to 1:256 1 week and 3 weeks ago is a fourfold increase, so her treatment is considered a failure. Evaluation of cerebrospinal fluid (CSF) for possible neurosyphilis is recommended.", "The current (2021) CDC STD treatment guidelines recommend that a persistent fourfold or more increase in RPR for more than 2 weeks should be considered a treatment failure in patients with syphilis. This patient’s increase in RPR from 1:64 6 months ago to 1:256 1 week and 3 weeks ago is a fourfold increase, so her treatment is considered a failure. Evaluation of cerebrospinal fluid (CSF) for possible neurosyphilis is recommended."], "ref": "1. Workowski KA, Bachmann LH, Chan PA et al. Sexually transmitted infections treatment guidelines, 2021. MMWR\nRecomm Rep. 2021;70(No. RR-4):1-187.", "rubric": "RUBRIC #1: BCIDP - ID Domain #1 Patient Care and Therapeutics Task # 1.2 Identify and recommend additional tests/procedures which need to be performed in order to design an infectious diseases pharmacotherapeutic plan Knowledge # k 1.1.11 Sexually transmitted diseases, 1.2 Pharmacotherapies related to specific infectious diseases (e.g., bacterial, fungal, viral) RUBRIC #2: BCIDP - ID Domain #1 Patient Care and Therapeutics Task # 1.3 Interpret, analyze, and integrate patient- specific information, disease-specific information and microbiologic and laboratory reports in order to design an infectious disease pharmacotherapeutic plan. Knowledge # # 1.14 Clinical laboratory tests in ID (e.g., rapid diagnostic testing, RPR, antibody concentrations), 1.17 Immunologic response to infection, 1.21 Factors that may impact response to therapy (e.g., dose optimization, penetration of antimicrobials, source control, immune status) RUBRIC #3: BCIDP - ID Domain # 1 Patient Care and Therapeutics Task # 1.1 Collect and organize patient-specific information (e.g., demographics, medical history, infection risks), disease-specific information, and microbiologic and laboratory reports needed to design an infectious diseases pharmacotherapeutic plan. Knowledge # 1.23 Measures to monitor response to antimicrobial therapy (e.g., resolution of signs and symptoms, laboratory data, readmission, development of drug resistance) __________________________________________________________________________________________________", "level": 3, "stemKo": "성생활을 하는 24세 비임신 여성이 6개월 전 1기 매독(primary syphilis)으로 진단받은 후 benzathine penicillin G 240만 단위를 근육주사(IM) 1회 용량으로 투여받았다. 현재 무증상이며 최근 검사 결과를 확인하기 위해 추적 방문차 STD 클리닉에 내원하였다. 6개월 전, 3주 전, 1주 전의 검사 결과는 다음과 같다: 6개월 전: rapid plasma reagin(RPR) 1:64, Fluorescent treponemal antibody absorbed(FTA-abs) 반응 양성, 1주 전 HIV 4세대 검사: 음성, 3주 전 및 1주 전 RPR: 1:256\n이러한 소견과 현행 Centers for Disease Control and Prevention(CDC) 성매개감염(STD) 치료 지침에 근거할 때, 현시점에서 가장 적절한 조치는?", "choicesKo": ["신경매독(neurosyphilis)을 배제하기 위해 뇌척수액(CSF) 검사를 시행하고, 결과가 음성이면 benzathine penicillin G 240만 단위를 근육주사(IM) 1회 용량으로 투여한다.", "신경매독(neurosyphilis)을 배제하기 위해 뇌척수액(CSF) 검사를 시행하고, 결과가 음성이면 benzathine penicillin G 240만 단위 근육주사(IM)를 1주 간격으로 3회 투여한다(즉, 총 720만 단위).", "benzathine penicillin G 240만 단위를 근육주사(IM) 1회 용량으로 투여한다.", "benzathine penicillin G 240만 단위 근육주사(IM)를 1주 간격으로 3회 투여한다(즉, 총 720만 단위)."], "rationalesKo": ["현행(2021) CDC STD 치료 지침은 매독 환자에서 RPR이 2주를 초과하여 4배 이상 지속적으로 상승하는 경우 치료 실패로 간주해야 한다고 권고한다. 이 환자는 6개월 전 1:64에서 1주 전 및 3주 전 1:256으로 상승하였으므로 4배 상승에 해당하며, 따라서 치료 실패로 간주된다. 신경매독 가능성에 대한 뇌척수액(CSF) 검사가 권고된다. 이 검사가 음성이면 benzathine penicillin G 240만 단위 IM을 1주 간격으로 3회 재치료하는 것이 권고된다.", "현행(2021) CDC STD 치료 지침은 매독 환자에서 RPR이 2주를 초과하여 4배 이상 지속적으로 상승하는 경우 치료 실패로 간주해야 한다고 권고한다. 이 환자는 6개월 전 1:64에서 1주 전 및 3주 전 1:256으로 상승하였으므로 4배 상승에 해당하며, 따라서 치료 실패로 간주된다. 신경매독 가능성에 대한 뇌척수액(CSF) 검사가 권고된다. 이 검사가 음성이면 benzathine penicillin G 240만 단위 IM을 1주 간격으로 3회 재치료하는 것이 권고된다. 결과가 양성이면 신경매독 치료 요법(예: crystalline penicillin G 1800만-2400만 단위/일 IV)이 적절하다.", "현행(2021) CDC STD 치료 지침은 매독 환자에서 RPR이 2주를 초과하여 4배 이상 지속적으로 상승하는 경우 치료 실패로 간주해야 한다고 권고한다. 이 환자는 6개월 전 1:64에서 1주 전 및 3주 전 1:256으로 상승하였으므로 4배 상승에 해당하며, 따라서 치료 실패로 간주된다. 신경매독 가능성에 대한 뇌척수액(CSF) 검사가 권고된다.", "현행(2021) CDC STD 치료 지침은 매독 환자에서 RPR이 2주를 초과하여 4배 이상 지속적으로 상승하는 경우 치료 실패로 간주해야 한다고 권고한다. 이 환자는 6개월 전 1:64에서 1주 전 및 3주 전 1:256으로 상승하였으므로 4배 상승에 해당하며, 따라서 치료 실패로 간주된다. 신경매독 가능성에 대한 뇌척수액(CSF) 검사가 권고된다."]}, {"id": 46, "section": "Infections of Reproductive Organs and Sexually Transmitted Diseases", "sectionKo": "생식기 감염·STD", "stem": "A 21-year-old female presents for the first time to your primary care clinic. She has no current complaints and no prior medical problems. A pregnancy test in clinic is negative. She has had four lifetime sexual partners, and is in a monogamous relationship with her husband who is also healthy. She has no history of genital ulcers or symptoms. She asks whether she should be screened for genital infections. Which screening tests are most appropriate for this patient based on current Centers for Disease Control and Prevention (CDC) treatment guidelines for sexually transmitted diseases?", "choices": ["Annual vaginal swabs with nucleic acid amplification tests (NAATs) for both Chlamydia trachomatis and Neisseria gonorrhoeae", "Annual vaginal swabs with nucleic acid amplification tests (NAATs) for both Chlamydia trachomatis and Neisseria gonorrhoeae, and syphilis serology (rapid plasma reagin \\[RPR\\] or Venereal Disease Research Laboratory \\[VDRL\\])", "Annual syphilis serology (rapid plasma reagin \\[RPR\\] or Venereal Disease Research Laboratory \\[VDRL\\])", "Annual urine nucleic acid amplification tests (NAATs) for both Chlamydia trachomatis and Neisseria gonorrhoeae"], "answer": 1, "rationales": ["This patient is sexually active and under the age of 25, which puts her in a group with a high prevalence of chlamydia and gonorrhea. The CDC recommends annual screening using NAATs for both Chlamydia trachomatis and Neisseria gonorrhoeae in sexually active women less than 25 years of age like this 21-year- old patient. Vaginal swabs are preferred over urine samples for the NAATs.", "This patient is sexually active and under the age of 25, which puts her in a group with a high prevalence of chlamydia and gonorrhea. The CDC recommends annual screening using NAATs for both Chlamydia trachomatis and Neisseria gonorrhoeae in sexually active women less than 25 years of age like this 21-year-old patient. Vaginal swabs are preferred over urine samples for the NAATs. Screening for syphilis using RPR or VDRL is not recommended by the CDC unless the patient is pregnant. It is not indicated for this non-pregnant woman.", "This patient is sexually active and under the age of 25, which puts her in a group with a high prevalence of chlamydia and gonorrhea. The CDC recommends annual screening using NAATs for both Chlamydia trachomatis and Neisseria gonorrhoeae in sexually active women less than 25 years of age like this 21-year-old patient. Vaginal swabs are preferred over urine samples for the NAATs. Screening for syphilis using RPR or VDRL is not recommended by the CDC unless the patient is pregnant. It is not indicated for this non-pregnant woman.", "This patient is sexually active and under the age of 25, which puts her in a group with a high prevalence of chlamydia and gonorrhea. The CDC recommends annual screening using NAATs for both Chlamydia trachomatis and Neisseria gonorrhoeae in sexually active women less than 25 years of age like this 21-year-old patient. Vaginal swabs are preferred over urine samples for the NAATs."], "ref": "1. Workowski KA, Bachmann LH, Chan PA et al. Sexually transmitted infections treatment guidelines, 2021.\nMMWR Recomm Rep. 2021;70(No. RR-4):1-187.", "rubric": "RUBRIC #1: BCIDP - ID Domain Domain 4. Public Health and Advocacy Task # 4.2 Support public health services targeted at the prevention of infectious diseases (e.g., vaccines, HIV testing, STD education) Knowledge # k 4.8 Screening guidelines for infectious diseases (e.g. HIV, STDs, tuberculosis) __________________________________________________________________________________________________", "level": 3, "stemKo": "21세 여성이 처음으로 일차진료 클리닉에 내원하였다. 현재 호소하는 증상은 없고 과거 병력도 없다. 클리닉에서 시행한 임신 검사는 음성이다. 평생 성 파트너는 4명이었으며, 현재는 역시 건강한 남편과 일부일처 관계이다. 성기 궤양이나 관련 증상의 병력은 없다. 그녀는 성기 감염에 대한 선별검사를 받아야 하는지 문의한다. 현행 Centers for Disease Control and Prevention(CDC) 성매개감염 치료 지침에 근거할 때, 이 환자에게 가장 적절한 선별검사는?", "choicesKo": ["Chlamydia trachomatis와 Neisseria gonorrhoeae 모두에 대한 질 도말(vaginal swab) 핵산증폭검사(NAAT)를 매년 시행", "Chlamydia trachomatis와 Neisseria gonorrhoeae 모두에 대한 질 도말(vaginal swab) 핵산증폭검사(NAAT), 그리고 매독 혈청검사(rapid plasma reagin \\[RPR\\] 또는 Venereal Disease Research Laboratory \\[VDRL\\])를 매년 시행", "매독 혈청검사(rapid plasma reagin \\[RPR\\] 또는 Venereal Disease Research Laboratory \\[VDRL\\])를 매년 시행", "Chlamydia trachomatis와 Neisseria gonorrhoeae 모두에 대한 소변 핵산증폭검사(NAAT)를 매년 시행"], "rationalesKo": ["이 환자는 성생활을 하고 있고 25세 미만이므로 chlamydia와 gonorrhea의 유병률이 높은 집단에 속한다. CDC는 이 21세 환자와 같이 성생활을 하는 25세 미만 여성에서 Chlamydia trachomatis와 Neisseria gonorrhoeae 모두에 대해 NAAT를 이용한 매년 선별검사를 권고한다. NAAT에는 소변 검체보다 질 도말이 선호된다.", "이 환자는 성생활을 하고 있고 25세 미만이므로 chlamydia와 gonorrhea의 유병률이 높은 집단에 속한다. CDC는 이 21세 환자와 같이 성생활을 하는 25세 미만 여성에서 Chlamydia trachomatis와 Neisseria gonorrhoeae 모두에 대해 NAAT를 이용한 매년 선별검사를 권고한다. NAAT에는 소변 검체보다 질 도말이 선호된다. RPR 또는 VDRL을 이용한 매독 선별검사는 환자가 임신 중이 아니라면 CDC에서 권고하지 않는다. 이 비임신 여성에게는 적응증이 되지 않는다.", "이 환자는 성생활을 하고 있고 25세 미만이므로 chlamydia와 gonorrhea의 유병률이 높은 집단에 속한다. CDC는 이 21세 환자와 같이 성생활을 하는 25세 미만 여성에서 Chlamydia trachomatis와 Neisseria gonorrhoeae 모두에 대해 NAAT를 이용한 매년 선별검사를 권고한다. NAAT에는 소변 검체보다 질 도말이 선호된다. RPR 또는 VDRL을 이용한 매독 선별검사는 환자가 임신 중이 아니라면 CDC에서 권고하지 않는다. 이 비임신 여성에게는 적응증이 되지 않는다.", "이 환자는 성생활을 하고 있고 25세 미만이므로 chlamydia와 gonorrhea의 유병률이 높은 집단에 속한다. CDC는 이 21세 환자와 같이 성생활을 하는 25세 미만 여성에서 Chlamydia trachomatis와 Neisseria gonorrhoeae 모두에 대해 NAAT를 이용한 매년 선별검사를 권고한다. NAAT에는 소변 검체보다 질 도말이 선호된다."]}, {"id": 47, "section": "Infections of Reproductive Organs and Sexually Transmitted Diseases", "sectionKo": "생식기 감염·STD", "stem": "A 23-year-old woman presents to the health department after having unprotected sex 10 weeks ago and requests a pregnancy test, which is positive. Based on her last menstrual period, she is 21 weeks into her pregnancy. She consented to screening for sexually transmitted diseases (STDs) at the time of her pregnancy test. Two days later the health department notifies her that she has tested positive for syphilis with a reactive fluorescent treponemal antibody absorbed (FTA-abs) test (prior records indicate negative test results 6 months ago), and rapid plasma reagin (RPR) titer of 1:64 (from two days ago). She has no symptoms of syphilis. She states that she had an anaphylactic reaction to penicillin as a child. Which is the most appropriate management for this patient’s syphilis?", "choices": ["Doxycycline 100 mg orally twice daily x 28 days", "A penicillin desensitization prot
