ca 임상진료지침에서 보조 요법으로 권장된다. 그러나 그 근거는 알레르기성 비염 병력이 있는 환자에서 얻어진 것으로, 기관 내 지침에서 이 요법의 사용을 모든 ABRS 환자에게 적용하는 데에는 한계가 있다."]}, {"id": 17, "section": "Upper Respiratory Tract Infections", "sectionKo": "상기도 감염", "stem": "MK is a 52-year-old man who has a past medical history of asthma and prostate cancer that is now in remission. He presents to the urgent care center with nasal congestion, mucopurulent drainage, and anosmia. He reports that these symptoms have been present for more than 3 months and he has been self-treating them with over- the-counter intranasal fluticasone spray with some relief. The results of a rapid COVID test are negative. Radiographic imaging demonstrates inflammation in the sinus cavities. He reports taking antibiotics at some point in the last 4 weeks but cannot recall what antibiotic he received, although he is confident that he completed the 10-day course of therapy. Which of the following interventions is most appropriate for this patient at this time?", "choices": ["Initiate therapy with doxycycline 100 mg by mouth twice daily for 10 days.", "Provide the patient with supportive care and systemic corticosteroids for 10 days.", "Initiate therapy with azithromycin 250 mg by mouth daily for 5 days.", "Provide the patient with supportive care and recommend irrigation with intranasal saline."], "answer": 4, "rationales": ["This patient displays features of chronic rhinosinusitis based on the duration of symptoms exceeding 12 weeks, presence of nasal congestion, and evidence of inflammation. Although chronic sinusitis can be characterized by acute exacerbations, in most cases it is a chronic inflammatory process with different microbiology associated with biofilm formation in the nasal passages. Use of antibiotics in the management of chronic rhinosinusitis is not advocated because it can alter the flora and increase the risk of an acute exacerbation for which a short course of antibiotics may be warranted. There are limited data suggesting that use of macrolide antibiotics or doxycycline may improve symptoms in patients with chronic rhinosinusitis, but this improvement is thought to be due to the anti-inflammatory modulation that these antibacterial agents provide in what is primarily an inflammatory process. Therefore, starting doxycycline is not the best choice for this patient. Providing the patient with supportive care and recommending irrigation with intranasal saline is a better choice.", "This patient displays features of chronic rhinosinusitis based on the duration of symptoms exceeding 12 weeks, presence of nasal congestion, and evidence of inflammation. Although chronic sinusitis can be characterized by acute exacerbations, in most cases it is a chronic inflammatory process with different microbiology associated with biofilm formation in the nasal passages. Currently, there is no consensus about the use of systemic corticosteroids for chronic rhinosinusitis, and the risk/benefit profile of using these agents for the management of this condition does not support recommending routine use. Providing the patient with supportive care and recommending irrigation with intranasal saline is the most appropriate intervention for this patient.", "This patient displays features of chronic rhinosinusitis based on the duration of symptoms exceeding 12 weeks, presence of nasal congestion, and evidence of inflammation. Although chronic sinusitis may be characterized by acute exacerbations, a chronic inflammatory process with different microbiology associated with biofilm formation in the nasal passages usually is involved. Use of antibiotics for the management of chronic rhinosinusitis is not recommended because it can alter the microbial flora and increase the risk of an acute exacerbation for which a short course of antibiotics may be warranted. There are limited data suggesting that the use of macrolide antibiotics or doxycycline may improve symptoms in patients with chronic rhinosinusitis, but this improvement is thought to be due to the anti-inflammatory modulation that these antibacterial agents provide in what is primarily an inflammatory process. Providing the patient with supportive care and recommending irrigation with intranasal saline is a better choice for this patient.", "This patient displays features of chronic rhinosinusitis based on the duration of symptoms exceeding 12 weeks, presence of nasal congestion, and evidence of inflammation. Although chronic sinusitis may be characterized by acute exacerbations, a chronic inflammatory process with different microbiology associated with biofilm formation in the nasal passages usually is involved. Use of antibiotics for the management of chronic rhinosinusitis is not recommended because it can alter the microbial flora and increase the risk of an acute exacerbation for which a short course of antibiotics may be warranted. Therefore, providing the patient with supportive care and recommending irrigation with intranasal saline is the most appropriate intervention for this patient."], "ref": "1. Barshak MB, Durand ML. The role of infection and antibiotics in chronic rhinosinusitis. Laryngoscope Investig\nOtolaryngol. 2017; 2:36-42. 2. Brook I. Microbiology of chronic rhinosinusitis. Eur J Clin Microbiol Infect Dis. 2016; 35:1059-68.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # 1.12 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.5 Knowledge # 1.16 __________________________________________________________________________________________________", "level": 3, "stemKo": "MK는 천식과 현재 관해 상태인 전립선암의 과거력이 있는 52세 남성이다. 환자는 코막힘, 점액화농성 분비물, 후각 소실을 주소로 응급 진료 센터에 내원하였다. 이러한 증상이 3개월 이상 지속되었으며, 일반의약품인 비강 내 fluticasone 스프레이로 자가 치료하여 어느 정도 완화되었다고 한다. COVID 신속검사 결과는 음성이다. 영상 검사에서 부비동 내 염증이 확인되었다. 환자는 지난 4주 사이 어느 시점에 항생제를 복용했다고 하나 어떤 항생제였는지는 기억하지 못하며, 다만 10일간의 치료 과정을 완료했다는 점은 확실하다고 한다. 현 시점에서 이 환자에게 가장 적절한 중재는 다음 중 무엇인가?", "choicesKo": ["Doxycycline 100 mg 경구 1일 2회로 10일간 치료를 시작한다.", "환자에게 보존적 치료와 함께 전신 코르티코스테로이드를 10일간 투여한다.", "Azithromycin 250 mg 경구 1일 1회로 5일간 치료를 시작한다.", "환자에게 보존적 치료를 제공하고 비강 내 생리식염수 세척을 권고한다."], "rationalesKo": ["이 환자는 12주를 초과하는 증상 지속 기간, 코막힘의 존재, 염증의 증거에 근거하여 만성 비부비동염의 특징을 보인다. 만성 부비동염은 급성 악화를 특징으로 할 수 있으나, 대부분의 경우 비강 통로의 biofilm 형성과 연관된 다른 미생물학적 특성을 갖는 만성 염증 과정이다. 만성 비부비동염의 관리에서 항생제 사용은 권장되지 않는데, 이는 항생제가 균총을 변화시켜 급성 악화의 위험을 증가시킬 수 있고 이 경우 단기간의 항생제 투여가 필요해질 수 있기 때문이다. Macrolide계 항생제나 doxycycline의 사용이 만성 비부비동염 환자의 증상을 개선할 수 있다는 제한적인 자료가 있으나, 이러한 개선은 주로 염증 과정인 이 질환에서 해당 항균제들이 제공하는 항염증 조절 작용에 기인하는 것으로 여겨진다. 따라서 doxycycline을 시작하는 것은 이 환자에게 가장 적절한 선택이 아니다. 환자에게 보존적 치료를 제공하고 비강 내 생리식염수 세척을 권고하는 것이 더 나은 선택이다.", "이 환자는 12주를 초과하는 증상 지속 기간, 코막힘의 존재, 염증의 증거에 근거하여 만성 비부비동염의 특징을 보인다. 만성 부비동염은 급성 악화를 특징으로 할 수 있으나, 대부분의 경우 비강 통로의 biofilm 형성과 연관된 다른 미생물학적 특성을 갖는 만성 염증 과정이다. 현재 만성 비부비동염에 대한 전신 코르티코스테로이드 사용에 관한 합의는 없으며, 이 질환의 관리에 이러한 약제를 사용하는 것의 위험/이익 프로파일은 일상적 사용을 권고할 만한 근거가 되지 못한다. 환자에게 보존적 치료를 제공하고 비강 내 생리식염수 세척을 권고하는 것이 이 환자에게 가장 적절한 중재이다.", "이 환자는 12주를 초과하는 증상 지속 기간, 코막힘의 존재, 염증의 증거에 근거하여 만성 비부비동염의 특징을 보인다. 만성 부비동염이 급성 악화를 특징으로 할 수 있으나, 대개는 비강 통로의 biofilm 형성과 연관된 다른 미생물학적 특성을 갖는 만성 염증 과정이 관여한다. 만성 비부비동염의 관리에서 항생제 사용은 권장되지 않는데, 이는 항생제가 미생물 균총을 변화시켜 급성 악화의 위험을 증가시킬 수 있고 이 경우 단기간의 항생제 투여가 필요해질 수 있기 때문이다. Macrolide계 항생제나 doxycycline의 사용이 만성 비부비동염 환자의 증상을 개선할 수 있다는 제한적인 자료가 있으나, 이러한 개선은 주로 염증 과정인 이 질환에서 해당 항균제들이 제공하는 항염증 조절 작용에 기인하는 것으로 여겨진다. 환자에게 보존적 치료를 제공하고 비강 내 생리식염수 세척을 권고하는 것이 이 환자에게 더 나은 선택이다.", "이 환자는 12주를 초과하는 증상 지속 기간, 코막힘의 존재, 염증의 증거에 근거하여 만성 비부비동염의 특징을 보인다. 만성 부비동염이 급성 악화를 특징으로 할 수 있으나, 대개는 비강 통로의 biofilm 형성과 연관된 다른 미생물학적 특성을 갖는 만성 염증 과정이 관여한다. 만성 비부비동염의 관리에서 항생제 사용은 권장되지 않는데, 이는 항생제가 미생물 균총을 변화시켜 급성 악화의 위험을 증가시킬 수 있고 이 경우 단기간의 항생제 투여가 필요해질 수 있기 때문이다. 따라서 환자에게 보존적 치료를 제공하고 비강 내 생리식염수 세척을 권고하는 것이 이 환자에게 가장 적절한 중재이다."]}, {"id": 18, "section": "Upper Respiratory Tract Infections", "sectionKo": "상기도 감염", "stem": "JW is a 55-year-old male with coronary artery disease (CAD) and chronic obstructive pulmonary disease (COPD) who recently quit smoking after a 10-pack-year history. He presents in December with a COPD exacerbation and forced expiratory volume in 1 second (FEV1) of 55% of the predicted value. He has had two prior COPD exacerbations leading to hospitalization since his diagnosis. His COPD Assessment Test (CAT) score is 12. He is receiving appropriate therapy for both CAD and COPD. His respiratory rate is 35 breaths per minute, and his oxygen saturation has improved with the administration of supplemental oxygen. The primary care provider would like a recommendation for ongoing follow-up to include pharmacotherapy options to prevent acute exacerbations of COPD. Which of the following is the most appropriate evidence-based recommendation for this patient?", "choices": ["Administer the 13-valent pneumococcal conjugate vaccine (PCV13) once the patient’s condition is stable.", "Administer the annual influenza vaccine and the 20-valent pneumococcal conjugate vaccine once the patient’s condition is stable.", "Initiate prednisone 40 mg orally by mouth daily.", "Initiate moxifloxacin 400 mg by mouth once daily for 5 days."], "answer": 2, "rationales": ["A pneumococcal vaccine (single dose of PCV20 or a combination of PCV15 followed by PPSV23) should be given to patients 19-64 years of age with chronic lung disease because of their high risk for invasive pneumococcal disease. This 55-year-old patient should receive it now along with the annual influenza vaccine. Both the annual influenza vaccine and pneumococcal vaccines have been shown in multiple studies to decrease the frequency of COPD exacerbations.", "A pneumococcal vaccine (PCV20 or PCV15 followed by PPSV23) should be given to patients 19-64 years of age with chronic lung disease because of their high risk for invasive pneumococcal disease. This 55-year-old patient should receive it now along with the annual influenza vaccine. Both the annual influenza vaccine and pneumococcal vaccines have been shown in multiple studies to decrease the frequency of COPD exacerbations.", "Systemic corticosteroids may be recommended for patients with an acute exacerbation of COPD. However, prolonged daily use of systemic corticosteroids is not associated with a decrease in the frequency of COPD exacerbations. Inhaled corticosteroids have been shown to reduce the frequency of acute exacerbations when given in conjunction with a long-acting beta2 agonist (LABA) or as part of a three-drug combination with a LABA and a long-acting muscarinic antagonist. The phosphodiesterase-4 inhibitor roflumilast is another anti- inflammatory therapy that can be considered for prophylaxis of acute exacerbations of COPD.", "Fluoroquinolones can be useful in the management of COPD exacerbations when there are signs of bacterial infection based on elevated C-reactive protein levels and white blood cell counts, even in the absence of culture data. However, this patient does not meet the criteria for use of antimicrobial therapy at this time based on his uncomplicated COPD exacerbation. The use of antibiotics for acute exacerbations does not decrease the frequency of future exacerbations, even in patients like JW with heart disease."], "ref": "1. Global Initiative for Chronic Obstructive Lung Disease, Inc. Global strategy for the diagnosis, management, and prevention of chronic obstructive pulmonary disease (2022 report). https://goldcopd.org/ (accessed 2022 Nov 1). 2. Bekkat-Berkani R, Wilkinson T, Buchy P et al. Seasonal influenza vaccination in patients with COPD: a systematic\nliterature review. BMC Pulm Med. 2017; 17:79. 3. Advisory Committee on Immunization Practices. Table 1. Recommended adult immunization schedule for ages\n19 years or older, United States, 2023. https://www.cdc.gov/vaccines/schedules/hcp/imz/adult.html#table-age (accessed 2023 Feb 9). 4. Dixit D, Bridgeman MB, Madduri RP et al. Pharmacological management and prevention of exacerbations of\nchronic obstructive pulmonary disease in hospitalized patients. P T. 2016; 41:703-12. 5. Matanock A, Lee G, Gierke R et al. Use of 13-valent pneumococcal conjugate vaccine and 23-valent\npneumococcal polysaccharide vaccine among adults aged ≥65 years: updated recommendations of the Advisory Committee on Immunization Practices. MMWR Morb Mortal Wkly Rep. 2019; 68:1069-75. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6871896/pdf/mm6846a5.pdf.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.3 Knowledge # 1.5 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.3 Knowledge # 1.28 RUBRIC #3: BCIDP - ID Domain # 1 Task # 1.3 Knowledge # 1.31 __________________________________________________________________________________________________", "level": 3, "stemKo": "JW는 관상동맥질환(CAD)과 만성 폐쇄성 폐질환(COPD)이 있는 55세 남성으로, 10갑년의 흡연력 후 최근 금연하였다. 환자는 12월에 COPD 악화로 내원하였으며 1초간 노력성 호기량(FEV1)은 예측치의 55%이다. 진단 이후 입원을 요한 COPD 악화가 두 차례 있었다. COPD 평가 검사(CAT) 점수는 12점이다. 환자는 CAD와 COPD 모두에 대해 적절한 치료를 받고 있다. 호흡수는 분당 35회이며, 산소 보충 투여로 산소포화도는 개선되었다. 일차 진료 의사는 COPD의 급성 악화를 예방하기 위한 약물요법 선택지를 포함한 지속적 추적 관리에 대한 권고를 요청하고 있다. 이 환자에게 가장 적절한 근거 기반 권고는 다음 중 무엇인가?", "choicesKo": ["환자의 상태가 안정되면 13가 폐렴구균 단백결합 백신(PCV13)을 접종한다.", "환자의 상태가 안정되면 연간 인플루엔자 백신과 20가 폐렴구균 단백결합 백신을 접종한다.", "Prednisone 40 mg 경구 1일 1회를 시작한다.", "Moxifloxacin 400 mg 경구 1일 1회로 5일간 치료를 시작한다."], "rationalesKo": ["만성 폐질환이 있는 19-64세 환자는 침습성 폐렴구균 질환의 위험이 높기 때문에 폐렴구균 백신(PCV20 1회 접종 또는 PCV15 접종 후 PPSV23 접종의 조합)을 투여해야 한다. 이 55세 환자는 연간 인플루엔자 백신과 함께 지금 접종받아야 한다. 연간 인플루엔자 백신과 폐렴구균 백신은 모두 여러 연구에서 COPD 악화의 빈도를 감소시키는 것으로 입증되었다.", "만성 폐질환이 있는 19-64세 환자는 침습성 폐렴구균 질환의 위험이 높기 때문에 폐렴구균 백신(PCV20 또는 PCV15 접종 후 PPSV23)을 투여해야 한다. 이 55세 환자는 연간 인플루엔자 백신과 함께 지금 접종받아야 한다. 연간 인플루엔자 백신과 폐렴구균 백신은 모두 여러 연구에서 COPD 악화의 빈도를 감소시키는 것으로 입증되었다.", "전신 코르티코스테로이드는 COPD의 급성 악화가 있는 환자에게 권장될 수 있다. 그러나 전신 코르티코스테로이드의 장기간 매일 사용은 COPD 악화 빈도의 감소와 연관되어 있지 않다. 흡입 코르티코스테로이드는 지속성 beta2 작용제(LABA)와 함께 투여하거나 LABA 및 지속성 무스카린 길항제와의 3제 병용요법의 일부로 투여할 때 급성 악화의 빈도를 감소시키는 것으로 입증되었다. Phosphodiesterase-4 억제제인 roflumilast는 COPD 급성 악화의 예방을 위해 고려할 수 있는 또 다른 항염증 치료이다.", "Fluoroquinolone계는 배양 자료가 없더라도 C-reactive protein 수치와 백혈구 수의 상승에 근거하여 세균 감염의 징후가 있는 경우 COPD 악화의 관리에 유용할 수 있다. 그러나 이 환자는 합병증이 없는 COPD 악화에 근거할 때 현 시점에서 항균 요법 사용 기준을 충족하지 않는다. 급성 악화에 대한 항생제 사용은 JW와 같이 심장 질환이 있는 환자에서도 향후 악화의 빈도를 감소시키지 않는다."]}, {"id": 19, "section": "Upper Respiratory Tract Infections", "sectionKo": "상기도 감염", "stem": "DB, a 62-year-old female, has chronic obstructive pulmonary disease (COPD), grade 2, category B and has been stable on therapy with an inhaled long-acting beta2 agonist (LABA)/inhaled corticosteroid (ICS) for the last 6 months. She suffers from chronic bronchitis for which she receives multiple courses of systemic corticosteroids throughout the year. She also has osteopenia and dyslipidemia for which she takes vitamin D/calcium citrate and atorvastatin, respectively. Which of the following may increase her risk for upper and lower respiratory tract infections, including pneumonia?", "choices": ["Advanced age", "Dyslipidemia", "Exposure to systemic and inhaled corticosteroids", "She does not have an increased risk for upper or lower respiratory tract infections based on her comorbidities."], "answer": 3, "rationales": ["Age greater than 65 years is associated with higher mortality when hospitalized for pneumonia or sepsis. However, this patient is only 62.", "Dyslipidemia and other comorbidities can increase the risk of hospitalization when pneumonia is present. However, this association is weak compared with the ongoing debate relative to exposure of patients with COPD to systemic corticosteroids and their risk of infection through down regulation of key inflammatory modulators that play a role in natural defense mechanisms that protect against infection.", "Although short courses of corticosteroids may improve outcomes in patients with COPD or bronchitis, multiple courses of systemic corticosteroids can predispose patients with COPD and bronchitis to pneumonia. This increased risk is a heavily debated phenomenon that is multifactorial in its pathogenesis. Although Cochrane review data suggest that this association may not be as strong as previously was thought, the 2021 Global Initiative for Chronic Obstructive Lung Disease (GOLD) guidelines encourage limited use and short courses of systemic corticosteroids when needed for acute COPD exacerbations. In the UPLIFT trial, an increased risk for pneumonia and respiratory adverse events was associated with exposure to corticosteroids even by the inhaled route in patients with COPD. This patient’s exposure to systemic and inhaled corticosteroids increases her risk for pneumonia and other upper and lower respiratory infections.", "This patient is at risk for pneumonia because of her COPD and exposure to multiple courses of systemic corticosteroids that suppress her immune system."], "ref": "1. Global Initiative for Chronic Obstructive Lung Disease, Inc. Global strategy for the diagnosis, management, and prevention of chronic obstructive pulmonary disease (2022 report). https://goldcopd.org/ (accessed 2022 Nov 1). 2. Morjaria JB, Rigby A, Morice AH. Inhaled corticosteroid use and the risk of pneumonia and COPD exacerbations\nin the UPLIFT study. Lung. 2017; 195:281-8. 3. Ernst P, Coulombe J, Brassard P et al. The risk of sepsis with inhaled and oral corticosteroids in patients with\nCOPD. COPD. 2017; 14:137-42.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # 1.16 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.3 Knowledge # 1.17 __________________________________________________________________________________________________", "level": 3, "stemKo": "DB는 62세 여성으로 만성폐쇄성폐질환(COPD) grade 2, category B를 가지고 있으며 지난 6개월간 흡입형 long-acting beta2 agonist(LABA)/흡입형 corticosteroid(ICS) 치료로 안정적으로 유지되고 있다. 그녀는 만성 기관지염을 앓고 있어 연중 여러 차례 전신 corticosteroid 요법을 받고 있다. 또한 골감소증과 이상지질혈증이 있어 각각 vitamin D/calcium citrate와 atorvastatin을 복용하고 있다. 다음 중 폐렴을 포함한 상기도 및 하기도 감염의 위험을 증가시킬 수 있는 것은?", "choicesKo": ["고령", "이상지질혈증", "전신 및 흡입 corticosteroid 노출", "그녀의 동반질환을 고려할 때 상기도 또는 하기도 감염의 위험이 증가되어 있지 않다."], "rationalesKo": ["65세를 초과하는 연령은 폐렴이나 패혈증으로 입원했을 때 더 높은 사망률과 연관된다. 그러나 이 환자는 62세에 불과하다.", "이상지질혈증 및 기타 동반질환은 폐렴이 있을 때 입원의 위험을 증가시킬 수 있다. 그러나 이러한 연관성은, COPD 환자가 전신 corticosteroid에 노출되어 감염으로부터 보호하는 자연 방어기전에 관여하는 핵심 염증 조절인자들이 하향 조절됨으로써 감염 위험이 높아진다는, 현재 진행 중인 논쟁에 비하면 약한 편이다.", "corticosteroid의 단기 요법은 COPD 또는 기관지염 환자에서 결과를 개선할 수 있지만, 전신 corticosteroid의 반복적인 사용은 COPD 및 기관지염 환자를 폐렴에 취약하게 만들 수 있다. 이러한 위험 증가는 그 병태생리가 다인성인, 논란이 많은 현상이다. Cochrane 리뷰 자료는 이 연관성이 이전에 생각되었던 것만큼 강하지 않을 수 있음을 시사하지만, 2021년 Global Initiative for Chronic Obstructive Lung Disease(GOLD) 지침은 급성 COPD 악화 시 전신 corticosteroid가 필요할 경우 제한적으로 그리고 단기간만 사용할 것을 권장한다. UPLIFT 연구에서는 COPD 환자에서 흡입 경로를 통한 corticosteroid 노출조차도 폐렴 및 호흡기계 이상반응 위험 증가와 연관되었다. 이 환자의 전신 및 흡입 corticosteroid 노출은 폐렴 및 기타 상기도·하기도 감염의 위험을 증가시킨다.", "이 환자는 COPD와 면역계를 억제하는 여러 차례의 전신 corticosteroid 노출 때문에 폐렴의 위험이 있다."]}, {"id": 20, "section": "Upper Respiratory Tract Infections", "sectionKo": "상기도 감염", "stem": "SK is a 69-year-old female with a past medical history of non-ST-segment myocardial infarction, seasonal allergic rhinitis, diabetes mellitus, and chronic obstructive pulmonary disease who presents to the outpatient primary care provider for a wellness checkup following a recent visit for an upper respiratory tract infection with accompanying fever. Review of her medical record reveals that she has not yet received any pneumococcal vaccination. Which of the following would be a contraindication to immunization with the 20-valent pneumococcal conjugate vaccine (PCV20) today?", "choices": ["Recent upper respiratory infection with accompanying fever", "Anaphylaxis to the diphtheria tetanus vaccine", "Anaphylaxis to the hepatitis B vaccine", "Anaphylaxis to latex and latex-containing products"], "answer": 2, "rationales": ["The only contraindication to PCV20 use is severe allergic reaction (e.g., anaphylaxis) to any component of the PCV20 vaccine or any diphtheria toxoid-containing vaccine. Moderate or severe acute illness with or without fever is a precaution in the use of PCV20. Therefore, this patient could receive PCV20 despite her recent upper respiratory tract infection and fever, with monitoring in the office.", "The only contraindication to PCV20 use is severe allergic reaction (e.g., anaphylaxis) to any component of the PCV20 vaccine or any diphtheria toxoid-containing vaccine.", "The only contraindication to PCV20 use is severe allergic reaction (e.g., anaphylaxis) to any component of the PCV20 vaccine or any diphtheria toxoid-containing vaccine.", "The only contraindication to PCV20 use is severe allergic reaction (e.g., anaphylaxis) to any component of the PCV20 vaccine or any diphtheria toxoid-containing vaccine."], "ref": "1. Matanock A, Lee G, Gierke R et al. Use of 13-valent pneumococcal conjugate vaccine and 23-valent\npneumococcal polysaccharide vaccine among adults aged ≥65 years: updated recommendations of the Advisory Committee on Immunization Practices. MMWR Morb Mortal Wkly Rep. 2019; 68:1069-75. https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6871896/pdf/mm6846a5.pdf. 2. Advisory Committee on Immunization Practices. Table 1. Recommended adult immunization schedule for ages\n19 years or older, United States, 2023. https://www.cdc.gov/vaccines/schedules/hcp/imz/adult.html#table-age (accessed 2023 Feb 9).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.5 Knowledge # 1.5 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.5 Knowledge # 1.31\nPresentation Title: Lower Respiratory Tract Infections\nLEARNING OBJECTIVES\nLO#1: Assess pharmacotherapies for lower respiratory tract infections, including antimicrobial spectrum of activity, pharmacokinetics, and pharmacodynamics.\nLO#2: Select the most appropriate pharmacotherapeutic plan and monitoring based on patient- and disease-specific information, antibiogram data, and best available evidence.\nLO#3: Interpret signs, symptoms, and laboratory and other relevant diagnostic test results.\nLO#4: Recommend the most appropriate modifications of patient-specific treatment plans based on efficacy, adverse effects, and follow-up assessment.\nLO#5: Interpret biomedical literature with regard to study design and methodology, significance of reported data and conclusions, limitations, and applicability of study results to patients with lower respiratory tract infections.", "level": 3, "stemKo": "SK는 69세 여성으로 non-ST-segment 심근경색, 계절성 알레르기 비염, 당뇨병, 만성폐쇄성폐질환의 과거력이 있으며, 최근 발열을 동반한 상기도 감염으로 내원한 이후 건강검진을 위해 외래 일차의료 제공자를 방문하였다. 의무기록 검토 결과 그녀는 아직 폐렴구균 백신을 전혀 접종받지 않은 것으로 확인되었다. 다음 중 오늘 20가 폐렴구균 단백결합 백신(PCV20) 접종의 금기가 되는 것은?", "choicesKo": ["발열을 동반한 최근의 상기도 감염", "diphtheria tetanus 백신에 대한 아나필락시스", "hepatitis B 백신에 대한 아나필락시스", "라텍스 및 라텍스 함유 제품에 대한 아나필락시스"], "rationalesKo": ["PCV20 사용의 유일한 금기는 PCV20 백신의 어떤 성분 또는 diphtheria toxoid를 함유한 백신에 대한 중증 알레르기 반응(예: 아나필락시스)이다. 발열 유무와 관계없이 중등도 또는 중증의 급성 질환은 PCV20 사용 시 주의사항(precaution)에 해당한다. 따라서 이 환자는 최근의 상기도 감염과 발열에도 불구하고 진료실에서 관찰하면서 PCV20을 접종받을 수 있다.", "PCV20 사용의 유일한 금기는 PCV20 백신의 어떤 성분 또는 diphtheria toxoid를 함유한 백신에 대한 중증 알레르기 반응(예: 아나필락시스)이다.", "PCV20 사용의 유일한 금기는 PCV20 백신의 어떤 성분 또는 diphtheria toxoid를 함유한 백신에 대한 중증 알레르기 반응(예: 아나필락시스)이다.", "PCV20 사용의 유일한 금기는 PCV20 백신의 어떤 성분 또는 diphtheria toxoid를 함유한 백신에 대한 중증 알레르기 반응(예: 아나필락시스)이다."]}, {"id": 21, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "AA is a 57-year-old female with a past medical history of type 2 diabetes mellitus, chronic kidney disease, and chronic obstructive pulmonary disease who is admitted to the intensive care unit for hyperglycemic hyperosmolar state. On hospital day 4, she develops signs and symptoms consistent with pneumonia. AA subsequently requires intubation due to severe hypoxia and pressor support for suspected septic shock. She was hospitalized 2 months ago for a diabetic foot infection requiring intravenous (IV) antibiotic therapy. Which of the following would be the most appropriate empiric antibiotic therapy for AA’s suspected pneumonia?", "choices": ["Linezolid plus ertapenem plus tobramycin", "Vancomycin plus cefepime", "Linezolid plus piperacillin-tazobactam plus ciprofloxacin", "Vancomycin plus cefepime plus moxifloxacin"], "answer": 3, "rationales": ["Linezolid plus piperacillin-tazobactam plus ciprofloxacin is the best choice for AA because it provides coverage for methicillin-resistant Staphylococcus aureus (MRSA) and double coverage for Pseudomonas aeruginosa (P. aeruginosa). These agents are indicated because AA’s pneumonia is hospital-acquired, she has a high mortality risk (a need for ventilator support and suspected septic shock), and she received IV antibiotic therapy within the past 90 days (i.e., she is at risk for MRSA and multidrug-resistant P. aeruginosa). Linezolid plus ertapenem plus tobramycin is not a good choice for AA because ertapenem does not provide coverage for P. aeruginosa, leaving the patient with only single drug coverage (i.e., tobramycin) despite an indication for the use of double coverage.", "Linezolid plus piperacillin-tazobactam plus ciprofloxacin is the best choice for AA because it provides coverage for methicillin-resistant Staphylococcus aureus (MRSA) and double coverage for Pseudomonas aeruginosa (P. aeruginosa). These agents are indicated because AA’s pneumonia is hospital-acquired, she has a high mortality risk (a need for ventilator support and suspected septic shock), and she received IV antibiotic therapy within the past 90 days (i.e., she is at risk for MRSA and multidrug-resistant P. aeruginosa). Vancomycin plus cefepime is not appropriate because it provides only single drug coverage (i.e., cefepime) for P. aeruginosa despite an indication for the use of double coverage.", "Linezolid plus piperacillin-tazobactam plus ciprofloxacin is the best choice for AA because it provides coverage for methicillin-resistant Staphylococcus aureus (MRSA) and double coverage for Pseudomonas aeruginosa (P. aeruginosa). These agents are indicated because AA’s pneumonia is hospital-acquired, she has a high mortality risk (a need for ventilator support and suspected septic shock), and she received IV antibiotic therapy within the past 90 days (i.e., she is at risk for MRSA and multidrug-resistant P. aeruginosa).", "Linezolid plus piperacillin-tazobactam plus ciprofloxacin is the best choice for AA because it provides coverage for methicillin-resistant Staphylococcus aureus (MRSA) and double coverage for Pseudomonas aeruginosa (P. aeruginosa). These agents are indicated because AA’s pneumonia is hospital-acquired, she has a high mortality risk (a need for ventilator support and suspected septic shock), and she received IV antibiotic therapy within the past 90 days (i.e., she is at risk for MRSA and multidrug-resistant P. aeruginosa). Vancomycin plus cefepime plus moxifloxacin is not appropriate because moxifloxacin does not provide coverage for P. aeruginosa, leaving the patient with only single drug coverage (i.e., cefepime) despite an indication for the use of double coverage."], "ref": "1. Kalil AC, Metersky ML, Klompas M et al. Management of adults with hospital-acquired and ventilator-associated pneumonia: 2016 clinical practice guidelines by the Infectious Diseases Society of America and the American Thoracic Society. Clin Infect Dis. 2016;63:e61-e111.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # 1.01.13, 1.11, 1.02 __________________________________________________________________________________________________", "level": 3, "stemKo": "AA는 57세 여성으로 제2형 당뇨병, 만성 신장질환, 만성폐쇄성폐질환의 과거력이 있으며 고혈당성 고삼투압 상태로 중환자실에 입원하였다. 입원 4일째, 그녀는 폐렴에 부합하는 징후와 증상이 발생하였다. 이후 AA는 중증 저산소증으로 인해 기관삽관이 필요하게 되었고 패혈성 쇼크가 의심되어 승압제 지지가 필요하였다. 그녀는 2개월 전 당뇨병성 족부감염으로 정맥(IV) 항생제 치료가 필요하여 입원한 적이 있다. 다음 중 AA의 의심되는 폐렴에 대해 가장 적절한 경험적 항생제 요법은?", "choicesKo": ["Linezolid 병용 ertapenem 병용 tobramycin", "Vancomycin 병용 cefepime", "Linezolid 병용 piperacillin-tazobactam 병용 ciprofloxacin", "Vancomycin 병용 cefepime 병용 moxifloxacin"], "rationalesKo": ["Linezolid 병용 piperacillin-tazobactam 병용 ciprofloxacin이 AA에게 최선의 선택인데, 이는 methicillin-resistant Staphylococcus aureus(MRSA)에 대한 커버와 Pseudomonas aeruginosa(P. aeruginosa)에 대한 이중 커버를 제공하기 때문이다. 이러한 약제들이 필요한 이유는 AA의 폐렴이 병원획득성이고, 사망 위험이 높으며(인공호흡기 지지가 필요하고 패혈성 쇼크가 의심됨), 지난 90일 이내에 IV 항생제 치료를 받았기 때문이다(즉, MRSA 및 다제내성 P. aeruginosa의 위험이 있음). Linezolid 병용 ertapenem 병용 tobramycin은 AA에게 좋은 선택이 아닌데, ertapenem이 P. aeruginosa를 커버하지 못하여 이중 커버가 필요함에도 불구하고 환자는 단일 약제 커버(즉, tobramycin)만 받게 되기 때문이다.", "Linezolid 병용 piperacillin-tazobactam 병용 ciprofloxacin이 AA에게 최선의 선택인데, 이는 methicillin-resistant Staphylococcus aureus(MRSA)에 대한 커버와 Pseudomonas aeruginosa(P. aeruginosa)에 대한 이중 커버를 제공하기 때문이다. 이러한 약제들이 필요한 이유는 AA의 폐렴이 병원획득성이고, 사망 위험이 높으며(인공호흡기 지지가 필요하고 패혈성 쇼크가 의심됨), 지난 90일 이내에 IV 항생제 치료를 받았기 때문이다(즉, MRSA 및 다제내성 P. aeruginosa의 위험이 있음). Vancomycin 병용 cefepime은 적절하지 않은데, 이중 커버가 필요함에도 불구하고 P. aeruginosa에 대해 단일 약제 커버(즉, cefepime)만 제공하기 때문이다.", "Linezolid 병용 piperacillin-tazobactam 병용 ciprofloxacin이 AA에게 최선의 선택인데, 이는 methicillin-resistant Staphylococcus aureus(MRSA)에 대한 커버와 Pseudomonas aeruginosa(P. aeruginosa)에 대한 이중 커버를 제공하기 때문이다. 이러한 약제들이 필요한 이유는 AA의 폐렴이 병원획득성이고, 사망 위험이 높으며(인공호흡기 지지가 필요하고 패혈성 쇼크가 의심됨), 지난 90일 이내에 IV 항생제 치료를 받았기 때문이다(즉, MRSA 및 다제내성 P. aeruginosa의 위험이 있음).", "Linezolid 병용 piperacillin-tazobactam 병용 ciprofloxacin이 AA에게 최선의 선택인데, 이는 methicillin-resistant Staphylococcus aureus(MRSA)에 대한 커버와 Pseudomonas aeruginosa(P. aeruginosa)에 대한 이중 커버를 제공하기 때문이다. 이러한 약제들이 필요한 이유는 AA의 폐렴이 병원획득성이고, 사망 위험이 높으며(인공호흡기 지지가 필요하고 패혈성 쇼크가 의심됨), 지난 90일 이내에 IV 항생제 치료를 받았기 때문이다(즉, MRSA 및 다제내성 P. aeruginosa의 위험이 있음). Vancomycin 병용 cefepime 병용 moxifloxacin은 적절하지 않은데, moxifloxacin이 P. aeruginosa를 커버하지 못하여 이중 커버가 필요함에도 불구하고 환자는 단일 약제 커버(즉, cefepime)만 받게 되기 때문이다."]}, {"id": 22, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "CC is a 27-year-old female with no past medical history who was admitted to the intensive care unit after a motor vehicle crash and subsequently developed ventilator-associated pneumonia. Culture results indicate the presence of Pseudomonas aeruginosa that is susceptible to piperacillin-tazobactam with a minimum inhibitory concentration (MIC) of 16/4 mg/L and resistant to cefepime and ceftazidime. CC is currently receiving piperacillin- tazobactam 3.375 g infused intravenously (IV) over 30 minutes every 8 hours. She has a creatinine clearance of 120 mL/min. Which of the following alternative piperacillin-tazobactam dosing regimens should be avoided in CC because attainment of pharmacokinetic and pharmacodynamics targets is LEAST likely?", "choices": ["3.375 g IV infused over 3 hr every 8 hr", "4.5 g IV infused over 30 min every 6 hr", "4.5 g IV infused over 30 min every 8 hr", "10.125 g every 24 hr as a continuous IV infusion"], "answer": 3, "rationales": ["Use of piperacillin-tazobactam 3.375 g IV infused over 3 hours every 8 hours (i.e., an extended infusion) has been shown to substantially increase the time above the minimum inhibitory concentration for beta-lactam antibiotics, including piperacillin-tazobactam. Therefore, this dosing strategy need not be avoided in CC.", "Use of piperacillin-tazobactam 4.5 g IV infused over 30 minutes every 6 hours (i.e., shortening the dosing interval) has been shown to substantially increase the time above the minimum inhibitory concentration for beta-lactam antibiotics, including piperacillin-tazobactam. Therefore, this dosing strategy need not be avoided in CC.", "Use of piperacillin-tazobactam 4.5 g IV infused over 30 minutes every 8 hours (i.e., increasing the dose) has been shown to result in marginal increases in the time above the minimum inhibitory concentration (MIC) for beta-lactam antibiotics with short half-lives, such as piperacillin-tazobactam, in patients like CC with normal renal function. Therefore, this dosing strategy would be LEAST likely to achieve an optimal time above the MIC and should be avoided for this patient.", "Use of piperacillin-tazobactam 10.125 g every 24 hours as a continuous IV infusion need not be avoided in CC because continuous IV infusions have been shown to substantially increase the time above the minimum inhibitory concentration for beta-lactam antibiotics, including piperacillin-tazobactam."], "ref": "1. Lodise TP, Lomaestro BM, Drusano GL. Application of antimicrobial pharmacodynamic concepts into clinical practice: focus on beta-lactam antibiotics: insights from the Society of Infectious Diseases Pharmacists. Pharmacotherapy. 2006;26:1320-32.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.1, 1.2 Knowledge # 1.30, 1.20 _____________________________________________________________________________________", "level": 3, "stemKo": "CC는 27세 여성으로 과거력은 없으며 교통사고 후 중환자실에 입원하였고 이후 인공호흡기 연관 폐렴이 발생하였다. 배양 결과 Pseudomonas aeruginosa가 확인되었으며, piperacillin-tazobactam에 감수성으로 최소억제농도(MIC)는 16/4 mg/L이고 cefepime과 ceftazidime에는 내성이다. CC는 현재 piperacillin-tazobactam 3.375 g을 30분에 걸쳐 정맥(IV) 주입하며 8시간마다 투여받고 있다. 그녀의 크레아티닌청소율은 120 mL/min이다. 다음 piperacillin-tazobactam 대체 용법 중 약동학 및 약력학 목표 달성 가능성이 가장 낮기 때문에 CC에서 피해야 하는 것은?", "choicesKo": ["3.375 g IV, 3시간에 걸쳐 주입, 8시간마다", "4.5 g IV, 30분에 걸쳐 주입, 6시간마다", "4.5 g IV, 30분에 걸쳐 주입, 8시간마다", "10.125 g을 24시간마다 지속 IV 주입"], "rationalesKo": ["piperacillin-tazobactam 3.375 g을 3시간에 걸쳐 8시간마다 IV 주입하는 방법(즉, 연장 주입)은 piperacillin-tazobactam을 포함한 beta-lactam 항생제에서 최소억제농도 이상으로 유지되는 시간을 상당히 증가시키는 것으로 나타났다. 따라서 이 용법은 CC에서 피할 필요가 없다.", "piperacillin-tazobactam 4.5 g을 30분에 걸쳐 6시간마다 IV 주입하는 방법(즉, 투여 간격 단축)은 piperacillin-tazobactam을 포함한 beta-lactam 항생제에서 최소억제농도 이상으로 유지되는 시간을 상당히 증가시키는 것으로 나타났다. 따라서 이 용법은 CC에서 피할 필요가 없다.", "piperacillin-tazobactam 4.5 g을 30분에 걸쳐 8시간마다 IV 주입하는 방법(즉, 용량 증가)은 CC와 같이 신기능이 정상인 환자에서 piperacillin-tazobactam처럼 반감기가 짧은 beta-lactam 항생제의 최소억제농도(MIC) 이상 유지 시간을 미미하게만 증가시키는 것으로 나타났다. 따라서 이 용법은 최적의 MIC 이상 유지 시간을 달성할 가능성이 가장 낮으므로 이 환자에서 피해야 한다.", "piperacillin-tazobactam 10.125 g을 24시간마다 지속 IV 주입하는 방법은 CC에서 피할 필요가 없는데, 지속 IV 주입은 piperacillin-tazobactam을 포함한 beta-lactam 항생제에서 최소억제농도 이상으로 유지되는 시간을 상당히 증가시키는 것으로 나타났기 때문이다."]}, {"id": 23, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "BB is a 69-year-old male with a past medical history of hypertension and dyslipidemia who is admitted to the general ward of the hospital for acute coronary syndrome. On hospital day 4, he develops signs and symptoms consistent with pneumonia but remains hemodynamically stable and does not require ventilator support. He has had no recent hospitalizations or antibiotic exposure. The hospital antibiogram with the percentage of isolates susceptible to relevant pathogens is shown below.", "choices": ["Cefepime", "Ceftriaxone plus azithromycin", "Linezolid plus piperacillin-tazobactam", "Vancomycin plus cefepime"], "answer": 1, "rationales": ["BB’s pneumonia is hospital-acquired because it developed more than 48 hours after admission. Cefepime provides coverage for methicillin-susceptible Staphylococcus aureus (MSSA), Pseudomonas aeruginosa (P. aeruginosa), and other gram-negative bacilli that commonly cause hospital-acquired pneumonia. This patient has no indications for either methicillin-resistant Staphylococcus aureus (MRSA) coverage or double P. aeruginosa coverage. He is not considered at high mortality risk (he is not in septic shock and was not mechanically ventilated as a result of this hospital-acquired pneumonia), which is an indication for both MRSA and double P. aeruginosa coverage. This patient has not received IV antibiotics in the past 90 days (a risk factor for MRSA and multidrug-resistant \\[MDR\\] P. aeruginosa). He does not have structural lung disease (a risk factor for MDR P. aeruginosa). The hospital antibiogram indicates that 82% of the tested S. aureus isolates are susceptible to nafcillin, which means that the local MRSA prevalence is less than 20% (an indication for providing MRSA coverage). The hospital antibiogram demonstrates that 86% of the tested P. aeruginosa isolates are susceptible to cefepime, which is greater than the other antipseudomonal drugs for which antibiogram data are available (levofloxacin and piperacillin-tazobactam). Therefore, cefepime is the best choice for BB.", "BB’s pneumonia is hospital-acquired because it developed more than 48 hours after admission. Ceftriaxone plus azithromycin is not appropriate for BB because it lacks coverage for Pseudomonas aeruginosa, which is a common cause of hospital-acquired pneumonia.", "BB’s pneumonia is hospital-acquired because it developed more than 48 hours after admission. Linezolid plus piperacillin-tazobactam is not appropriate for BB because coverage for methicillin-resistant Staphylococcus aureus (MRSA) is not indicated since he has not received IV antibiotics within the past 90 days, he contracted the infection in a hospital with a MRSA prevalence less than 20% (as indicated by the fact that 82% of the tested S. aureus isolates are susceptible to nafcillin), and he does not appear to be at high risk of death (ventilator support is not required, and he does not have septic shock).", "BB’s pneumonia is hospital-acquired because it developed more than 48 hours after admission. Vancomycin plus cefepime is not appropriate for BB because coverage for methicillin-resistant Staphylococcus aureus (MRSA) is not indicated since he has not received IV antibiotics within the past 90 days, he contracted the infection in a hospital with a MRSA prevalence under 20% (as indicated by the fact that 82% of the tested S. aureus isolates are susceptible to nafcillin), and he does not appear to be at high risk of death (ventilator support is not required, and he does not have septic shock)."], "ref": "1. Kalil AC, Metersky ML, Klompas M et al. Management of adults with hospital-acquired and ventilator-associated pneumonia: 2016 clinical practice guidelines by the Infectious Diseases Society of America and the American 2. Thoracic Society. Clin Infect Dis. 2016;63:e61-e111.", "rubric": "RUBRIC #1: BCIDP – ID Domain # 1 Task # 1.1 Knowledge # 1.1.13, 1.02, 1.11 __________________________________________________________________________________________________", "tables": [{"title": "병원 antibiogram (% susceptible)", "headers": ["Organism", "Azithro", "Cefepime", "Ceftriaxone", "Levoflox", "Linezolid", "Nafcillin", "Pip-tazo", "Vanco"], "rows": [["E. coli", "15", "94", "77", "73", "–", "–", "90", "–"], ["H. influenzae", "98", "100", "100", "100", "–", "–", "100", "–"], ["K. pneumoniae", "–", "90", "80", "81", "–", "–", "89", "–"], ["S. aureus", "55", "82", "82", "56", "99", "82", "82", "100"], ["S. pneumoniae", "70", "96", "97", "99", "100", "100", "95", "100"], ["P. aeruginosa", "–", "86", "–", "77", "–", "–", "79", "–"]]}], "ask": "Which of the following would be the most appropriate empiric antibiotic therapy for BB who has not received intravenous (IV) antibiotics within the past 90 days?", "level": 3, "stemKo": "BB는 69세 남성으로 고혈압과 이상지질혈증의 과거력이 있으며 급성 관상동맥 증후군으로 병원 일반 병동에 입원하였다. 입원 4일째, 그는 폐렴에 부합하는 징후와 증상이 발생하였으나 혈역학적으로 안정적이며 인공호흡기 지지는 필요하지 않다. 그는 최근 입원력이나 항생제 노출력이 없다. 관련 병원체에 대한 감수성 균주 백분율이 포함된 원내 antibiogram은 아래와 같다.", "choicesKo": ["Cefepime", "Ceftriaxone 병용 azithromycin", "Linezolid 병용 piperacillin-tazobactam", "Vancomycin 병용 cefepime"], "rationalesKo": ["BB의 폐렴은 입원 48시간 이후에 발생하였으므로 병원획득성이다. Cefepime은 methicillin-susceptible Staphylococcus aureus(MSSA), Pseudomonas aeruginosa(P. aeruginosa) 및 병원획득 폐렴을 흔히 일으키는 기타 그람음성 간균을 커버한다. 이 환자는 methicillin-resistant Staphylococcus aureus(MRSA) 커버나 P. aeruginosa 이중 커버 중 어느 것도 적응이 되지 않는다. 그는 사망 위험이 높은 것으로 간주되지 않는데(패혈성 쇼크 상태가 아니며 이번 병원획득 폐렴으로 인해 기계환기를 받지 않았음), 이는 MRSA 커버와 P. aeruginosa 이중 커버 모두의 적응증에 해당한다. 이 환자는 지난 90일 이내에 IV 항생제를 투여받지 않았다(MRSA 및 다제내성[MDR] P. aeruginosa의 위험인자). 그는 구조적 폐질환이 없다(MDR P. aeruginosa의 위험인자). 원내 antibiogram에 따르면 검사된 S. aureus 균주의 82%가 nafcillin에 감수성이며, 이는 해당 지역 MRSA 유병률이 20% 미만임을 의미한다(20% 이상일 경우 MRSA 커버 제공의 적응증이 됨). 원내 antibiogram은 검사된 P. aeruginosa 균주의 86%가 cefepime에 감수성임을 보여주며, 이는 antibiogram 자료가 있는 다른 항녹농균 약제(levofloxacin 및 piperacillin-tazobactam)보다 높다. 따라서 cefepime이 BB에게 최선의 선택이다.", "BB의 폐렴은 입원 48시간 이후에 발생하였으므로 병원획득성이다. Ceftriaxone 병용 azithromycin은 BB에게 적절하지 않은데, 병원획득 폐렴의 흔한 원인인 Pseudomonas aeruginosa에 대한 커버가 없기 때문이다.", "BB의 폐렴은 입원 48시간 이후에 발생하였으므로 병원획득성이다. Linezolid 병용 piperacillin-tazobactam은 BB에게 적절하지 않은데, methicillin-resistant Staphylococcus aureus(MRSA) 커버가 적응이 되지 않기 때문이다. 그는 지난 90일 이내에 IV 항생제를 투여받지 않았고, MRSA 유병률이 20% 미만인 병원에서 감염되었으며(검사된 S. aureus 균주의 82%가 nafcillin에 감수성이라는 사실로 확인됨), 사망 위험이 높아 보이지 않는다(인공호흡기 지지가 필요하지 않고 패혈성 쇼크도 없음).", "BB의 폐렴은 입원 48시간 이후에 발생하였으므로 병원획득성이다. Vancomycin 병용 cefepime은 BB에게 적절하지 않은데, methicillin-resistant Staphylococcus aureus(MRSA) 커버가 적응이 되지 않기 때문이다. 그는 지난 90일 이내에 IV 항생제를 투여받지 않았고, MRSA 유병률이 20% 미만인 병원에서 감염되었으며(검사된 S. aureus 균주의 82%가 nafcillin에 감수성이라는 사실로 확인됨), 사망 위험이 높아 보이지 않는다(인공호흡기 지지가 필요하지 않고 패혈성 쇼크도 없음)."]}, {"id": 24, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "Which of the following currently is an appropriate evidence-based clinical application (i.e., use) of procalcitonin serum concentrations as an adjunct to clinical judgment to guide antibiotic therapy for lower respiratory tract infections?", "choices": ["Escalating antibiotic therapy in patients with hospital-associated pneumonia (HAP)", "Initiating antibiotic therapy in patients with suspected community-acquired pneumonia (CAP)", "Discontinuing antibiotic therapy in patients with ventilator-associated pneumonia (VAP)", "Ruling out the need for antibiotic therapy in patients with suspected influenza"], "answer": 3, "rationales": ["Available data demonstrating the accuracy of procalcitonin serum concentrations for identifying patients with inadequately treated HAP currently are lacking.", "Available data indicate only modest accuracy of procalcitonin serum concentrations for identifying community- acquired bacterial pneumonia, and clinical data supporting the use of procalcitonin serum concentrations for determining whether to initiate antibiotic therapy in patients with suspected CAP are lacking.", "Multiple randomized controlled trials demonstrate that the use of procalcitonin serum concentrations along with clinical criteria for decision making about when to discontinue antibiotic therapy in patients with VAP can reduce the duration of antibiotic exposure without a negative impact on clinical outcomes.", "Available data indicate only modest accuracy of procalcitonin serum concentrations for identifying community- acquired bacterial pneumonia, and clinical data supporting the use of procalcitonin serum concentrations to differentiate community-acquired bacterial pneumonia from influenza are lacking."], "ref": "1. Kalil AC, Metersky ML, Klompas M et al. Management of adults with hospital-acquired and ventilator-associated pneumonia: 2016 clinical practice guidelines by the Infectious Diseases Society of America and the American Thoracic Society. Clin Infect Dis. 2016;63:e61-e111. 2. Self WH, Balk RA, Grijalva CG et al. Procalcitonin as a marker of etiology in adults hospitalized with community-\nacquired pneumonia. Clin Infect Dis. 2017;65:183-90. 3. Metlay JP, Waterer GW, Long AC et al. Diagnosis and treatment of adults with community-acquired pneumonia.\nAn official clinical practice guideline of the American Thoracic Society and Infectious Diseases Society of America. Am J Respir Crit Care Med. 2019;200:e45-e67.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.2, 1.4 Knowledge # 1.1.13, 1.14, 1.21, 1.22 RUBRIC #2: BCIDP - ID Domain # 2 Task # 2.3 Knowledge # 2.09 __________________________________________________________________________________________________", "level": 3, "stemKo": "다음 중 하기도 감염의 항생제 요법을 결정하는 데 있어 임상적 판단의 보조 수단으로서 procalcitonin 혈청 농도를 사용하는 것에 대해, 현재 근거에 기반한 적절한 임상적 적용(즉, 사용)에 해당하는 것은?", "choicesKo": ["병원연관 폐렴(HAP) 환자에서 항생제 요법을 상향 조정(escalation)하는 경우", "지역사회획득 폐렴(CAP)이 의심되는 환자에서 항생제 요법을 시작하는 경우", "인공호흡기 연관 폐렴(VAP) 환자에서 항생제 요법을 중단하는 경우", "인플루엔자가 의심되는 환자에서 항생제 요법의 필요성을 배제하는 경우"], "rationalesKo": ["HAP가 적절히 치료되지 않은 환자를 확인하는 데 있어 procalcitonin 혈청 농도의 정확도를 입증하는 자료는 현재 부족하다.", "이용 가능한 자료는 지역사회획득 세균성 폐렴을 확인하는 데 있어 procalcitonin 혈청 농도의 정확도가 중등도 수준에 불과함을 보여주며, CAP가 의심되는 환자에서 항생제 요법의 시작 여부를 결정하기 위해 procalcitonin 혈청 농도를 사용하는 것을 뒷받침하는 임상 자료는 부족하다.", "여러 무작위 대조 연구에서 VAP 환자의 항생제 요법 중단 시점을 결정할 때 임상적 기준과 함께 procalcitonin 혈청 농도를 사용하면 임상 결과에 부정적인 영향 없이 항생제 노출 기간을 단축할 수 있음이 입증되었다.", "이용 가능한 자료는 지역사회획득 세균성 폐렴을 확인하는 데 있어 procalcitonin 혈청 농도의 정확도가 중등도 수준에 불과함을 보여주며, 지역사회획득 세균성 폐렴과 인플루엔자를 감별하기 위해 procalcitonin 혈청 농도를 사용하는 것을 뒷받침하는 임상 자료는 부족하다."]}, {"id": 25, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "ZZ, a 49-year-old Caucasian male with a past medical history of hypertension and chronic obstructive pulmonary disease, was admitted to the general ward of the hospital with influenza. He subsequently developed pneumonia caused by methicillin-resistant Staphylococcus aureus (MRSA). ZZ is currently receiving intravenous (IV) vancomycin 1000 mg every 12 hours and seems to be improving clinically. ZZ weighs 75 kg and is 70 inches tall. His serum creatinine is stable at 1.1 mg/dL, his blood urea nitrogen (BUN) is stable at 17 mg/dL, and his urine output has not changed since beginning vancomycin. The steady-state vancomycin trough concentration and area under the concentration-time curve (AUC) are determined to be 16.5 mg/L and 750 mg*h/L, respectively. Which of the following is the most appropriate course of action for ZZ’s IV vancomycin therapy at this time assuming that his renal function remains stable?", "choices": ["Continue 1000 mg every 12 hr.", "Change 1000 mg every 12 hr to 1000 mg every 24 hr.", "Change 1000 mg every 12 hr to 750 mg every 8 hr.", "Change 1000 mg every 12 hr to 750 mg every 12 hr."], "answer": 4, "rationales": ["The steady-state vancomycin AUC is 750 mg*hr/L, which is greater than the recommended range of 400-600 mg*hr/L. Vancomycin trough concentrations above 15 mg/L and AUC values above 600 mg*hr/L have been associated with an increased risk of vancomycin-associated nephrotoxicity in multiple observational studies. A vancomycin dosage reduction is needed to achieve a daily vancomycin AUC between 400 and 600 mg*hr/L. If the patient’s renal function remains stable, continuing vancomycin 1000 mg every 12 hr will continue to result in a steady-state AUC above 600 mg*hr/dL.", "The steady-state vancomycin AUC is 750 mg*hr/L, which is greater than the recommended range of 400-600 mg*hr/L. Vancomycin trough concentrations above 15 mg/L and AUC values above 600 mg*hr/L have been associated with an increased risk of vancomycin-associated nephrotoxicity in multiple observational studies. A vancomycin dosage reduction is needed to achieve a daily vancomycin AUC between 400 and 600 mg*hr/L. Because vancomycin follows first-order (linear) pharmacokinetics, a new dosage or estimated AUC for a given new dose can be calculated using proportions (AUCnew / 24-hr Dosenew = AUCold / 24-hr Doseold). Based on this principle of first-order pharmacokinetics, vancomycin 1000 mg every 24 hr is estimated to result in a steady- state AUC below 400 mg*hr/dL (x / 1000 mg = 750 mg*hr/L / 2000 mg; x = 375 mg*hr/L), which is less than the target range of 400-600 mg*hr/dL. Therefore, changing vancomycin 1000 mg every 12 hours to 1000 mg every 24 hours is not the best choice for ZZ because it would decrease the probability of treatment success.", "The steady-state vancomycin AUC is 750 mg*hr/L, which is greater than the recommended range of 400-600 mg*hr/L. Vancomycin trough concentrations above 15 mg/L and AUC values above 600 mg*hr/L have been associated with an increased risk of vancomycin-associated nephrotoxicity in multiple observational studies. A vancomycin dosage reduction is needed to achieve a daily vancomycin AUC between 400 and 600 mg*hr/L. Because vancomycin follows first-order (linear) pharmacokinetics, a new dose or estimated AUC for a given new dose can be calculated using proportions (AUCnew / 24-hr Dosenew = AUCold / 24-hr Doseold). Based on this principle of first-order pharmacokinetics, vancomycin 750 mg every 8 hours is estimated to result in a steady- state AUC above 600 mg*hr/dL (x / 2250 mg = 750 mg*hr/L / 2000 mg; x = 844 mg*hr/L), which is greater than the target range of 400-600 mg*hr/dL. Therefore, changing vancomycin 1000 mg every 12 hours to 750 mg every 8 hours is not the best choice for ZZ because he would continue to be at risk for vancomycin-associated nephrotoxicity.", "The steady-state vancomycin AUC is 750 mg*hr/L, which is greater than the recommended range of 400-600 mg*hr/L. Vancomycin trough concentrations above 15 mg/L and AUC values above 600 mg*hr/L have been associated with an increased risk of vancomycin-associated nephrotoxicity in multiple observational studies. A vancomycin dosage reduction is needed to achieve a daily vancomycin AUC between 400 and 600 mg*hr/L. Because vancomycin follows first-order (linear) pharmacokinetics, a new dosage or estimated AUC for a given new dose can be calculated using proportions (AUCnew / 24-hr Dosenew = AUCold / 24-hr Doseold). Based on this principle of first-order pharmacokinetics, vancomycin 750 mg every 12 hr is estimated to result in a steady- state AUC between 400 and 600 mg*hr/dL (x / 1500 mg = 750 mg*hr/L / 2000 mg; x = 563 mg*hr/L). Therefore, changing vancomycin 1000 mg every 12 hours to 750 mg every 12 hours is the best choice for ZZ because it will decrease the risk for vancomycin-associated nephrotoxicity without compromising the probability of treatment success."], "ref": "1. Rybak MJ, Le J, Lodise TP et al. Therapeutic monitoring of vancomycin for serious methicillin-resistant\nStaphylococcus aureus infections: a revised consensus guideline and review by the American Society of Health- System Pharmacists, the Infectious Diseases Society of America, the Pediatric Infectious Diseases Society, and the Society of Infectious Diseases Pharmacists. Am J Health-Syst Pharm. 2020;77:835-64.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.2 Knowledge # 1.1.13, 1.03, 1.18, 1.20 __________________________________________________________________________________________________", "level": 3, "stemKo": "ZZ는 고혈압과 만성폐쇄성폐질환의 병력이 있는 49세 백인 남성으로, influenza로 병원 일반병동에 입원하였다. 이후 그는 methicillin-resistant Staphylococcus aureus (MRSA)에 의한 폐렴이 발생하였다. ZZ는 현재 정맥주사(IV) vancomycin 1000 mg을 12시간마다 투여받고 있으며 임상적으로 호전되는 것으로 보인다. ZZ의 체중은 75 kg이고 신장은 70 inches이다. 그의 혈청 크레아티닌은 1.1 mg/dL로 안정적이고, 혈중요소질소(BUN)는 17 mg/dL로 안정적이며, vancomycin 시작 이후 소변량의 변화는 없다. 정상상태(steady-state) vancomycin 최저 농도(trough)와 농도-시간 곡선하 면적(AUC)은 각각 16.5 mg/L와 750 mg*h/L로 확인되었다. 그의 신기능이 안정적으로 유지된다고 가정할 때, 현시점에서 ZZ의 IV vancomycin 요법에 대한 조치로 가장 적절한 것은?", "choicesKo": ["1000 mg을 12시간마다 그대로 유지한다.", "1000 mg 12시간마다를 1000 mg 24시간마다로 변경한다.", "1000 mg 12시간마다를 750 mg 8시간마다로 변경한다.", "1000 mg 12시간마다를 750 mg 12시간마다로 변경한다."], "rationalesKo": ["정상상태 vancomycin AUC는 750 mg*hr/L로, 권장 범위인 400-600 mg*hr/L보다 높다. 15 mg/L를 초과하는 vancomycin trough 농도와 600 mg*hr/L를 초과하는 AUC 값은 여러 관찰 연구에서 vancomycin 관련 신독성 위험 증가와 연관되어 왔다. 하루 vancomycin AUC를 400에서 600 mg*hr/L 사이로 맞추기 위해서는 vancomycin 용량 감량이 필요하다. 환자의 신기능이 안정적으로 유지된다면, vancomycin 1000 mg을 12시간마다 계속 투여하는 것은 계속해서 정상상태 AUC가 600 mg*hr/dL를 초과하는 결과를 낳을 것이다.", "정상상태 vancomycin AUC는 750 mg*hr/L로, 권장 범위인 400-600 mg*hr/L보다 높다. 15 mg/L를 초과하는 vancomycin trough 농도와 600 mg*hr/L를 초과하는 AUC 값은 여러 관찰 연구에서 vancomycin 관련 신독성 위험 증가와 연관되어 왔다. 하루 vancomycin AUC를 400에서 600 mg*hr/L 사이로 맞추기 위해서는 vancomycin 용량 감량이 필요하다. vancomycin은 1차(선형) 약동학을 따르므로, 새로운 용법 또는 주어진 새 용량에 대한 예상 AUC는 비례식(AUCnew / 24-hr Dosenew = AUCold / 24-hr Doseold)을 이용하여 계산할 수 있다. 이러한 1차 약동학의 원리에 근거하면, vancomycin 1000 mg을 24시간마다 투여할 경우 정상상태 AUC는 400 mg*hr/dL 미만이 될 것으로 추정되며(x / 1000 mg = 750 mg*hr/L / 2000 mg; x = 375 mg*hr/L), 이는 목표 범위인 400-600 mg*hr/dL보다 낮다. 따라서 vancomycin 1000 mg 12시간마다를 1000 mg 24시간마다로 변경하는 것은 치료 성공 가능성을 낮추므로 ZZ에게 가장 좋은 선택이 아니다.", "정상상태 vancomycin AUC는 750 mg*hr/L로, 권장 범위인 400-600 mg*hr/L보다 높다. 15 mg/L를 초과하는 vancomycin trough 농도와 600 mg*hr/L를 초과하는 AUC 값은 여러 관찰 연구에서 vancomycin 관련 신독성 위험 증가와 연관되어 왔다. 하루 vancomycin AUC를 400에서 600 mg*hr/L 사이로 맞추기 위해서는 vancomycin 용량 감량이 필요하다. vancomycin은 1차(선형) 약동학을 따르므로, 새로운 용량 또는 주어진 새 용량에 대한 예상 AUC는 비례식(AUCnew / 24-hr Dosenew = AUCold / 24-hr Doseold)을 이용하여 계산할 수 있다. 이러한 1차 약동학의 원리에 근거하면, vancomycin 750 mg을 8시간마다 투여할 경우 정상상태 AUC는 600 mg*hr/dL를 초과할 것으로 추정되며(x / 2250 mg = 750 mg*hr/L / 2000 mg; x = 844 mg*hr/L), 이는 목표 범위인 400-600 mg*hr/dL보다 높다. 따라서 vancomycin 1000 mg 12시간마다를 750 mg 8시간마다로 변경하는 것은 환자가 계속해서 vancomycin 관련 신독성 위험에 노출되므로 ZZ에게 가장 좋은 선택이 아니다.", "정상상태 vancomycin AUC는 750 mg*hr/L로, 권장 범위인 400-600 mg*hr/L보다 높다. 15 mg/L를 초과하는 vancomycin trough 농도와 600 mg*hr/L를 초과하는 AUC 값은 여러 관찰 연구에서 vancomycin 관련 신독성 위험 증가와 연관되어 왔다. 하루 vancomycin AUC를 400에서 600 mg*hr/L 사이로 맞추기 위해서는 vancomycin 용량 감량이 필요하다. vancomycin은 1차(선형) 약동학을 따르므로, 새로운 용법 또는 주어진 새 용량에 대한 예상 AUC는 비례식(AUCnew / 24-hr Dosenew = AUCold / 24-hr Doseold)을 이용하여 계산할 수 있다. 이러한 1차 약동학의 원리에 근거하면, vancomycin 750 mg을 12시간마다 투여할 경우 정상상태 AUC는 400에서 600 mg*hr/dL 사이가 될 것으로 추정된다(x / 1500 mg = 750 mg*hr/L / 2000 mg; x = 563 mg*hr/L). 따라서 vancomycin 1000 mg 12시간마다를 750 mg 12시간마다로 변경하는 것은 치료 성공 가능성을 저해하지 않으면서 vancomycin 관련 신독성 위험을 낮추므로 ZZ에게 가장 좋은 선택이다."]}, {"id": 26, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "The highest level of currently available evidence to support the use of ceftazidime-avibactam for the treatment of patients with ventilator-associated pneumonia (VAP) caused by carbapenem-resistant Enterobacterales (CRE) is:", "choices": ["Data from in vivo animal models of pneumonia caused by CRE", "Comparative observational data from patients with bloodstream infections caused by CRE", "Non-comparative observational data from patients with VAP caused by CRE", "Randomized controlled trial data from patients with nosocomial pneumonia, including VAP"], "answer": 3, "rationales": ["Numerous reports of humans receiving ceftazidime-avibactam for the treatment of VAP caused by CRE have been published, providing a higher level of evidence than data from in vivo animal models.", "Although the results from two observational comparative studies suggest that ceftazidime-avibactam may be superior to alternative therapies for infections caused by CRE, only a small portion of these patients had pneumonia, and no comparative outcome data in a pneumonia subgroup were reported. This limits the external generalizability of these data for patients with VAP caused by CRE.", "Subgroups of case series, an observational comparative study, and randomized controlled trials provide observational, non-comparative data that provide an estimate of the efficacy of ceftazidime-avibactam for treating VAP caused by CRE.", "Although results of a randomized controlled trial by Torres and colleagues suggest that ceftazidime-avibactam may be non-inferior to meropenem for the treatment of nosocomial pneumonia, only one-third of participants had VAP, \\~ 5% were infected with a carbapenem-resistant organism, and less than 1% were infected with CRE, limiting the external generalizability of these data for the treatment of patients with VAP caused by CRE."], "ref": "1. Shields RK, Potoski BA, Haidar G et al. Clinical outcomes, drug toxicity, and emergence of ceftazidime-avibactam\nresistance among patients treated for carbapenem-resistant Enterobacteriaceae infections. Clin Infect Dis. 2016;63:1615-8. 2. Temkin E, Torre-Cisneros J, Beovic B et al. Ceftazidime-avibactam as salvage therapy for infections caused by\ncarbapenem-resistant organisms. Antimicrob Agents Chemother. 2017;61(2):pii:e01964-16. 3. Shields RK, Nguyen MH, Chen L et al. Ceftazidime-avibactam is superior to other treatment regimens against\ncarbapenem-resistant Klebsiella pneumoniae bacteremia. Antimicrob Agents Chemother. 2017;61(8):pii:e00883- 17. 4. van Duin D, Lok JJ, Earley M et al. Colistin versus ceftazidime-avibactam in the treatment of infections due to\ncarbapenem-resistant Enterobacteriaceae. Clin Infect Dis. 2018;66:163-71. 5. Torres A, Zhong N, Pachl J et al. Ceftazidime-avibactam versus meropenem in nosocomial pneumonia, including\nventilator-associated pneumonia (REPROVE): a randomised, double-blind, phase 3 non-inferiority trial. Lancet Infect Dis. 2018;18:285-95.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 2 Task # 2.3 Knowledge # 2.07, 2.09 __________________________________________________________________________________________________", "level": 3, "stemKo": "carbapenem-resistant Enterobacterales (CRE)에 의한 인공호흡기 관련 폐렴(ventilator-associated pneumonia, VAP) 환자의 치료에 ceftazidime-avibactam 사용을 뒷받침하는, 현재 이용 가능한 가장 높은 수준의 근거는 다음 중 무엇인가?", "choicesKo": ["CRE에 의한 폐렴의 in vivo 동물 모델 자료", "CRE에 의한 혈류감염 환자의 비교 관찰 자료", "CRE에 의한 VAP 환자의 비비교(non-comparative) 관찰 자료", "VAP를 포함한 병원내 폐렴 환자를 대상으로 한 무작위 대조 임상시험 자료"], "rationalesKo": ["CRE에 의한 VAP 치료를 위해 ceftazidime-avibactam을 투여받은 사람에 대한 다수의 보고가 발표되었으며, 이는 in vivo 동물 모델 자료보다 더 높은 수준의 근거를 제공한다.", "두 건의 관찰적 비교 연구 결과는 CRE에 의한 감염에서 ceftazidime-avibactam이 대체 요법보다 우수할 수 있음을 시사하지만, 이들 환자 중 폐렴 환자는 극히 일부에 불과하였고 폐렴 하위군에서의 비교 결과 자료는 보고되지 않았다. 이는 CRE에 의한 VAP 환자에 대한 이 자료의 외적 일반화 가능성을 제한한다.", "증례 시리즈, 한 건의 관찰적 비교 연구, 그리고 무작위 대조 임상시험의 하위군은 관찰적·비비교 자료를 제공하며, 이는 CRE에 의한 VAP 치료에서 ceftazidime-avibactam의 유효성을 추정할 수 있게 해준다.", "Torres 등의 무작위 대조 임상시험 결과는 병원내 폐렴 치료에서 ceftazidime-avibactam이 meropenem에 비열등할 수 있음을 시사하지만, 참여자 중 3분의 1만이 VAP였고, \\~ 5%만이 carbapenem 내성 균에 감염되었으며, 1% 미만만이 CRE에 감염되어, CRE에 의한 VAP 환자 치료에 대한 이 자료의 외적 일반화 가능성이 제한된다."]}, {"id": 27, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "Which of the following oral levofloxacin regimens is most appropriate for use as outpatient therapy for an adult patient with suspected community-acquired bacterial pneumonia and normal renal function?", "choices": ["500 mg daily for 3 days", "500 mg daily for 5 days", "750 mg daily for 3 days", "750 mg daily for 5 days"], "answer": 4, "rationales": ["Data from the use of oral levofloxacin 750 mg daily suggest that the minimum required duration of treatment for community-acquired pneumonia in adults is 5 days. Three days of therapy is inadequate, regardless of the dose.", "Data from the use of oral levofloxacin 500 mg daily suggest that 7-10 days is the appropriate required duration of treatment for adults with community-acquired pneumonia. Five days of therapy with levofloxacin 500 mg is inadequate in an adult with normal renal function.", "Data from the use of oral levofloxacin 750 mg daily suggest that the minimum required duration of treatment for community-acquired pneumonia in adults is 5 days. Three days of therapy is inadequate.", "Data from the use of oral levofloxacin 750 mg daily suggest that the minimum required duration of treatment for community-acquired pneumonia in adults is 5 days."], "ref": "1. Metlay JP, Waterer GW, Long AC et al. Diagnosis and treatment of adults with community-acquired pneumonia.\nAn official clinical practice guideline of the American Thoracic Society and Infectious Diseases Society of America. Am J Respir Crit Care Med. 2019;200:e45-e67. 2. Dunbar LM, Wunderink RG, Habib MP et al. High-dose, short-course levofloxacin for community-acquired\npneumonia: a new treatment paradigm. Clin Infect Dis. 2003;37:752-60.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # 1.1.13, 1.02, 1.20 __________________________________________________________________________________________________", "level": 3, "stemKo": "지역사회획득 세균성 폐렴이 의심되고 신기능이 정상인 성인 환자에게 외래 치료로 사용하기에 가장 적절한 경구 levofloxacin 용법은 다음 중 무엇인가?", "choicesKo": ["500 mg을 1일 1회 3일간", "500 mg을 1일 1회 5일간", "750 mg을 1일 1회 3일간", "750 mg을 1일 1회 5일간"], "rationalesKo": ["경구 levofloxacin 750 mg 1일 1회 사용 자료에 따르면 성인 지역사회획득 폐렴 치료에 필요한 최소 기간은 5일이다. 용량과 무관하게 3일간의 치료는 부적절하다.", "경구 levofloxacin 500 mg 1일 1회 사용 자료에 따르면 성인 지역사회획득 폐렴에서 적절한 치료 기간은 7-10일이다. 신기능이 정상인 성인에서 levofloxacin 500 mg으로 5일간 치료하는 것은 부적절하다.", "경구 levofloxacin 750 mg 1일 1회 사용 자료에 따르면 성인 지역사회획득 폐렴 치료에 필요한 최소 기간은 5일이다. 3일간의 치료는 부적절하다.", "경구 levofloxacin 750 mg 1일 1회 사용 자료에 따르면 성인 지역사회획득 폐렴 치료에 필요한 최소 기간은 5일이다."]}, {"id": 28, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "WW, a 67-year-old female with a past medical history of type 2 diabetes mellitus, chronic kidney disease stage III, and chronic obstructive pulmonary disease (COPD), presents to the emergency department with malaise, body aches, subjective fever, and new onset shortness of breath with increased home oxygen requirements. She reports that her symptoms began 3 days ago. WW is admitted to the general ward of the hospital and diagnosed with influenza confirmed by reverse transcription polymerase chain reaction testing. Which of the following is most appropriate for WW at this time?", "choices": ["Initiate inhaled zanamivir.", "Initiate IV peramivir.", "Initiate oral oseltamivir.", "Do not initiate any antiviral medication."], "answer": 3, "rationales": ["Inhaled zanamivir is not preferred in patients with underlying respiratory disease, such as this patient’s COPD, because of the risk of further exacerbating reactive airway disease.", "In hospitalized patients, intravenous peramivir is reserved for patients who cannot absorb oral oseltamivir (e.g., because of gastric stasis, gastrointestinal bleeding, or malabsorption) because data supporting the use of peramivir for severe influenza in hospitalized adults are limited.", "Oral oseltamivir is the best choice for this patient because they are able to tolerate oral medications and do not need intravenous peramivir. Inhaled zanamivir is less preferred to prevent exacerbating COPD.", "The Infectious Diseases Society of America recommends treatment with antiviral agents for patients hospitalized due to influenza, even when it is initiated more than 48 hours after symptom onset like with this patient."], "ref": "1. Uyeki TM, Bernstein HH, Bradley JS et al. Clinical practice guidelines by the Infectious Diseases Society of\nAmerica: 2018 update on diagnosis, treatment, chemoprophylaxis, and institutional outbreak management of seasonal influenza. Clin Infect Dis. 2019;68(6):e1-e47.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # 1.1.13, 1.02, 1.20 __________________________________________________________________________________________________", "level": 3, "stemKo": "WW는 제2형 당뇨병, 만성콩팥병 3기, 만성폐쇄성폐질환(COPD)의 병력이 있는 67세 여성으로, 권태감, 전신 통증, 주관적 발열, 그리고 가정 산소 요구량 증가를 동반한 새로 발생한 호흡곤란을 주소로 응급실에 내원하였다. 그녀는 증상이 3일 전에 시작되었다고 말한다. WW는 병원 일반병동에 입원하였고 역전사 중합효소연쇄반응(reverse transcription polymerase chain reaction) 검사로 확진된 influenza로 진단되었다. 현시점에서 WW에게 가장 적절한 것은 다음 중 무엇인가?", "choicesKo": ["흡입 zanamivir를 시작한다.", "IV peramivir를 시작한다.", "경구 oseltamivir를 시작한다.", "어떠한 항바이러스제도 시작하지 않는다."], "rationalesKo": ["흡입 zanamivir는 이 환자의 COPD와 같은 기저 호흡기 질환이 있는 환자에서는 반응성 기도 질환을 더욱 악화시킬 위험 때문에 선호되지 않는다.", "입원 환자에서 정맥주사 peramivir는 경구 oseltamivir를 흡수할 수 없는 환자(예: 위정체, 위장관 출혈, 흡수장애 등의 이유)에게 한정하여 사용하는데, 이는 입원한 성인의 중증 influenza에 대한 peramivir 사용을 뒷받침하는 자료가 제한적이기 때문이다.", "이 환자는 경구 약제를 견딜 수 있고 정맥주사 peramivir가 필요하지 않으므로 경구 oseltamivir가 가장 좋은 선택이다. 흡입 zanamivir는 COPD 악화를 예방하기 위해 덜 선호된다.", "Infectious Diseases Society of America는 influenza로 입원한 환자에 대해, 이 환자처럼 증상 발생 후 48시간이 지나서 시작하는 경우에도 항바이러스제 치료를 권장한다."]}, {"id": 29, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "GG, a 47-year-old female with type 2 diabetes, hypertension, and dyslipidemia, was admitted to the neurologic ICU following a stroke and requires mechanical ventilation. On hospital day 5 she developed ventilator-associated pneumonia (VAP). A tracheal aspirate was sent for culture, and she was started on vancomycin, cefepime, and ciprofloxacin. Today is hospital day 7. Norepinephrine was started this morning for hypotension refractory to fluid resuscitation.", "choices": ["Discontinue ciprofloxacin and continue cefepime.", "Discontinue cefepime and ciprofloxacin and add meropenem.", "Discontinue cefepime and ciprofloxacin and add ceftolozane-tazobactam.", "Continue cefepime and ciprofloxacin and add tobramycin."], "answer": 4, "rationales": ["Although the pathogen is susceptible to cefepime, its use as monotherapy is not appropriate in this patient who is in septic shock using both the old definition of septic shock (based on 2 of 4 criteria for systemic inflammatory response syndrome and requirement for vasopressor therapy) and the newer definition (serum lactate greater than 2 mmol/L and requirement for vasopressor therapy). Current recommendations from the Infectious Diseases Society of America and American Thoracic Society call for combination therapy in patients with VAP who remain in septic shock, even after antimicrobial susceptibilities are known, because of a potential mortality benefit.", "This patient is in septic shock using both the old definition of septic shock (based on 2 of 4 criteria for systemic inflammatory response syndrome and requirement for vasopressor therapy) and the newer definition (serum lactate greater than 2 mmol/L and requirement for vasopressor therapy). Current recommendations from the Infectious Diseases Society of America and American Thoracic Society call for combination therapy in patients with VAP who remain in septic shock, even after antimicrobial susceptibilities are known, because of a potential mortality benefit. Although the pathogen is susceptible to meropenem, discontinuing cefepime and ciprofloxacin and adding meropenem is not the best choice for this patient because the use of monotherapy is not appropriate, and there are no data to suggest that meropenem will be more efficacious than cefepime for treating VAP.", "This patient is in septic shock using both the old definition of septic shock (based on 2 of 4 criteria for systemic inflammatory response syndrome and requirement for vasopressor therapy) and the newer definition (serum lactate greater than 2 mmol/L and requirement for vasopressor therapy). Current recommendations from the Infectious Diseases Society of America and American Thoracic Society call for combination therapy in patients with VAP who remain in septic shock, even after antimicrobial susceptibilities are known, because of a potential mortality benefit. Although the pathogen is susceptible to ceftolozane-tazobactam, discontinuing cefepime and ciprofloxacin and adding ceftolozane-tazobactam is not the best choice for this patient because the use of monotherapy is not appropriate, and there are few data to support the use of ceftolozane-tazobactam to treat VAP or suggest that it will be more efficacious than cefepime for treating VAP.", "This patient is in septic shock using both the old definition of septic shock (based on 2 of 4 criteria for systemic inflammatory response syndrome and requirement for vasopressor therapy) and the newer definition (serum lactate greater than 2 mmol/L and requirement for vasopressor therapy). Current recommendations from the Infectious Diseases Society of America and American Thoracic Society call for combination therapy in patients with VAP who remain in septic shock, even after antimicrobial susceptibilities are known, because of a potential mortality benefit. Continuing cefepime and adding tobramycin is the only choice that employs combination therapy with two antibiotics to which this patient’s P. aeruginosa isolate is susceptible, so it is the best choice for her."], "ref": "1. Singer M, Deutschman CS, Seymour CW et al. The third international consensus definitions for sepsis and septic\nshock (Sepsis-3). JAMA. 2016;315:801-10. 2. Kalil AC, Metersky ML, Klompas M et al. Management of adults with hospital-acquired and ventilator-associated pneumonia: 2016 clinical practice guidelines by the Infectious Diseases Society of America and the American Thoracic Society. Clin Infect Dis. 2016;63:e61-e111.", "rubric": "RUBRIC #1: Domain # 1 Task # 1.2, 1.4 Knowledge # 1.1.13, 1.02, 1.11, 1.14, 1.20, 1.22 RUBRIC #2: Domain # 2 Task # 2.3 Knowledge # 2.09 __________________________________________________________________________________________________", "panel": [["Vitals", "Temp 39°C · MAP 63 mmHg · HR 87 bpm · RR 24"], ["Labs", "SCr 1 mg/dL · BUN 15 mg/dL · Lactate 3.4 mmol/L · WBC 13×10⁹/L"], ["Culture", "Tracheal aspirate — P. aeruginosa"], ["현재 약물", "Cefepime 2 g IV (3hr 주입) q8h · Vancomycin 1500 mg IV q12h · Ciprofloxacin 400 mg IV q8h · Norepinephrine 0.2 mcg/kg/min · Propofol 0.6 mg/kg/hr · Dexmedetomidine 0.6 mcg/kg/hr"]], "tables": [{"title": "감수성 결과 (P. aeruginosa, 기관흡인)", "headers": ["Drug", "MIC (mg/L)", "해석"], "rows": [["Piperacillin/tazobactam", "64/4", "I"], ["Cefepime", "4", "S"], ["Imipenem", "4", "I"], ["Meropenem", "2", "S"], ["Ceftolozane/tazobactam", "1/0.5", "S"], ["Ciprofloxacin", "8", "R"], ["Levofloxacin", "16", "R"], ["Tobramycin", "1", "S"], ["Colistin", "1", "S"]]}], "ask": "In addition to discontinuing vancomycin, which of the following modifications to GG's antibiotic therapy is most appropriate at this time?", "level": 3, "stemKo": "GG는 제2형 당뇨병, 고혈압, 이상지질혈증이 있는 47세 여성으로, 뇌졸중 후 신경계 중환자실(ICU)에 입원하였고 기계환기가 필요한 상태이다. 입원 5일째에 그녀는 인공호흡기 관련 폐렴(ventilator-associated pneumonia, VAP)이 발생하였다. 기관 흡인물을 배양 검사에 보냈고, vancomycin, cefepime, ciprofloxacin이 시작되었다. 오늘은 입원 7일째이다. 수액 소생술에 불응하는 저혈압에 대해 오늘 아침 norepinephrine이 시작되었다.", "choicesKo": ["ciprofloxacin을 중단하고 cefepime을 유지한다.", "cefepime과 ciprofloxacin을 중단하고 meropenem을 추가한다.", "cefepime과 ciprofloxacin을 중단하고 ceftolozane-tazobactam을 추가한다.", "cefepime과 ciprofloxacin을 유지하고 tobramycin을 추가한다."], "rationalesKo": ["해당 병원체가 cefepime에 감수성이 있기는 하지만, 이 환자는 기존 정의(전신염증반응증후군 4개 기준 중 2개 및 승압제 요구)와 최신 정의(혈청 lactate 2 mmol/L 초과 및 승압제 요구) 모두에 따라 패혈성 쇼크 상태이므로 단독요법으로 사용하는 것은 적절하지 않다. Infectious Diseases Society of America와 American Thoracic Society의 현행 권고는 패혈성 쇼크가 지속되는 VAP 환자에서는 항균제 감수성 결과가 확인된 후에도, 사망률 이득 가능성 때문에 병합요법을 시행할 것을 요구한다.", "이 환자는 기존 정의(전신염증반응증후군 4개 기준 중 2개 및 승압제 요구)와 최신 정의(혈청 lactate 2 mmol/L 초과 및 승압제 요구) 모두에 따라 패혈성 쇼크 상태이다. Infectious Diseases Society of America와 American Thoracic Society의 현행 권고는 패혈성 쇼크가 지속되는 VAP 환자에서는 항균제 감수성 결과가 확인된 후에도, 사망률 이득 가능성 때문에 병합요법을 시행할 것을 요구한다. 해당 병원체가 meropenem에 감수성이 있기는 하지만, cefepime과 ciprofloxacin을 중단하고 meropenem을 추가하는 것은 단독요법 사용이 적절하지 않고, VAP 치료에서 meropenem이 cefepime보다 더 효과적일 것이라는 자료도 없으므로 이 환자에게 가장 좋은 선택이 아니다.", "이 환자는 기존 정의(전신염증반응증후군 4개 기준 중 2개 및 승압제 요구)와 최신 정의(혈청 lactate 2 mmol/L 초과 및 승압제 요구) 모두에 따라 패혈성 쇼크 상태이다. Infectious Diseases Society of America와 American Thoracic Society의 현행 권고는 패혈성 쇼크가 지속되는 VAP 환자에서는 항균제 감수성 결과가 확인된 후에도, 사망률 이득 가능성 때문에 병합요법을 시행할 것을 요구한다. 해당 병원체가 ceftolozane-tazobactam에 감수성이 있기는 하지만, cefepime과 ciprofloxacin을 중단하고 ceftolozane-tazobactam을 추가하는 것은 단독요법 사용이 적절하지 않고, VAP 치료에 ceftolozane-tazobactam 사용을 뒷받침하거나 VAP 치료에서 cefepime보다 더 효과적일 것임을 시사하는 자료가 거의 없으므로 이 환자에게 가장 좋은 선택이 아니다.", "이 환자는 기존 정의(전신염증반응증후군 4개 기준 중 2개 및 승압제 요구)와 최신 정의(혈청 lactate 2 mmol/L 초과 및 승압제 요구) 모두에 따라 패혈성 쇼크 상태이다. Infectious Diseases Society of America와 American Thoracic Society의 현행 권고는 패혈성 쇼크가 지속되는 VAP 환자에서는 항균제 감수성 결과가 확인된 후에도, 사망률 이득 가능성 때문에 병합요법을 시행할 것을 요구한다. cefepime을 유지하고 tobramycin을 추가하는 것은 이 환자의 P. aeruginosa 분리주가 감수성을 보이는 두 가지 항생제로 병합요법을 시행하는 유일한 선택지이므로, 그녀에게 가장 좋은 선택이다."]}, {"id": 30, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "MM is a 4-year-old female who was admitted to the general ward of the hospital with suspected community-acquired pneumonia (CAP). She has no past medical history nor recent antibiotic exposure and she has not received any vaccines. The reported penicillin MIC50 and MIC90 for Streptococcus pneumoniae isolates at your hospital are 2 mg/L and 4 mg/L, respectively. Which of the following would be the most appropriate empiric antibiotic agent to use for MM’s suspected CAP?", "choices": ["Ampicillin", "Ceftriaxone", "Penicillin G", "Vancomycin"], "answer": 2, "rationales": ["This patient has not been immunized against Haemophilus influenzae type b or Streptococcus pneumoniae, the most common bacterial pathogens in unvaccinated children with CAP. Ampicillin is not appropriate for this patient because it does not provide coverage for penicillin-resistant Streptococcus pneumoniae.", "This patient has not been immunized against Haemophilus influenzae type b or Streptococcus pneumoniae. Ceftriaxone provides coverage against Haemophilus influenzae and Streptococcus pneumoniae, the most common bacterial pathogens in unvaccinated children with CAP. Ceftriaxone also provides coverage for penicillin-resistant Streptococcus pneumoniae, which represents a large proportion (at least 10%) of local isolates. The current Clinical and Laboratory Standards Institute (CLSI) susceptibility breakpoint for intravenous penicillin against Streptococcus pneumoniae is no more than 2 mg/L. Because the MIC90 (90th percentile of isolates tested) is 4 mg/L, at least 10% of the isolates tested have an MIC of 4 mg/L or greater and therefore are resistant to penicillin.", "This patient has not been immunized against Haemophilus influenzae (H. influenzae) type b or Streptococcus pneumoniae, the most common bacterial pathogens in unvaccinated children with CAP. Penicillin G does not provide coverage for H. influenzae or penicillin-resistant Streptococcus pneumoniae.", "This patient has not been immunized against Haemophilus influenzae type b or Streptococcus pneumoniae, the most common bacterial pathogens in unvaccinated children with CAP. Vancomycin does not provide coverage for Haemophilus influenzae. Furthermore, use of vancomycin to provide coverage for methicillin-resistant Staphylococcus aureus is not necessary because this patient is not exhibiting any readily apparent features consistent with Staphylococcus aureus pneumonia (e.g., necrotizing or cavitary findings on imaging, failure of previous antibiotic therapy)."], "ref": "1. Bradley JS, Byington CL, Shah SS et al. The management of community-acquired pneumonia in infants and\nchildren older than 3 months of age: clinical practice guidelines by the Pediatric Infectious Diseases Society and the Infectious Diseases Society of America. Clin Infect Dis. 2011;53:e25-76. 2. Clinical Laboratory and Standards Institute. Performance standards for antimicrobial susceptibility testing, 32nd\ned. CLSI supplement M100. Wayne, PA: Clinical Laboratory and Standards Institute; 2022.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.1,1.3,1.4 Knowledge # 1.1.13, 1.2, 1.11, 1.13, 1.16 __________________________________________________________________________________________________\nPresentation Title: HIV Infection & AIDS\nLEARNING OBJECTIVES\nLO#1: Interpret signs, symptoms, and laboratory and other relevant diagnostic test results related to HIV infection.\nLO#2: Assess pharmacotherapies for HIV-infection and AIDS, including opportunistic infections.\nLO#3: Select the most appropriate pharmacotherapeutic plan and monitoring based on patient- and disease-specific information, resistance data, and best available evidence.\nLO#4: Recommend modifications of patient-specific treatment plans based on efficacy, drug interactions, immunologic or virologic response, and adverse effects.\nLO#5: List recommended immunizations and screening guidelines for patients with HIV.\nLO#6: Evaluate a plan to facilitate transitions of care.", "level": 3, "stemKo": "MM은 지역사회획득 폐렴(community-acquired pneumonia, CAP)이 의심되어 병원 일반병동에 입원한 4세 여아이다. 그녀는 과거 병력이나 최근 항생제 노출력이 없으며, 어떠한 백신도 접종받지 않았다. 귀하의 병원에서 보고된 Streptococcus pneumoniae 분리주의 penicillin MIC50 및 MIC90은 각각 2 mg/L와 4 mg/L이다. MM의 의심되는 CAP에 대해 경험적 항생제로 사용하기에 가장 적절한 것은 다음 중 무엇인가?", "choicesKo": ["Ampicillin", "Ceftriaxone", "Penicillin G", "Vancomycin"], "rationalesKo": ["이 환자는 백신 미접종 소아의 CAP에서 가장 흔한 세균 병원체인 Haemophilus influenzae type b 또는 Streptococcus pneumoniae에 대한 예방접종을 받지 않았다. Ampicillin은 penicillin 내성 Streptococcus pneumoniae를 커버하지 못하므로 이 환자에게 적절하지 않다.", "이 환자는 Haemophilus influenzae type b 또는 Streptococcus pneumoniae에 대한 예방접종을 받지 않았다. Ceftriaxone은 백신 미접종 소아의 CAP에서 가장 흔한 세균 병원체인 Haemophilus influenzae와 Streptococcus pneumoniae를 커버한다. 또한 Ceftriaxone은 지역 분리주에서 상당한 비율(최소 10%)을 차지하는 penicillin 내성 Streptococcus pneumoniae도 커버한다. 현행 Clinical and Laboratory Standards Institute (CLSI)의 정맥주사 penicillin에 대한 Streptococcus pneumoniae 감수성 판정 기준(breakpoint)은 2 mg/L 이하이다. MIC90(검사한 분리주의 90번째 백분위수)이 4 mg/L이므로, 검사한 분리주의 최소 10%는 MIC가 4 mg/L 이상이며 따라서 penicillin에 내성이다.", "이 환자는 백신 미접종 소아의 CAP에서 가장 흔한 세균 병원체인 Haemophilus influenzae (H. influenzae) type b 또는 Streptococcus pneumoniae에 대한 예방접종을 받지 않았다. Penicillin G는 H. influenzae나 penicillin 내성 Streptococcus pneumoniae를 커버하지 못한다.", "이 환자는 백신 미접종 소아의 CAP에서 가장 흔한 세균 병원체인 Haemophilus influenzae type b 또는 Streptococcus pneumoniae에 대한 예방접종을 받지 않았다. Vancomycin은 Haemophilus influenzae를 커버하지 못한다. 또한 이 환자는 Staphylococcus aureus 폐렴에 부합하는 뚜렷한 특징(예: 영상에서 괴사성 또는 공동성 소견, 이전 항생제 치료의 실패)을 보이지 않으므로 methicillin-resistant Staphylococcus aureus를 커버하기 위해 vancomycin을 사용할 필요는 없다."]}, {"id": 31, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "HPI: The patient is a 44-year-old man who has sex with men who was diagnosed with HIV infection 5 years ago during a routine physical exam. At the time of diagnosis, the patient was asymptomatic. In the years following his diagnosis, he missed several clinic appointments, but he presents today for follow up and is ready to start HIV medications.\nPMH: HIV infection 5 years ago, hypertension, dyslipidemia, depression, and type 2 diabetes mellitus SH: No tobacco, EtOH 1-2 drinks per week. Full time employed – works a 9-5 job. Sexually active with 2-3 partners in the last year; always uses condoms.\nMedications (all oral): hydrochlorothiazide 25 mg daily, atorvastatin 10 mg daily, sertraline 50 mg daily, metformin 500 mg twice daily, and antacids as needed for occasional heartburn.\nAllergy: Sulfa\nPhysical exam is unremarkable VS: BP 127/84 mm Hg, HR 68 bpm, RR 18 breaths/min, T 98.6°F, Wt 75 kg, Ht 5’9”\nPertinent Labs: SCr 0.8 mg/dL, AST 58 U/L, ALT 96 U/L, CD4 38 cells/mm3, HIV RNA 195,000 copies/mL, HIV resistance test negative, toxoplasmosis IgG negative, G6PD deficiency negative, HLA-B*5701 negative, HBsAg positive, anti-HBs negative, anti-HBc IgG positive, anti-HBc IgM negative, anti-HCV negative, HBV viral load 150,000 IU/mL.\nWhich of the following single-tablet antiretroviral therapies would you recommend for the treatment of this patient’s HIV infection based on guidelines from the U.S. Department of Health and Human Services (DHHS)?", "choices": ["Dolutegravir/abacavir/lamivudine (Triumeq)", "Efavirenz/tenofovir disoproxil fumarate/emtricitabine (Atripla)", "Bictegravir/tenofovir alafenamide/emtricitabine (Biktarvy)", "Rilpivirine/tenofovir alafenamide/emtricitabine (Odefsey)"], "answer": 3, "rationales": ["This is a single-tablet regimen that is recommended as a first-line treatment option in the DHHS HIV treatment guidelines. The patient’s HLA-B*5701 test is negative, making abacavir a potential therapeutic option. However, this patient also has hepatitis B virus infection for which lamivudine is suboptimal. A tenofovir-containing HIV treatment regimen is preferred.", "This single-tablet HIV treatment regimen is no longer recommended as first-line treatment in the DHHS treatment guidelines. In addition, this patient has a history of depression, making this HIV treatment regimen suboptimal given the link between efavirenz and suicidal ideation.", "This single-tablet HIV treatment regimen is recommended as a first-line treatment option in the DHHS HIV treatment guidelines. The regimen contains tenofovir alafenamide, which is a recommended treatment option in combination with emtricitabine for the treatment of this patient’s hepatitis B virus infection. Tenofovir alafenamide may be preferred over tenofovir disoproxil fumarate for long-term renal and bone health. There are some drug-drug interaction concerns that require patient counseling (e.g., the need to take doses at least 2 hours apart from antacid doses or at the same time with food), but these are not contraindications to the use of this HIV treatment regimen.", "This single-tablet HIV treatment regi
