<style>
:root{
  --ink:#16282e; --paper:#eef0ee; --card:#ffffff; --line:#dfe3e1;
  --muted:#5c6b6f; --faint:#8a979a;
  --teal:#0f7d72; --teal-d:#0a5d55; --teal-wash:#e6f1ef;
  --ok:#15803d; --ok-wash:#e7f3ea; --bad:#b3242b; --bad-wash:#fbeaea;
  --amber:#c47b08; --amber-wash:#fbf0db; --kr:#1d5fa8; --kr-wash:#e7eef7;
  --mono:ui-monospace,"SF Mono",Menlo,"Cascadia Mono",Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,40,46,.06),0 6px 20px rgba(20,40,46,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:18px;max-width:880px;margin:0 auto}
button{font-family:inherit;cursor:pointer}
a{color:var(--teal-d)}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--faint)}
h1{font-size:18px;margin:0;letter-spacing:-.01em}
.hidden{display:none!important}
.bar{height:7px;background:var(--paper);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .5s}

/* nav */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand .tag{font-family:var(--mono);font-size:10.5px;color:var(--teal-d);
  background:var(--teal-wash);padding:2px 7px;border-radius:5px;letter-spacing:.06em}
nav{display:flex;gap:6px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--muted);
  font-size:13px;padding:7px 13px;border-radius:8px;font-weight:500}
nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
nav button:hover:not(.on){border-color:var(--teal);color:var(--teal-d)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* ===== HOME ===== */
.hsplit{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.metric{padding:16px 16px 14px}
.metric .lab{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.metric .big{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1;margin:10px 0 2px}
.metric .big small{font-size:15px;color:var(--faint);font-weight:500}
.metric .sub{font-size:12px;color:var(--faint);margin-top:8px}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block}
.todaybox{padding:15px 16px;margin-bottom:12px}
.todaybox h3{margin:0 0 10px;font-size:13px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
.todo-actions{display:flex;gap:9px;flex-wrap:wrap}
.cta{border:0;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:600;background:var(--teal);color:#fff;display:flex;align-items:center;gap:8px}
.cta:hover{background:var(--teal-d)}
.cta.alt{background:var(--card);border:1.5px solid var(--line);color:var(--ink)}
.cta.alt:hover{border-color:var(--teal)}
.cta .n{font-family:var(--mono);background:rgba(255,255,255,.22);padding:1px 7px;border-radius:6px;font-size:12.5px}
.cta.alt .n{background:var(--paper)}
.infonote{padding:13px 15px;font-size:12.5px;color:var(--muted);line-height:1.6}
.infonote summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-d)}
.infonote p{margin:9px 0 0}
.streakline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-top:10px}

/* ===== CURRICULUM ===== */
.cov{padding:16px;margin-bottom:14px}
.cov .row{display:flex;align-items:center;gap:12px;margin-top:9px}
.cov .row .nm{flex:0 0 120px;font-size:12.5px;color:var(--muted)}
.cov .row .pct{font-family:var(--mono);font-size:12px;color:var(--muted);flex:0 0 78px;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:12px}
.legend span{display:flex;align-items:center;gap:5px}

.grp{margin:18px 0 8px}
.grp .gt{font-size:14px;font-weight:700}
.grp .gn{font-size:11.5px;color:var(--faint);font-family:var(--mono)}

.topic{margin-bottom:10px;overflow:hidden}
.topic-head{display:flex;align-items:center;gap:11px;padding:13px 15px;cursor:pointer;user-select:none}
.topic-head:hover{background:#fafbfa}
.tstat{width:10px;height:10px;border-radius:99px;flex-shrink:0;background:var(--faint)}
.tstat.doing{background:var(--amber)} .tstat.done{background:var(--ok)} .tstat.review{background:var(--teal)}
.topic-head .tn{font-weight:600;font-size:14.5px;flex:1}
.topic-head .tmeta{display:flex;align-items:center;gap:7px;flex-shrink:0}
.badge{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:5px;letter-spacing:.03em}
.badge.case{color:var(--teal-d);background:var(--teal-wash)}
.badge.nocase{color:var(--faint);background:var(--paper)}
.badge.rev{color:var(--teal);background:var(--teal-wash)}
.chev{color:var(--faint);font-size:12px;transition:transform .2s;font-family:var(--mono)}
.topic.open .chev{transform:rotate(90deg)}
.topic-body{display:none;padding:0 15px 15px;border-top:1px solid var(--line)}
.topic.open .topic-body{display:block}

.statusbtns{display:flex;gap:6px;margin:13px 0}
.statusbtns button{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--muted);
  font-size:12.5px;padding:8px 6px;border-radius:8px;font-weight:600}
.statusbtns button.sel[data-s="todo"]{border-color:var(--faint);background:var(--paper);color:var(--ink)}

<script>const BANK=[{"id": 1, "section": "Antimicrobial Stewardship", "sectionKo": "항생제 스튜어드십 (ASP)", "stem": "If your hospital implemented an automatic substitution policy to administer intravenous piperacillin/tazobactam 3.375 g every 8 hours infused over 4 hours instead of 4.5 g every 8 hours infused over 30 minutes, which of the following changes should be expected when tracking antibiotic utilization?", "choices": ["Increase in days of therapy (DOT)/1000 patient days", "Decrease in defined daily doses (DDD)/1000 patient days", "Decrease in days of therapy (DOT)/1000 patient days", "Increase in defined daily doses (DDD)/1000 patient days"], "answer": 2, "rationales": ["The days of therapy (DOT) would be unchanged by implementation of a strategy that utilizes fewer grams per day of piperacillin/tazobactam. The DOT per 1000 patient days would be affected if a different number of patients received piperacillin/tazobactam or the patients received a different duration of therapy.", "The defined daily dose (DDD) is calculated using the number of grams of an antibiotic. Therefore, implementation of this extended infusion policy that results in a decrease in the total number of grams used per day for a patient will decrease the DDD per 1000 patient days.", "The days of therapy (DOT) would be unchanged by implementation of this extended infusion strategy, which utilizes fewer grams per day of piperacillin/tazobactam for a patient.", "The defined daily dose (DDD) is calculated using the number of grams of an antibiotic. This extended-infusion strategy would decrease the total number of grams of piperacillin/tazobactam utilized per day for a patient, which would decrease (not increase) the DDD per 1000 patient days."], "ref": "1. Ibrahim OM, Polk RE. Antimicrobial use metrics and benchmarking to improve stewardship outcomes:\nmethodology, opportunities, and challenges. Infect Dis Clin North Am. 2014;28:195-214. 2. Bennett N, Schultz L, Boyd S et al. Understanding inpatient antimicrobial stewardship metrics. Am J Health-\nSyst Pharm. 2018;75:230-8. doi: 10.2146/ajhp160335.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 3 Task # 3.1 Knowledge # 3.1 __________________________________________________________________________________________________", "level": 3, "stemKo": "귀하의 병원에서 정맥주사 piperacillin/tazobactam을 4.5 g을 8시간마다 30분에 걸쳐 주입하는 대신 3.375 g을 8시간마다 4시간에 걸쳐 주입하도록 하는 자동 대체(automatic substitution) 정책을 시행하였다면, 항생제 사용량을 추적할 때 예상되는 변화로 가장 적절한 것은?", "choicesKo": ["days of therapy (DOT)/1000 patient days의 증가", "defined daily doses (DDD)/1000 patient days의 감소", "days of therapy (DOT)/1000 patient days의 감소", "defined daily doses (DDD)/1000 patient days의 증가"], "rationalesKo": ["1일당 사용되는 piperacillin/tazobactam의 그램 수를 줄이는 전략을 시행하더라도 days of therapy (DOT)는 변하지 않는다. DOT per 1000 patient days는 piperacillin/tazobactam을 투여받은 환자 수가 달라지거나 환자들이 다른 치료 기간을 적용받는 경우에 영향을 받는다.", "defined daily dose (DDD)는 항생제의 그램 수를 이용하여 산출한다. 따라서 환자 1인당 1일 사용되는 총 그램 수를 감소시키는 이러한 연장 주입(extended infusion) 정책을 시행하면 DDD per 1000 patient days가 감소한다.", "환자 1인당 1일 사용되는 piperacillin/tazobactam의 그램 수를 줄이는 이러한 연장 주입 전략을 시행하더라도 days of therapy (DOT)는 변하지 않는다.", "defined daily dose (DDD)는 항생제의 그램 수를 이용하여 산출한다. 이러한 연장 주입 전략은 환자 1인당 1일 사용되는 piperacillin/tazobactam의 총 그램 수를 감소시키므로 DDD per 1000 patient days를 증가시키는 것이 아니라 감소시킨다."]}, {"id": 2, "section": "Antimicrobial Stewardship", "sectionKo": "항생제 스튜어드십 (ASP)", "stem": "Which of the following are the most common indications for hospital antibiotic use that should be targeted for action in hospital antibiotic stewardship programs, according to the 2019 Centers for Disease Control and Prevention (CDC) core elements of hospital antibiotic stewardship programs?", "choices": ["Upper respiratory tract infections, urinary tract infections, and skin and soft tissue infections", "Intra-abdominal infections, urinary tract infections, and skin and soft tissue infections", "Intra-abdominal infections, upper respiratory infections, and urinary tract infections", "Lower respiratory tract infections, urinary tract infections, and skin and soft tissue infections"], "answer": 4, "rationales": ["The 2019 CDC core elements of hospital antibiotic stewardship programs document recommends actions targeting lower (not upper) respiratory tract infections, urinary tract infections, and skin and soft tissue infections because they are the most common indications for hospital antibiotic use.", "The 2019 CDC core elements of hospital antibiotic stewardship programs document recommends actions targeting lower respiratory tract infections, urinary tract infections, and skin and soft tissue infections (not intra- abdominal infections) because they are the most common indications for hospital antibiotic use.", "The 2019 CDC core elements of hospital antibiotic stewardship programs document recommends actions targeting lower (not upper) respiratory tract infections, urinary tract infections, and skin and soft tissue infections (not intra-abdominal infections) because they are the most common indications for hospital antibiotic use.", "The 2019 CDC core elements of hospital antibiotic stewardship programs document recommends actions targeting lower respiratory tract infections, urinary tract infections, and skin and soft tissue infections because they are the most common indications for hospital antibiotic use."], "ref": "1. Centers for Disease Control and Prevention. The core elements of hospital antibiotic stewardship programs:\n2019. https://www.cdc.gov/antibiotic-use/healthcare/implementation/core-elements.html (accessed 2022 Nov 7).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 3 Task # 3.1, 3.3 Knowledge # 3.3, 3.8 __________________________________________________________________________________________________", "level": 3, "stemKo": "2019년 Centers for Disease Control and Prevention (CDC)의 병원 항생제 스튜어드십 프로그램 핵심 요소(core elements)에 따르면, 병원 항생제 스튜어드십 프로그램에서 중재(action)의 대상으로 삼아야 할 가장 흔한 병원 내 항생제 사용 적응증으로 가장 적절한 것은?", "choicesKo": ["상기도 감염, 요로감염, 피부 및 연조직 감염", "복강 내 감염, 요로감염, 피부 및 연조직 감염", "복강 내 감염, 상기도 감염, 요로감염", "하기도 감염, 요로감염, 피부 및 연조직 감염"], "rationalesKo": ["2019년 CDC 병원 항생제 스튜어드십 프로그램 핵심 요소 문서에서는 상기도 감염이 아니라 하기도 감염, 요로감염, 피부 및 연조직 감염이 병원 내 항생제 사용의 가장 흔한 적응증이므로 이들을 대상으로 하는 중재를 권고한다.", "2019년 CDC 병원 항생제 스튜어드십 프로그램 핵심 요소 문서에서는 복강 내 감염이 아니라 하기도 감염, 요로감염, 피부 및 연조직 감염이 병원 내 항생제 사용의 가장 흔한 적응증이므로 이들을 대상으로 하는 중재를 권고한다.", "2019년 CDC 병원 항생제 스튜어드십 프로그램 핵심 요소 문서에서는 상기도가 아닌 하기도 감염, 요로감염, 피부 및 연조직 감염(복강 내 감염이 아님)이 병원 내 항생제 사용의 가장 흔한 적응증이므로 이들을 대상으로 하는 중재를 권고한다.", "2019년 CDC 병원 항생제 스튜어드십 프로그램 핵심 요소 문서에서는 하기도 감염, 요로감염, 피부 및 연조직 감염이 병원 내 항생제 사용의 가장 흔한 적응증이므로 이들을 대상으로 하는 중재를 권고한다."]}, {"id": 3, "section": "Antimicrobial Stewardship", "sectionKo": "항생제 스튜어드십 (ASP)", "stem": "Which of the following is an appropriate approach to evaluate risk-stratified antibiotic utilization?", "choices": ["Comparing defined daily doses (DDD) per 1000 patient days for patients discharged with ICD10 diagnosis codes for pneumonia among similar hospitals", "Comparing days of therapy (DOT) for patients on medical floors among similar hospitals", "Comparing defined daily dose (DDD) for patients admitted to neurosurgical services among similar hospitals", "Comparing annual days of therapy (DOT) for patients in the medical intensive care unit at your hospital over the past 5 years"], "answer": 1, "rationales": ["This is a correct method for evaluating risk-stratified utilization data because it involves comparing standardized antibiotic utilization among similar types of patients (i.e., on specific wards with similar diagnoses). Comparing DDD without standardization based on 1000 patient days would not be appropriate because the census probably is different at other hospitals making it difficult to make comparisons.", "This is a correct method for risk-stratified comparison because evaluating risk-stratified utilization data involves comparing standardized antibiotic utilization among similar types of patients (i.e., on specific wards with similar diagnoses). However, the data need to be standardized per 1000 patient days to be useful because the wards at different hospitals are likely to have different numbers of patients.", "This is a correct method for risk stratified comparison because evaluating risk-stratified utilization data involves comparing standardized antibiotic utilization among similar types of patients (i.e., on specific wards with similar diagnoses). However, the data need to be standardized per 1000 patient days to be useful because the wards at different hospitals are likely to have different numbers of admissions.", "This is a correct method for risk stratified comparison because evaluating risk-stratified utilization data involves comparing standardized antibiotic utilization among similar types of patients (i.e., on specific wards with similar diagnoses). However, the data need to be standardized per 1000 patient days to be useful because the wards at different hospitals are likely to have different numbers of admissions."], "ref": "1. Ibrahim OM, Polk RE. Antimicrobial use metrics and benchmarking to improve stewardship outcomes:\nmethodology, opportunities, and challenges. Infect Dis Clin North Am. 2014;28:195-214. 2. Bennett N, Schultz L, Boyd S et al. Understanding inpatient antimicrobial stewardship metrics. Am J Health-\nSyst Pharm. 2018;75:230-8. doi: 10.2146/ajhp160335.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 3 Task # 3.1 Knowledge # 3.1 __________________________________________________________________________________________________", "level": 3, "stemKo": "위험도 보정(risk-stratified) 항생제 사용량을 평가하는 적절한 접근법으로 가장 적절한 것은?", "choicesKo": ["유사한 병원들 사이에서 폐렴 ICD10 진단 코드로 퇴원한 환자들의 defined daily doses (DDD) per 1000 patient days를 비교한다", "유사한 병원들 사이에서 일반 병동(medical floor)에 있는 환자들의 days of therapy (DOT)를 비교한다", "유사한 병원들 사이에서 신경외과에 입원한 환자들의 defined daily dose (DDD)를 비교한다", "귀하의 병원에서 지난 5년간 내과계 중환자실 환자들의 연간 days of therapy (DOT)를 비교한다"], "rationalesKo": ["이는 유사한 유형의 환자들(즉, 특정 병동에 있으면서 유사한 진단을 가진 환자들) 사이에서 표준화된 항생제 사용량을 비교하는 것이므로 위험도 보정 사용량 자료를 평가하는 올바른 방법이다. 1000 patient days를 기준으로 표준화하지 않은 DDD의 비교는 다른 병원의 재원 환자 수(census)가 다를 가능성이 높아 비교가 어려우므로 적절하지 않다.", "위험도 보정 사용량 자료의 평가는 유사한 유형의 환자들(즉, 특정 병동에 있으면서 유사한 진단을 가진 환자들) 사이에서 표준화된 항생제 사용량을 비교하는 것이므로 이는 위험도 보정 비교의 올바른 방법이다. 그러나 병원마다 병동의 환자 수가 다를 가능성이 높으므로 자료가 유용하려면 1000 patient days를 기준으로 표준화되어야 한다.", "위험도 보정 사용량 자료의 평가는 유사한 유형의 환자들(즉, 특정 병동에 있으면서 유사한 진단을 가진 환자들) 사이에서 표준화된 항생제 사용량을 비교하는 것이므로 이는 위험도 보정 비교의 올바른 방법이다. 그러나 병원마다 병동의 입원 건수가 다를 가능성이 높으므로 자료가 유용하려면 1000 patient days를 기준으로 표준화되어야 한다.", "위험도 보정 사용량 자료의 평가는 유사한 유형의 환자들(즉, 특정 병동에 있으면서 유사한 진단을 가진 환자들) 사이에서 표준화된 항생제 사용량을 비교하는 것이므로 이는 위험도 보정 비교의 올바른 방법이다. 그러나 병원마다 병동의 입원 건수가 다를 가능성이 높으므로 자료가 유용하려면 1000 patient days를 기준으로 표준화되어야 한다."]}, {"id": 4, "section": "Antimicrobial Stewardship", "sectionKo": "항생제 스튜어드십 (ASP)", "stem": "Which of the following is a 2019 Centers for Disease Control and Prevention (CDC) core element of hospital antibiotic stewardship programs?", "choices": ["Responsibility", "Prevention", "Tracking", "Implementation"], "answer": 3, "rationales": ["The CDC core elements of hospital antibiotic stewardship programs are hospital leadership commitment, accountability, pharmacy expertise, action, tracking, reporting, and education. Responsibility is not among the core elements.", "The CDC core elements of hospital antibiotic stewardship programs are hospital leadership commitment, accountability, pharmacy expertise, action, tracking, reporting, and education. Prevention is not among the core elements.", "The CDC core elements of hospital antibiotic stewardship programs are hospital leadership commitment, accountability, pharmacy expertise, action, tracking, reporting, and education.", "The CDC core elements of hospital antibiotic stewardship programs are hospital leadership commitment, accountability, pharmacy expertise, action, tracking, reporting, and education. Implementation is not among the core elements."], "ref": "1. Centers for Disease Control and Prevention. The core elements of hospital antibiotic stewardship programs:\n2019. https://www.cdc.gov/antibiotic-use/healthcare/pdfs/hospital-core-elements-H.pdf (accessed 2022 Nov 7).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 3 Task # 3.3 Knowledge # 3.2, 3.8 __________________________________________________________________________________________________", "level": 3, "stemKo": "2019년 Centers for Disease Control and Prevention (CDC)의 병원 항생제 스튜어드십 프로그램 핵심 요소(core element)에 해당하는 것으로 가장 적절한 것은?", "choicesKo": ["책무성(Responsibility)", "예방(Prevention)", "추적(Tracking)", "실행(Implementation)"], "rationalesKo": ["CDC의 병원 항생제 스튜어드십 프로그램 핵심 요소는 병원 리더십의 참여(hospital leadership commitment), 책임성(accountability), 약제 전문성(pharmacy expertise), 중재(action), 추적(tracking), 보고(reporting), 교육(education)이다. Responsibility는 핵심 요소에 포함되지 않는다.", "CDC의 병원 항생제 스튜어드십 프로그램 핵심 요소는 병원 리더십의 참여(hospital leadership commitment), 책임성(accountability), 약제 전문성(pharmacy expertise), 중재(action), 추적(tracking), 보고(reporting), 교육(education)이다. Prevention은 핵심 요소에 포함되지 않는다.", "CDC의 병원 항생제 스튜어드십 프로그램 핵심 요소는 병원 리더십의 참여(hospital leadership commitment), 책임성(accountability), 약제 전문성(pharmacy expertise), 중재(action), 추적(tracking), 보고(reporting), 교육(education)이다.", "CDC의 병원 항생제 스튜어드십 프로그램 핵심 요소는 병원 리더십의 참여(hospital leadership commitment), 책임성(accountability), 약제 전문성(pharmacy expertise), 중재(action), 추적(tracking), 보고(reporting), 교육(education)이다. Implementation은 핵심 요소에 포함되지 않는다."]}, {"id": 5, "section": "Antimicrobial Stewardship", "sectionKo": "항생제 스튜어드십 (ASP)", "stem": "Which of the following is the minimum number of isolates recommended by the Clinical and Laboratory Standards Institute (CLSI) for inclusion of an organism on an annual antibiogram?", "choices": ["25", "50", "30", "100"], "answer": 3, "rationales": ["The CLSI M-39 document provides recommendations for composing an antibiogram. Thirty isolates is the minimum number recommended for inclusion of an organism on an annual antibiogram.", "The CLSI M-39 document provides recommendations for composing an antibiogram. Thirty isolates is the minimum number recommended for inclusion of an organism on an annual antibiogram.", "The CLSI M-39 document provides recommendations for composing an antibiogram. Thirty isolates is the minimum number recommended for inclusion of an organism on an annual antibiogram.", "The CLSI M-39 document provides recommendations for composing an antibiogram. Thirty isolates is the minimum number recommended for inclusion of an organism on an annual antibiogram."], "ref": "1. Clinical and Laboratory Standards Institute. M-39: analysis and presentation of cumulative antimicrobial\nsusceptibility test data, 5th ed. 2022.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 3 Task # 3.2 Knowledge # K3.6 __________________________________________________________________________________________________", "level": 3, "stemKo": "Clinical and Laboratory Standards Institute (CLSI)가 연간 antibiogram에 특정 균종을 포함시키기 위해 권고하는 최소 분리주(isolate) 수로 가장 적절한 것은?", "choicesKo": ["25", "50", "30", "100"], "rationalesKo": ["CLSI M-39 문서는 antibiogram 작성에 대한 권고를 제공한다. 연간 antibiogram에 특정 균종을 포함시키기 위해 권고되는 최소 분리주 수는 30주이다.", "CLSI M-39 문서는 antibiogram 작성에 대한 권고를 제공한다. 연간 antibiogram에 특정 균종을 포함시키기 위해 권고되는 최소 분리주 수는 30주이다.", "CLSI M-39 문서는 antibiogram 작성에 대한 권고를 제공한다. 연간 antibiogram에 특정 균종을 포함시키기 위해 권고되는 최소 분리주 수는 30주이다.", "CLSI M-39 문서는 antibiogram 작성에 대한 권고를 제공한다. 연간 antibiogram에 특정 균종을 포함시키기 위해 권고되는 최소 분리주 수는 30주이다."]}, {"id": 6, "section": "Antimicrobial Stewardship", "sectionKo": "항생제 스튜어드십 (ASP)", "stem": "Which of the following interpretations of a Standardized Antimicrobial Administration Ratio (SAAR) value of 1.5 is correct?", "choices": ["It indicates a higher rate of inappropriate antimicrobial utilization compared with other hospitals.", "It indicates a lower rate of antimicrobial utilization than at other hospitals.", "It indicates that the rate of antimicrobial utilization is higher than predicted at a particular hospital.", "It indicates that the rate of antimicrobial resistance is higher than at other hospitals."], "answer": 3, "rationales": ["The SAAR value is used to benchmark antimicrobial utilization (i.e., days of therapy) at a particular hospital, and it can be used for comparison with other hospitals. The SAAR is defined as the ratio of observed antimicrobial utilization to predicted antimicrobial utilization. This benchmarking value does not reflect the appropriateness of antimicrobial therapy or antimicrobial resistance. A SAAR value of 1.0 would reflect antimicrobial utilization that is the same as predicted. A value exceeding 1.0 would reflect a higher than predicted rate of antimicrobial utilization.", "The SAAR value is used to benchmark antimicrobial utilization (i.e., days of therapy) at a particular hospital, and it can be used for comparison with other hospitals. The SAAR is defined as the ratio of observed antimicrobial utilization to predicted antimicrobial utilization. This benchmarking value does not reflect the appropriateness of antimicrobial therapy or antimicrobial resistance. A SAAR value of 1.0 would reflect antimicrobial utilization that is the same as predicted. A value exceeding 1.0 would reflect a higher than predicted rate of antimicrobial utilization.", "The SAAR value is used to benchmark antimicrobial utilization (i.e., days of therapy) at a particular hospital, and it can be used for comparison with other hospitals. The SAAR is defined as the ratio of observed antimicrobial utilization to predicted antimicrobial utilization. This benchmarking value does not reflect the appropriateness of antimicrobial therapy or antimicrobial resistance. A SAAR value of 1.0 would reflect antimicrobial utilization that is the same as predicted. A value exceeding 1.0 would reflect a higher than predicted rate of antimicrobial utilization.", "The SAAR value is used to benchmark antimicrobial utilization (i.e., days of therapy) at a particular hospital, and it can be used for comparison with other hospitals. The SAAR is defined as the ratio of observed antimicrobial utilization to predicted antimicrobial utilization. This benchmarking value does not reflect the appropriateness of antimicrobial therapy or antimicrobial resistance. A SAAR value of 1.0 would reflect antimicrobial utilization that is the same as predicted. A value exceeding 1.0 would reflect a higher than predicted rate of antimicrobial utilization."], "ref": "1. Centers for Disease Control and Prevention (CDC), National Healthcare Safety Network. Antimicrobial use and\nresistance module (AUR) – January 2022. https://www.cdc.gov/nhsn/pdfs/pscmanual/11pscaurcurrent.pdf (accessed 2022 Oct 31).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 3 Task # 3.1 Knowledge # K3.1, 3.8 _________________________________________________________________________________________________", "level": 3, "stemKo": "Standardized Antimicrobial Administration Ratio (SAAR) 값이 1.5일 때의 해석으로 가장 적절한 것은?", "choicesKo": ["다른 병원들에 비해 부적절한 항균제 사용 비율이 더 높음을 의미한다.", "다른 병원들보다 항균제 사용 비율이 더 낮음을 의미한다.", "해당 병원의 항균제 사용 비율이 예측치보다 더 높음을 의미한다.", "다른 병원들보다 항균제 내성률이 더 높음을 의미한다."], "rationalesKo": ["SAAR 값은 특정 병원의 항균제 사용량(즉, days of therapy)을 벤치마킹하는 데 사용되며, 다른 병원과의 비교에도 활용할 수 있다. SAAR은 관찰된 항균제 사용량 대 예측된 항균제 사용량의 비로 정의된다. 이 벤치마킹 값은 항균제 치료의 적절성이나 항균제 내성을 반영하지 않는다. SAAR 값 1.0은 항균제 사용량이 예측치와 동일함을 반영한다. 1.0을 초과하는 값은 예측치보다 높은 항균제 사용 비율을 반영한다.", "SAAR 값은 특정 병원의 항균제 사용량(즉, days of therapy)을 벤치마킹하는 데 사용되며, 다른 병원과의 비교에도 활용할 수 있다. SAAR은 관찰된 항균제 사용량 대 예측된 항균제 사용량의 비로 정의된다. 이 벤치마킹 값은 항균제 치료의 적절성이나 항균제 내성을 반영하지 않는다. SAAR 값 1.0은 항균제 사용량이 예측치와 동일함을 반영한다. 1.0을 초과하는 값은 예측치보다 높은 항균제 사용 비율을 반영한다.", "SAAR 값은 특정 병원의 항균제 사용량(즉, days of therapy)을 벤치마킹하는 데 사용되며, 다른 병원과의 비교에도 활용할 수 있다. SAAR은 관찰된 항균제 사용량 대 예측된 항균제 사용량의 비로 정의된다. 이 벤치마킹 값은 항균제 치료의 적절성이나 항균제 내성을 반영하지 않는다. SAAR 값 1.0은 항균제 사용량이 예측치와 동일함을 반영한다. 1.0을 초과하는 값은 예측치보다 높은 항균제 사용 비율을 반영한다.", "SAAR 값은 특정 병원의 항균제 사용량(즉, days of therapy)을 벤치마킹하는 데 사용되며, 다른 병원과의 비교에도 활용할 수 있다. SAAR은 관찰된 항균제 사용량 대 예측된 항균제 사용량의 비로 정의된다. 이 벤치마킹 값은 항균제 치료의 적절성이나 항균제 내성을 반영하지 않는다. SAAR 값 1.0은 항균제 사용량이 예측치와 동일함을 반영한다. 1.0을 초과하는 값은 예측치보다 높은 항균제 사용 비율을 반영한다."]}, {"id": 7, "section": "Antimicrobial Stewardship", "sectionKo": "항생제 스튜어드십 (ASP)", "stem": "Which of the following is one of the two most effective antibiotic stewardship interventions in hospitals and considered a foundational priority intervention to improve antibiotic use, according to the 2019 Centers for Disease Control and Prevention (CDC) core elements of hospital antibiotic stewardship programs?", "choices": ["Preauthorization", "Standardized order sets based on guidelines", "Extended infusion of beta-lactam antibiotics", "Intravenous-to-oral conversion of antibiotic therapy"], "answer": 1, "rationales": ["According to the CDC, preauthorization and prospective audit with feedback are the two most effective antibiotic stewardship interventions in hospitals, and they are considered foundational priority interventions to improve antibiotic use in hospitals. Standardized order sets based on guidelines, extended infusion of selected antibiotics (e.g., piperacillin/tazobactam), and intravenous-to-oral conversion of antibiotic therapy are not among the priority interventions.", "According to the CDC, preauthorization and prospective audit with feedback are the two most effective antibiotic stewardship interventions in hospitals, and they are considered foundational priority interventions to improve antibiotic use in hospitals. Standardized order sets based on guidelines, extended infusion of selected antibiotics (e.g., piperacillin/tazobactam), and intravenous-to-oral conversion of antibiotic therapy are not among the priority interventions.", "According to the CDC, preauthorization and prospective audit with feedback are the two most effective antibiotic stewardship interventions in hospitals, and they are considered foundational priority interventions to improve antibiotic use in hospitals. Standardized order sets based on guidelines, extended infusion of selected antibiotics (e.g., piperacillin/tazobactam), and intravenous-to-oral conversion of antibiotic therapy are not among the priority interventions.", "According to the CDC, preauthorization and prospective audit with feedback are the two most effective antibiotic stewardship interventions in hospitals, and they are considered foundational priority interventions to improve antibiotic use in hospitals. Standardized order sets based on guidelines, extended infusion of selected antibiotics (e.g., piperacillin/tazobactam), and intravenous-to-oral conversion of antibiotic therapy are not among the priority interventions."], "ref": "1. Centers for Disease Control and Prevention. The core elements of hospital antibiotic stewardship programs:\n2019. https://www.cdc.gov/antibiotic-use/healthcare/implementation/core-elements.html (accessed 2022 Nov 7).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 3 Task # 3.1, 3.3 Knowledge # 3.2, 3.8\n__________________________________________________________________________________________________", "level": 3, "stemKo": "2019년 Centers for Disease Control and Prevention (CDC)의 병원 항생제 스튜어드십 프로그램 핵심 요소에 따르면, 병원에서 가장 효과적인 두 가지 항생제 스튜어드십 중재 중 하나이며 항생제 사용 개선을 위한 기본적인 우선순위 중재로 간주되는 것으로 가장 적절한 것은?", "choicesKo": ["사전승인(Preauthorization)", "진료지침에 근거한 표준화된 처방 세트(order set)", "beta-lactam 항생제의 연장 주입(extended infusion)", "항생제 치료의 정맥주사에서 경구 전환"], "rationalesKo": ["CDC에 따르면 사전승인(preauthorization)과 전향적 감사 및 피드백(prospective audit with feedback)이 병원에서 가장 효과적인 두 가지 항생제 스튜어드십 중재이며, 병원 내 항생제 사용 개선을 위한 기본적인 우선순위 중재로 간주된다. 진료지침에 근거한 표준화된 처방 세트, 선택된 항생제(예: piperacillin/tazobactam)의 연장 주입, 항생제 치료의 정맥주사에서 경구 전환은 우선순위 중재에 포함되지 않는다.", "CDC에 따르면 사전승인(preauthorization)과 전향적 감사 및 피드백(prospective audit with feedback)이 병원에서 가장 효과적인 두 가지 항생제 스튜어드십 중재이며, 병원 내 항생제 사용 개선을 위한 기본적인 우선순위 중재로 간주된다. 진료지침에 근거한 표준화된 처방 세트, 선택된 항생제(예: piperacillin/tazobactam)의 연장 주입, 항생제 치료의 정맥주사에서 경구 전환은 우선순위 중재에 포함되지 않는다.", "CDC에 따르면 사전승인(preauthorization)과 전향적 감사 및 피드백(prospective audit with feedback)이 병원에서 가장 효과적인 두 가지 항생제 스튜어드십 중재이며, 병원 내 항생제 사용 개선을 위한 기본적인 우선순위 중재로 간주된다. 진료지침에 근거한 표준화된 처방 세트, 선택된 항생제(예: piperacillin/tazobactam)의 연장 주입, 항생제 치료의 정맥주사에서 경구 전환은 우선순위 중재에 포함되지 않는다.", "CDC에 따르면 사전승인(preauthorization)과 전향적 감사 및 피드백(prospective audit with feedback)이 병원에서 가장 효과적인 두 가지 항생제 스튜어드십 중재이며, 병원 내 항생제 사용 개선을 위한 기본적인 우선순위 중재로 간주된다. 진료지침에 근거한 표준화된 처방 세트, 선택된 항생제(예: piperacillin/tazobactam)의 연장 주입, 항생제 치료의 정맥주사에서 경구 전환은 우선순위 중재에 포함되지 않는다."]}, {"id": 8, "section": "Antimicrobial Stewardship", "sectionKo": "항생제 스튜어드십 (ASP)", "stem": "Which of the following statements about regulatory requirements for antimicrobial stewardship is correct?", "choices": ["The Centers for Medicare and Medicaid Services (CMS) conducts accreditation surveys of outpatient clinics to ensure compliance with the Centers for Disease Control and Prevention (CDC) core elements of antibiotic stewardship programs.", "The Joint Commission requires the Centers for Disease Control and Prevention (CDC) core elements of antibiotic stewardship programs for accreditation of acute care hospitals.", "The Centers for Disease Control and Prevention (CDC) requires the submission of antibiotic utilization data to the National Healthcare Safety network (NHSN) antimicrobial use (AU) module.", "The Leapfrog Group requires acute care hospitals to meet The Joint Commission (TJC) accreditation requirements pertaining to antimicrobial stewardship."], "answer": 2, "rationales": ["The CMS does not perform survey visits for outpatient clinics for this purpose.", "The Joint Commission requires the CDC antimicrobial stewardship core elements for accreditation of acute care hospitals.", "Tracking and benchmarking antibiotic utilization data for submission to the NHSN AU module currently is voluntary.", "The Leapfrog Group is a patient advocacy group that does not require fulfillment of TJC accreditation requirements pertaining to antimicrobial stewardship in acute care hospitals."], "ref": "1. The Leapfrog Group. Appropriate use of antibiotics in hospitals. http://www.leapfroggroup.org/ratings-\nreports/antibiotic-stewardship (accessed 2022 Nov 7). 2. Centers for Disease Control and Prevention. The core elements of hospital antibiotic stewardship programs:\n2019. https://www.cdc.gov/antibiotic-use/healthcare/pdfs/hospital-core-elements-H.pdf (accessed 2022 Nov 7).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 3 Task # 3.3 Knowledge # 3.3 __________________________________________________________________________________________________", "level": 3, "stemKo": "항균제 스튜어드십에 대한 규제 요건에 관한 설명으로 가장 적절한 것은?", "choicesKo": ["Centers for Medicare and Medicaid Services (CMS)는 외래 클리닉이 Centers for Disease Control and Prevention (CDC)의 항생제 스튜어드십 프로그램 핵심 요소를 준수하는지 확인하기 위해 인증 실사를 시행한다.", "The Joint Commission은 급성기 병원의 인증을 위해 Centers for Disease Control and Prevention (CDC)의 항생제 스튜어드십 프로그램 핵심 요소를 요구한다.", "Centers for Disease Control and Prevention (CDC)는 National Healthcare Safety Network (NHSN)의 antimicrobial use (AU) 모듈에 항생제 사용량 자료를 제출하도록 요구한다.", "The Leapfrog Group은 급성기 병원이 항균제 스튜어드십과 관련된 The Joint Commission (TJC) 인증 요건을 충족하도록 요구한다."], "rationalesKo": ["CMS는 이러한 목적으로 외래 클리닉에 대한 실사 방문을 시행하지 않는다.", "The Joint Commission은 급성기 병원의 인증을 위해 CDC의 항균제 스튜어드십 핵심 요소를 요구한다.", "NHSN AU 모듈에 제출하기 위한 항생제 사용량 자료의 추적 및 벤치마킹은 현재 자발적(voluntary)이다.", "The Leapfrog Group은 환자 옹호 단체로서, 급성기 병원에서 항균제 스튜어드십과 관련된 TJC 인증 요건의 충족을 요구하지 않는다."]}, {"id": 9, "section": "Antimicrobial Stewardship", "sectionKo": "항생제 스튜어드십 (ASP)", "stem": "The Centers for Disease Control and Prevention (CDC) core elements of outpatient antibiotic stewardship are intended for which of the following settings?", "choices": ["Emergency departments, primary care clinics, and dental offices", "Primary care clinics, subspecialty clinics, and nursing homes", "Subspecialty clinics, nursing homes, and dental offices", "Urgent care clinics, nursing homes, and retail pharmacy-based healthcare clinics"], "answer": 1, "rationales": ["The CDC core elements of outpatient antibiotic stewardship apply to primary care clinics, specialty and subspecialty clinics, urgent care settings, emergency departments, dental offices, and retail (e.g., pharmacy- based) healthcare clinics. The CDC has a different set of core elements for antibiotic stewardship for patients in nursing homes.", "The CDC core elements of outpatient antibiotic stewardship apply to primary care clinics, specialty and subspecialty clinics, urgent care settings, emergency departments, dental offices, and retail (e.g., pharmacy- based) healthcare clinics. The CDC has a different set of core elements for antibiotic stewardship for patients in nursing homes.", "The CDC core elements of outpatient antibiotic stewardship apply to primary care clinics, specialty and subspecialty clinics, urgent care settings, emergency departments, dental offices, and retail (e.g., pharmacy- based) healthcare clinics. The CDC has a different set of core elements for antibiotic stewardship for patients in nursing homes.", "The CDC core elements of outpatient antibiotic stewardship apply to primary care clinics, specialty and subspecialty clinics, urgent care settings, emergency departments, dental offices, and retail (e.g., pharmacy- based) healthcare clinics. The CDC has a different set of core elements for antibiotic stewardship for patients in nursing homes."], "ref": "1. Centers for Disease Control and Prevention. Core elements of outpatient antibiotic stewardship. September 8,\n2021. https://www.cdc.gov/antibiotic-use/core-elements/outpatient.html (accessed 2022 Nov 7).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 3 Task # 3.3 Knowledge # 3.3\n__________________________________________________________________________________________________", "level": 3, "stemKo": "Centers for Disease Control and Prevention (CDC)의 외래 항생제 스튜어드십 핵심 요소가 적용 대상으로 하는 진료 환경으로 가장 적절한 것은?", "choicesKo": ["응급실, 일차 진료 클리닉, 치과 진료실", "일차 진료 클리닉, 세부전문 클리닉, 요양원(nursing home)", "세부전문 클리닉, 요양원(nursing home), 치과 진료실", "긴급 진료(urgent care) 클리닉, 요양원(nursing home), 소매약국 기반 헬스케어 클리닉"], "rationalesKo": ["CDC의 외래 항생제 스튜어드십 핵심 요소는 일차 진료 클리닉, 전문 및 세부전문 클리닉, 긴급 진료(urgent care) 환경, 응급실, 치과 진료실, 소매(예: 약국 기반) 헬스케어 클리닉에 적용된다. CDC는 요양원(nursing home) 환자를 위한 항생제 스튜어드십에 대해서는 별도의 핵심 요소를 두고 있다.", "CDC의 외래 항생제 스튜어드십 핵심 요소는 일차 진료 클리닉, 전문 및 세부전문 클리닉, 긴급 진료(urgent care) 환경, 응급실, 치과 진료실, 소매(예: 약국 기반) 헬스케어 클리닉에 적용된다. CDC는 요양원(nursing home) 환자를 위한 항생제 스튜어드십에 대해서는 별도의 핵심 요소를 두고 있다.", "CDC의 외래 항생제 스튜어드십 핵심 요소는 일차 진료 클리닉, 전문 및 세부전문 클리닉, 긴급 진료(urgent care) 환경, 응급실, 치과 진료실, 소매(예: 약국 기반) 헬스케어 클리닉에 적용된다. CDC는 요양원(nursing home) 환자를 위한 항생제 스튜어드십에 대해서는 별도의 핵심 요소를 두고 있다.", "CDC의 외래 항생제 스튜어드십 핵심 요소는 일차 진료 클리닉, 전문 및 세부전문 클리닉, 긴급 진료(urgent care) 환경, 응급실, 치과 진료실, 소매(예: 약국 기반) 헬스케어 클리닉에 적용된다. CDC는 요양원(nursing home) 환자를 위한 항생제 스튜어드십에 대해서는 별도의 핵심 요소를 두고 있다."]}, {"id": 10, "section": "Antimicrobial Stewardship", "sectionKo": "항생제 스튜어드십 (ASP)", "stem": "Which of the following is NOT required to be reported by acute care hospitals to the Centers for Disease Control and Prevention (CDC) National Healthcare Safety Network (NHSN)?", "choices": ["Catheter-associated urinary tract infection", "Hospital-acquired Clostridioides difficile (C. difficile) infection", "Hospital-onset methicillin-resistant Staphylococcus aureus (MRSA) surgical site infection", "Multidrug-resistant (MDR) Pseudomonas infection"], "answer": 4, "rationales": ["The CDC NHSN requires reporting of catheter-associated urinary tract infection.", "The CDC NHSN requires reporting of hospital-acquired C. difficile infection.", "The CDC NHSN requires reporting of hospital-onset MRSA surgical site infection.", "The CDC NHSN does not require reporting of MDR Pseudomonas infection, unless it is associated with a urinary catheter or central line."], "ref": "1. Centers for Disease Control and Prevention. CMS – acute care hospitals (ACH). January 3, 2022.\nhttps://www.cdc.gov/nhsn/cms/ach.html (accessed 2022 Nov 7).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 3 Task # 3.4 Knowledge # 3.3, 3.12 _________________________________________________________________________________________________\nPresentation Title: Upper Respiratory Tract Infections\nLEARNING OBJECTIVES\nLO#1: Assess available pharmacotherapies for upper respiratory tract infections.\nLO#2: Select the most appropriate pharmacotherapeutic plan and monitoring based on patient- and disease-specific information, antibiogram data, and best available evidence.\nLO#3: Recommend modifications of patient-specific treatment plans based on efficacy and adverse effects.\nLO#4: Identify recommended immunizations and potential adverse effects.", "level": 3, "stemKo": "다음 중 급성기 병원(acute care hospital)이 Centers for Disease Control and Prevention (CDC) National Healthcare Safety Network (NHSN)에 보고할 의무가 없는 것은?", "choicesKo": ["카테터 관련 요로감염(catheter-associated urinary tract infection)", "병원 획득 Clostridioides difficile (C. difficile) 감염", "병원 발생(hospital-onset) methicillin-resistant Staphylococcus aureus (MRSA) 수술 부위 감염", "다제내성(multidrug-resistant, MDR) Pseudomonas 감염"], "rationalesKo": ["CDC NHSN은 카테터 관련 요로감염의 보고를 요구한다.", "CDC NHSN은 병원 획득 C. difficile 감염의 보고를 요구한다.", "CDC NHSN은 병원 발생 MRSA 수술 부위 감염의 보고를 요구한다.", "CDC NHSN은 MDR Pseudomonas 감염이 요로 카테터나 중심정맥관과 관련된 경우가 아니라면 그 보고를 요구하지 않는다."]}, {"id": 11, "section": "Upper Respiratory Tract Infections", "sectionKo": "상기도 감염", "stem": "KP is a 4-year-old Hispanic female who attends a day care facility 3 days each week. She now presents for her well child visit with a temperature of 38.5°C, rhinorrhea, and a left-sided bulging tympanic membrane. The results of a rapid COVID test are negative. Review of her medical record indicates that she has not received any vaccines since she was 2 months old. At this time, which of the following is the most appropriate pharmacologic intervention for KP?", "choices": ["Use watchful waiting for any progression of symptoms for the next 48-72 hours and administer 1 dose each of Haemophilus influenzae type B vaccine and pneumococcal conjugate vaccine (13-valent (PCV13) or 15- valent (PCV15)).", "Use watchful waiting for any progression of symptoms for the next 48-72 hours and administer the first dose of a 2-dose series of Haemophilus influenzae type B vaccine and 1 dose of 23-valent pneumococcal polysaccharide vaccine (PPSV23).", "Initiate treatment for acute otitis media with amoxicillin/clavulanate 90 mg/kg/day orally in two divided doses for 5 days and administer 1 dose each of Haemophilus influenzae type B vaccine and pneumococcal conjugate vaccine (PCV13 or PCV15).", "Initiate treatment for acute otitis media with ceftriaxone 50 mg/kg given intramuscularly X 1 dose and administer the first dose of a 2-dose series of Haemophilus influenzae type B vaccine and 1 dose of 23-valent pneumococcal polysaccharide vaccine."], "answer": 1, "rationales": ["According to 2013 guidelines for the management of acute otitis media in pediatric patients, watchful waiting prior to initiation of antimicrobial therapy is indicated for patients more than 2 years of age who present with non-severe symptoms. This patient’s symptoms are not severe based on her unilateral bulging tympanic membrane and lack of fever of 39°C, otorrhea, and pain. This patient has missed key immunizations that could decrease morbidity associated with upper respiratory infections. She has not completed the vaccine series for Haemophilus influenzae type B or pneumococcal vaccine. Based on her age (exceeding 2 years) she is a candidate for a single dose of Haemophilus influenzae type B vaccine instead of the standard 3- or 4-dose series. Furthermore, she requires catch-up immunization with the pneumococcal conjugate vaccine. Either the 13-valent (PCV13) or 15-valent (PCV15) pneumococcal conjugate vaccines are appropriate. Receipt of PPSV23 is not appropriate given her lack of comorbidities that would classify her as at high risk for invasive pneumococcal disease. Therefore, the use of watchful waiting for any progression of symptoms for the next 48-72 hours and administration of 1 dose each of Haemophilus influenzae type B vaccine and PCV13 are appropriate for KP.", "This patient needs to receive only 1 dose of Haemophilus influenzae type B vaccine at this time based on her age, which exceeds 2 years. The correct pneumococcal vaccine for administration to this patient who has no comorbidities or high-risk conditions is the conjugate vaccine (PCV13 or PCV15) as a single dose.", "Therapy with amoxicillin/clavulanate could be considered in this scenario because 2013 guidelines for the management of acute otitis media (AOM) provide an option for initiating antibiotic therapy in patients more than 2 years of age with unilateral AOM. However, this would not be the best choice because of this patient’s lack of severe symptoms and the presence of rhinorrhea, which is more often associated with a viral etiology than a bacterial etiology in patients with AOM. A short course of antibiotic therapy for 5-7 days is appropriate for patients 6 years of age or older with AOM. However, 7 days of therapy are recommended for patients 2-5 years of age. Giving 1 dose each of Haemophilus influenzae type B vaccine and pneumococcal conjugate vaccine (PCV13 or PCV15) is appropriate as catch-up for these vaccines in this patient.", "Ceftriaxone is not the preferred initial therapy for the management of acute otitis media (AOM). However, it is recommended as an alternative first-line therapy for patients who have failed to respond to initial antibiotic therapy within 48-72 hours. Amoxicillin 90 mg/kg/day by mouth remains the mainstay of primary therapy for AOM in pediatric patients. Therefore, although ceftriaxone could be a plausible recommendation, it does not represent the best option for managing this patient’s AOM considering her patient-specific factors, such as age, past medical history, and lack of severe illness. Based on an age greater than 2 years, this patient needs to receive only 1 dose of Haemophilus influenzae type B vaccine at this time. The correct pneumococcal vaccine for administration to this patient who has no comorbidities or high-risk conditions is the conjugate vaccine (PCV13 or PCV15) as a single dose."], "ref": "1. Lieberthal AS, Carroll AE, Chonmaitree T et al. The diagnosis and management of acute otitis media.\nPediatrics. 2013; 131:e964-99. 2. Centers for Disease Control and Prevention Advisory Committee on Immunization Practices. Table 1.\nRecommended child and adolescent immunization schedule for ages 18 years or younger, United States, 2023. https://www.cdc.gov/vaccines/schedules/hcp/imz/child-adolescent.html (accessed 2023 Feb 9). 3. Centers for Disease Control and Prevention Advisory Committee on Immunization Practices. Table 2. Catch-\nup immunization schedule for persons aged 4 months-18 years who start late or who are more than 1 month behind, United States, 2023. https://www.cdc.gov/vaccines/schedules/hcp/imz/catchup.html (accessed 2023 Feb 9).", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # K1.2 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.4 Knowledge # K1.16 RUBRIC #3: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # 1.31 __________________________________________________________________________________________________", "level": 3, "stemKo": "KP는 4세 히스패닉 여아로 주 3일 어린이집에 다닌다. 현재 건강 검진(well child visit)을 위해 내원하였으며 체온 38.5°C, 콧물(rhinorrhea), 좌측 고막 팽윤(bulging tympanic membrane)이 관찰된다. 신속 COVID 검사 결과는 음성이다. 의무기록을 검토한 결과 생후 2개월 이후로 어떤 백신도 접종받지 않았다. 현 시점에서 KP에게 가장 적절한 약물학적 중재는 다음 중 무엇인가?", "choicesKo": ["향후 48-72시간 동안 증상의 진행 여부에 대해 주의 깊은 경과관찰(watchful waiting)을 시행하고, Haemophilus influenzae type B 백신과 폐렴구균 단백결합백신(13가(PCV13) 또는 15가(PCV15))을 각각 1회분 투여한다.", "향후 48-72시간 동안 증상의 진행 여부에 대해 주의 깊은 경과관찰을 시행하고, Haemophilus influenzae type B 백신 2회 접종 시리즈의 첫 번째 용량과 23가 폐렴구균 다당질백신(PPSV23) 1회분을 투여한다.", "급성 중이염(acute otitis media)에 대해 amoxicillin/clavulanate 90 mg/kg/day를 경구로 2회 분할 투여하여 5일간 치료를 시작하고, Haemophilus influenzae type B 백신과 폐렴구균 단백결합백신(PCV13 또는 PCV15)을 각각 1회분 투여한다.", "급성 중이염에 대해 ceftriaxone 50 mg/kg을 근육주사로 1회 투여하여 치료를 시작하고, Haemophilus influenzae type B 백신 2회 접종 시리즈의 첫 번째 용량과 23가 폐렴구균 다당질백신 1회분을 투여한다."], "rationalesKo": ["소아 환자의 급성 중이염 관리에 관한 2013년 지침에 따르면, 항균제 치료를 시작하기 전 주의 깊은 경과관찰은 비중증(non-severe) 증상으로 내원한 2세 초과 환자에게 적응이 된다. 이 환자의 증상은 편측 고막 팽윤이며 39°C의 발열, 이루(otorrhea), 통증이 없으므로 중증이 아니다. 이 환자는 상기도 감염과 관련된 이환율을 낮출 수 있는 주요 예방접종을 놓쳤다. Haemophilus influenzae type B 백신 시리즈나 폐렴구균 백신 시리즈를 완료하지 않았다. 연령(2세 초과)에 근거하여 이 환자는 표준적인 3회 또는 4회 접종 시리즈 대신 Haemophilus influenzae type B 백신 1회 접종의 대상이 된다. 또한 폐렴구균 단백결합백신으로 따라잡기(catch-up) 접종이 필요하다. 13가(PCV13) 또는 15가(PCV15) 폐렴구균 단백결합백신 중 어느 것이든 적절하다. 침습성 폐렴구균 질환의 고위험군으로 분류될 만한 동반질환이 없으므로 PPSV23 접종은 적절하지 않다. 따라서 향후 48-72시간 동안 증상의 진행 여부에 대한 주의 깊은 경과관찰과 Haemophilus influenzae type B 백신 및 PCV13 각각 1회분의 투여가 KP에게 적절하다.", "이 환자는 2세를 초과하는 연령에 근거하여 현 시점에서 Haemophilus influenzae type B 백신을 1회분만 접종받으면 된다. 동반질환이나 고위험 상태가 없는 이 환자에게 투여할 올바른 폐렴구균 백신은 단백결합백신(PCV13 또는 PCV15) 1회 접종이다.", "급성 중이염(AOM) 관리에 관한 2013년 지침은 편측 AOM이 있는 2세 초과 환자에서 항생제 치료를 시작하는 선택지를 제시하고 있으므로, 이 상황에서 amoxicillin/clavulanate 치료도 고려할 수 있다. 그러나 이 환자에게 중증 증상이 없고, AOM 환자에서 세균성 원인보다 바이러스성 원인과 더 흔히 연관되는 콧물이 동반되어 있으므로 이는 최선의 선택이 아니다. 5-7일의 짧은 항생제 치료 과정은 AOM이 있는 6세 이상 환자에게 적절하다. 그러나 2-5세 환자에게는 7일간의 치료가 권장된다. Haemophilus influenzae type B 백신과 폐렴구균 단백결합백신(PCV13 또는 PCV15)을 각각 1회분 투여하는 것은 이 환자에서 해당 백신들의 따라잡기 접종으로 적절하다.", "Ceftriaxone은 급성 중이염(AOM) 관리를 위한 선호되는 초기 치료가 아니다. 그러나 초기 항생제 치료에 48-72시간 이내에 반응하지 않은 환자에게 대체 1차 치료로 권장된다. 소아 환자의 AOM에서 amoxicillin 90 mg/kg/day 경구 투여가 여전히 일차 치료의 근간으로 남아 있다. 따라서 ceftriaxone이 그럴듯한 권고안이 될 수는 있으나, 연령, 과거 병력, 중증 질환의 부재와 같은 이 환자의 개별 인자를 고려할 때 이 환자의 AOM 관리를 위한 최선의 선택지는 아니다. 2세를 초과하는 연령에 근거하여 이 환자는 현 시점에서 Haemophilus influenzae type B 백신을 1회분만 접종받으면 된다. 동반질환이나 고위험 상태가 없는 이 환자에게 투여할 올바른 폐렴구균 백신은 단백결합백신(PCV13 또는 PCV15) 1회 접종이다."]}, {"id": 12, "section": "Upper Respiratory Tract Infections", "sectionKo": "상기도 감염", "stem": "SL is an 8-year-old Caucasian male with past medical history of cerebral palsy, tympanostomy tubes for recurrent acute otitis media, and acute bacterial rhinosinusitis for which he has been receiving therapy with amoxicillin/clavulanate at home (today is day 5 of treatment). He presents to the emergency department with complaints of severe ear pain not relieved by ibuprofen 10 mg/kg/dose given via gastrostomy tube every 8 hours as well as fever of 40°C. His mother also reports shortness of breath and increased output from his gastrostomy tube that seems to coordinate with his amoxicillin/clavulanate doses but is much worse today. Which of the following represents the best antibiotic therapy to administer via gastrostomy tube to SL after discontinuing amoxicillin/clavulanate based on his presentation?", "choices": ["Cefdinir 14 mg/kg/day in two divided doses and azithromycin 10 mg/kg/day for 5 additional days", "Doxycycline 4 mg/kg/day in 2 divided doses for 10 additional days", "Clindamycin 30 mg/kg/day in three divided doses plus cefixime 8 mg/kg/day in two divided doses for additional 7 days", "Levofloxacin 20 mg/kg/day in two divided doses for 5 additional days"], "answer": 4, "rationales": ["This patient is displaying signs of a type I hypersensitivity reaction probably caused by the amoxicillin component of his current treatment regimen. In pediatric patients with a type 1 hypersensitivity reaction, therapy for acute bacterial rhinosinusitis involves the use of a fluoroquinolone instead of therapy with clindamycin plus a third-generation cephalosporin because of concerns about cross-reactivity between cephalosporins and aminopenicillins. The use of macrolide antibiotics is discouraged because of community- wide resistance displayed by Streptococcus pneumoniae isolates, making this choice inferior to the other treatment options provided despite the inclusion of a third-generation cephalosporin.", "Although this patient is 8 years of age, doxycycline is a viable treatment option. However, doxycycline does not represent the best choice for this patient based on recommendations in the 2012 Infectious Diseases Society of America clinical practice guidelines for acute bacterial rhinosinusitis management in children and adults, which advise against the use of tetracyclines in children.", "This patient is displaying signs of a type I hypersensitivity reaction probably caused by the amoxicillin component of his current treatment regimen. In pediatric patients with a type 1 hypersensitivity reaction, therapy for acute bacterial rhinosinusitis involves the use of a fluoroquinolone instead of therapy with clindamycin plus a third-generation cephalosporin because of concerns about cross-reactivity between cephalosporins and aminopenicillins. Therefore, clindamycin plus cefixime is not a good choice for this patient.", "This patient is displaying signs of a type I hypersensitivity reaction probably caused by the amoxicillin component of his current treatment regimen. In pediatric patients with a type 1 hypersensitivity reaction, therapy for acute bacterial rhinosinusitis involves the use of a fluoroquinolone instead of therapy with clindamycin plus a third-generation cephalosporin because of concerns about cross-reactivity between cephalosporins and aminopenicillins. Although consideration of a shorter course of antibiotics of 5-7 days for the treatment of rhinosinusitis is encouraged in the 2012 Infectious Diseases Society of America clinical practice guidelines for acute bacterial rhinosinusitis in children and adults, the recommended treatment duration remains 10-14 days for children. Levofloxacin will provide adequate coverage for the most common bacterial causes of acute otitis media in this complex patient who is not antibiotic-naïve (Streptococcus pneumoniae, Haemophilus influenzae, and Moraxella catarrhalis). Therefore, 5 additional days of levofloxacin is appropriate for this patient who has received 5 days of amoxicillin/clavulanate."], "ref": "1. Chow AW, Benninger MS, Brook I et al. IDSA clinical practice guideline for acute bacterial rhinosinusitis in\nchildren and adults. Clin Infect Dis. 2012; 54:e72-e112.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.4 Knowledge # 1.2 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.2 Knowledge # 1.4 RUBRIC #3: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # 1.9 RUBRIC #4: BCIDP - ID Domain # 1 Task # 1.2 Knowledge # 1.24 __________________________________________________________________________________________________", "level": 3, "stemKo": "SL은 8세 백인 남아로, 뇌성마비(cerebral palsy), 재발성 급성 중이염으로 인한 고막 환기관(tympanostomy tube) 삽입, 급성 세균성 부비동염(acute bacterial rhinosinusitis)의 과거 병력이 있으며 급성 세균성 부비동염에 대해 자택에서 amoxicillin/clavulanate 치료를 받고 있다(오늘이 치료 5일째). 위루관(gastrostomy tube)으로 8시간마다 투여한 ibuprofen 10 mg/kg/dose로도 완화되지 않는 심한 귀 통증과 40°C의 발열을 호소하며 응급실에 내원하였다. 어머니는 또한 호흡곤란과 위루관 배출량 증가를 보고하는데, 이는 amoxicillin/clavulanate 투여와 시기적으로 맞아떨어지는 것으로 보이며 오늘 훨씬 악화되었다. 이 환자의 임상 양상에 근거하여 amoxicillin/clavulanate를 중단한 후 SL에게 위루관으로 투여할 가장 적절한 항생제 치료는 다음 중 무엇인가?", "choicesKo": ["Cefdinir 14 mg/kg/day를 2회 분할 투여하고 azithromycin 10 mg/kg/day를 추가로 5일간 투여", "Doxycycline 4 mg/kg/day를 2회 분할하여 추가로 10일간 투여", "Clindamycin 30 mg/kg/day를 3회 분할 투여하고 cefixime 8 mg/kg/day를 2회 분할하여 추가로 7일간 투여", "Levofloxacin 20 mg/kg/day를 2회 분할하여 추가로 5일간 투여"], "rationalesKo": ["이 환자는 현재 치료 요법의 amoxicillin 성분에 의한 것으로 추정되는 제1형 과민반응(type I hypersensitivity reaction)의 징후를 보이고 있다. 제1형 과민반응이 있는 소아 환자에서 급성 세균성 부비동염 치료는, cephalosporin과 aminopenicillin 간 교차반응에 대한 우려 때문에 clindamycin과 3세대 cephalosporin 병용 치료 대신 fluoroquinolone을 사용하는 것이다. Macrolide 항생제의 사용은 Streptococcus pneumoniae 분리주가 보이는 지역사회 전반의 내성 때문에 권장되지 않으며, 3세대 cephalosporin이 포함되어 있음에도 이 선택지를 다른 치료 선택지보다 열등하게 만든다.", "이 환자가 8세이므로 doxycycline은 사용 가능한 치료 선택지이기는 하다. 그러나 소아 및 성인의 급성 세균성 부비동염 관리에 관한 2012년 Infectious Diseases Society of America 임상진료지침이 소아에서 tetracycline계의 사용을 권장하지 않는다는 점에 근거할 때, doxycycline은 이 환자에게 최선의 선택이 아니다.", "이 환자는 현재 치료 요법의 amoxicillin 성분에 의한 것으로 추정되는 제1형 과민반응의 징후를 보이고 있다. 제1형 과민반응이 있는 소아 환자에서 급성 세균성 부비동염 치료는, cephalosporin과 aminopenicillin 간 교차반응에 대한 우려 때문에 clindamycin과 3세대 cephalosporin 병용 치료 대신 fluoroquinolone을 사용하는 것이다. 따라서 clindamycin과 cefixime 병용은 이 환자에게 좋은 선택이 아니다.", "이 환자는 현재 치료 요법의 amoxicillin 성분에 의한 것으로 추정되는 제1형 과민반응의 징후를 보이고 있다. 제1형 과민반응이 있는 소아 환자에서 급성 세균성 부비동염 치료는, cephalosporin과 aminopenicillin 간 교차반응에 대한 우려 때문에 clindamycin과 3세대 cephalosporin 병용 치료 대신 fluoroquinolone을 사용하는 것이다. 소아 및 성인의 급성 세균성 부비동염에 관한 2012년 Infectious Diseases Society of America 임상진료지침에서 부비동염 치료를 위해 5-7일의 더 짧은 항생제 치료 기간을 고려하도록 권장하고 있으나, 소아에서 권장 치료 기간은 여전히 10-14일이다. Levofloxacin은 항생제 비투여 상태가 아닌(not antibiotic-naïve) 이 복잡한 환자에서 급성 중이염의 가장 흔한 세균성 원인균(Streptococcus pneumoniae, Haemophilus influenzae, Moraxella catarrhalis)에 대해 충분한 커버리지를 제공한다. 따라서 amoxicillin/clavulanate를 5일간 투여받은 이 환자에게 levofloxacin을 추가로 5일간 투여하는 것이 적절하다."]}, {"id": 13, "section": "Upper Respiratory Tract Infections", "sectionKo": "상기도 감염", "stem": "The antimicrobial stewardship team at University Hospital X (a facility with 450 adult beds and 50 pediatric beds) has decided to create clinical pathways for the most common respiratory infectious diseases encountered at the facility and would like to include all service areas. Sixty percent of pediatric patients presenting to the facility are unvaccinated or receiving vaccines on a delayed basis. The local antibiogram displays 30% Streptococcus pneumoniae resistance to ampicillin and 5% resistance of this pathogen to ceftriaxone. Half (50%) of Haemophilus influenzae isolates are beta-lactamase positive. Last year Moraxella catarrhalis represented 60% of the total respiratory pathogens isolated from pediatric upper respiratory cultures. Which of the following antimicrobial therapies would you recommend as the preferred empiric therapy for the acute otitis media (AOM) clinical pathway for pediatric patients at this hospital?", "choices": ["Amoxicillin/clavulanate 45 mg/kg/day by mouth in two divided doses", "Cefdinir 14 mg/kg/day by mouth in two divided doses", "Cefixime 8 mg/kg/day by mouth in two divided doses", "Clindamycin 30 mg/kg/day by mouth in three divided doses + cefpodoxime 10 mg/kg/day by mouth in two divided doses"], "answer": 3, "rationales": ["A third-generation cephalosporin would be most appropriate for the AOM clinical pathway at this hospital because of the Streptococcus pneumoniae ampicillin resistance rate above 10%, the high percentage of pediatric patients who are unvaccinated or inadequately vaccinated, and the high prevalence of Moraxella catarrhalis isolates that are known to produce beta-lactamase enzymes that would not be adequately covered by first-line therapy with amoxicillin or amoxicillin/clavulanate. The local antibiogram and patient populations served by this hospital must be taken into consideration when selecting the best empiric therapy for inclusion in the clinical pathway because antimicrobial stewardship is not just about using therapy with the narrowest antimicrobial spectrum of activity but also the timely initiation of the most appropriate therapy to manage the most likely organisms in patients with respiratory infections. The amoxicillin-clavulanate dosage based on the amoxicillin component would need to be at least 90 mg/kg/day to achieve adequate exposure to overcome the alteration in penicillin binding proteins anticipated as a primary mechanism of resistance exhibited by Streptococcus pneumoniae. Therefore, amoxicillin/clavulanate 45 mg/kg/day in two divided doses is not a good choice for empiric therapy in the AOM clinical pathway at this hospital.", "A third-generation cephalosporin would be most appropriate for the AOM clinical pathway at this hospital because of the Streptococcus pneumoniae ampicillin resistance rate above 10%, the high percentage of pediatric patients who are unvaccinated or inadequately vaccinated, and the high prevalence of Moraxella catarrhalis isolates that are known to produce beta-lactamase enzymes that would not be adequately covered by first-line therapy with amoxicillin or amoxicillin/clavulanate. Although cefdinir provides broader coverage than is typically desired, the local antibiogram and patient populations served by this hospital must be taken into consideration when selecting the best empiric therapy for inclusion in the AOM clinical pathway because antimicrobial stewardship is not just about using therapy with the narrowest antimicrobial spectrum of activity but also the timely initiation of the most appropriate therapy to manage the most likely organisms in patients with respiratory infections. Cefdinir is a guideline-recommended alternative to amoxicillin-clavulanate for treating AOM, but it is inadequate in efficacy for treating AOM because the concentrations of cefdinir in the inner and middle ear fluid are insufficient. Low drug exposure could lead to treatment failure and resistance. Therefore, cefdinir is not a good choice for empiric therapy in the AOM clinical pathway at this hospital.", "A third-generation cephalosporin would be most appropriate for the AOM clinical pathway at this hospital because of the Streptococcus pneumoniae ampicillin resistance rate above 10%, the high percentage of pediatric patients who are unvaccinated or inadequately vaccinated, and the high prevalence of Moraxella catarrhalis isolates that are known to produce beta-lactamase enzymes that would not be adequately covered by first-line therapy with amoxicillin or amoxicillin/clavulanate. Although cefixime provides broader coverage than is typically desired, the local antibiogram and patient populations served by this hospital must be taken into consideration when selecting the best empiric therapy for inclusion in the clinical pathway because antimicrobial stewardship is not just about using therapy with the narrowest antimicrobial spectrum of activity but also the timely initiation of the most appropriate therapy to manage the most likely organisms in patients with respiratory infections. Cefixime is the best choice for empiric therapy in in the AOM clinical pathway at this hospital.", "A third-generation cephalosporin would be most appropriate for the AOM clinical pathway at this hospital because of the Streptococcus pneumoniae ampicillin resistance rate above 10%, the high percentage of pediatric patients who are unvaccinated or inadequately vaccinated, and the high prevalence of Moraxella catarrhalis isolates that are known to produce beta-lactamase enzymes that would not be adequately covered by first-line therapy with amoxicillin or amoxicillin/clavulanate. Although clindamycin plus a third-generation cephalosporin is a potential option for pediatric patients who are allergic to penicillins, this combination is not recommended as a first-line empiric therapy for all patients. The use of clindamycin to provide coverage for methicillin-resistant Staphylococcus aureus (MRSA) is not needed because the top three bacterial pathogens in AOM are Streptococcus pneumoniae, Haemophilus influenzae, and Moraxella catarrhalis. Therefore, clindamycin plus cefpodoxime is not a good choice for empiric therapy in the AOM clinical pathway at this hospital."], "ref": "1. Lieberthal AS, Carroll AE, Chonmaitree T et al. The diagnosis and management of acute otitis media. Pediatrics.\n2013; 131:e964-99. 2. Bowlware KL, McCracken GH Jr, Lozano-Hernandez J et al. Cefdinir pharmacokinetics and tolerability in children\nreceiving 25 mg/kg once daily. Pediatr Infect Dis J. 2006; 25:208-10. 3. Casey JR, Block SL, Hedrick J et al. Comparison of amoxicillin/clavulanic acid high dose with cefdinir in the\ntreatment of acute otitis media. Drugs. 2012; 72:1991-7.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.3 Knowledge # 1.7 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.4 Knowledge # 1.2 __________________________________________________________________________________________________", "level": 3, "stemKo": "University Hospital X(성인 병상 450개, 소아 병상 50개 규모의 시설)의 항균제 스튜어드십 팀은 해당 시설에서 가장 흔히 접하는 호흡기 감염질환에 대한 임상 경로(clinical pathway)를 만들기로 결정하였으며, 모든 진료 영역을 포함하고자 한다. 이 시설에 내원하는 소아 환자의 60%는 예방접종을 받지 않았거나 지연된 일정으로 접종을 받고 있다. 지역 항생제 감수성표(antibiogram)에는 Streptococcus pneumoniae의 ampicillin 내성률이 30%, 이 균주의 ceftriaxone 내성률이 5%로 나타나 있다. Haemophilus influenzae 분리주의 절반(50%)은 beta-lactamase 양성이다. 작년에 Moraxella catarrhalis는 소아 상기도 배양에서 분리된 전체 호흡기 병원균의 60%를 차지하였다. 이 병원의 소아 환자를 위한 급성 중이염(acute otitis media, AOM) 임상 경로에서 선호되는 경험적 치료로 다음 중 어떤 항균제 치료를 권고하겠는가?", "choicesKo": ["Amoxicillin/clavulanate 45 mg/kg/day 경구, 2회 분할 투여", "Cefdinir 14 mg/kg/day 경구, 2회 분할 투여", "Cefixime 8 mg/kg/day 경구, 2회 분할 투여", "Clindamycin 30 mg/kg/day 경구, 3회 분할 투여 + cefpodoxime 10 mg/kg/day 경구, 2회 분할 투여"], "rationalesKo": ["이 병원의 AOM 임상 경로에는 3세대 cephalosporin이 가장 적절한데, Streptococcus pneumoniae의 ampicillin 내성률이 10%를 초과하고, 예방접종을 받지 않았거나 불충분하게 접종받은 소아 환자의 비율이 높으며, amoxicillin 또는 amoxicillin/clavulanate 1차 치료로는 충분히 커버되지 않을 beta-lactamase 효소를 생산하는 것으로 알려진 Moraxella catarrhalis 분리주의 유병률이 높기 때문이다. 항균제 스튜어드십은 단지 가장 좁은 항균 스펙트럼의 치료를 사용하는 것뿐 아니라 호흡기 감염 환자에서 가장 가능성이 높은 균주를 관리하기 위한 가장 적절한 치료를 적시에 시작하는 것이기도 하므로, 임상 경로에 포함할 최선의 경험적 치료를 선택할 때 이 병원의 지역 항생제 감수성표와 진료 대상 환자군을 반드시 고려해야 한다. Amoxicillin 성분을 기준으로 한 amoxicillin/clavulanate 용량은 Streptococcus pneumoniae가 나타내는 일차적 내성 기전으로 예상되는 페니실린 결합 단백(penicillin binding protein)의 변화를 극복할 만큼 충분한 노출을 달성하기 위해 최소 90 mg/kg/day는 되어야 한다. 따라서 amoxicillin/clavulanate 45 mg/kg/day를 2회 분할 투여하는 것은 이 병원의 AOM 임상 경로에서 경험적 치료로 좋은 선택이 아니다.", "이 병원의 AOM 임상 경로에는 3세대 cephalosporin이 가장 적절한데, Streptococcus pneumoniae의 ampicillin 내성률이 10%를 초과하고, 예방접종을 받지 않았거나 불충분하게 접종받은 소아 환자의 비율이 높으며, amoxicillin 또는 amoxicillin/clavulanate 1차 치료로는 충분히 커버되지 않을 beta-lactamase 효소를 생산하는 것으로 알려진 Moraxella catarrhalis 분리주의 유병률이 높기 때문이다. Cefdinir가 일반적으로 원하는 것보다 더 넓은 커버리지를 제공하기는 하지만, 항균제 스튜어드십은 단지 가장 좁은 항균 스펙트럼의 치료를 사용하는 것뿐 아니라 호흡기 감염 환자에서 가장 가능성이 높은 균주를 관리하기 위한 가장 적절한 치료를 적시에 시작하는 것이기도 하므로, AOM 임상 경로에 포함할 최선의 경험적 치료를 선택할 때 이 병원의 지역 항생제 감수성표와 진료 대상 환자군을 반드시 고려해야 한다. Cefdinir는 AOM 치료에서 amoxicillin/clavulanate의 지침 권장 대체 약제이지만, 내이 및 중이액 내 cefdinir 농도가 불충분하기 때문에 AOM 치료에는 효능이 부적절하다. 낮은 약물 노출은 치료 실패와 내성으로 이어질 수 있다. 따라서 cefdinir는 이 병원의 AOM 임상 경로에서 경험적 치료로 좋은 선택이 아니다.", "이 병원의 AOM 임상 경로에는 3세대 cephalosporin이 가장 적절한데, Streptococcus pneumoniae의 ampicillin 내성률이 10%를 초과하고, 예방접종을 받지 않았거나 불충분하게 접종받은 소아 환자의 비율이 높으며, amoxicillin 또는 amoxicillin/clavulanate 1차 치료로는 충분히 커버되지 않을 beta-lactamase 효소를 생산하는 것으로 알려진 Moraxella catarrhalis 분리주의 유병률이 높기 때문이다. Cefixime이 일반적으로 원하는 것보다 더 넓은 커버리지를 제공하기는 하지만, 항균제 스튜어드십은 단지 가장 좁은 항균 스펙트럼의 치료를 사용하는 것뿐 아니라 호흡기 감염 환자에서 가장 가능성이 높은 균주를 관리하기 위한 가장 적절한 치료를 적시에 시작하는 것이기도 하므로, 임상 경로에 포함할 최선의 경험적 치료를 선택할 때 이 병원의 지역 항생제 감수성표와 진료 대상 환자군을 반드시 고려해야 한다. Cefixime은 이 병원의 AOM 임상 경로에서 경험적 치료로 가장 좋은 선택이다.", "이 병원의 AOM 임상 경로에는 3세대 cephalosporin이 가장 적절한데, Streptococcus pneumoniae의 ampicillin 내성률이 10%를 초과하고, 예방접종을 받지 않았거나 불충분하게 접종받은 소아 환자의 비율이 높으며, amoxicillin 또는 amoxicillin/clavulanate 1차 치료로는 충분히 커버되지 않을 beta-lactamase 효소를 생산하는 것으로 알려진 Moraxella catarrhalis 분리주의 유병률이 높기 때문이다. Clindamycin과 3세대 cephalosporin 병용은 penicillin에 알레르기가 있는 소아 환자에게 가능한 선택지이기는 하나, 모든 환자에서 1차 경험적 치료로 권장되지는 않는다. AOM의 3대 세균성 병원균은 Streptococcus pneumoniae, Haemophilus influenzae, Moraxella catarrhalis이므로 methicillin-resistant Staphylococcus aureus (MRSA)를 커버하기 위해 clindamycin을 사용할 필요는 없다. 따라서 clindamycin과 cefpodoxime 병용은 이 병원의 AOM 임상 경로에서 경험적 치료로 좋은 선택이 아니다."]}, {"id": 14, "section": "Upper Respiratory Tract Infections", "sectionKo": "상기도 감염", "stem": "A 68-year-old woman with a past medical history of congestive heart failure (CHF) and type 2 diabetes mellitus presents to the primary care clinic with complaints of nasal discharge, cough, and frontal headaches that have been intermittent over the last 2 weeks. She reports having a cold during that time and thought she was getting better until 3 days ago when her symptoms worsened. She is diagnosed with acute bacterial rhinosinusitis, and the healthcare provider would like to initiate antibiotic therapy. Which of the following represents the best initial empiric therapy for this patient?", "choices": ["Amoxicillin/clavulanate 2 g by mouth twice daily for 5 days", "Amoxicillin/clavulanate 500 mg by mouth three times daily for 10 days", "Moxifloxacin 400 mg by mouth daily for 7 days", "Cefdinir 300 mg by mouth twice daily for 5 days"], "answer": 1, "rationales": ["The empiric drug of choice for acute bacterial rhinosinusitis (ABRS) is amoxicillin/clavulanate, according to the 2012 Infectious Diseases Society of America clinical practice guidelines for management of ABRS in children and adults. The use of high-dose amoxicillin/clavulanate (i.e., 2 g orally twice daily) instead of 500 mg orally three times daily is appropriate for this patient because of her advanced age (exceeding 65 years) and comorbid disease states (diabetes mellitus and CHF) and because of concerns about penicillin non-susceptible Streptococcus pneumoniae. The recommended duration of treatment for adults with ABRS is 5-7 days.", "The empiric drug of choice for acute bacterial rhinosinusitis (ABRS) is amoxicillin/clavulanate, according to the 2012 Infectious Diseases Society of America clinical practice guidelines for management of ABRS in children and adults. The use of high dose amoxicillin/clavulanate (i.e., 2 g orally twice daily) instead of 500 mg orally three times daily is appropriate for this patient because of her advanced age (exceeding 65 years) and comorbid disease states (diabetes mellitus and CHF) and because of concerns about penicillin non-susceptible Streptococcus pneumoniae. The recommended duration of treatment for adults with ABRS is 5-7 days. Therefore, amoxicillin/clavulanate 500 mg by mouth three times daily for 10 days is not the best choice for this patient.", "The empiric drug of choice for acute bacterial rhinosinusitis (ABRS) is amoxicillin/clavulanate, according to the 2012 Infectious Diseases Society of America (IDSA) clinical practice guidelines for management of ABRS in children and adults. The use of high-dose amoxicillin/clavulanate (i.e., 2 g orally twice) instead of 500 mg orally three times daily) is appropriate for this patient because of her advanced age (exceeding 65 years) and comorbid disease states (diabetes mellitus and CHF) and because of concerns about penicillin non-susceptible Streptococcus pneumoniae. The recommended duration of treatment for ABRS in adults is 5-7 days. Fluoroquinolones are not recommended as first-line therapy in the 2012 IDSA clinical practice guidelines. Moreover, moxifloxacin provides anaerobic coverage, which may not be needed for this patient.", "The empiric drug of choice for acute bacterial rhinosinusitis (ABRS) is amoxicillin/clavulanate, according to the 2012 Infectious Diseases Society of America (IDSA) clinical practice guidelines for management of ABRS in children and adults. The use of high-dose amoxicillin/clavulanate (i.e., 2 g orally twice daily) is appropriate for this patient because of her advanced age (exceeding 65 years) and comorbid disease states (diabetes mellitus and CHF) and because of concerns about penicillin non-susceptible Streptococcus pneumoniae. The recommended duration of treatment for adults with ABRS is 5-7 days. Cephalosporin antibiotics are no longer recommended as first-line therapy for management of ABRS. Therefore, cefdinir is not a good choice for this patient."], "ref": "1. Chow AW, Benninger MS, Brook I et al. IDSA clinical practice guideline for acute bacterial rhinosinusitis in\nchildren and adults. Clin Infect Dis. 2012; 54:e72-e112. 2. Barshak MB, Durand ML. The role of infection and antibiotics in chronic rhinosinusitis. Laryngoscope Investig\nOtolaryngol. 2017; 2:36-42.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # 1.11 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.4 Knowledge # 1.16 RUBRIC #3: BCIDP - ID Domain # 1 Task # 1.4 Knowledge # 1.20 __________________________________________________________________________________________________", "level": 3, "stemKo": "울혈성 심부전(CHF)과 제2형 당뇨병의 과거력이 있는 68세 여성이 지난 2주 동안 간헐적으로 지속된 콧물, 기침, 전두부 두통을 주소로 일차 진료 클리닉에 내원하였다. 환자는 그 기간 동안 감기를 앓았으며 호전되고 있다고 생각했으나 3일 전부터 증상이 악화되었다고 한다. 환자는 급성 세균성 비부비동염으로 진단되었고, 의료진은 항생제 치료를 시작하고자 한다. 이 환자에게 가장 적절한 초기 경험적 치료는 다음 중 무엇인가?", "choicesKo": ["Amoxicillin/clavulanate 2 g 경구 1일 2회, 5일간", "Amoxicillin/clavulanate 500 mg 경구 1일 3회, 10일간", "Moxifloxacin 400 mg 경구 1일 1회, 7일간", "Cefdinir 300 mg 경구 1일 2회, 5일간"], "rationalesKo": ["소아 및 성인의 급성 세균성 비부비동염(ABRS) 관리에 대한 2012년 Infectious Diseases Society of America 임상진료지침에 따르면 ABRS의 경험적 치료 약물로 선택되는 것은 amoxicillin/clavulanate이다. 이 환자에게는 500 mg 경구 1일 3회 대신 고용량 amoxicillin/clavulanate(즉, 2 g 경구 1일 2회)를 사용하는 것이 적절한데, 이는 고령(65세 초과)과 동반 질환(당뇨병 및 CHF), 그리고 penicillin 비감수성 Streptococcus pneumoniae에 대한 우려 때문이다. 성인 ABRS의 권장 치료 기간은 5-7일이다.", "소아 및 성인의 급성 세균성 비부비동염(ABRS) 관리에 대한 2012년 Infectious Diseases Society of America 임상진료지침에 따르면 ABRS의 경험적 치료 약물로 선택되는 것은 amoxicillin/clavulanate이다. 이 환자에게는 500 mg 경구 1일 3회 대신 고용량 amoxicillin/clavulanate(즉, 2 g 경구 1일 2회)를 사용하는 것이 적절한데, 이는 고령(65세 초과)과 동반 질환(당뇨병 및 CHF), 그리고 penicillin 비감수성 Streptococcus pneumoniae에 대한 우려 때문이다. 성인 ABRS의 권장 치료 기간은 5-7일이다. 따라서 amoxicillin/clavulanate 500 mg 경구 1일 3회 10일간 투여하는 것은 이 환자에게 가장 적절한 선택이 아니다.", "소아 및 성인의 급성 세균성 비부비동염(ABRS) 관리에 대한 2012년 Infectious Diseases Society of America(IDSA) 임상진료지침에 따르면 ABRS의 경험적 치료 약물로 선택되는 것은 amoxicillin/clavulanate이다. 이 환자에게는 500 mg 경구 1일 3회 대신 고용량 amoxicillin/clavulanate(즉, 2 g 경구 1일 2회)를 사용하는 것이 적절한데, 이는 고령(65세 초과)과 동반 질환(당뇨병 및 CHF), 그리고 penicillin 비감수성 Streptococcus pneumoniae에 대한 우려 때문이다. 성인 ABRS의 권장 치료 기간은 5-7일이다. 2012년 IDSA 임상진료지침에서 fluoroquinolone계는 1차 치료로 권장되지 않는다. 또한 moxifloxacin은 혐기성균 커버를 제공하는데, 이 환자에게는 필요하지 않을 수 있다.", "소아 및 성인의 급성 세균성 비부비동염(ABRS) 관리에 대한 2012년 Infectious Diseases Society of America(IDSA) 임상진료지침에 따르면 ABRS의 경험적 치료 약물로 선택되는 것은 amoxicillin/clavulanate이다. 이 환자에게 고용량 amoxicillin/clavulanate(즉, 2 g 경구 1일 2회)를 사용하는 것이 적절한데, 이는 고령(65세 초과)과 동반 질환(당뇨병 및 CHF), 그리고 penicillin 비감수성 Streptococcus pneumoniae에 대한 우려 때문이다. 성인 ABRS의 권장 치료 기간은 5-7일이다. Cephalosporin계 항생제는 더 이상 ABRS 관리의 1차 치료로 권장되지 않는다. 따라서 cefdinir는 이 환자에게 좋은 선택이 아니다."]}, {"id": 15, "section": "Upper Respiratory Tract Infections", "sectionKo": "상기도 감염", "stem": "A 32-year-old male with no known drug allergies presents to the outpatient physician clinic with a fever of 39.5°C, purulent nasal discharge, and facial pain surrounding the ethmoid region. He was started on amoxicillin/clavulanate 500 mg by mouth three times daily for acute bacterial rhinosinusitis (ABRS) but reports that the pain and discharge have become worse during the time since he began taking it 48 hours ago. The results of a rapid COVID test are negative. The patient reports compliance with his antibiotic regimen. Which of the following is the best alternative to amoxicillin/clavulanate for treating his ABRS?", "choices": ["Trimethoprim-sulfamethoxazole 1 double-strength tablet by mouth twice daily", "Clindamycin 300 mg by mouth three times per day plus cefixime 400 mg by mouth twice daily", "Doxycycline 100 mg by mouth twice daily", "Levofloxacin 500 mg by mouth once daily"], "answer": 3, "rationales": ["Trimethoprim-sulfamethoxazole is not an appropriate alternative to amoxicillin-clavulanate for this patient because of high rates of resistance among Streptococcus pneumoniae and Haemophilus influenzae, which are common pathogens in patients with ABRS.", "Clindamycin plus cefixime is an alternative to amoxicillin-clavulanate for children with ABRS and evidence of non-type I hypersensitivity, but it is not indicated for adults with ABRS.", "When a patient has worsening ABRS symptoms within 72 hours after initiation of appropriate first-line therapy, the agent should be changed to broaden coverage for pathogens that may exhibit resistance to beta- lactam antibiotics even in the presence of a beta-lactamase inhibitor (i.e., this patient’s amoxicillin- clavulanate). Doxycycline is the best alternative for this patient because it provides adequate coverage for the most common upper respiratory pathogens associated with ABRS, which are Streptococcus pneumoniae, Haemophilus influenzae, and Moraxella catarrhalis.", "Although levofloxacin is an alternative to amoxicillin-clavulanate for the treatment of ABRS, the FDA warns against the use of fluoroquinolones when other alternatives are available because of the risk of adverse effects from fluoroquinolones. Doxycycline is the best alternative for this patient because it provides adequate coverage for the most common upper respiratory pathogens associated with ABRS, which are Streptococcus pneumoniae, Haemophilus influenzae, and Moraxella catarrhalis."], "ref": "1. Chow AW, Benninger MS, Brook I et al. IDSA clinical practice guideline for acute bacterial rhinosinusitis in\nchildren and adults. Clin Infect Dis. 2012; 54:e72-e112. 2. Rosenfeld RM. Clinical practice: acute sinusitis in adults. N Engl J Med. 2016; 375: 962-70.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.1 Knowledge # 1.2 RUBRIC #2: BCIDP - ID Domain # 1 Task # 1.2 Knowledge # 1.22 __________________________________________________________________________________________________", "level": 3, "stemKo": "알려진 약물 알레르기가 없는 32세 남성이 39.5°C의 발열, 화농성 콧물, 사골동 부위 주변의 안면 통증을 주소로 외래 진료 클리닉에 내원하였다. 환자는 급성 세균성 비부비동염(ABRS)으로 amoxicillin/clavulanate 500 mg 경구 1일 3회를 시작하였으나, 48시간 전 복용을 시작한 이후 통증과 분비물이 오히려 악화되었다고 한다. COVID 신속검사 결과는 음성이다. 환자는 항생제 요법을 잘 준수하였다고 보고한다. 이 환자의 ABRS 치료에서 amoxicillin/clavulanate를 대체할 가장 적절한 약제는 다음 중 무엇인가?", "choicesKo": ["Trimethoprim-sulfamethoxazole double-strength 정제 1정 경구 1일 2회", "Clindamycin 300 mg 경구 1일 3회 + cefixime 400 mg 경구 1일 2회", "Doxycycline 100 mg 경구 1일 2회", "Levofloxacin 500 mg 경구 1일 1회"], "rationalesKo": ["Trimethoprim-sulfamethoxazole은 ABRS 환자에서 흔한 병원체인 Streptococcus pneumoniae와 Haemophilus influenzae의 내성률이 높기 때문에 이 환자에서 amoxicillin-clavulanate의 적절한 대체 약제가 아니다.", "Clindamycin과 cefixime의 병용은 비(非)제1형 과민반응의 증거가 있는 ABRS 소아 환자에서 amoxicillin-clavulanate의 대체 요법이지만, ABRS 성인 환자에서는 적응이 되지 않는다.", "적절한 1차 치료 시작 후 72시간 이내에 ABRS 증상이 악화되는 경우, beta-lactamase 억제제가 있음에도 beta-lactam계 항생제에 내성을 보일 수 있는 병원체(즉, 이 환자의 amoxicillin-clavulanate)에 대한 커버를 확대하도록 약제를 변경해야 한다. Doxycycline은 ABRS와 관련된 가장 흔한 상기도 병원체인 Streptococcus pneumoniae, Haemophilus influenzae, Moraxella catarrhalis에 대해 적절한 커버를 제공하므로 이 환자에게 가장 적절한 대체 약제이다.", "Levofloxacin이 ABRS 치료에서 amoxicillin-clavulanate의 대체 약제이기는 하지만, FDA는 fluoroquinolone계의 이상반응 위험 때문에 다른 대체 약제를 사용할 수 있는 경우 fluoroquinolone계의 사용을 경고하고 있다. Doxycycline은 ABRS와 관련된 가장 흔한 상기도 병원체인 Streptococcus pneumoniae, Haemophilus influenzae, Moraxella catarrhalis에 대해 적절한 커버를 제공하므로 이 환자에게 가장 적절한 대체 약제이다."]}, {"id": 16, "section": "Upper Respiratory Tract Infections", "sectionKo": "상기도 감염", "stem": "An institutional guideline for the management of acute bacterial rhinosinusitis (ABRS) is drafted by a working group and provided to the clinical pharmacist for review. The working group seeks specific recommendations for appropriate adjunctive therapies for this patient population. Which of the following is the best evidence-based recommendation for all patients presenting with ABRS based on the 2012 Infectious Diseases Society of America (IDSA) clinical practice guideline for ABRS in children and adults?", "choices": ["Intranasal tobramycin irrigation", "Intranasal saline irrigation", "Intranasal decongestants", "Intranasal corticosteroids"], "answer": 2, "rationales": ["There is no recommendation to support the use of intranasal antibiotic solution irrigations as adjunctive therapy for patients with ABRS in the 2012 Infectious Diseases Society of America clinical practice guideline for acute bacterial rhinosinusitis in children and adults.", "Intranasal saline irrigation is recommended in the 2012 Infectious Diseases Society of America clinical practice guideline as an adjunctive therapy for adults with ABRS. Although the recommendation is weak with low-to- moderate evidence, it can be applied to all patients with ABRS.", "Intranasal and other topical preparations of decongestants are not recommended as adjunctive therapies for the management of ABRS based on a strong recommendation with a low-to-moderate level of evidence in the 2012 Infectious Diseases Society of America clinical practice guideline for acute bacterial rhinosinusitis in children and adults.", "Intranasal corticosteroids are recommended as an adjunctive therapy in the 2012 Infectious Diseases Society of America clinical practice guideline for acute bacterial rhinosinusitis. However, the evidence is from patients with a history of allergic rhinitis, which is a limitation in applying use of this therapy to all patients with ABRS for the institutional guideline."], "ref": "1. Chow AW, Benninger MS, Brook I et al. IDSA clinical practice guideline for acute bacterial rhinosinusitis in\nchildren and adults. Clin Infect Dis. 2012; 54:e72-e112.", "rubric": "RUBRIC #1: BCIDP - ID Domain # 1 Task # 1.4 Knowledge # 1.2 RUBRIC #2: BCIDP - ID Domain # 2 Task # 2.2 Knowledge # 2.3 __________________________________________________________________________________________________", "level": 3, "stemKo": "급성 세균성 비부비동염(ABRS) 관리를 위한 기관 내 지침이 실무 그룹에 의해 초안으로 작성되어 검토를 위해 임상약사에게 제공되었다. 실무 그룹은 이 환자군에 적절한 보조 요법에 대한 구체적인 권고를 요청하고 있다. 소아 및 성인 ABRS에 대한 2012년 Infectious Diseases Society of America(IDSA) 임상진료지침에 근거할 때, ABRS로 내원하는 모든 환자에게 권고할 수 있는 가장 적절한 근거 기반 권고는 다음 중 무엇인가?", "choicesKo": ["비강 내 tobramycin 세척", "비강 내 생리식염수 세척", "비강 내 충혈완화제", "비강 내 코르티코스테로이드"], "rationalesKo": ["소아 및 성인의 급성 세균성 비부비동염에 대한 2012년 Infectious Diseases Society of America 임상진료지침에는 ABRS 환자의 보조 요법으로 비강 내 항생제 용액 세척의 사용을 지지하는 권고가 없다.", "비강 내 생리식염수 세척은 2012년 Infectious Diseases Society of America 임상진료지침에서 성인 ABRS 환자의 보조 요법으로 권장된다. 권고 강도는 약하고 근거 수준은 낮음-중등도이지만, ABRS 환자 전체에 적용할 수 있다.", "비강 내 및 기타 국소 충혈완화제 제제는 소아 및 성인의 급성 세균성 비부비동염에 대한 2012년 Infectious Diseases Society of America 임상진료지침에서 낮음-중등도 근거 수준의 강한 권고에 따라 ABRS 관리의 보조 요법으로 권장되지 않는다.", "비강 내 코르티코스테로이드는 급성 세균성 비부비동염에 대한 2012년 Infectious Diseases Society of Ameri
