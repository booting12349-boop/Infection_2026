ocol in the hospital and benzathine penicillin G 2.4 million units intramuscularly (IM) as a single dose", "A penicillin skin test to confirm the allergy, followed by a penicillin desensitization protocol in the hospital, and benzathine penicillin G 7.2 million units divided in three 2.4-million-unit intramuscular (IM) doses at 1-week intervals", "A penicillin skin test to confirm the allergy, followed by a penicillin desensitization protocol in the hospital, and benzathine penicillin G 2.4 million units intramuscularly (IM) as a single dose"], "answer": 4, "rationales": ["Doxycycline cannot be safely recommended for pregnant patients with syphilis.", "Use of a penicillin desensitization protocol in the hospital and benzathine penicillin G 2.4 million units IM as a one-time dose would be appropriate if you assume that the allergy is a true allergy, but this is not necessarily the case without confirmation.", "The treatment in this example would be appropriate for late latent syphilis, but this patient has early latent syphilis.", "A penicillin skin test to confirm the allergy followed by a penicillin desensitization protocol in the hospital and benzathine penicillin G 2.4 million units IM as a single dose is the current guideline-recommended treatment method for management of syphilis (in this case early latent syphilis) in a pregnant patient with an allergy to penicillin. Patients with a history of anaphylactic reaction do not necessarily continue to have this allergy for their whole life, which is why verifying the allergy through penicillin skin testing (which will detect immunoglobulin E-mediated reactions) is suggested."], "ref": "", "rubric": "", "level": 3, "stemKo": "23세 여성이 10주 전 피임 없이 성관계를 가진 후 보건소에 내원하여 임신 검사를 요청하였고, 결과는 양성이었다. 마지막 월경일을 기준으로 임신 21주째이다. 임신 검사 당시 성매개감염(STD) 선별검사에도 동의하였다. 이틀 후 보건소는 그녀에게 매독 검사 양성 결과를 통보하였는데, fluorescent treponemal antibody absorbed(FTA-abs) 검사가 반응 양성(이전 기록상 6개월 전에는 음성)이었고, rapid plasma reagin(RPR) 역가는 1:64(이틀 전 검사)였다. 매독 증상은 없다. 그녀는 어린 시절 penicillin에 아나필락시스 반응이 있었다고 진술한다. 이 환자의 매독에 대해 가장 적절한 관리는?", "choicesKo": ["Doxycycline 100 mg 경구 하루 2회, 28일간", "병원에서 penicillin 탈감작 프로토콜을 시행한 후 benzathine penicillin G 240만 단위를 근육주사(IM) 단회 투여", "알레르기를 확인하기 위한 penicillin 피부반응검사를 시행한 후, 병원에서 penicillin 탈감작 프로토콜을 시행하고, benzathine penicillin G 720만 단위를 240만 단위씩 3회로 나누어 1주 간격으로 근육주사(IM) 투여", "알레르기를 확인하기 위한 penicillin 피부반응검사를 시행한 후, 병원에서 penicillin 탈감작 프로토콜을 시행하고, benzathine penicillin G 240만 단위를 근육주사(IM) 단회 투여"], "rationalesKo": ["Doxycycline은 매독이 있는 임신부에게 안전하게 권고할 수 없다.", "병원에서 penicillin 탈감작 프로토콜을 시행하고 benzathine penicillin G 240만 단위를 IM 1회 투여하는 것은 해당 알레르기가 진짜 알레르기라고 가정할 경우 적절하겠지만, 확인 없이는 반드시 그렇다고 할 수 없다.", "이 보기의 치료는 후기 잠복매독(late latent syphilis)에 적절하지만, 이 환자는 조기 잠복매독(early latent syphilis)이다.", "알레르기를 확인하기 위한 penicillin 피부반응검사를 시행한 후 병원에서 penicillin 탈감작 프로토콜을 시행하고 benzathine penicillin G 240만 단위를 IM 단회 투여하는 것이, penicillin 알레르기가 있는 임신부의 매독(이 경우 조기 잠복매독) 관리에 대해 현행 지침에서 권고하는 치료 방법이다. 아나필락시스 반응의 병력이 있는 환자가 반드시 평생 그 알레르기를 지속적으로 갖는 것은 아니며, 이것이 penicillin 피부반응검사(immunoglobulin E 매개 반응을 검출함)를 통해 알레르기를 확인하도록 권장하는 이유이다."]}, {"id": 48, "section": "Central Nervous System Infections", "sectionKo": "중추신경계감염", "stem": "54세 남자가 3일간의 발열·두통·의식저하로 내원하였다. 뇌척수액 그람염색에서 그람양성 diplococci가 관찰되었다. 가장 적절한 경험적 치료는?", "choices": ["Vancomycin + ceftriaxone", "Ampicillin 단독", "Meropenem + azithromycin", "Clindamycin + amikacin"], "answer": 1, "rationales": ["성인 세균성 수막염의 최다 원인균은 S. pneumoniae(그람양성 diplococci)로, 폐렴구균 내성을 고려해 vancomycin + 3세대 cephalosporin(ceftriaxone) 경험적 병용이 표준이다.", "Ampicillin 단독은 Listeria 커버 목적이며 폐렴구균 경험적 치료로는 부적절하다.", "Meropenem+azithromycin은 세균성 수막염 표준 경험요법이 아니다.", "Clindamycin+amikacin은 수막염 원인균 커버·CSF 투과가 부적절하다."], "ref": "성인 세균성 수막염 임상진료지침(국내) / IDSA Bacterial Meningitis; Harrison 20th", "rubric": "", "level": 2, "stemKo": "54세 남자가 3일간의 발열·두통·의식저하로 내원하였다. 뇌척수액 그람염색에서 그람양성 diplococci가 관찰되었다. 가장 적절한 경험적 치료는?", "choicesKo": ["Vancomycin + ceftriaxone", "Ampicillin 단독", "Meropenem + azithromycin", "Clindamycin + amikacin"], "rationalesKo": ["성인 세균성 수막염의 최다 원인균은 S. pneumoniae(그람양성 diplococci)로, 폐렴구균 내성을 고려해 vancomycin + 3세대 cephalosporin(ceftriaxone) 경험적 병용이 표준이다.", "Ampicillin 단독은 Listeria 커버 목적이며 폐렴구균 경험적 치료로는 부적절하다.", "Meropenem+azithromycin은 세균성 수막염 표준 경험요법이 아니다.", "Clindamycin+amikacin은 수막염 원인균 커버·CSF 투과가 부적절하다."]}, {"id": 49, "section": "Central Nervous System Infections", "sectionKo": "중추신경계감염", "stem": "45세 남자가 갑작스런 의식저하·저혈압·점상출혈로 내원하였다. 2년 전 ITP로 비장절제술을 받았고, CSF 그람염색에서 그람음성 diplococci가 보였다. 원인균은?", "choices": ["Streptococcus pneumoniae", "Neisseria meningitidis", "Listeria monocytogenes", "Haemophilus influenzae"], "answer": 2, "rationales": ["폐렴구균도 무비증에서 호발하나 그람양성 diplococci로 형태가 다르다.", "그람음성 diplococci + 점상/자반 + 무비증(비장절제) 조합은 N. meningitidis에 합당하며 치료는 ceftriaxone/cefotaxime이다.", "Listeria는 그람양성 rod이다.", "H. influenzae는 그람음성 coccobacilli이다."], "ref": "Harrison 20th; 국내 수막염 지침", "rubric": "", "level": 2, "stemKo": "45세 남자가 갑작스런 의식저하·저혈압·점상출혈로 내원하였다. 2년 전 ITP로 비장절제술을 받았고, CSF 그람염색에서 그람음성 diplococci가 보였다. 원인균은?", "choicesKo": ["Streptococcus pneumoniae", "Neisseria meningitidis", "Listeria monocytogenes", "Haemophilus influenzae"], "rationalesKo": ["폐렴구균도 무비증에서 호발하나 그람양성 diplococci로 형태가 다르다.", "그람음성 diplococci + 점상/자반 + 무비증(비장절제) 조합은 N. meningitidis에 합당하며 치료는 ceftriaxone/cefotaxime이다.", "Listeria는 그람양성 rod이다.", "H. influenzae는 그람음성 coccobacilli이다."]}, {"id": 50, "section": "Central Nervous System Infections", "sectionKo": "중추신경계감염", "stem": "신병훈련소 23세 남자가 수막구균 수막염으로 확진되었다. 접촉 후 화학예방의 대상·방법으로 옳은 것은?", "choices": ["3일 전 면회 온 어머니 – ceftriaxone 2 g IM 1회", "기도 suction한 간호사 – ceftriaxone 1 g IV 1회", "같은 내무반 군인 – rifampin 600 mg 1회", "초진·요추천자한 전공의 – rifampin 600 mg q12h 2일"], "answer": 4, "rationales": ["화학예방 대상은 밀접·가정 접촉자와 호흡기 분비물에 직접 노출된 의료진이며, 단순 면회객은 대상이 아니다.", "노출은 되었으나 ceftriaxone 예방은 250 mg IM 1회가 정확한 용법이다.", "밀접접촉 군인은 대상이나 rifampin은 600 mg q12h 2일이어야 하며 1회는 부적절하다.", "요추천자로 호흡기 분비물에 직접 노출된 전공의는 대상이며 rifampin 600 mg q12h 2일이 정확한 요법이다."], "ref": "Harrison 20th 수막구균 chemoprophylaxis", "rubric": "", "level": 3, "stemKo": "신병훈련소 23세 남자가 수막구균 수막염으로 확진되었다. 접촉 후 화학예방의 대상·방법으로 옳은 것은?", "choicesKo": ["3일 전 면회 온 어머니 – ceftriaxone 2 g IM 1회", "기도 suction한 간호사 – ceftriaxone 1 g IV 1회", "같은 내무반 군인 – rifampin 600 mg 1회", "초진·요추천자한 전공의 – rifampin 600 mg q12h 2일"], "rationalesKo": ["화학예방 대상은 밀접·가정 접촉자와 호흡기 분비물에 직접 노출된 의료진이며, 단순 면회객은 대상이 아니다.", "노출은 되었으나 ceftriaxone 예방은 250 mg IM 1회가 정확한 용법이다.", "밀접접촉 군인은 대상이나 rifampin은 600 mg q12h 2일이어야 하며 1회는 부적절하다.", "요추천자로 호흡기 분비물에 직접 노출된 전공의는 대상이며 rifampin 600 mg q12h 2일이 정확한 요법이다."]}, {"id": 51, "section": "Central Nervous System Infections", "sectionKo": "중추신경계감염", "stem": "64세 남자가 경련으로 내원하였다. 만취 상태에 거미혈관종이 있었고, CSF는 단백 상승·당은 정상에 가까웠으며 혈액배양에서 그람양성 rod가 자랐다. 원인균과 치료는?", "choices": ["S. pneumoniae – vancomycin + ceftriaxone", "Listeria monocytogenes – ampicillin + gentamicin", "N. meningitidis – ceftriaxone", "E. coli – cefotaxime"], "answer": 2, "rationales": ["폐렴구균은 그람양성 diplococci로 형태가 다르다.", "고령·알코올·간질환·면역저하에서 Listeria(그람양성 rod)가 호발하며 아급성·경련이 흔하고 CSF 당이 정상에 가깝다. 치료는 ampicillin+gentamicin(상승효과), 페니실린 알레르기 시 TMP-SMX이다.", "수막구균은 그람음성 diplococci이다.", "E. coli는 그람음성 rod이다."], "ref": "Harrison 20th; 국내 수막염 지침", "rubric": "", "level": 3}, {"id": 52, "section": "Urinary Tract Infections", "sectionKo": "요로감염", "stem": "당뇨가 있는 54세 여자가 3일간의 배뇨통·빈뇨·절박뇨로 내원하였고 발열·측복통 등 전신증상은 없었다. 지난 1년간 급성 방광염으로 5회 경구 항생제 치료력이 있다. 경험적 경구 항생제로 가장 적절한 것은?", "choices": ["Ciprofloxacin", "Nitrofurantoin", "TMP-SMX", "Amoxicillin/clavulanate"], "answer": 2, "rationales": ["FQ는 내성 보존을 위해 단순 방광염 1차로 지양한다.", "단순 방광염 1차는 nitrofurantoin 등이며, 반복 FQ/TMP-SMX 노출력이 있어 nitrofurantoin이 적절하다.", "반복 사용력·지역 내성을 고려하면 차선이다.", "β-lactam은 대안이나 nitrofurantoin이 우선된다."], "ref": "요로감염 항생제 사용지침(국내) / 2011 요로감염 권고안", "rubric": "", "level": 1}, {"id": 53, "section": "Urinary Tract Infections", "sectionKo": "요로감염", "stem": "72세 여자가 발열·의식저하로 내원하였다. 혈압 85/40 mmHg, 15년간 당뇨로 치료받았다. 복부 CT에서 신실질 내 가스가 관찰되었다. 진단은?", "choices": ["Emphysematous pyelonephritis", "Acute cortical necrosis", "Renal cell carcinoma", "Urinary stone"], "answer": 1, "rationales": ["당뇨·고령 여성에서 신실질 내 가스형성은 emphysematous pyelonephritis로, 세균성 신우신염 중 가장 중한 형태이다(주 원인 E. coli).", "피질괴사는 가스형성 소견과 부합하지 않는다.", "신세포암은 감염·가스 소견과 다르다.", "요로결석은 가스형성과 무관하다."], "ref": "2011 요로감염 권고안; Harrison 20th", "rubric": "", "level": 2}, {"id": 54, "section": "Urinary Tract Infections", "sectionKo": "요로감염", "stem": "급성 신우신염으로 감수성 있는 ciprofloxacin(E. coli, cipro-S)을 투여한 지 4일째에도 발열과 측복통이 지속된다. 다음으로 가장 적절한 조치는?", "choices": ["즉시 신절제술", "영상 확인 후 경피적 배농(신주위/신농양 의심)", "항생제 중단", "경과 관찰만"], "answer": 2, "rationales": ["신절제는 성급하며 우선 배농·감압을 고려한다.", "APN 치료 4–5일 후에도 발열이 지속되면 신주위/신농양을 의심해 영상 확인 후 경피적 배농을 시행한다.", "감수성 항생제 중단은 부적절하다.", "관찰만 하는 것은 합병증을 놓칠 수 있다."], "ref": "2011 요로감염 권고안; Harrison 20th", "rubric": "", "level": 3}, {"id": 55, "section": "Urinary Tract Infections", "sectionKo": "요로감염", "stem": "신낭종 감염을 동반한 급성 신우신염 환자에서 E. coli 감수성 결과가 R: amikacin·ciprofloxacin / S: cefotaxime·meropenem·TMP-SMX 였다. 낭종 투과력을 고려한 가장 적절한 약제는?", "choices": ["Amikacin", "TMP-SMX", "Cefotaxime", "Meropenem"], "answer": 2, "rationales": ["Amikacin은 내성이며 낭종 투과도 불량하다.", "낭종 투과가 우수한 약제는 FQ·TMP-SMX·chloramphenicol인데 FQ가 내성이므로 감수성 있는 TMP-SMX가 적절하다.", "Cefotaxime은 감수성이나 낭종 투과가 제한적이다.", "Meropenem은 감수성이나 낭종 투과 측면에서 TMP-SMX가 우선된다."], "ref": "Harrison 20th p.2153", "rubric": "", "level": 3}, {"id": 56, "section": "Skin & Soft Tissue Infections", "sectionKo": "피부·연조직감염", "stem": "35세 남자가 3일 전 시작된 발열과 우측 다리의 통증·발적·열감으로 내원하였다. 양측 족부 백선이 있었다. 이 봉와직염을 일으키는 가장 흔한 원인균 2가지는?", "choices": ["S. aureus, S. pyogenes", "E. coli, Klebsiella pneumoniae", "Pseudomonas, Acinetobacter", "Clostridium, Bacteroides"], "answer": 1, "rationales": ["봉와직염은 피부 상재·침입균인 S. aureus와 S. pyogenes(A군 β-용혈성 연쇄구균)가 가장 흔하다.", "장내 그람음성균은 전형적 봉와직염 원인이 아니다.", "녹농균·아시네토박터는 특수 상황을 제외하면 흔한 원인이 아니다.", "혐기·클로스트리디움은 괴사성 감염에서 고려된다."], "ref": "Harrison 20th; 피부 연조직 감염 항생제 사용지침(국내)", "rubric": "", "level": 1}, {"id": 57, "section": "Skin & Soft Tissue Infections", "sectionKo": "피부·연조직감염", "stem": "56세 여자가 종아리 병변이 급속히 확대되며 극심한 통증을 호소하고 혈압 75/30 mmHg였다. 어린 시절 페니실린 주사로 쇼크를 겪었고 페니실린 피부반응이 양성이다. 검붉은 병변이 넓어지고 있다. 치료는?", "choices": ["Penicillin 탈감작 후 정주 + aminoglycoside", "Carbapenem 탈감작 후 정주", "Vancomycin + fluoroquinolone 정주", "Doxycycline 경구"], "answer": 3, "rationales": ["페니실린 아나필락시스·쇼크 상황에서 탈감작은 부적절하다.", "카바페넴 탈감작도 급성 중증 상황에 적절하지 않다.", "괴사근막염은 조기·적극적 외과적 debridement와 광범위 항생제가 원칙이며, 페니실린 아나필락시스 시 vancomycin(그람양성)+fluoroquinolone(그람음성)이 대안이다.", "경구 doxycycline은 중증 괴사성 감염 치료로 부적절하다."], "ref": "Harrison 20th; Mandell 8th 괴사근막염", "rubric": "", "level": 3}, {"id": 58, "section": "Bone & Joint Infections", "sectionKo": "골관절감염", "stem": "45세 남자가 7일간의 발열·다리 통증으로 내원하여 MRI와 혈액배양으로 골수염이 진단되었다. 정맥 항생제 1개월 후 경구로 전환할 때 포도상구균 골수염에서 가장 효과적인 경구 요법은?", "choices": ["Cephalexin", "Amoxicillin/clavulanate", "Levofloxacin + rifampin", "경구 vancomycin + metronidazole"], "answer": 3, "rationales": ["단독 경구 β-lactam(cephalexin)은 biofilm 골수염에서 열등하다.", "Amoxicillin/clavulanate 단독도 최적은 아니다.", "포도상구균 골수염의 경구 전환은 levofloxacin+rifampin 조합이 가장 효과적이다.", "경구 vancomycin은 전신 흡수가 되지 않아 골수염 치료에 부적절하다."], "ref": "Harrison 20th; Osteomyelitis", "rubric": "", "level": 3}, {"id": 59, "section": "Bone & Joint Infections", "sectionKo": "골관절감염", "stem": "발열과 요통을 보이는 환자에서 S. aureus 균혈증과 함께 척추 골수염이 의심된다. 진단에 가장 유용한(gold standard) 검사는?", "choices": ["단순 X-ray", "MRI", "혈액검사만", "단독 골스캔"], "answer": 2, "rationales": ["단순 X-ray는 초기 민감도가 낮다.", "MRI가 척추 골수염 진단의 gold standard이다.", "혈액검사만으로는 진단이 어렵다.", "골스캔은 보조적 역할에 그친다."], "ref": "Harrison 20th 척추 골수염", "rubric": "", "level": 1}, {"id": 60, "section": "Intra-abdominal Infections", "sectionKo": "복강내감염", "stem": "당뇨 환자가 발열·우상복부 통증과 함께 안구내염을 보여 시행한 복부 CT에서 간농양이 확인되었다. 가장 가능성 있는 원인균은?", "choices": ["Hypervirulent Klebsiella pneumoniae", "Escherichia coli", "Bacteroides fragilis", "Enterococcus faecium"], "answer": 1, "rationales": ["당뇨·아시아인에서 간농양과 전이감염(안구내염 등)을 보이면 hypervirulent K. pneumoniae가 유력하며 string test 양성이 특징이다.", "담도성 간농양에 E. coli가 흔하나 전이감염·안구내염 조합은 hvKP를 시사한다.", "Bacteroides는 단독 원인으로 전형적이지 않다.", "E. faecium은 이 임상 조합의 전형적 원인이 아니다."], "ref": "Harrison 20th p.1154", "rubric": "", "level": 2}, {"id": 61, "section": "Intra-abdominal Infections", "sectionKo": "복강내감염", "stem": "HIV로 치료 중인 34세 남자가 고열·설사·복통으로 내원하여 간농양이 확인되었다. 병변 흡인액은 흰색이었고 배양에서 자라는 균이 없었다. 원인 병원체와 치료는?", "choices": ["Entamoeba histolytica – metronidazole", "K. pneumoniae – ceftriaxone", "S. aureus – nafcillin", "Candida – fluconazole"], "answer": 1, "rationales": ["배양 음성과 흡인액 양상은 원충인 Entamoeba histolytica를 시사하며, metronidazole 750 mg tid 5–10일로 치료하고 흡인은 보통 필요하지 않다.", "세균성이라면 배양에서 균이 자란다.", "S. aureus 간농양은 혈행성이며 배양 양성이 흔하다.", "Candida 간농양은 이 임상상과 부합하지 않는다."], "ref": "Harrison 20th pp.1570-1573", "rubric": "", "level": 2}, {"id": 62, "section": "Intra-abdominal Infections", "sectionKo": "복강내감염", "stem": "담도 기원의 화농성 간농양 치료 원칙으로 옳은 것은?", "choices": ["항생제만 3일", "배액(경피적/수술) + 항생제 4–6주", "경과 관찰", "항진균제 단독"], "answer": 2, "rationales": ["단기 항생제 단독은 부적절하다.", "배액이 치료의 근간이며 항생제를 4–6주 병용한다.", "관찰만 하는 것은 부적절하다.", "세균성이므로 항진균 단독은 부적절하다."], "ref": "Harrison 20th p.957", "rubric": "", "level": 1}, {"id": 63, "section": "Infective Endocarditis", "sectionKo": "감염심내막염", "stem": "57세 남자가 3주간의 발열로 내원하여 심초음파에서 vegetation이 관찰되었고 혈액배양에서 Enterococcus faecalis(gentamicin-S, ampicillin-S, vancomycin-S)가 동정되었다. 가장 적절한 치료는?", "choices": ["Linezolid", "Ampicillin 단독", "Vancomycin 단독", "Ampicillin + gentamicin"], "answer": 4, "rationales": ["Linezolid는 정균성으로 살균요법이 필요한 IE에 부적절하다.", "장구균 IE에서 β-lactam 단독은 부적절하다.", "Vancomycin 단독도 장구균 IE의 표준 병용이 아니다.", "감수성 장구균 IE는 ampicillin(또는 penicillin) + gentamicin 4–6주 살균 병용이 표준이다."], "ref": "Harrison 20th; AHA/IDSA 감염심내막염", "rubric": "", "level": 2}, {"id": 64, "section": "Infective Endocarditis", "sectionKo": "감염심내막염", "stem": "5년 전 대동맥판막 치환술을 받은 43세 여자가 7일 전부터 발열이 있어 내원하였다. 심초음파에서 인공판막 vegetation이 보였고 혈액에서 oxacillin-susceptible staphylococci가 배양되었다. 적절한 항균제 조합은?", "choices": ["Ceftriaxone + gentamicin", "Nafcillin + gentamicin", "Nafcillin + rifampin + gentamicin", "Vancomycin + rifampin + gentamicin"], "answer": 3, "rationales": ["인공판막 포도상구균 IE에는 rifampin을 포함한 3제 병용이 필요하다.", "2제(nafcillin+gentamicin)는 인공판막 IE에 불충분하다.", "인공판막 MSSA IE는 nafcillin + rifampin + gentamicin이 표준이다.", "MSSA에는 vancomycin보다 항포도상 β-lactam(nafcillin)이 우선된다."], "ref": "AHA/IDSA 감염심내막염 지침", "rubric": "", "level": 3}, {"id": 65, "section": "Infective Endocarditis", "sectionKo": "감염심내막염", "stem": "52세 남자가 3주 전 시작된 발열로 내원하여 혈액배양 3쌍 모두에서 Aggregatibacter actinomycetemcomitans(HACEK)가 동정되었고 범수축기 심잡음이 있었다. 자연판막 심내막염일 때 권장 항균제 치료기간은?", "choices": ["2주", "4주", "6주", "8주"], "answer": 2, "rationales": ["2주는 부족하다.", "HACEK 자연판막 IE는 ceftriaxone 등으로 4주 치료한다.", "6주는 인공판막·특정 균에서의 기간이다.", "8주는 표준 이상이다."], "ref": "AHA/IDSA 감염심내막염 지침", "rubric": "", "level": 2}, {"id": 66, "section": "Infective Endocarditis", "sectionKo": "감염심내막염", "stem": "대동맥판 vegetation이 있는 감염심내막염 환자에서 수술적 치료를 고려해야 하는 경우가 아닌 것은?", "choices": ["판막 기능부전에 의한 중등도–중증 심부전", "적절한 치료에도 지속되는 균혈증", "진균에 의한 심내막염", "Septic emboli에 의한 피부 병변만 있는 경우"], "answer": 4, "rationales": ["판막 기능부전에 의한 심부전은 수술 적응이다.", "적절한 항균요법에도 지속되는 균혈증은 수술을 강력히 고려한다.", "진균 IE는 효과적 살균요법 부재로 수술 적응이다.", "색전에 의한 피부 병변 자체만으로는 수술 적응이 아니며, 크고 이동성 큰 vegetation·재색전 위험 시 고려한다."], "ref": "Harrison 20th; AHA/IDSA 수술 적응증", "rubric": "", "level": 3}, {"id": 67, "section": "Fungal Infections", "sectionKo": "진균감염", "stem": "대장암으로 중심정맥관을 삽입하고 항암치료 중인 42세 여자가 발열이 발생하여 혈액배양에서 효모균(yeast)이 배양되었다(호중구감소 없음). 적절한 초기 항진균 치료는?", "choices": ["Fluconazole", "Caspofungin", "Flucytosine", "Amphotericin B deoxycholate"], "answer": 2, "rationales": ["Fluconazole은 안정적이고 비내성인 경우의 대안이다.", "칸디다혈증의 초기 치료(TOC)는 echinocandin(caspofungin)이며 중심정맥관 제거, 안저검사, 혈액배양 음전 후 2주 유지가 원칙이다.", "Flucytosine 단독은 부적절하다.", "지질제형이 아닌 amphotericin B deoxycholate는 독성이 커 1차로 선호되지 않는다."], "ref": "IDSA 2016 Candidiasis 관리지침", "rubric": "", "level": 1}, {"id": 68, "section": "Tuberculosis", "sectionKo": "결핵", "stem": "새로 진단된 약제감수성 폐결핵 성인의 표준 초치료 요법은?", "choices": ["2HRZE(집중 2개월) → 4HR(유지 4개월)", "3HR", "INH 단독 9개월", "HR 2개월"], "answer": 1, "rationales": ["감수성 결핵 표준 초치료는 2HRZE 후 4HR이다.", "3HR은 잠복결핵 요법이다.", "INH 단독(9H)은 잠복결핵 선택지다.", "2개월만으로는 불충분하다."], "ref": "결핵 진료지침 5판(질병관리청 2024)", "rubric": "", "level": 1}, {"id": 69, "section": "Tuberculosis", "sectionKo": "결핵", "stem": "결핵 치료 중 손발 저림(말초신경병증)을 호소한다. 원인 약제와 예방/처치는?", "choices": ["INH — pyridoxine(비타민 B6) 병용", "RIF — 즉시 중단", "EMB — 시력검사", "PZA — 요산강하제"], "answer": 1, "rationales": ["INH는 말초신경병증을 유발하며 pyridoxine(B6) 병용으로 예방·완화한다.", "RIF는 간독성·약물상호작용이 주 이슈다.", "EMB는 시신경염(시력·색각)이 특징이다.", "PZA는 고요산혈증·관절통이 특징이다."], "ref": "결핵 진료지침 5판", "rubric": "", "level": 2}, {"id": 70, "section": "Tuberculosis", "sectionKo": "결핵", "stem": "경구피임약을 복용하는 여성이 결핵 치료 시작 후 피임 실패가 우려된다. 관련 기전은?", "choices": ["INH의 CYP 억제", "RIF의 강력한 CYP 유도", "EMB의 신배설", "PZA의 단백결합 경쟁"], "answer": 2, "rationales": ["INH는 일부 억제 작용이나 임상적 핵심은 아니다.", "RIF는 강력한 CYP3A 유도제로 경구피임약·warfarin·azole 등의 대사를 촉진해 효과를 감소시킨다.", "EMB는 상호작용의 주 원인이 아니다.", "PZA는 해당 기전이 아니다."], "ref": "결핵 진료지침 5판; Harrison", "rubric": "", "level": 2}, {"id": 71, "section": "Surgical Prophylaxis", "sectionKo": "수술 예방", "stem": "대부분의 수술에서 cefazolin 예방적 항생제의 투여 시점으로 옳은 것은?", "choices": ["절개 60분 이내", "절개 4시간 전", "수술 종료 후", "마취 유도 24시간 전"], "answer": 1, "rationales": ["절개 60분 이내(vancomycin·fluoroquinolone은 120분 이내)에 투여한다.", "4시간 전은 너무 이르다.", "종료 후 투여는 예방 목적에 부적절하다.", "24시간 전은 부적절하다."], "ref": "ASHP Antimicrobial Prophylaxis in Surgery", "rubric": "", "level": 1}, {"id": 72, "section": "Surgical Prophylaxis", "sectionKo": "수술 예방", "stem": "수술 예방적 항생제의 권장 종료 시점은?", "choices": ["수술 후 24시간 이내", "배액관 제거 시까지", "수술 후 5일", "발열 소실까지"], "answer": 1, "rationales": ["수술 후 24시간 이내에 종료하며 불필요한 연장을 지양한다.", "배액관 유지가 항생제 연장 사유가 되지 않는다.", "5일 연장은 부적절하다.", "발열 소실까지 지속은 부적절하다."], "ref": "ASHP; HIRA 수술 예방적 항생제 적정성 평가", "rubric": "", "level": 1}, {"id": 73, "section": "Surgical Prophylaxis", "sectionKo": "수술 예방", "stem": "cefazolin 예방 하에 수술이 4시간 이상 지속되고 출혈이 많다. 옳은 조치는?", "choices": ["수술 중 재투여(반감기 2배 경과 시)", "재투여 불필요", "vancomycin으로 변경", "종료 후 경구 전환"], "answer": 1, "rationales": ["반감기 2배(cefazolin 약 4시간) 경과 또는 대량 출혈 시 수술 중 재투여한다.", "재투여가 필요한 상황이다.", "약제 변경 이유가 없다.", "경구 전환은 부적절하다."], "ref": "ASHP Antimicrobial Prophylaxis in Surgery", "rubric": "", "level": 2}, {"id": 74, "section": "Travel & Imported Infections", "sectionKo": "여행자·해외유입감염", "stem": "가을에 밭일을 한 뒤 발열·발진과 함께 가피(eschar)가 관찰된다. 치료는?", "choices": ["Doxycycline", "Vancomycin", "Fluconazole", "Oseltamivir"], "answer": 1, "rationales": ["eschar를 동반한 쯔쯔가무시(O. tsutsugamushi)는 doxycycline이 1차(임신부 azithromycin/clarithromycin)이다.", "그람양성 커버는 부적절하다.", "항진균제는 부적절하다.", "항바이러스제는 부적절하다."], "ref": "진드기매개감염병 관리지침; Harrison", "rubric": "", "level": 2}, {"id": 75, "section": "Travel & Imported Infections", "sectionKo": "여행자·해외유입감염", "stem": "장마철 논일 후 발열·근육통·객혈·결막충혈과 저혈압을 보이는 중증 렙토스피라증. 치료는?", "choices": ["Penicillin(또는 ceftriaxone) 정주", "Acyclovir", "TMP-SMX", "Metronidazole"], "answer": 1, "rationales": ["중증 렙토스피라증은 정주 penicillin/ceftriaxone/cefotaxime로 치료한다(경증은 doxycycline).", "항바이러스제는 부적절하다.", "해당 균 커버가 아니다.", "혐기균 표적으로 부적절하다."], "ref": "Harrison; 렙토스피라증 관리지침", "rubric": "", "level": 2}, {"id": 76, "section": "Travel & Imported Infections", "sectionKo": "여행자·해외유입감염", "stem": "국내에서 감염된 삼일열 말라리아(P. vivax) 환자에서 재발 방지(근치)를 위해 필요한 것은?", "choices": ["클로로퀸 단독", "클로로퀸 + 프리마퀸(G6PD 확인 후)", "Artesunate 정주", "Doxycycline"], "answer": 2, "rationales": ["클로로퀸은 혈중형만 제거해 재발을 막지 못한다.", "간 휴면체 근치를 위해 프리마퀸을 추가하며 투여 전 G6PD 검사가 필수다.", "artesunate는 중증 말라리아용이다.", "보조·예방적 역할이다."], "ref": "말라리아 진료가이드(질병관리청)", "rubric": "", "level": 2}, {"id": 77, "section": "Travel & Imported Infections", "sectionKo": "여행자·해외유입감염", "stem": "동남아 여행 후 발열·근육통과 혈소판감소로 뎅기열이 진단되었다. 치료로 옳은 것은?", "choices": ["대증치료(수분보충), 아스피린 회피", "Ceftriaxone", "Oseltamivir", "즉시 예방적 혈소판 수혈"], "answer": 1, "rationales": ["뎅기열은 대증치료가 원칙이며 출혈 위험으로 아스피린을 회피한다.", "세균 표적 항생제는 부적절하다.", "항인플루엔자제는 부적절하다.", "예방적 혈소판 수혈은 일상 권고가 아니다."], "ref": "Harrison; 질병관리청", "rubric": "", "level": 1}, {"id": 78, "section": "COVID-19", "sectionKo": "코로나19", "stem": "기저질환이 있는 65세 환자가 증상 3일째 경증 코로나19(SpO2 96%)로 내원했다. 외래 1차 항바이러스는?", "choices": ["Nirmatrelvir/ritonavir", "Molnupiravir", "경험적 항생제", "회복기 혈장"], "answer": 1, "rationales": ["고위험 경증~중등증(발병 5일 이내)의 1차는 nirmatrelvir/ritonavir이다(IDSA 2025 강한 권고).", "molnupiravir는 다른 선택지가 없을 때만 고려한다.", "세균 동반이 아니면 항생제는 비권고다.", "회복기 혈장은 일상 권고가 아니다."], "ref": "IDSA 2025 COVID-19 antiviral update", "rubric": "", "level": 1}, {"id": 79, "section": "COVID-19", "sectionKo": "코로나19", "stem": "고위험 외래 코로나 환자가 CYP3A로 대사되는 약을 다수 복용해 nirmatrelvir/ritonavir가 부적합하다. 대안은?", "choices": ["Remdesivir", "치료하지 않음", "Dexamethasone", "Tocilizumab"], "answer": 1, "rationales": ["팍스로비드가 상호작용으로 부적합하면 remdesivir를 사용한다.", "고위험이므로 치료가 필요하다.", "dexamethasone은 입원 산소필요 시 사용한다.", "tocilizumab은 입원 중증에서 쓴다."], "ref": "IDSA 2025", "rubric": "", "level": 2}, {"id": 80, "section": "COVID-19", "sectionKo": "코로나19", "stem": "코로나19로 입원한 환자가 산소가 필요한 저산소혈증을 보인다. 권장 치료는?", "choices": ["Dexamethasone", "Nirmatrelvir/ritonavir", "항생제 단독", "스테로이드는 금기"], "answer": 1, "rationales": ["산소가 필요한 경우 dexamethasone을 사용하며 급속 악화 시 tocilizumab/baricitinib을 추가한다.", "경구 항바이러스는 외래 경증용이다.", "항생제 단독은 부적절하다.", "산소가 필요하면 스테로이드가 권고된다."], "ref": "IDSA/NIH COVID-19", "rubric": "", "level": 2}, {"id": 81, "section": "Antimicrobial Resistance", "sectionKo": "감염치료 원칙", "stem": "ESBL 생성 E. coli에 의한 균혈증(중증)의 우선 치료는?", "choices": ["Carbapenem(meropenem 등)", "Ceftriaxone", "Ciprofloxacin", "Ampicillin"], "answer": 1, "rationales": ["ESBL 중증 감염은 carbapenem이 우선이다.", "3세대 cephalosporin은 ESBL에 부적절하다.", "FQ 내성이 흔하다.", "ampicillin은 내성이다."], "ref": "IDSA 2024 AMR Gram-negative Guidance", "rubric": "", "level": 2}, {"id": 82, "section": "Antimicrobial Resistance", "sectionKo": "감염치료 원칙", "stem": "Enterobacter cloacae 균혈증에서 유도성 AmpC를 고려한 약제 선택은?", "choices": ["Cefepime", "Ceftriaxone", "Ceftazidime", "Ampicillin/sulbactam"], "answer": 1, "rationales": ["AmpC 과생성 위험균(Enterobacter·K. aerogenes·C. freundii)은 cefepime을 선호한다.", "3세대 cephalosporin은 유도내성 위험이 있다.", "ceftazidime도 3세대로 부적절하다.", "부적절하다."], "ref": "IDSA 2024 AMR", "rubric": "", "level": 3}, {"id": 83, "section": "Antimicrobial Resistance", "sectionKo": "감염치료 원칙", "stem": "NDM(금속-β-lactamase, MBL) 생성 CRE의 적절한 치료 조합은?", "choices": ["Ceftazidime-avibactam + aztreonam", "Meropenem-vaborbactam", "Ceftazidime-avibactam 단독", "Ertapenem"], "answer": 1, "rationales": ["MBL에는 avibactam·vaborbactam이 무효이므로 ceftazidime-avibactam + aztreonam(또는 cefiderocol)을 쓴다.", "KPC용으로 MBL에는 무효다.", "단독으로는 MBL을 커버하지 못한다.", "carbapenem 내성이다."], "ref": "IDSA 2024 AMR; CRE 항생제 사용지침(질병관리청)", "rubric": "", "level": 3}, {"id": 84, "section": "Biostatistics & Literature", "sectionKo": "의학통계·논문비평", "stem": "질병이 있는 100명 중 90명이 검사 양성이었다. 이 검사의 민감도는?", "choices": ["90%", "10%", "알 수 없음", "45%"], "answer": 1, "rationales": ["민감도 = TP/(TP+FN) = 90/100 = 90%.", "10%는 위음성률이다.", "계산 가능하다.", "오답이다."], "ref": "표준 의학통계·EBM", "rubric": "", "level": 1}, {"id": 85, "section": "Biostatistics & Literature", "sectionKo": "의학통계·논문비평", "stem": "치료군 사건율 10%, 대조군 사건율 20%일 때 NNT는?", "choices": ["10", "5", "20", "2"], "answer": 1, "rationales": ["ARR = 20−10 = 10%(0.1), NNT = 1/ARR = 10.", "계산 오류다.", "계산 오류다.", "계산 오류다."], "ref": "표준 의학통계·EBM", "rubric": "", "level": 2}, {"id": 86, "section": "Biostatistics & Literature", "sectionKo": "의학통계·논문비평", "stem": "상대위험도(RR) 0.85, 95% 신뢰구간 0.70–1.05로 보고되었다. 옳은 해석은?", "choices": ["통계적으로 유의하지 않다(CI가 1 포함)", "유의하게 위험 감소", "유의하게 위험 증가", "표본 크기가 크다"], "answer": 1, "rationales": ["비(RR)의 95% CI가 1을 포함하므로 통계적으로 유의하지 않다.", "유의하다고 볼 수 없다.", "유의하다고 볼 수 없다.", "CI만으로 표본 크기를 직접 판단할 수 없다."], "ref": "표준 의학통계·EBM", "rubric": "", "level": 2}, {"id": 87, "section": "Fungal Infections", "sectionKo": "진균감염", "stem": "면역저하자가 두통·발열을 보이고 CSF India ink 양성으로 크립토코쿠스 수막염이 진단되었다. 유도 치료는?", "choices": ["Liposomal amphotericin B + flucytosine", "Fluconazole 단독", "Echinocandin", "Voriconazole"], "answer": 1, "rationales": ["유도치료는 liposomal amphotericin B + flucytosine이며 이후 fluconazole로 공고·유지한다.", "fluconazole은 공고·유지 단계 약제다.", "echinocandin은 Cryptococcus에 무효다.", "voriconazole은 1차가 아니다."], "ref": "IDSA Cryptococcosis; 전공의 슬라이드", "rubric": "", "level": 2}, {"id": 88, "section": "Fungal Infections", "sectionKo": "진균감염", "stem": "호중구감소 환자의 침습성 폐 아스페르길루스증의 1차 치료는?", "choices": ["Voriconazole", "Fluconazole", "Caspofungin", "Amphotericin B deoxycholate"], "answer": 1, "rationales": ["침습성 아스페르길루스증의 1차는 voriconazole이다(예방은 posaconazole).", "fluconazole은 Aspergillus에 무효다.", "echinocandin은 보조·구제 목적이다.", "지질제형이 선호되며 deoxycholate는 1차가 아니다."], "ref": "IDSA Aspergillosis; 전공의 슬라이드", "rubric": "", "level": 2}, {"id": 89, "section": "Influenza", "sectionKo": "인플루엔자", "stem": "65세 만성폐질환자가 인플루엔자 의심 증상 발병 1일째 내원했다. 옳은 조치는?", "choices": ["신속검사 결과와 무관하게 oseltamivir 조기 투여", "항생제 우선 투여", "해열제만 처방", "5일 경과 관찰"], "answer": 1, "rationales": ["고위험군은 가능한 한 빨리(48시간 이내) 항바이러스제를 조기 투여한다.", "세균 합병증이 없으면 항생제는 부적절하다.", "해열제만으로는 부족하다.", "지연 관찰은 부적절하다."], "ref": "질병관리청 인플루엔자 관리지침", "rubric": "", "level": 1}, {"id": 90, "section": "Influenza", "sectionKo": "인플루엔자", "stem": "단회 경구로 인플루엔자를 치료하는 baloxavir의 작용기전은?", "choices": ["Cap-의존 엔도뉴클레아제 억제", "Neuraminidase 억제", "M2 이온통로 억제", "RNA 중합효소 사슬 종결"], "answer": 1, "rationales": ["baloxavir는 cap-의존 엔도뉴클레아제를 억제한다(단회 경구).", "NA 억제는 oseltamivir·zanamivir·peramivir다.", "M2 억제는 amantadine이다.", "해당 기전이 아니다."], "ref": "대한감염학회/질병관리청", "rubric": "", "level": 1}, {"id": 91, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "CAP 환자의 CURB-65 점수가 2점이다. 처치 방향으로 옳은 것은?", "choices": ["입원을 고려한다", "무조건 외래", "즉시 ICU", "항생제 불필요"], "answer": 1, "rationales": ["CURB-65 2점은 입원 고려 구간이다.", "0–1점이 외래 구간이다.", "≥3점에서 ICU를 고려한다.", "세균성 폐렴은 항생제가 필요하다."], "ref": "성인 CAP 지침 2018", "rubric": "", "level": 2}, {"id": 92, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "최근 90일 이내 정주 항생제 사용력이 있는 사망 고위험 HAP의 경험적 치료는?", "choices": ["항녹농균 2제 + vancomycin/linezolid", "3세대 cephalosporin 단독", "macrolide 단독", "cefazolin"], "answer": 1, "rationales": ["MDR·사망 위험 HAP은 항녹농균 2제에 MRSA 커버를 더한다.", "단독 협범위는 부적절하다.", "비정형 커버만으로 부족하다.", "그람양성 협범위로 부적절하다."], "ref": "국내 HAP/VAP 지침 2023", "rubric": "", "level": 3}, {"id": 93, "section": "Antimicrobial Stewardship", "sectionKo": "항생제 스튜어드십 (ASP)", "stem": "소아나 신기능 저하 환자가 많은 병원에서 항생제 사용량 지표로 DDD보다 DOT가 선호되는 이유는?", "choices": ["DOT는 용량과 무관해 소아·신기능저하에 덜 왜곡된다", "DDD가 항상 더 정확하다", "DOT는 계산이 불가능하다", "둘은 동일하다"], "answer": 1, "rationales": ["DOT는 투여일수 기반으로 용량 보정 불필요해 소아·신기능저하에 유리하다.", "DDD는 성인 상용량 기준이라 이들 군에서 왜곡된다.", "DOT는 산출 가능하다.", "정의가 다르다."], "ref": "ASP 통합 운영 가이드라인", "rubric": "", "level": 3}, {"id": 94, "section": "Antimicrobial Stewardship", "sectionKo": "항생제 스튜어드십 (ASP)", "stem": "정맥에서 경구로 전환(IV→PO)하기 좋은 고생체이용률 약제가 아닌 것은?", "choices": ["Vancomycin(경구)", "Levofloxacin", "Metronidazole", "Fluconazole"], "answer": 1, "rationales": ["경구 vancomycin은 전신 흡수가 거의 없어 전신감염 IV→PO 전환에 부적절하다.", "levofloxacin은 생체이용률이 높다.", "metronidazole은 높다.", "fluconazole은 높다."], "ref": "ASP 통합 운영 가이드라인", "rubric": "", "level": 2}, {"id": 95, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "CD4 180/uL인 HIV 환자의 폐포자충 폐렴(PJP) 일차예방 약제는?", "choices": ["TMP-SMX", "Azithromycin", "Fluconazole", "Valganciclovir"], "answer": 1, "rationales": ["CD4 <200 또는 분획 <14%에서 TMP-SMX로 PJP를 예방한다.", "MAC 예방 계열이다.", "진균 예방 약이다.", "CMV 약이다."], "ref": "국내 HIV 진료지침", "rubric": "", "level": 1}, {"id": 96, "section": "Reproductive/STD", "sectionKo": "생식기 감염·STD", "stem": "골반염(PID) 외래 치료의 대표 조합은?", "choices": ["Ceftriaxone + doxycycline (± metronidazole)", "Vancomycin 단독", "Fluconazole", "Acyclovir"], "answer": 1, "rationales": ["PID는 다균성이라 ceftriaxone+doxycycline(±metronidazole) 병합이 표준이다.", "그람양성 단독은 부적절하다.", "항진균제는 부적절하다.", "항바이러스제는 부적절하다."], "ref": "성매개감염 진료지침 2023", "rubric": "", "level": 2}, {"id": 97, "section": "Immunization", "sectionKo": "예방접종", "stem": "항암화학요법 중인(높은 수준 면역저하) 환자에게 금기인 백신은?", "choices": ["MMR(약독화 생백신)", "불활성화 인플루엔자", "Tdap", "PPSV23"], "answer": 1, "rationales": ["높은 수준 면역저하에서 약독화 생백신(MMR 등)은 금기다.", "불활성화 백신은 접종 가능하다.", "불활성화·톡소이드로 가능하다.", "다당 백신으로 가능하다."], "ref": "질병관리청 예방접종 지침", "rubric": "", "level": 2}, {"id": 98, "section": "CNS Infections", "sectionKo": "중추신경계감염", "stem": "58세 알코올중독 남성의 세균성 수막염 경험적 치료에 반드시 추가해야 하는 것은?", "choices": ["Ampicillin(Listeria 커버)", "Metronidazole", "Fluconazole", "Acyclovir 단독"], "answer": 1, "rationales": ["≥50세·알코올중독·면역저하는 Listeria 위험으로 표준 조합에 ampicillin을 추가한다.", "혐기 커버는 표준이 아니다.", "진균 커버 불필요하다.", "바이러스 단독은 부적절하다."], "ref": "성인 세균성 수막염 지침(국내)", "rubric": "", "level": 2}, {"id": 99, "section": "Urinary Tract Infections", "sectionKo": "요로감염", "stem": "무증상 세균뇨에서 치료가 권고되는 대상은?", "choices": ["임신부", "고령 요양원 거주자", "무증상 당뇨환자", "유치도뇨 보유자"], "answer": 1, "rationales": ["무증상 세균뇨는 임신부와 비뇨기 침습 시술 전에만 치료한다.", "고령 무증상은 치료하지 않는다.", "무증상 당뇨는 치료하지 않는다.", "무증상 유치도뇨는 치료하지 않는다."], "ref": "요로감염 항생제 사용지침(국내)", "rubric": "", "level": 1}, {"id": 100, "section": "Skin & Soft Tissue", "sectionKo": "피부·연조직감염", "stem": "MRSA 위험이 낮은 경증 화농성 피부농양의 1차 처치는?", "choices": ["절개 배농(I&D)", "경구 vancomycin", "정주 daptomycin", "광범위 경구 항생제"], "answer": 1, "rationales": ["경증 화농성 농양은 I&D만으로 충분하다(경증은 전신 항생제 불필요).", "경구 vancomycin은 흡수되지 않는다.", "정주 약제는 과하다.", "광범위 항생제는 불필요하다."], "ref": "IDSA 2014 SSTI", "rubric": "", "level": 1}, {"id": 101, "section": "Intra-abdominal", "sectionKo": "복강내감염", "stem": "복수 다형핵백혈구(PMN)가 300/mm³로 확인된 자발성 세균성 복막염(SBP)의 1차 치료는?", "choices": ["Cefotaxime", "경구 vancomycin", "Nitrofurantoin", "Acyclovir"], "answer": 1, "rationales": ["복수 PMN ≥250이면 SBP로 3세대 cephalosporin(cefotaxime)으로 치료한다.", "경구 vancomycin은 CDI용이다.", "요로감염 약이다.", "항바이러스제는 부적절하다."], "ref": "성인 복강 내 감염 지침 2022", "rubric": "", "level": 2}, {"id": 102, "section": "Endocarditis", "sectionKo": "감염심내막염", "stem": "S. aureus 균혈증 환자에서 심내막염 평가를 위해 선호되는 검사는?", "choices": ["경식도 심초음파(TEE)", "단순 흉부 X-ray", "전신 뼈 스캔", "복부 CT"], "answer": 1, "rationales": ["S. aureus 균혈증은 심내막염 위험이 높아 심초음파(민감도 낮으면 TEE) 평가가 권장된다.", "흉부 X-ray로 IE를 진단할 수 없다.", "뼈 스캔은 관련 없다.", "복부 CT는 관련 없다."], "ref": "AHA/IDSA 감염심내막염", "rubric": "", "level": 2}, {"id": 103, "section": "Fungal", "sectionKo": "진균감염", "stem": "칸디다혈증에서 fluconazole 내성이 특징적인 균종은?", "choices": ["Candida krusei", "Candida albicans", "Candida parapsilosis", "Candida dubliniensis"], "answer": 1, "rationales": ["C. krusei는 fluconazole에 본질적 내성으로 echinocandin을 쓴다.", "C. albicans는 대개 감수성이다.", "C. parapsilosis는 fluconazole 감수성이나 echinocandin MIC가 높다.", "대개 감수성이다."], "ref": "IDSA 2016 Candidiasis", "rubric": "", "level": 3}, {"id": 104, "section": "Tuberculosis", "sectionKo": "결핵", "stem": "결핵 치료 중 시력 저하·색각 이상을 유발할 수 있어 모니터링이 필요한 약제는?", "choices": ["Ethambutol", "Isoniazid", "Rifampin", "Pyrazinamide"], "answer": 1, "rationales": ["EMB는 시신경염(시력·색각)을 유발해 모니터링이 필요하다.", "INH는 말초신경병증·간독성이다.", "RIF는 간독성·상호작용이다.", "PZA는 간독성·고요산혈증이다."], "ref": "결핵 진료지침 5판", "rubric": "", "level": 2}, {"id": 105, "section": "Travel/Imported", "sectionKo": "여행자·해외유입감염", "stem": "참진드기에 물린 뒤 고열·백혈구/혈소판 감소·ferritin 상승을 보이는 SFTS 환자의 관리로 옳은 것은?", "choices": ["대증치료 + (중증 시)비말주의", "Doxycycline 근치", "즉시 항바이러스 완치", "경구 항진균제"], "answer": 1, "rationales": ["SFTS는 대증치료가 원칙이며 중증 환자 관리 시 접촉·비말주의를 준수한다.", "특이 항생제로 근치되지 않는다.", "확립된 항바이러스 완치제가 없다.", "항진균제는 무관하다."], "ref": "진드기매개감염병 관리지침", "rubric": "", "level": 3}, {"id": 106, "section": "Biostatistics", "sectionKo": "의학통계·논문비평", "stem": "특이도가 매우 높은 검사에서 결과가 양성일 때의 임상적 의미는?", "choices": ["양성이면 확진에 유용(SpPin)", "음성이면 배제에 유용", "민감도가 높다는 의미", "유병률과 무관하게 PPV 100%"], "answer": 1, "rationales": ["특이도가 높으면 양성일 때 확진에 유용하다(SpPin).", "그것은 민감도(SnNout)의 성질이다.", "특이도와 민감도는 별개다.", "PPV는 유병률에 의존한다."], "ref": "표준 EBM", "rubric": "", "level": 2}, {"id": 107, "section": "AMR", "sectionKo": "감염치료 원칙", "stem": "항녹농균제 대부분에 내성인 DTR(difficult-to-treat) Pseudomonas aeruginosa의 우선 선택은?", "choices": ["Ceftolozane-tazobactam", "Ceftriaxone", "Ampicillin/sulbactam", "Ertapenem"], "answer": 1, "rationales": ["DTR-P. aeruginosa는 ceftolozane-tazobactam 등 신규 약제를 우선한다.", "3세대 cephalosporin으론 부족하다.", "녹농균 커버가 안 된다.", "ertapenem은 녹농균에 무효다."], "ref": "IDSA 2024 AMR", "rubric": "", "level": 3}, {"id": 108, "section": "COVID-19", "sectionKo": "코로나19", "stem": "코로나19 외래 고위험 환자에서 molnupiravir를 고려하는 상황은?", "choices": ["팍스로비드·remdesivir 모두 부적합할 때", "1차 선택으로 항상", "입원 중증에서", "산소 필요 시"], "answer": 1, "rationales": ["molnupiravir는 다른 선택지가 없을 때만 고려한다(효과 제한적, 임신 금기).", "1차는 nirmatrelvir/ritonavir다.", "입원 중증용이 아니다.", "산소 필요 시는 dexamethasone이다."], "ref": "IDSA 2025 COVID-19", "rubric": "", "level": 2}, {"id": 109, "section": "Influenza", "sectionKo": "인플루엔자", "stem": "중증 인플루엔자 환자에서 oseltamivir 용법으로 권고되는 것은?", "choices": ["고용량 150 mg 하루 2회", "표준의 절반", "흡입 전환", "즉시 중단"], "answer": 1, "rationales": ["중증 인플루엔자에서는 고용량 oseltamivir(150 mg BID)가 권고되며 중증 지속 시 연장할 수 있다.", "감량은 부적절하다.", "흡입 전환 근거가 부족하다.", "중단은 부적절하다."], "ref": "대한감염학회 중증 인플루엔자 지침", "rubric": "", "level": 3}, {"id": 110, "section": "Upper Respiratory Tract Infections", "sectionKo": "상기도 감염", "stem": "성인 급성 인두염 환자 대부분의 원인과 처치로 옳은 것은?", "choices": ["대부분 바이러스 → 항생제 불필요", "대부분 세균 → 즉시 항생제", "모두 진균 → 항진균제", "모두 결핵 → 항결핵제"], "answer": 1, "rationales": ["급성 인두염은 대부분 바이러스로 항생제가 필요 없다(Centor ≥3에서 신속항원검사 후 결정).", "세균성은 일부(S. pyogenes)다.", "진균은 원인이 아니다.", "결핵은 원인이 아니다."], "ref": "성인 급성 상기도감염 항생제 사용지침", "rubric": "", "level": 1}, {"id": 111, "section": "Biostatistics", "sectionKo": "의학통계·논문비평", "stem": "질병이 없는 100명 중 95명이 검사 음성이었다. 이 검사의 특이도는?", "choices": ["95%", "5%", "알 수 없음", "50%"], "answer": 1, "rationales": ["특이도 = TN/(TN+FP) = 95/100 = 95%.", "5%는 위양성률이다.", "계산 가능하다.", "오답이다."], "ref": "표준 의학통계·EBM", "rubric": "", "level": 1}, {"id": 112, "section": "Biostatistics", "sectionKo": "의학통계·논문비평", "stem": "유병률이 매우 낮은 집단에서 같은 검사를 적용할 때 나타나는 변화는?", "choices": ["양성예측도(PPV)가 낮아진다", "민감도가 낮아진다", "특이도가 낮아진다", "NPV가 낮아진다"], "answer": 1, "rationales": ["PPV는 유병률에 의존해 유병률이 낮으면 위양성 비중이 커져 PPV가 낮아진다.", "민감도는 유병률과 무관하다.", "특이도는 유병률과 무관하다.", "유병률이 낮으면 NPV는 오히려 높다."], "ref": "표준 의학통계·EBM", "rubric": "", "level": 2}, {"id": 113, "section": "Biostatistics", "sectionKo": "의학통계·논문비평", "stem": "양성우도비(LR+)의 정의로 옳은 것은?", "choices": ["민감도 / (1−특이도)", "(1−민감도) / 특이도", "특이도 / 민감도", "1 / NNT"], "answer": 1, "rationales": ["LR+ = 민감도/(1−특이도)로, 클수록 양성 시 확진에 유용하다.", "그것은 LR−이다.", "정의가 아니다.", "NNT와 무관하다."], "ref": "표준 의학통계·EBM", "rubric": "", "level": 2}, {"id": 114, "section": "Biostatistics", "sectionKo": "의학통계·논문비평", "stem": "환자-대조군(case-control) 연구에서 연관성 지표로 주로 사용하는 것은?", "choices": ["교차비(odds ratio)", "상대위험도(relative risk)", "발생률", "NNT"], "answer": 1, "rationales": ["후향적 환자-대조군에서는 발생률을 직접 못 구해 교차비(OR)를 사용한다.", "RR은 코호트·RCT에서 산출한다.", "환자-대조군에선 발생률 직접 산출이 어렵다.", "치료효과 지표다."], "ref": "표준 의학통계·EBM", "rubric": "", "level": 2}, {"id": 115, "section": "Biostatistics", "sectionKo": "의학통계·논문비평", "stem": "무작위 배정 임상시험에서 ITT(intention-to-treat) 분석의 특징은?", "choices": ["배정된 군 그대로 분석해 무작위배정 이점을 보존한다", "순응자만 분석한다", "탈락자를 모두 제외한다", "효과를 과대평가한다"], "answer": 1, "rationales": ["ITT는 배정된 군 그대로 분석해 무작위배정의 이점을 보존하며 효과를 보수적으로 추정한다.", "그것은 per-protocol 분석이다.", "탈락자 제외는 ITT가 아니다.", "보수적(과소) 추정 경향이다."], "ref": "표준 의학통계·EBM", "rubric": "", "level": 2}, {"id": 116, "section": "Biostatistics", "sectionKo": "의학통계·논문비평", "stem": "근거 위계(evidence hierarchy)에서 일반적으로 가장 상위에 위치하는 연구설계는?", "choices": ["체계적 문헌고찰·메타분석", "환자-대조군연구", "단면연구", "증례보고"], "answer": 1, "rationales": ["잘 수행된 체계적 문헌고찰·메타분석이 위계 상위다.", "그 아래 수준이다.", "더 낮은 수준이다.", "가장 낮은 수준이다."], "ref": "표준 의학통계·EBM", "rubric": "", "level": 1}, {"id": 117, "section": "Biostatistics", "sectionKo": "의학통계·논문비평", "stem": "제1종 오류(type I error)에 해당하는 것은?", "choices": ["귀무가설이 참인데 기각(위양성)", "귀무가설이 거짓인데 채택(위음성)", "검정력", "표본 크기"], "answer": 1, "rationales": ["제1종 오류(α)는 참인 귀무가설을 잘못 기각하는 위양성이다.", "그것은 제2종 오류(β)다.", "검정력=1−β다.", "표본 크기는 오류 종류가 아니다."], "ref": "표준 의학통계·EBM", "rubric": "", "level": 2}, {"id": 118, "section": "AMR", "sectionKo": "감염치료 원칙", "stem": "KPC 생성 carbapenem 내성 장내세균(CRE) 중증 감염의 우선 선택은?", "choices": ["Ceftazidime-avibactam", "Ceftriaxone", "Ciprofloxacin", "Ampicillin/sulbactam"], "answer": 1, "rationales": ["KPC형 CRE는 ceftazidime-avibactam(또는 meropenem-vaborbactam·imipenem-relebactam)을 쓴다.", "3세대 cephalosporin은 무효다.", "FQ 내성이 흔하다.", "커버되지 않는다."], "ref": "IDSA 2024 AMR Gram-negative Guidance", "rubric": "", "level": 2}, {"id": 119, "section": "AMR", "sectionKo": "감염치료 원칙", "stem": "ESBL 생성 E. coli에 의한 단순 방광염(경증)에서 carbapenem을 아끼기 위한 선택은?", "choices": ["Nitrofurantoin(또는 fosfomycin·TMP-SMX)", "Meropenem", "Ceftazidime-avibactam", "Cefiderocol"], "answer": 1, "rationales": ["ESBL 단순 방광염은 nitrofurantoin·fosfomycin·TMP-SMX 등 좁은 약제를 우선해 carbapenem·신약을 비축한다.", "중증이 아니면 carbapenem은 과하다.", "신약은 비축 대상이다.", "신약은 비축 대상이다."], "ref": "IDSA 2024 AMR Gram-negative Guidance", "rubric": "", "level": 2}, {"id": 120, "section": "AMR", "sectionKo": "감염치료 원칙", "stem": "Stenotrophomonas maltophilia 감염의 1차 치료제는?", "choices": ["TMP-SMX", "Meropenem", "Piperacillin/tazobactam", "Amikacin"], "answer": 1, "rationales": ["S. maltophilia는 carbapenem에 본질적 내성이며 TMP-SMX가 1차다.", "carbapenem은 유발·무효다.", "대개 무효다.", "단독으로 부적절하다."], "ref": "IDSA 2024 AMR Gram-negative Guidance", "rubric": "", "level": 3}, {"id": 121, "section": "AMR", "sectionKo": "감염치료 원칙", "stem": "Carbapenem 내성 Acinetobacter baumannii(CRAB) 치료의 근간이 되는 약제는?", "choices": ["고용량 ampicillin-sulbactam 기반 병용", "Ceftriaxone", "Fluconazole", "Nitrofurantoin"], "answer": 1, "rationales": ["CRAB는 고용량 ampicillin-sulbactam 기반 병용(±cefiderocol·minocycline·polymyxin)을 쓴다.", "3세대 cephalosporin은 무효다.", "항진균제는 무관하다.", "요로 국한 약제다."], "ref": "IDSA 2024 AMR Gram-negative Guidance", "rubric": "", "level": 3}, {"id": 122, "section": "AMR", "sectionKo": "감염치료 원칙", "stem": "Vancomycin 내성 장구균(VRE) 균혈증의 치료 선택은?", "choices": ["Linezolid 또는 daptomycin", "Vancomycin 증량", "Ceftriaxone", "Ampicillin(감수성 무관)"], "answer": 1, "rationales": ["VRE 균혈증은 linezolid 또는 daptomycin을 사용한다.", "vancomycin은 내성이다.", "커버되지 않는다.", "ampicillin 내성이 흔하다."], "ref": "IDSA 2024 AMR Gram-negative Guidance", "rubric": "", "level": 2}, {"id": 123, "section": "AMR", "sectionKo": "감염치료 원칙", "stem": "OXA-48형 carbapenemase 생성 CRE에 유효한 약제는?", "choices": ["Ceftazidime-avibactam", "Meropenem-vaborbactam", "Ceftriaxone", "Ertapenem"], "answer": 1, "rationales": ["OXA-48에는 ceftazidime-avibactam이 유효하다.", "vaborbactam은 OXA-48 커버가 약하다.", "3세대는 무효다.", "carbapenem 내성이다."], "ref": "IDSA 2024 AMR Gram-negative Guidance", "rubric": "", "level": 2}, {"id": 124, "section": "AMR", "sectionKo": "감염치료 원칙", "stem": "철 운반체(siderophore)를 이용해 세포 내로 들어가며 금속-β-lactamase(MBL) 포함 광범위 내성균을 커버하는 약제는?", "choices": ["Cefiderocol", "Ceftriaxone", "Cefazolin", "Ampicillin"], "answer": 1, "rationales": ["cefiderocol은 siderophore cephalosporin으로 MBL 포함 광범위 내성 그람음성균을 커버한다.", "일반 3세대다.", "1세대다.", "협범위다."], "ref": "IDSA 2024 AMR Gram-negative Guidance", "rubric": "", "level": 3}, {"id": 125, "section": "Immunization", "sectionKo": "예방접종", "stem": "PCV13과 PPSV23이 모두 적응이 되는 성인에서 접종 순서·간격은?", "choices": ["PCV13 먼저 → 최소 8주 후 PPSV23", "PPSV23 먼저 → 4주 후 PCV13", "동시 접종", "간격 제한 없음"], "answer": 1, "rationales": ["PCV13(단백결합)을 먼저 접종하고 최소 8주 후 PPSV23(다당)을 접종한다.", "순서가 반대다.", "동시접종하지 않는다.", "최소 간격이 있다."], "ref": "질병관리청 예방접종 지침", "rubric": "", "level": 1}, {"id": 126, "section": "Immunization", "sectionKo": "예방접종", "stem": "임신부 Tdap 접종 권고로 옳은 것은?", "choices": ["매 임신 시 1회, 임신 27–36주", "임신 전 1회로 충분", "수유기에만", "임신 중 금기"], "answer": 1, "rationales": ["이전 접종력과 무관하게 매 임신 시 27–36주에 Tdap 1회를 접종한다.", "매 임신 접종이 권고된다.", "임신 중 접종이 목표다.", "금기가 아니다."], "ref": "질병관리청 예방접종 지침", "rubric": "", "level": 2}, {"id": 127, "section": "Immunization", "sectionKo": "예방접종", "stem": "계란 알레르기가 있는 소아의 MMR 접종에 대한 설명으로 옳은 것은?", "choices": ["특별한 주의 없이 접종 가능", "절대 금기", "피부반응 검사 후에만", "면역글로불린 선투여 필요"], "answer": 1, "rationales": ["MMR은 계란 알레르기와 무관하게 접종 가능하다.", "금기가 아니다.", "불필요하다.", "불필요하다."], "ref": "질병관리청 예방접종 지침", "rubric": "", "level": 2}, {"id": 128, "section": "Immunization", "sectionKo": "예방접종", "stem": "비장절제(무비증) 환자에게 특히 권장되는 백신 조합은?", "choices": ["폐구균·수막구균·Hib", "BCG·황열·로타", "MMR·수두", "HPV 단독"], "answer": 1, "rationales": ["무비증은 협막 세균 위험으로 폐구균·수막구균·Hib 백신을 권장한다.", "생백신 위주로 부적절하다.", "무비증 특이 권장이 아니다.", "해당 목적이 아니다."], "ref": "질병관리청 예방접종 지침", "rubric": "", "level": 3}, {"id": 129, "section": "Immunization", "sectionKo": "예방접종", "stem": "HBsAg 양성 산모의 신생아 또는 HBV 노출 후 예방으로 옳은 것은?", "choices": ["B형간염 면역글로불린(HBIG) + 백신", "백신만", "HBIG만", "항바이러스제 단독"], "answer": 1, "rationales": ["HBV 노출·수직감염 예방은 HBIG와 백신을 함께 투여한다.", "수동면역이 함께 필요하다.", "능동면역이 함께 필요하다.", "노출 후 예방 표준이 아니다."], "ref": "질병관리청 예방접종 지침", "rubric": "", "level": 2}, {"id": 130, "section": "Immunization", "sectionKo": "예방접종", "stem": "광견병(공수병) 노출 후 예방접종(미접종자)으로 옳은 것은?", "choices": ["백신 + 광견병 면역글로불린", "백신만", "면역글로불린만", "관찰 후 결정"], "answer": 1, "rationales": ["미접종 노출자는 백신과 광견병 면역글로불린을 함께 투여한다.", "수동면역이 함께 필요하다.", "능동면역이 함께 필요하다.", "즉시 예방을 시작한다."], "ref": "질병관리청 예방접종 지침", "rubric": "", "level": 2}, {"id": 131, "section": "Immunization", "sectionKo": "예방접종", "stem": "면역억제 치료를 앞둔 환자에서 약독화 생백신 접종 시점은?", "choices": ["면역억제 시작 최소 4주 전", "치료 중 아무 때나", "치료 시작 당일", "제한 없음"], "answer": 1, "rationales": ["약독화 생백신은 면역억제 시작 최소 4주 전(불활성화는 2주 전)에 접종한다.", "치료 중 생백신은 금기다.", "당일은 부적절하다.", "시점 제한이 있다."], "ref": "질병관리청 예방접종 지침", "rubric": "", "level": 1}, {"id": 132, "section": "CNS Infections", "sectionKo": "중추신경계감염", "stem": "성인 폐렴구균 수막염이 의심될 때 dexamethasone 투여 시점으로 옳은 것은?", "choices": ["첫 항생제 직전 또는 동시", "항생제 3일 후", "증상 소실 후", "투여하지 않음"], "answer": 1, "rationales": ["폐렴구균 수막염은 dexamethasone을 첫 항생제 직전/동시에 시작하며 이미 항생제가 시작됐으면 뒤늦게 시작하지 않는다.", "뒤늦은 시작은 효과가 없다.", "시점이 늦다.", "성인 폐렴구균 수막염에서 권고된다."], "ref": "성인 세균성 수막염 지침(국내)·IDSA", "rubric": "", "level": 2}, {"id": 133, "section": "CNS Infections", "sectionKo": "중추신경계감염", "stem": "신경외과 수술·션트와 관련된 세균성 수막염의 경험적 치료 조합은?", "choices": ["Vancomycin + ceftazidime(또는 cefepime)", "Ampicillin 단독", "Ceftriaxone 단독", "Fluconazole"], "answer": 1, "rationales": ["신경외과 관련 수막염은 그람음성·녹농균·포도알균 커버로 vancomycin + 항녹농균 cephalosporin을 쓴다.", "Listeria 표적 단독은 부적절하다.", "녹농균 커버가 약하다.", "진균 커버는 부적절하다."], "ref": "성인 세균성 수막염 지침(국내)·IDSA", "rubric": "", "level": 3}, {"id": 134, "section": "CNS Infections", "sectionKo": "중추신경계감염", "stem": "세균성 수막염에서 전형적인 뇌척수액(CSF) 소견은?", "choices": ["호중구 우세·단백 상승·당 감소", "림프구 우세·단백 정상·당 정상", "호산구 우세", "정상 소견"], "answer": 1, "rationales": ["세균성 수막염은 호중구 우세, 단백 상승, 당 감소(CSF/혈청 <0.4)를 보인다.", "그것은 바이러스성 양상이다.", "기생충 등에서 드물게 본다.", "정상은 아니다."], "ref": "성인 세균성 수막염 지침(국내)·IDSA", "rubric": "", "level": 1}, {"id": 135, "section": "CNS Infections", "sectionKo": "중추신경계감염", "stem": "급성 발열과 측두엽 국소증상, CSF에서 HSV DNA PCR 양성인 환자의 치료는?", "choices": ["정주 acyclovir", "Ceftriaxone", "Ganciclovir", "Fluconazole"], "answer": 1, "rationales": ["HSV 뇌염은 즉시 정주 acyclovir가 표준이다.", "세균 표적으로 부적절하다.", "HSV 1차가 아니다.", "진균 약이다."], "ref": "성인 세균성 수막염 지침(국내)·IDSA", "rubric": "", "level": 2}, {"id": 136, "section": "CNS Infections", "sectionKo": "중추신경계감염", "stem": "단일 뇌농양이 확인된 환자의 치료 원칙으로 옳은 것은?", "choices": ["배농(수술) + 항생제", "항생제만 3일", "관찰", "항진균제 단독"], "answer": 1, "rationales": ["뇌농양은 배농(흡인·절제)과 광범위 항생제를 병행한다.", "단기 항생제만으론 부족하다.", "관찰은 부적절하다.", "세균성이 흔하다."], "ref": "성인 세균성 수막염 지침(국내)·IDSA", "rubric": "", "level": 3}, {"id": 137, "section": "CNS Infections", "sectionKo": "중추신경계감염", "stem": "고열·의식저하와 함께 점상·자반성 발진을 보이는 수막염 환자의 원인·치료는?", "choices": ["N. meningitidis – ceftriaxone/cefotaxime", "S. pneumoniae – ampicillin", "Listeria – TMP-SMX", "E. coli – nitrofurantoin"], "answer": 1, "rationales": ["점상/자반 발진 동반 수막염은 수막구균을 시사하며 ceftriaxone/cefotaxime로 치료한다.", "폐렴구균은 자반이 특징적이지 않다.", "Listeria 양상이 아니다.", "요로감염 약제다."], "ref": "성인 세균성 수막염 지침(국내)·IDSA", "rubric": "", "level": 1}, {"id": 138, "section": "CNS Infections", "sectionKo": "중추신경계감염", "stem": "결핵성 수막염 치료의 특징으로 옳은 것은?", "choices": ["항결핵제 + 스테로이드 병용, 장기 치료", "단기 항생제", "항진균제 병용", "치료 불필요"], "answer": 1, "rationales": ["결핵성 수막염은 항결핵제에 스테로이드를 병용하고 치료기간을 연장한다.", "단기 치료는 부적절하다.", "진균 커버는 불필요하다.", "치료가 필요하다."], "ref": "성인 세균성 수막염 지침(국내)·IDSA", "rubric": "", "level": 2}, {"id": 139, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "동반질환이 없는 건강한 성인의 외래 지역사회획득 폐렴 경험적 치료는?", "choices": ["Amoxicillin 고용량 또는 doxycycline", "Vancomycin", "Meropenem", "경구 nitrofurantoin"], "answer": 1, "rationales": ["건강한 외래 CAP은 amoxicillin 고용량 또는 doxycycline이 적절하다.", "그람양성 협범위로 부적절하다.", "과도한 광범위다.", "요로감염 약제다."], "ref": "성인 CAP/HAP 지침·ATS/IDSA", "rubric": "", "level": 1}, {"id": 140, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "중환자실 입원이 필요한 중증 CAP의 경험적 치료는?", "choices": ["β-lactam + azithromycin(또는 호흡기 FQ) 병용", "β-lactam 단독", "macrolide 단독", "doxycycline 단독"], "answer": 1, "rationales": ["중증 CAP은 단독요법이 아닌 β-lactam + azithromycin/호흡기 FQ 병용을 권장한다.", "단독은 부적절하다.", "단독은 부적절하다.", "단독은 부적절하다."], "ref": "성인 CAP/HAP 지침·ATS/IDSA", "rubric": "", "level": 3}, {"id": 141, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "소변 Legionella 항원 검사가 특히 권고되는 상황은?", "choices": ["중등도·중증 CAP", "모든 외래 경증", "무증상자", "건강검진"], "answer": 1, "rationales": ["Legionella 소변 항원은 중등도·중증 CAP에서 권고된다.", "경증 외래에서 일상적이지 않다.", "무증상엔 불필요하다.", "선별검사가 아니다."], "ref": "성인 CAP/HAP 지침·ATS/IDSA", "rubric": "", "level": 2}, {"id": 142, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "CAP에서 정맥(IV)→경구(PO) 전환의 적절한 기준은?", "choices": ["혈역학 안정 + 경구 복용 가능 + 임상 호전", "해열 즉시 무조건", "입원 당일", "항상 14일 후"], "answer": 1, "rationales": ["임상적으로 안정되고 경구 복용이 가능하며 호전되면 IV→PO로 전환한다.", "단일 지표만으로 결정하지 않는다.", "너무 이르다.", "고정 기간이 아니다."], "ref": "성인 CAP/HAP 지침·ATS/IDSA", "rubric": "", "level": 2}, {"id": 143, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감염", "stem": "의식저하·연하곤란 환자의 흡인성 폐렴에서 고려할 경험적 커버는?", "choices": ["구강 혐기·그람음성(ampicillin/sulbactam 등)", "항진균제", "항바이러스제", "항결핵제"], "answer": 1, "rationales": ["흡인성 폐렴은 구강 혐기·그람음성 커버(ampicillin/sulbactam 등)를 고려한다(일상적 혐기 커버는 폐농양·농흉).", "진균 표적이 아니다.", "바이러스 표적이 아니다.", "결핵 표적이 아니다."], "ref": "성인 CAP/HAP 지침·ATS/IDSA", "rubric": "", "level": 2}, {"id": 144, "section": "Lower Respiratory Tract Infections", "sectionKo": "하기도 감 ": "Intra-abdominal", "sectionKo": "복강내감염", "stem": "Clostridioides difficile 감염(CDI) 초기 치료는?", "choices": ["Fidaxomicin(또는 경구 vancomycin)", "정주 vancomycin", "경구 nitrofurantoin", "Ceftriaxone"], "answer": 1, "rationales": ["초기 CDI는 fidaxomicin 선호(경구 vancomycin 가능), metronidazole은 강등.", "정주 vanco는 CDI 무효.", "무관.", "오히려 유발."], "ref": "성인 복강 내 감염 지침 2022 / SHEA-IDSA CDI", "rubric": "", "level": 1}, {"id": 191, "section": "Intra-abdominal", "sectionKo": "복강내감염", "stem": "전격성(fulminant) CDI의 치료는?", "choices": ["경구 vancomycin 500 mg QID + 정주 metronidazole", "경구 metronidazole 단독", "fidaxomicin 단독", "관찰"], "answer": 1, "rationales": ["전격성 CDI는 고용량 경구 vancomycin에 정주 metronidazole을 병용.", "단독은 불충분.", "전격성 근거 부족.", "위험."], "ref": "성인 복강 내 감염 지침 2022 / SHEA-IDSA CDI", "rubric": "", "level": 3}, {"id": 192, "section": "Intra-abdominal", "sectionKo": "복강내감염", "stem": "CDI 첫 재발의 치료 선택은?", "choices": ["Fidaxomicin 또는 tapered/pulsed vancomycin", "정주 metronidazole", "항진균제", "무치료"], "answer": 1, "rationales": ["첫 재발은 fidaxomicin 또는 tapered/pulsed vancomycin(고위험 bezlotoxumab 고려).", "부적절.", "무관.", "치료 필요."], "ref": "성인 복강 내 감염 지침 2022 / SHEA-IDSA CDI", "rubric": "", "level": 2}, {"id": 193, "section": "Intra-abdominal", "sectionKo": "복강내감염", "stem": "발열·황달·우상복부 통증(Charcot 3징)을 보이는 급성 담관염의 핵심 치료는?", "choices": ["담도 배액(ERCP) + 항생제", "항생제만", "관찰", "항바이러스제"], "answer": 1, "rationales": ["급성 담관염은 담도 감압·배액(ERCP)과 항생제 병행이 핵심.", "배액 없이는 부족.", "위험.", "무관."], "ref": "성인 복강 내 감염 지침 2022 / SHEA-IDSA CDI", "rubric": "", "level": 2}, {"id": 194, "section": "Intra-abdominal", "sectionKo": "복강내감염", "stem": "중증·의료관련 복강내감염의 경험적 커버로 옳은 것은?", "choices": ["Pip-tazo/carbapenem ± 항Candida", "좁은 β-lactam", "경구 amoxicillin", "항바이러스제"], "answer": 1, "rationales": ["중증·의료관련은 광범위(pip-tazo/carbapenem)에 필요 시 항Candida를 더한다.", "불충분.", "불충분.", "무관."], "ref": "성인 복강 내 감염 지침 2022 / SHEA-IDSA CDI", "rubric": "", "level": 2}, {"id": 195, "section": "Bone & Joint", "sectionKo": "골관절감염", "stem": "혈역학적으로 안정된 자연 척추 골수염 환자의 접근으로 : "급성 화농성 관절염의 경험적 항생제 선택(MSSA/MRSA 고려)으로 옳은 것은?", "choices": ["MSSA cefazolin·MRSA vancomycin", "항진균제", "경구 amoxicillin", "관찰"], "answer": 1, "rationales": ["원인·감수성에 따라 MSSA는 cefazolin/nafcillin, MRSA는 vancomycin.", "무관.", "불충분.", "부적절."], "ref": "IDSA 2015 척추골수염 / 2013 PJI", "rubric": "", "level": 2}, {"id": 202, "section": "Urinary Tract Infections", "sectionKo": "요로감염", "stem": "단순 급성 신우신염(외래)의 경구 치료는?", "choices": ["경구 fluoroquinolone(cipro/levo)", "Nitrofurantoin", "경구 vancomycin", "Metronidazole"], "answer": 1, "rationales": ["단순 신우신염 외래는 경구 FQ(투여 전 소변배양).", "조직농도 낮아 신우신염 부적합.", "흡수 안 됨.", "무관."], "ref": "요로감염 항생제 사용지침(국내)", "rubric": "", "level": 2}, {"id": 203, "section": "Urinary Tract Infections", "sectionKo": "요로감염", "stem": "급성 세균성 전립선염의 치료는?", "choices": ["Fluoroquinolone 또는 TMP-SMX", "Nitrofurantoin", "경구 vancomycin", "Fluconazole"], "answer": 1, "rationales": ["급성 세균성 전립선염은 FQ 또는 TMP-SMX.", "전립선 투과 불량.", "흡수 안 됨.", "무관."], "ref": "요로감염 항생제 사용지침(국내)", "rubric": "", "level": 2}, {"id": 204, "section": "Urinary Tract Infections", "sectionKo": "요로감염", "stem": "요로 폐쇄를 동반한 복잡성 요로감염의 필수 처치는?", "choices": ["감압·배액 + 광범위 항생제", "경구 항생제만", "관찰", "진통제만"], "answer": 1, "rationales": ["폐쇄성 복잡성 UTI는 감압·배액이 필수이며 광범위 항생제를 병행.", "배액 없이는 실패.", "위험.", "불충분."], "ref": "요로감염 항생제 사용지침(국내)", "rubric": "", "level": 3}, {"id": 205, "section": "Urinary Tract Infections", "sectionKo": "요로감염", "stem": "증상이 있는 도뇨관 관련 요로감염(CAUTI)의 처치로 옳은 것은?", "choices": ["도뇨관 교체/제거 + 항생제", "무증상도 항생제", "도뇨관 유지·관찰", "항진균제 단독"], "answer": 1, "rationales": ["증상 있는 CAUTI는 도뇨관 교체·제거와 항생제 치료.", "무증상 세균뇨는 치료 안 함.", "교체가 도움.", "부적절."], "ref": "요로감염 항생제 사용지침(국내)", "rubric": "", "level": 2}, {"id": 206, "section": "Urinary Tract Infections", "sectionKo": "요로감염", "stem": "모든 급성 신우신염에서 경험적 항생제 투여 전에 반드시 시행해야 하는 검사는?", "choices": ["소변배양", "혈액배양만", "복부 CT", "방광경"], "answer": 1, "rationales": ["모든 신우신염은 경험적 치료 전 소변배양이 필수.", "소변배양이 우선.", "일상 아님.", "불필요."], "ref": "요로감염 항생제 사용지침(국내)", "rubric": "", "level": 1}, {"id": 207, "section": "Urinary Tract Infections", "sectionKo": "요로감염", "stem": "ESBL 생성 E. coli에 의한 단순 방광염의 경구 선택은?", "choices": ["Nitrofurantoin 또는 fosfomycin", "Meropenem", "Ceftriaxone", "Ampicillin"], "answer": 1, "rationales": ["ESBL 단순 방광염은 nitrofurantoin·fosfomycin으로 carbapenem을 비축.", "경증엔 과함.", "ESBL 무효.", "내성."], "ref": "요로감염 항생제 사용지침(국내)", "rubric": "", "level": 2}, {"id": 208, "section": "Urinary Tract Infections", "sectionKo": "요로감염", "stem": "단순 방광염에서 FQ·carbapenem을 1차로 쓰지 않고 비축하는 이유는?", "choices": ["내성 발현 억제(항생제 관리)", "효과가 없어서", "독성이 없어서", "가격이 비싸서만"], "answer": 1, "rationales": ["내성 보존을 위해 FQ·carbapenem은 단순 방광염 1차에서 지양한다.", "효과는 있음.", "독성 문제도 있음.", "주된 이유는 내성 관리."], "ref": "요로감염 항생제 사용지침(국내)", "rubric": "", "level": 1}, {"id": 209, "section": "Reproductive/STD", "sectionKo": "생식기 감염·STD", "stem": "임질(N. gonorrhoeae)의 1차 치료는?", "choices": ["Ceftriaxone 근육주사", "경구 amoxicillin", "Fluconazole", "Metronidazole"], "answer": 1, "rationales": ["임질 1차는 ceftriaxone IM.", "부적절.", "무관.", "무관."], "ref": "성매개감염 진료지침 2023", "rubric": "", "level": 1}, {"id": 210, "section": "Reproductive/STD", "sectionKo": "생식기 감염·STD", "stem": "임질 치료 시 클라미디아 동반감염을 배제하지 못한 경우 병합할 약제는?", "choices": ["Doxycycline(또는 azithromycin)", "Vancomycin", "Fluconazole", "Acyclovir"], "answer": 1, "rationales": ["클라미디아 미배제 시 doxycycline(또는 azithromycin) 병합.", "무관.", "무관.", "무관."], "ref": "성매개감염 진료지침 2023", "rubric": "", "level": 2}, {"id": 211, "section": "Reproductive/STD", "sectionKo": "생식기 감염·STD", "stem": "클라미디아(C. trachomatis)의 1차 치료는?", "choices": ["Doxycycline", "Ceftriaxone", "Penicillin", "Metronidazole"], "answer": 1, "rationales": ["클라미디아 1차는 doxycycline(대안 azithromycin).", "임질용.", "매독용.", "트리코모나스용."], "ref": "성매개감염 진료지침 2023", "rubric": "", "level": 1}, {"id": 212, "section": "Reproductive/STD", "sectionKo": "생식기 감염·STD", "stem": "조기(1·2기·조기잠복) 매독의 치료는?", "choices": ["Benzathine penicillin G 240만 단위 IM 1회", "Doxycycline 3일", "Ceftriaxone 1회", "Metronidazole"], "answer": 1, "rationales": ["조기 매독은 benzathine penicillin G 240만 단위 IM 1회.", "불충분.", "1차 아님.", "무관."], "ref": "성매개감염 진료지침 2023", "rubric": "", "level": 2}, {"id": 213, "section": "Reproductive/STD", "sectionKo": "생식기 감염·STD", "stem": "비임신 성인 매독 환자가 페니실린 알레르기가 있을 때 대안은?", "choices": ["Doxycycline", "Vancomycin", "Fluconazole", "Nitrofurantoin"], "answer": 1, "rationales": ["비임신 PCN 알레르기 매독은 doxycycline 등을 고려.", "부적절.", "무관.", "무관."], "ref": "성매개감염 진료지침 2023", "rubric": "", "level": 2}, {"id": 214, "section": "Reproductive/STD", "sectionKo": "생식기 감염·STD", "stem": "성매개감염 관리의 기본 원칙으로 옳은 것은?", "choices": ["성접촉자 동시치료 + 재검", "환자만 단독치료", "증상 소실 시 종료", "항상 입원"], "answer": 1, "rationales": ["재감염·전파 차단을 위해 파트너 동시치료와 재검이 필요.", "전파 지속.", "재검 필요.", "대부분 외래."], "ref": "성매개감염 진료지침 2023", "rubric": "", "level": 2}, {"id": 215, "section": "Reproductive/STD", "sectionKo": "생식기 감염·STD", "stem": "임신부 매독 치료의 원칙으로 옳은 것은?", "choices": ["Penicillin(알레르기 시 탈감작 후 penicillin)", "Doxycycline", "치료 보류", "분만 후로 연기"], "answer": 1, "rationales": ["임신부 매독은 penicillin이 유일 표준으로, 알레르기 시 탈감작 후 사용한다.", "임신부 금기.", "위험.", "즉시 치료."], "ref": "성매개감염 진료지침 2023", "rubric": "", "level": 3}, {"id": 216, "section": "Fungal", "sectionKo": "진균감염", "stem": "침습성 폐 아스페르길루스증의 1차 치료제는?", "choices": ["Voriconazole", "Fluconazole", "경구 nystatin", "Amphotericin B deoxycholate"], "answer": 1, "rationales": ["침습성 아스페르길루스증 1차는 voriconazole(예방은 posaconazole).", "Aspergillus 무효.", "전신 무효.", "지질제형이 선호, deoxycholate는 1차 아님."], "ref": "IDSA Candidiasis 2016 / Aspergillosis / Cryptococcosis / 전공의 슬라이드", "rubric": "", "level": 2}, {"id": 217, "section": "Fungal", "sectionKo": "진균감염", "stem": "조절되지 않는 당뇨 환자의 비-부비동에 발생한 무코르증(mucormycosis)의 1차 치료는?", "choices": ["Liposomal amphotericin B + 외과적 절제", "Fluconazole", "Echinocandin", "Voriconazole"], "answer": 1, "rationales": ["무코르증은 liposomal amphotericin B와 적극적 변연절제가 핵심.", "무효.", "무코르 무효.", "무코르 활성 약함(2차 isavuconazole)."], "ref": "IDSA Candidiasis 2016 / Aspergillosis / Cryptococcosis / 전공의 슬라이드", "rubric": "", "level": 3}, {"id": 218, "section": "Fungal", "sectionKo": "진균감염", "stem": "칸디다혈증 모든 환자에게 최소 1회 시행해야 하는 검사는?", "choices": ["산동 안저검사(안내염 배제)", "뇌 MRI", "골수검사", "대장내시경"], "answer": 1, "rationales": ["칸디다혈증은 전이감염(안내염) 배제를 위해 안저검사를 시행.", "일상 아님.", "무관.", "무관."], "ref": "IDSA Candidiasis 2016 / Aspergillosis / Cryptococcosis / 전공의 슬라이드", "rubric": "", "level": 1}, {"id": 219, "section": "Fungal", "sectionKo": "진균감염", "stem": "칸디다혈증에서 fluconazole로 step-down 전환이 가능한 조건은?", "choices": ["혈역학 안정 + 감수성 + 배양 음전", "호중구감소 중", "불안정", "C. krusei"], "answer": 1, "rationales": ["안정·fluconazole 감수성·배양 음전 시 step-down 가능.", "호중구감소는 echinocandin 유지.", "불안정은 부적절.", "C. krusei는 내성."], "ref": "IDSA Candidiasis 2016 / Aspergillosis / Cryptococcosis / 전공의 슬라이드", "rubric": "", "level": 2}, {"id": 220, "section": "Fungal", "sectionKo": "진균감염", "stem": "면역저하자의 크립토코쿠스 수막염 유도치료는?", "choices": ["Liposomal amphotericin B + flucytosine", "Fluconazole 단독", "Echinocandin", "Voriconazole"], "answer": 1, "rationales": ["유도는 liposomal ampho B + flucytosine, 이후 fluconazole 공고·유지.", "공고·유지 단계.", "Cryptococcus 무효.", "1차 아님."], "ref": "IDSA Candidiasis 2016 / Aspergillosis / Cryptococcosis / 전공의 슬라이드", "rubric": "", "level": 3}, {"id": 221, "section": "Fungal", "sectionKo": "진균감염", "stem": "폐포자충 폐렴(PCP)의 1차 치료제는?", "choices": ["TMP-SMX", "Voriconazole", "Echinocandin", "Amphotericin B"], "answer": 1, "rationales": ["PCP 1차는 TMP-SMX(중증 저산소혈증 시 스테로이드 병용).", "무관.", "PCP 무효.", "1차 아님."], "ref": "IDSA Candidiasis 2016 / Aspergillosis / Cryptococcosis / 전공의 슬라이드", "rubric": "", "level": 1}, {"id": 222, "section": "Fungal", "sectionKo": "진균감염", "stem": "칸디다혈증에서 중심정맥관(CVC)에 대한 처치로 옳은 것은?", "choices": ["가능한 한 조기 제거", "유지", "교체 없이 관찰", "항생제 잠금만"], "answer": 1, "rationales": ["칸디다혈증은 CVC를 가능한 한 조기 제거.", "제거가 원칙.", "부적절.", "불충분."], "ref": "IDSA Candidiasis 2016 / Aspergillosis / Cryptococcosis / 전공의 슬라이드", "rubric": "", "level": 2}, {"id": 223, "section": "Surgical Prophylaxis", "sectionKo": "수술 예방", "stem": "대부분의 수술에서 예방적 항생제 1차 선택은?", "choices": ["Cefazolin", "Vancomycin", "Meropenem", "Ciprofloxacin"], "answer": 1, "rationales": ["1차는 cefazolin(1세대).", "MRSA 고위험 시 추가.", "과도한 광범위.", "부적절."], "ref": "ASHP Antimicrobial Prophylaxis in Surgery / SHEA-IDSA-APIC", "rubric": "", "level": 1}, {"id": 224, "section": "Surgical Prophylaxis", "sectionKo": "수술 예방", "stem": "β-lactam 알레르기 환자의 수술 예방적 항생제 대안은?", "choices": ["Clindamycin 또는 vancomycin(±그람음성 커버)", "Amoxicillin", "Ceftriaxone", "Penicillin"], "answer": 1, "rationales": ["β-lactam 알레르기는 clindamycin 또는 vancomycin(필요 시 그람음성 커버).", "교차·부적절.", "교차 우려.", "교차·부적절."], "ref": "ASHP Antimicrobial Prophylaxis in Surgery / SHEA-IDSA-APIC", "rubric": "", "level": 2}, {"id": 225, "section": "Surgical Prophylaxis", "sectionKo": "수술 예방", "stem": "대장·직장 수술의 예방으로 옳은 것은?", "choices": ["그람음성·혐기 커버 + 경구 장정결", "cefazolin 단독으로 충분", "항생제 불필요", "항진균제"], "answer": 1, "rationales": ["대장·직장은 그람음성·혐기 커버(cefazolin+metronidazole/cefoxitin)와 경구 장정결.", "혐기 커버 부족.", "오염수술로 필요.", "무관."], "ref": "ASHP Antimicrobial Prophylaxis in Surgery / SHEA-IDSA-APIC", "rubric": "", "level": 2}, {"id": 226, "section": "Surgical Prophylaxis", "sectionKo": "수술 예방", "stem": "체중 120 kg 이상 성인의 cefazolin 예방 용량은?", "choices": ["3 g", "1 g", "500 mg", "250 mg"], "answer": 1, "rationales": ["체중 ≥120 kg는 cefazolin 3 g(그 외 2 g).", "저용량.", "저용량.", "저용량."], "ref": "ASHP Antimicrobial Prophylaxis in Surgery / SHEA-IDSA-APIC", "rubric": "", "level": 2}, {"id": 227, "section": "Surgical Prophylaxis", "sectionKo": "수술 예방", "stem": "MRSA 보균·고위험 환자의 수술 예방으로 옳은 것은?", "choices": ["Cefazolin에 vancomycin 추가", "Vancomycin 단독으로 대체", "항생제 불필요", "경구 항생제"], "answer": 1, "rationales": ["MRSA 위험 시 cefazolin에 vancomycin을 추가(단독 대체 아님 — MSSA·그람음성 커버 유지).", "단독 대체는 부적절.", "예방 필요.", "정주가 원칙."], "ref": "ASHP Antimicrobial Prophylaxis in Surgery / SHEA-IDSA-APIC", "rubric": "", "level": 2}, {"id": 228, "section": "Surgical Prophylaxis", "sectionKo": "수술 예방", "stem": "수술 예방적 항생제의 재투여가 필요한 상황은?", "choices": ["수술이 항생제 반감기의 2배 이상 지속 또는 대량 출혈", "항상 매시간", "재투여 불필요", "종료 후"], "answer": 1, "rationales": ["반감기 2배 경과(cefazolin 약 4시간)·대량 출혈 시 수술 중 재투여.", "불필요하게 잦음.", "필요한 경우 있음.", "부적절."], "ref": "ASHP Antimicrobial Prophylaxis in Surgery / SHEA-IDSA-APIC", "rubric": "", "level": 2}, {"id": 229, "section": "Surgical Prophylaxis", "sectionKo": "수술 예방", "stem": "수술부위감염(SSI) 예방을 위한 제모 방법으로 옳은 것은?", "choices": ["Clipping(면도기 면도 지양)", "면도날 면도", "제모 크림 필수", "제모 안 함이 항상 최선"], "answer": 1, "rationales": ["필요 시 clipping을 하고 면도날 면도는 지양한다.", "미세손상으로 SSI↑.", "필수는 아님.", "필요 시 clipping."], "ref": "ASHP Antimicrobial Prophylaxis in Surgery / SHEA-IDSA-APIC", "rubric": "", "level": 1}, {"id": 230, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "현행 지침에서 HIV 진단 후 항레트로바이러스치료(ART) 시작 시점은?", "choices": ["진단 즉시(CD4 수치 무관)", "CD4 <350일 때", "CD4 <200일 때", "증상 발생 후"], "answer": 1, "rationales": ["현행은 진단 즉시(rapid initiation), CD4 무관.", "기준 삭제됨.", "기준 삭제됨.", "즉시 시작."], "ref": "국내 HIV 진료지침 / DHHS / 전공의 슬라이드", "rubric": "", "level": 1}, {"id": 231, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "CD4 150/uL HIV 환자의 폐포자충 폐렴(PJP) 일차예방 약제는?", "choices": ["TMP-SMX", "Azithromycin", "Fluconazole", "Valganciclovir"], "answer": 1, "rationales": ["CD4 <200 또는 분획 <14%는 TMP-SMX로 PJP 예방.", "MAC 계열.", "진균 예방.", "CMV 약."], "ref": "국내 HIV 진료지침 / DHHS / 전공의 슬라이드", "rubric": "", "level": 1}, {"id": 232, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "PJP에서 보조 스테로이드가 권고되는 기준은?", "choices": ["PaO2 <70 mmHg 또는 A-aDO2 ≥35", "모든 PJP", "CD4 >500", "발열만"], "answer": 1, "rationales": ["저산소혈증(PaO2 <70 또는 A-aDO2 ≥35)이면 스테로이드 병용.", "전부는 아님.", "무관.", "불충분."], "ref": "국내 HIV 진료지침 / DHHS / 전공의 슬라이드", "rubric": "", "level": 2}, {"id": 233, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "CD4 <50/uL에서 특히 주의해야 할 기회감염은?", "choices": ["CMV·파종성 MAC", "급성 인두염", "단순 방광염", "수족구병"], "answer": 1, "rationales": ["CD4 <50은 CMV(망막염 등)·파종성 MAC 위험이 높다.", "무관.", "무관.", "무관."], "ref": "국내 HIV 진료지침 / DHHS / 전공의 슬라이드", "rubric": "", "level": 2}, {"id": 234, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "HIV 환자의 CMV 망막염 치료로 옳은 것은?", "choices": ["Ganciclovir → valganciclovir 유지(불응 시 foscarnet)", "Acyclovir", "TMP-SMX", "Fluconazole"], "answer": 1, "rationales": ["CMV 망막염은 ganciclovir→valganciclovir 유지, 불응 시 foscarnet.", "HSV/VZV용.", "PJP용.", "진균용."], "ref": "국내 HIV 진료지침 / DHHS / 전공의 슬라이드", "rubric": "", "level": 3}, {"id": 235, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "동종조혈모세포이식(CMV 혈청양성 R+) 환자의 CMV 예방으로 옳은 것은?", "choices": ["Letermovir 이식 후 100일까지", "Acyclovir 평생", "예방 불필요", "Fluconazole"], "answer": 1, "rationales": ["R+ 동종 HSCT는 letermovir로 이식 후 100일까지 예방(질환 발생 시 중지).", "불충분.", "고위험군은 예방.", "무관."], "ref": "국내 HIV 진료지침 / DHHS / 전공의 슬라이드", "rubric": "", "level": 3}, {"id": 236, "section": "HIV Infection & AIDS", "sectionKo": "HIV/AIDS", "stem": "PJP의 1차 치료제와 치료기간은?", "choices": ["TMP-SMX, 21일", "Fluconazole, 7일", "Ganciclovir, 14일", "Isoniazid, 6개월"], "answer": 1, "rationales": ["PJP 1차는 TMP-SMX(TMP 15–20 mg/kg/일 분할) 21일.", "진균 약.", "CMV 약.", "결핵 약."], "ref": "국내 HIV 진료지침 / DHHS / 전공의 슬라이드", "rubric": "", "level": 1}, {"id": 237, "section": "Travel/Imported", "sectionKo": "여행자·해외유입감염", "stem": "임신부의 쯔쯔가무시(scrub typhus) 치료로 적절한 것은?", "choices": ["Azithromycin", "Doxycycline", "Ciprofloxacin", "Levofloxacin"], "answer": 1, "rationales": ["임신부 쯔쯔가무시는 azithromycin(또는 clarithromycin/rifampicin) — doxycycline 회피.", "임신부 회피.", "권고 근거 약함.", "권고 근거 약함."], "ref": "진드기매개감염병 관리지침 / 말라리아 진료가이드 / Harrison", "rubric": "", "level": 2}, {"id": 238, "section": "Travel/Imported", "sectionKo": "여행자·해외유입감염", "stem": "해외유입 열대열 말라리아(P. falciparum)의 치료로 옳은 것은?", "choices": ["ACT(여행지 내성 확인)", "클로로퀸 단독", "프리마퀸 단독", "대증치료만"], "answer": 1, "rationales": ["열대열은 ACT 등으로 치료하며 여행지 내성을 확인.", "내성 흔함.", "단독 부적절.", "치료 필요."], "ref": "진드기매개감염병 관리지침 / 말라리아 진료가이드 / Harrison", "rubric": "", "level": 2}, {"id": 239, "section": "Travel/Imported", "sectionKo": "여행자·해외유입감염", "stem": "중증 말라리아(종 무관)의 1차 치료는?", "choices": ["정주 artesunate", "경구 클로로퀸", "경구 프리마퀸", "대증치료"], "answer": 1, "rationales": ["중증 말라리아는 종에 관계없이 정주 artesunate.", "중증엔 부적절.", "단독 부적절.", "불충분."], "ref": "진드기매개감염병 관리지침 / 말라리아 진료가이드 / Harrison", "rubric": "", "level": 3}, {"id": 240, "section": "Travel/Imported", "sectionKo": "여행자·해외유입감염", "stem": "참진드기에 물린 뒤 고열·백혈구/혈소판 감소·ferritin 상승을 보이는 SFTS의 관리는?", "choices": ["대증치료 + 중증 시 비말주의", "Doxycycline 근치", "즉시 항바이러스 완치", "항진균제"], "answer": 1, "rationales": ["SFTS는 대증치료가 원칙, 중증 관리 시 접촉·비말주의.", "근치되지 않음.", "확립된 완치제 없음.", "무관."], "ref": "진드기매개감염병 관리지침 / 말라리아 진료가이드 / Harrison", "rubric": "", "level": 3}, {"id": 241, "section": "Travel/Imported", "sectionKo": "여행자·해외유입감염", "stem": "장마철 논일 후 발열·근육통·객혈을 보이는 중증 렙토스피라증의 치료는?", "choices": ["Penicillin 또는 ceftriaxone 정주", "Acyclovir", "Fluconazole", "Metronidazole"], "answer": 1, "rationales": ["중증 렙토스피라증은 정주 penicillin/ceftriaxone(경증은 doxycycline).", "무관.", "무관.", "무관."], "ref": "진드기매개감염병 관리지침 / 말라리아 진료가이드 / Harrison", "rubric": "", "level": 2}, {"id": 242, "section": "Travel/Imported", "sectionKo": "여행자·해외유입감염", "stem": "라임병 초기(erythema migrans)의 치료제는?", "choices": ["Doxycycline", "Vancomycin", "Fluconazole", "Acyclovir"], "answer": 1, "rationales": ["라임병 초기는 doxycycline(진단은 ELISA→western blot).", "부적절.", "무관.", "무관."], "ref": "진드기매개감염병 관리지침 / 말라리아 진료가이드 / Harrison", "rubric": "", "level": 2}, {"id": 243, "section": "Travel/Imported", "sectionKo": "여행자·해외유입감염", "stem": "동남아 여행 후 발열·혈소판감소로 뎅기열이 진단된 환자의 치료는?", "choices": ["대증치료(수분보충), 아스피린 회피", "Ceftriaxone", "Oseltamivir", "예방적 혈소판 수혈"], "answer": 1, "rationales": ["뎅기는 대증치료·아스피린 회피가 원칙.", "무관.", "무관.", "일상 권고 아님."], "ref": "진드기매개감염병 관리지침 / 말라리아 진료가이드 / Harrison", "rubric": "", "level": 1}, {"id": 244, "section": "Antimicrobial Stewardship", "sectionKo": "항생제 스튜어드십 (ASP)", "stem": "ASP의 두 가지 핵심 전략은?", "choices": ["전향적 감사·피드백 / 처방 제한·사전승인", "손위생 / 격리", "백신 / 검역", "TDM / DUR"], "answer": 1, "rationales": ["핵
