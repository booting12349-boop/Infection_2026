kg/일을 초과하지 않는다", "상한이 없다", "50 mg/kg/일까지 가능", "100 mg/kg/일까지 가능"], "answer": 1, "explain": "clavulanate 10 mg/kg/일 초과 시 설사가 증가 → 초과 금지(14:1 제형을 쓰는 이유).", "level": 2}, {"id": "uri-42", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회, Infect Chemother 2017;49(4)) + 2026년 부산대병원 자료 · AI 재구성이므로 원문 확인 필요", "q": "소아 급성 중이염의 통증·발열 조절 약과 용량으로 옳은 것은?", "choices": ["acetaminophen 10~15 mg/kg q4~6h (1일 최대 75 mg/kg)", "aspirin 상용량", "codeine 상용량", "항생제만으로 조절"], "answer": 1, "explain": "acetaminophen 10~15 mg/kg를 4~6시간 간격으로 투여하되 1일 총량 75 mg/kg를 넘지 않는다(q4h로 6회를 다 주면 90 mg/kg가 되어 초과). 대안은 ibuprofen 5~10 mg/kg q6~8h(1일 최대 40 mg/kg). 소아에게 aspirin(Reye 증후군)과 codeine은 피한다.", "level": 1}, {"id": "uri-43", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회, Infect Chemother 2017;49(4)) + 2026년 부산대병원 자료 · AI 재구성이므로 원문 확인 필요", "q": "체중 15 kg 소아에게 amoxicillin 고용량(90 mg/kg/일)을 처방할 때 하루 총량은?", "choices": ["약 1,350 mg/일", "약 450 mg/일", "약 90 mg/일", "약 3,000 mg/일"], "answer": 1, "explain": "90 mg/kg × 15 kg = 1,350 mg/일(보통 2회 분할). 체중당 용량 계산형 기출 대비.", "level": 2}, {"id": "uri-44", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회, Infect Chemother 2017;49(4)) + 2026년 부산대병원 자료 · AI 재구성이므로 원문 확인 필요", "q": "소아 급성 중이염의 표준 치료기간으로 옳은 것은?", "choices": ["총 10일 기본(경증 5~7일)", "단회 투여", "3일 고정", "4주 이상"], "answer": 1, "explain": "총 10일 기본, 경증은 5~7일 가능. 투여 2~3일째 반응을 평가한다.", "level": 1}, {"id": "uri-45", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회, Infect Chemother 2017;49(4)) + 2026년 부산대병원 자료 · AI 재구성이므로 원문 확인 필요", "q": "소아 크룹(croup)의 특징과 원인으로 옳은 것은?", "choices": ["흡기 천명·개 짖는 기침이며 대부분 바이러스 → 항생제 불필요", "대부분 세균 → 즉시 항생제", "항상 기관절개가 필요", "포도알균이 주원인"], "answer": 1, "explain": "크룹은 파라인플루엔자 등 바이러스, barking cough·stridor 특징. 항생제 불필요.", "level": 1}, {"id": "uri-46", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회, Infect Chemother 2017;49(4)) + 2026년 부산대병원 자료 · AI 재구성이므로 원문 확인 필요", "q": "급성 후두개염에 대한 설명으로 옳지 않은 것은?", "choices": ["세균성 응급으로 기도폐쇄 위험", "nafcillin + 3세대 세팔로스포린 병합", "대부분 바이러스라 항생제가 불필요", "Hib 백신 도입 후 감소"], "answer": 3, "explain": "후두개염은 세균성 응급으로 조기 항생제(nafcillin+3세대 세파)가 원칙. 바이러스라 항생제가 불필요한 것은 크룹·급성 후두염.", "level": 2}, {"id": "uri-47", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회, Infect Chemother 2017;49(4)) + 2026년 부산대병원 자료 · AI 재구성이므로 원문 확인 필요", "q": "상기도감염에서 질환별 1차 항생제 연결로 옳은 것은?", "choices": ["인두편도염=amoxicillin, 부비동염·중이염=amox/clav 또는 amox 고용량", "인두편도염=amox/clav, 부비동염=amoxicillin", "모두 azithromycin", "모두 levofloxacin"], "answer": 1, "explain": "인두염은 좁은 amoxicillin(GAS penicillin 내성 없음), 부비동·중이는 β-lactamase 생성 H. influenzae·M. catarrhalis와 PRSP를 겨냥해 amox/clav 또는 amox 고용량.", "level": 2}, {"id": "uri-48", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회, Infect Chemother 2017;49(4)) + 2026년 부산대병원 자료 · AI 재구성이므로 원문 확인 필요", "q": "인두편도염에서 신속항원검사(RADT)가 음성일 때 적절한 처치는?", "choices": ["대증요법", "즉시 광범위 항생제", "ceftriaxone 정주", "편도절제술"], "answer": 1, "explain": "RADT 음성이면 대증요법, 양성이면 항생제. 임상만으로 구분이 어려워 RADT를 근거로 삼는다.", "level": 1}, {"id": "onco-1", "topic": "onco", "tname": "암환자 감염", "src": "NCCN Prevention and Treatment of Cancer-Related Infections", "level": 1, "q": "62세 남성이 AML 관해유도 항암 7일째에 구강체온 38.5℃가 1회 측정되었다. ANC 120/mm³, 혈압 118/70 mmHg. 가장 적절한 다음 조치는?", "choices": ["혈액배양 결과가 나올 때까지 해열제만 투여하고 관찰한다", "혈액배양을 채취한 뒤 60분 이내에 항녹농균 β-lactam을 정주한다", "G-CSF를 먼저 투여하고 발열이 지속되면 항생제를 시작한다", "Vancomycin과 cefepime을 즉시 병용 투여한다"], "answer": 2, "explain": "ANC <500/mm³에서 1회 ≥38.3℃(또는 ≥38.0℃ 1시간 지속)는 호중구감소성 발열의 정의를 충족한다. 배양은 채취하되 결과를 기다리지 않고 가능한 한 1시간 이내에 경험적 광범위 항생제를 시작해야 하며, 기본은 항녹농균 β-lactam 단독요법이다. 혈역학적으로 안정하고 그람양성균 근거가 없으므로 vancomycin을 초기부터 더할 이유는 없다."}, {"id": "onco-2", "topic": "onco", "tname": "암환자 감염", "src": "NCCN Prevention and Treatment of Cancer-Related Infections", "level": 2, "q": "유방암으로 외래 항암 중인 55세 여성이 발열로 내원했다. MASCC 점수 23점, 활력징후 안정, 경구 섭취 가능, 보호자 동반 및 응급실 접근성 양호하며 예방적 항생제는 받지 않았다. 가장 적절한 치료는?", "choices": ["입원하여 meropenem 정주", "경구 ciprofloxacin + amoxicillin/clavulanate로 외래 관리", "경구 levofloxacin 단독", "입원하여 cefepime + vancomycin 정주"], "answer": 2, "explain": "MASCC ≥21점은 저위험군으로, 임상적·사회적 조건이 갖춰지면 경구 요법과 외래 관리를 고려할 수 있다. 저위험 경구 요법의 표준 조합은 ciprofloxacin + amoxicillin/clavulanate이다. 단, FQ 예방요법을 받던 환자에게는 경구 FQ 기반 요법을 쓰지 않는다."}, {"id": "onco-3", "topic": "onco", "tname": "암환자 감염", "src": "NCCN Prevention and Treatment of Cancer-Related Infections", "level": 2, "q": "호중구감소성 발열 환자에서 초기 경험적 요법에 vancomycin을 추가할 적응증으로 보기 어려운 것은?", "choices": ["중심정맥 카테터 삽입부의 발적과 압통", "혈역학적 불안정(패혈성 쇼크)", "MRSA 집락이 확인된 병력", "발열이 24시간 지속되나 활력징후는 안정적임"], "answer": 4, "explain": "혈역학적 불안정, 그람양성균 배양 양성, 카테터 관련 감염, 피부·연조직 감염, 폐렴, MRSA 집락, 중증 점막염 등이 vancomycin 추가 적응증이다. 활력징후가 안정된 상태에서 발열만 지속되는 것은 추가 적응증이 아니며, 오히려 근거가 없으면 48–72시간 내 중단해야 한다."}, {"id": "onco-4", "topic": "onco", "tname": "암환자 감염", "src": "NCCN Prevention and Treatment of Cancer-Related Infections", "level": 2, "q": "동종 조혈모세포이식 후 호중구감소성 발열로 piperacillin/tazobactam을 투여 중인 환자가 5일째에도 발열이 지속되고 ANC는 계속 <100/mm³이다. 가장 적절한 조치는?", "choices": ["항생제를 meropenem으로 상향하고 경과 관찰", "경험적 항진균제를 추가하고 흉부 CT·galactomannan 등 진균 정밀검사를 시행", "Vancomycin을 추가", "항생제를 모두 중단하고 재평가"], "answer": 2, "explain": "광범위 항생제에도 4–7일 이상 발열이 지속되고 호중구감소가 회복되지 않으면 침습진균감염을 의심해 경험적 항진균제(echinocandin 또는 liposomal amphotericin B)를 추가하고, 동시에 흉부 CT·galactomannan 등 진단적 평가를 진행한다."}, {"id": "onco-5", "topic": "onco", "tname": "암환자 감염", "src": "NCCN Prevention and Treatment of Cancer-Related Infections", "level": 2, "q": "AML 관해유도 요법을 시작하는 환자에게 침습성 사상균(Aspergillus) 감염 예방을 위해 가장 적절한 약제는?", "choices": ["Fluconazole", "Posaconazole", "Nystatin 함수", "Acyclovir"], "answer": 2, "explain": "AML/MDS 관해유도, 중증 GVHD 등 사상균 위험이 높은 상황에서는 곰팡이 커버가 있는 posaconazole을 예방적으로 사용한다. Fluconazole은 효모(Candida)만 커버하므로 Aspergillus 예방에는 부적절하고, acyclovir는 HSV 예방용이다."}, {"id": "onco-6", "topic": "onco", "tname": "암환자 감염", "src": "NCCN Prevention and Treatment of Cancer-Related Infections", "level": 1, "q": "호중구감소성 발열에서 경험적 항생제 중단을 고려할 수 있는 가장 대표적인 상황은?", "choices": ["해열되고 ANC가 500/mm³ 이상으로 회복된 경우", "투여 3일째 배양이 음성인 경우", "CRP가 감소하기 시작한 경우", "환자가 퇴원을 원하는 경우"], "answer": 1, "explain": "원인이 규명되지 않은 호중구감소성 발열에서 항생제 중단의 기준은 임상적 안정(해열)과 골수 회복(ANC ≥500/mm³)이다. 배양 음성이나 염증수치 변화만으로 중단을 결정하지 않는다."}, {"id": "onco-7", "topic": "onco", "tname": "암환자 감염", "src": "NCCN Prevention and Treatment of Cancer-Related Infections", "level": 3, "q": "호중구감소성 발열 환자에서 중심정맥 카테터 제거를 강하게 고려해야 하는 상황으로 가장 적절한 것은?", "choices": ["Coagulase-negative staphylococci 1쌍 배양 양성", "Candida 혈증 또는 터널·포켓 감염", "발열이 48시간 지속", "CRP 상승"], "answer": 2, "explain": "터널·포켓 감염, 그리고 S. aureus·Candida·P. aeruginosa 등에 의한 카테터 관련 혈류감염은 카테터 제거 적응증이다. Coagulase-negative staphylococci는 오염 가능성을 감별한 뒤 카테터 보존적 치료를 시도할 수 있다."}, {"id": "tp-1", "topic": "transplant", "tname": "이식·면역저하 감염", "src": "Fourth International Consensus Guidelines on CMV in SOT (2025) · KDIGO", "level": 1, "q": "CMV D+/R− 신장이식 수혜자에서 보편적 예방요법(universal prophylaxis)으로 가장 널리 사용되는 약제와 기간은?", "choices": ["Acyclovir · 1개월", "Valganciclovir · 6개월", "Letermovir · 2주", "Foscarnet · 3개월"], "answer": 2, "explain": "D+/R−는 CMV 최고위험군으로, 신장이식에서는 valganciclovir 1일 1회 보편적 예방요법을 통상 6개월간 시행한다(그 외 위험군은 대개 3개월). 예방 종료 후 지연발현 CMV 질환에 주의해야 한다."}, {"id": "tp-2", "topic": "transplant", "tname": "이식·면역저하 감염", "src": "Fourth International Consensus Guidelines on CMV in SOT (2025)", "level": 2, "q": "이식 후 1–6개월 사이에 가장 특징적으로 발생하는 감염군은?", "choices": ["수술부위감염·카테터 관련 감염", "CMV·PJP·Aspergillus 등 기회감염", "지역사회획득 폐렴·요로감염", "공여자 유래 전파 감염"], "answer": 2, "explain": "이식 후 1개월 이내는 수술·병원 관련 감염과 공여자 유래 감염이, 1–6개월은 면역억제가 최대인 시기로 CMV·PJP·아스페르길루스·BK·결핵 재활성화 등 기회감염이, 6개월 이후는 지역사회획득 감염이 주가 된다."}, {"id": "tp-3", "topic": "transplant", "tname": "이식·면역저하 감염", "src": "KDIGO Kidney Transplant Recipient", "level": 2, "q": "Tacrolimus를 복용 중인 이식 환자에게 침습성 아스페르길루스증으로 voriconazole을 시작하려 한다. 약사가 우선 권고할 조치는?", "choices": ["Tacrolimus 용량을 미리 상당 폭 감량하고 혈중농도를 자주 추적한다", "Tacrolimus를 증량한다", "Tacrolimus를 중단하고 스테로이드 단독으로 전환한다", "상호작용이 없으므로 그대로 유지한다"], "answer": 1, "explain": "Voriconazole은 강력한 CYP3A4 억제제로 tacrolimus 농도를 크게 상승시켜 신독성·신경독성을 유발할 수 있다. 병용 시작 시 tacrolimus를 선제적으로 감량하고 혈중농도를 자주 측정하며 조정해야 한다."}, {"id": "tp-4", "topic": "transplant", "tname": "이식·면역저하 감염", "src": "Fourth International Consensus Guidelines on CMV in SOT (2025)", "level": 3, "q": "Ganciclovir로 2주 이상 치료했으나 CMV DNA가 감소하지 않고 UL97 변이가 확인되었다. 다음 중 가장 적절한 선택은?", "choices": ["Ganciclovir 용량을 2배로 증량", "Maribavir 또는 foscarnet으로 전환하고 면역억제를 감량", "Acyclovir 고용량으로 전환", "Letermovir로 전환"], "answer": 2, "explain": "UL97 변이는 ganciclovir/valganciclovir 내성을 시사한다. 불응성·내성 CMV에서는 maribavir(불응/내성 적응증) 또는 foscarnet·cidofovir로 전환하고, 가능하면 면역억제를 감량해 숙주 면역 회복을 돕는다. Letermovir는 예방 목적 약제로 확립된 CMV 질환의 치료제가 아니다."}, {"id": "tp-5", "topic": "transplant", "tname": "이식·면역저하 감염", "src": "KDIGO Kidney Transplant Recipient", "level": 1, "q": "신장이식 수혜자에서 Pneumocystis jirovecii 폐렴 예방을 위한 표준 약제는?", "choices": ["TMP-SMX", "Azithromycin", "Fluconazole", "Valganciclovir"], "answer": 1, "explain": "PJP 예방의 1차 약제는 TMP-SMX이며, 신장이식에서는 통상 이식 후 6–12개월 이상 투여한다. 설파 알레르기 등으로 사용이 어려우면 dapsone, atovaquone, 흡입 pentamidine 등을 대안으로 고려한다."}, {"id": "tp-6", "topic": "transplant", "tname": "이식·면역저하 감염", "src": "KDIGO Kidney Transplant Recipient", "level": 2, "q": "이식 수혜자의 예방접종에 대한 설명으로 옳은 것은?", "choices": ["이식 후에도 생백신을 자유롭게 접종할 수 있다", "가능한 한 이식 전에 접종을 완료하고, 이식 후에는 생백신을 금기로 한다", "이식 후에는 어떤 백신도 접종하지 않는다", "불활화 백신은 이식 후 금기이다"], "answer": 2, "explain": "면역억제 상태에서는 생백신이 금기이므로 이식 전에 접종을 완료하는 것이 원칙이다. 이식 후에도 인플루엔자·폐렴구균 등 불활화 백신은 권장되며, 면역원성이 낮을 수 있어 접종 시기를 조정한다."}, {"id": "tp-7", "topic": "transplant", "tname": "이식·면역저하 감염", "src": "KDIGO Kidney Transplant Recipient", "level": 3, "q": "신장이식 후 BK 바이러스 신병증이 진단되었을 때 가장 우선적인 처치는?", "choices": ["Cidofovir 정주", "면역억제제 감량", "Leflunomide 단독 전환", "Valganciclovir 투여"], "answer": 2, "explain": "BK 바이러스 신병증에는 확립된 특이 항바이러스제가 없으며, 면역억제 감량이 1차 처치이다. Cidofovir·leflunomide·IVIG 등은 근거가 제한적인 보조 수단이다."}, {"id": "tdm-1", "topic": "tdm", "tname": "항생제 TDM", "src": "ASHP/IDSA/PIDS/SIDP Vancomycin TDM Consensus Guideline (2020)", "level": 1, "q": "중증 MRSA 균혈증 환자에서 반코마이신 모니터링의 권고 목표는?", "choices": ["Trough 15–20 mg/L", "AUC24/MIC 400–600", "Peak 30–40 mg/L", "Trough 10–15 mg/L"], "answer": 2, "explain": "2020년 개정 합의지침은 중증 MRSA 감염에서 AUC24/MIC 400–600(MIC 1 mg/L, 액체배지 미량희석 기준)을 목표로 할 것을 권고하며, trough 단독 목표는 더 이상 권고하지 않는다."}, {"id": "tdm-2", "topic": "tdm", "tname": "항생제 TDM", "src": "ASHP/IDSA/PIDS/SIDP Vancomycin TDM Consensus Guideline (2020)", "level": 2, "q": "Trough 15–20 mg/L 목표가 더 이상 권고되지 않는 주된 이유는?", "choices": ["채혈이 번거롭기 때문", "AUC 예측이 부정확하고 신독성 위험이 증가하기 때문", "효과가 없다고 밝혀졌기 때문", "반코마이신이 더 이상 1차 약제가 아니기 때문"], "answer": 2, "explain": "Trough는 AUC의 대리지표로 사용되었으나 개인 간 편차가 커 AUC를 잘 예측하지 못하고, 15–20 mg/L 유지가 급성신손상 위험을 높인다는 근거가 축적되어 AUC 기반 모니터링으로 전환되었다."}, {"id": "tdm-3", "topic": "tdm", "tname": "항생제 TDM", "src": "ASHP/IDSA/PIDS/SIDP Vancomycin TDM Consensus Guideline (2020)", "level": 2, "q": "패혈성 쇼크로 중환자실에 입실한 90 kg 환자에게 반코마이신을 시작한다. 부하용량 권고 범위로 가장 적절한 것은?", "choices": ["10 mg/kg", "20–35 mg/kg (실제 체중)", "40–50 mg/kg", "부하용량은 권고되지 않는다"], "answer": 2, "explain": "중증·중환자에서는 목표 노출에 빨리 도달하기 위해 실제 체중 기준 20–35 mg/kg의 부하용량을 고려한다. 이후 유지용량은 15–20 mg/kg q8–12h로 시작해 AUC 결과로 조정한다."}, {"id": "tdm-4", "topic": "tdm", "tname": "항생제 TDM", "src": "ASHP/IDSA/PIDS/SIDP Vancomycin TDM Consensus Guideline (2020)", "level": 2, "q": "베이지안 소프트웨어를 이용한 AUC 산출의 장점으로 가장 적절한 것은?", "choices": ["정상상태 도달 전 1–2개 농도만으로도 조기에 AUC를 추정할 수 있다", "MIC 측정이 필요 없다", "신기능 평가가 필요 없다", "채혈 시각을 기록할 필요가 없다"], "answer": 1, "explain": "베이지안 방식은 모집단 PK 모델을 활용하므로 비정상상태의 1–2개 농도로도 개별 AUC를 추정할 수 있어 치료 24–48시간 이내 조기 평가가 가능하다. 반면 1차 PK 방정식 방식은 정상상태에서 peak·trough 2개 농도가 필요하다."}, {"id": "tdm-5", "topic": "tdm", "tname": "항생제 TDM", "src": "ASHP/IDSA/PIDS/SIDP Vancomycin TDM Consensus Guideline (2020)", "level": 2, "q": "반코마이신 투여 환자에서 급성신손상 위험을 유의하게 높이는 병용약제로 지침이 특히 강조한 것은?", "choices": ["Piperacillin/tazobactam", "Cefepime", "Meropenem", "Linezolid"], "answer": 1, "explain": "반코마이신과 piperacillin/tazobactam 병용은 급성신손상 위험을 높인다는 근거가 축적되어 지침이 이를 명시적으로 언급한다. 장기 병용이 필요한 경우 신기능을 더 자주 감시하고 대체 요법을 고려한다."}, {"id": "tdm-6", "topic": "tdm", "tname": "항생제 TDM", "src": "ASHP/IDSA/PIDS/SIDP Vancomycin TDM Consensus Guideline (2020)", "level": 3, "q": "MRSA 균혈증 환자의 분리주 반코마이신 MIC가 액체배지 미량희석법으로 2 mg/L로 보고되었다. 가장 적절한 판단은?", "choices": ["용량을 대폭 증량해 AUC 800 이상을 목표로 한다", "안전한 용량으로 목표 AUC 달성이 어려우므로 대체 약제를 고려한다", "MIC와 무관하므로 기존 용량을 유지한다", "Trough 20–25 mg/L를 목표로 조정한다"], "answer": 2, "explain": "MIC 2 mg/L에서 AUC/MIC 400을 맞추려면 AUC24가 800에 달해야 하는데, 이는 신독성 위험이 큰 노출이다. 따라서 daptomycin 등 대체 약제를 고려하는 것이 합리적이다."}, {"id": "tdm-7", "topic": "tdm", "tname": "항생제 TDM", "src": "ASHP/IDSA/PIDS/SIDP Vancomycin TDM Consensus Guideline (2020)", "level": 3, "q": "아미노글리코사이드의 1일 1회 고용량 요법이 가능한 약동학·약력학적 근거로 가장 적절한 것은?", "choices": ["시간의존적 살균과 짧은 반감기", "농도의존적 살균과 후항생제효과", "단백결합률이 높기 때문", "신장에서 재흡수되기 때문"], "answer": 2, "explain": "아미노글리코사이드는 농도의존적 살균 효과와 뚜렷한 후항생제효과(PAE)를 가지므로, 최고농도를 높이고 저농도 구간을 두는 1일 1회 요법이 효과를 유지하면서 신독성·이독성을 줄이는 전략이 된다."}, {"id": "uri-49", "q": "2세 남아가 감기 후 청력이 좀 떨어진 것 같다고 내원했다. 발열·이통은 없고 고막은 함몰되어 있으며 액체 저류가 보이나 팽륜이나 이루는 없다. 가장 적절한 처치는?", "choices": ["amoxicillin 고용량 10일", "항생제 없이 경과 관찰", "경구 항히스타민제 투여", "즉시 환기관 삽입"], "answer": 2, "level": 2, "explain": "급성 염증 징후 없이 중이 삼출만 있는 삼출성 중이염(OME)이다. OME에는 항생제·항히스타민제·경구 스테로이드 모두 효과가 입증되지 않아 경과 관찰이 원칙이다. 3개월 이상 지속되면서 청력저하나 언어발달 지연이 있을 때 환기관 삽입을 고려한다.", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회) · 유소아 중이염 진료지침 2014(대한이과학회) · IDSA 2012 Acute Bacterial Rhinosinusitis"}, {"id": "uri-50", "q": "소아 급성 중이염(AOM) 확진에 대한 설명으로 옳은 것은?", "choices": ["고막 발적만 있어도 확진할 수 있다", "급성 증상과 함께 고막 팽륜 또는 이루가 있어야 한다", "증상만으로 확진한다", "중이 삼출만 있으면 확진이다"], "answer": 2, "level": 2, "explain": "AOM 확진에는 급성 발현 증상과 함께 중이 염증의 객관적 징후(고막 팽륜, 급성 천공에 의한 이루 등)가 필요하다. 발적만으로는 울음·발열로도 생길 수 있어 부족하고, 삼출만 있으면 OME로 분류한다. 고막 소견이 불분명할 때는 AOM보다 OME 가능성을 먼저 생각한다.", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회) · 유소아 중이염 진료지침 2014(대한이과학회) · IDSA 2012 Acute Bacterial Rhinosinusitis"}, {"id": "uri-51", "q": "23세 남자가 인두편도염으로 amoxicillin을 4일간 복용했으나 악화되었다. 편측 인두 팽윤, 목젖 편위, 개구장애, 웅얼거리는 목소리가 있다. 가장 우선되는 조치는?", "choices": ["항생제를 levofloxacin으로 변경", "천자·절개 배농 시행 후 항생제 지속", "경구 스테로이드 단독 투여", "경과 관찰하며 amoxicillin 유지"], "answer": 2, "level": 3, "explain": "개구장애·목젖 편위·hot potato voice는 편도주위농양의 전형적 소견이다. 농양은 항생제 단독으로 해결되지 않으므로 천자 흡인이나 절개 배농이 우선이며, 이후 혐기성균을 포함해 커버하는 항생제(ampicillin/sulbactam 또는 clindamycin)를 지속한다.", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회) · 유소아 중이염 진료지침 2014(대한이과학회) · IDSA 2012 Acute Bacterial Rhinosinusitis"}, {"id": "uri-52", "q": "52세 남자가 코막힘·후비루·안면압박감이 4개월째 지속된다며 내원했다. 가장 적절한 접근은?", "choices": ["급성 세균성 부비동염에 준해 amox/clav 10일", "만성 부비동염으로 보고 비강 세척·비강 스테로이드 중심으로 관리하며 원인 평가와 이비인후과 의뢰", "levofloxacin 4주 투여", "항생제 없이 경구 항히스타민제만 투여"], "answer": 2, "level": 2, "explain": "증상이 12주 이상 지속되면 만성 부비동염으로 분류하며 급성과 치료 전략이 다르다. 항생제 단독 효과가 제한적이고 생리식염수 비강 세척과 비강 내 스테로이드가 중심이다. 알레르기·비용종·해부학적 이상 등 기저 원인 평가와 이비인후과 의뢰가 필요하다.", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회) · 유소아 중이염 진료지침 2014(대한이과학회) · IDSA 2012 Acute Bacterial Rhinosinusitis"}, {"id": "uri-53", "q": "급성 세균성 부비동염의 보조요법에 대한 IDSA 권고로 옳은 것은?", "choices": ["경구 항히스타민제를 모든 환자에게 권고한다", "생리식염수 비강 세척을 권고하고, 알레르기 비염 병력이 있으면 비강 내 스테로이드를 권고한다", "경구 충혈완화제를 1차로 권고한다", "보조요법은 일절 권고하지 않는다"], "answer": 2, "level": 2, "explain": "생리식염수 비강 세척은 보조요법으로 권고되며, 알레르기 비염 병력이 있는 환자에서는 비강 내 스테로이드가 도움이 된다. 반면 경구 항히스타민제와 경구 충혈완화제는 세균성 부비동염에서 권고되지 않는다.", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회) · 유소아 중이염 진료지침 2014(대한이과학회) · IDSA 2012 Acute Bacterial Rhinosinusitis"}, {"id": "uri-54", "q": "성인 급성 세균성 부비동염 환자에게 amox/clav를 시작했으나 72시간이 지나도 호전이 없다. 가장 적절한 다음 단계는?", "choices": ["같은 약을 5일 더 유지", "복약 순응도와 진단을 먼저 재검토한 뒤 고용량 amox/clav 또는 levofloxacin으로 변경", "즉시 정주 carbapenem으로 상향", "doxycycline으로 변경"], "answer": 2, "level": 2, "explain": "48~72시간 내 반응이 없으면 먼저 순응도와 진단(바이러스성·알레르기성·비감염성)을 재검토한다. 그 뒤 내성균을 고려해 고용량 amox/clav 또는 호흡기 FQ로 변경한다. 국내 지침은 폐렴구균 doxycycline 내성률이 높아 대체약에서 제외했고, 안와·두개내 합병증이 의심되면 조영 CT가 필요하다.", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회) · 유소아 중이염 진료지침 2014(대한이과학회) · IDSA 2012 Acute Bacterial Rhinosinusitis"}, {"id": "uri-55", "q": "합병증 없는 성인 급성 세균성 부비동염의 표준 항생제 투여기간으로 가장 적절한 것은?", "choices": ["3일", "총 5~10일(증상 호전 후 4~7일까지)", "최소 3주", "증상이 완전히 소실될 때까지 무기한"], "answer": 2, "level": 1, "explain": "성인은 총 5~10일이 표준이며 증상 호전 후 4~7일까지 유지하는 방식으로 기간을 잡는다. 소아는 더 길어 10~28일 또는 호전 후 7일까지 투여한다.", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회) · 유소아 중이염 진료지침 2014(대한이과학회) · IDSA 2012 Acute Bacterial Rhinosinusitis"}, {"id": "uri-56", "q": "재발성 급성 중이염(최근 6개월간 3회, 12개월간 4회 이상)의 관리로 가장 적절한 것은?", "choices": ["장기 예방적 항생제를 우선 시작한다", "환기관 삽입을 고려하고 폐렴구균·인플루엔자 백신 접종력을 확인한다", "매 삽화마다 ceftriaxone 근주", "항히스타민제 장기 투여"], "answer": 2, "level": 2, "explain": "재발성 중이염에서 장기 예방적 항생제는 내성 유발 대비 이득이 작아 권장되지 않는다. 환기관 삽입을 고려하고, 폐렴구균 백신과 인플루엔자 백신이 중이염 발생을 줄이므로 접종력을 확인·보완한다. 간접흡연 노출, 눕혀서 젖병 수유 등 위험인자 교정도 함께 한다.", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회) · 유소아 중이염 진료지침 2014(대한이과학회) · IDSA 2012 Acute Bacterial Rhinosinusitis"}, {"id": "uri-57", "q": "인두편도염 후 지속되는 고열, 경부 압통, 폐 다발성 결절 음영이 나타났다. 원인균으로 가장 의심되는 것은?", "choices": ["Streptococcus pyogenes", "Fusobacterium necrophorum", "Mycoplasma pneumoniae", "Epstein-Barr virus"], "answer": 2, "level": 3, "explain": "Lemierre 증후군은 인두 감염 후 내경정맥 혈전정맥염과 패혈성 색전(주로 폐)을 일으키며 원인균은 혐기성 그람음성간균 Fusobacterium necrophorum이다. 인두염이 항생제에 반응하지 않으면서 경부 압통과 폐 병변이 동반되면 반드시 의심해야 한다.", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회) · 유소아 중이염 진료지침 2014(대한이과학회) · IDSA 2012 Acute Bacterial Rhinosinusitis"}, {"id": "uri-58", "q": "급성 중이염 발생을 줄이는 데 근거가 있는 예방 수단은?", "choices": ["폐렴구균 단백결합 백신(PCV)과 인플루엔자 백신 접종", "장기 항히스타민제 투여", "예방적 경구 세팔로스포린", "비타민 C 고용량"], "answer": 1, "level": 1, "explain": "PCV와 인플루엔자 백신은 급성 중이염 발생률을 낮춘다는 근거가 있다. 항히스타민제와 예방적 항생제는 권장되지 않으며, 모유수유·간접흡연 회피 등 환경적 요인 관리가 함께 중요하다.", "topic": "uri", "tname": "상기도감염", "src": "급성 상기도감염 항생제 사용지침(대한감염학회·대한화학요법학회) · 유소아 중이염 진료지침 2014(대한이과학회) · IDSA 2012 Acute Bacterial Rhinosinusitis"}, {"id": "principles-v1", "topic": "principles", "tname": "감염치료 원칙", "src": "2024 카바페넴 내성 장내세균목(CRE) 감염증 항생제 사용 지침 (KDCA) · IDSA 2024 AMR Guidance", "q": "72세 여성이 발열과 우측 늑골척추각 압통, 배뇨통으로 응급실에 내원하였다. 체온 38.9도, 혈압 96/58 mmHg, 맥박 112회/분, 호흡수 22회/분이었고 WBC 16,400/uL, CRP 18.2 mg/dL, SCr 1.0 mg/dL(eGFR 62 mL/min/1.73m2)이었다. 요로성 패혈증으로 판단하여 meropenem 1 g q8h를 경험적으로 시작하였다. 입원 2일째 혈액배양 2쌍과 소변배양에서 모두 Escherichia coli가 동정되었고, ESBL 음성이며 ampicillin·cefazolin·ceftriaxone·ciprofloxacin·TMP-SMX 모두 감수성이었다. 3일째 체온 36.8도, 혈압 118/72 mmHg로 안정되었고 경구 섭취가 가능하다. 이 시점의 항생제 조정으로 가장 적절한 것은?", "choices": ["meropenem 1 g q8h를 그대로 유지하여 총 14일간 투여한다", "meropenem에 amikacin을 추가하여 병용 상승효과를 얻는다", "ceftriaxone 2 g q24h로 탈에스컬레이션하고 총 7일에 종료한다", "ciprofloxacin 400 mg q12h와 gentamicin 병용요법으로 변경한다"], "answer": 3, "explain": "경험적으로 시작한 광범위 항생제는 배양·감수성 결과가 확인되면 유효한 약제 중 가장 좁은 스펙트럼으로 신속히 탈에스컬레이션하는 것이 감염치료의 기본 원칙이다. ESBL 음성 감수성 E. coli에 의한 요로성 패혈증은 ceftriaxone으로 충분하며, 균혈증을 동반한 급성 신우신염도 임상반응이 양호하면 7일 치료로 종료할 수 있다. carbapenem을 유지하는 것(1)은 CRE 발생 위험을 높이는 불필요한 노출로 국내 CRE 지침이 명시적으로 경계하는 사용 행태이다. 감수성 단일 약제로 조절되는 상황에서 aminoglycoside 병용(2)은 신독성만 더하며, 국내 E. coli의 fluoroquinolone 내성률이 높아 (4)의 조합도 근거가 없다.", "level": 1}, {"id": "principles-v2", "topic": "principles", "tname": "감염치료 원칙", "src": "2024 카바페넴 내성 장내세균목(CRE) 감염증 항생제 사용 지침 (KDCA) · IDSA 2024 Guidance on Treatment of AMR Gram-negative Infections", "q": "64세 남성이 중환자실 재원 12일째 인공호흡기를 적용한 상태에서 발열이 발생하였다. 체온 39.1도, 혈압 88/52 mmHg로 norepinephrine을 유지 중이며 WBC 21,000/uL, procalcitonin 8.4 ng/mL이다. 혈액배양에서 Klebsiella pneumoniae가 동정되었고 meropenem MIC >16 mg/L, imipenem MIC >16 mg/L, colistin MIC 0.5 mg/L, tigecycline MIC 1 mg/L, ceftazidime-avibactam MIC 2 mg/L(감수성)였다. 카바페넴분해효소 유전자 검사에서 blaKPC-2 양성, blaNDM 및 blaOXA-48 음성이었다. SCr 1.1 mg/dL, CrCl 68 mL/min이다. 가장 적절한 치료는?", "choices": ["colistin 부하용량 투여 후 tigecycline과 병용요법을 시작한다", "ceftazidime-avibactam 2.5 g q8h 단독요법을 시작한다", "meropenem 2 g를 3시간 연장주입하여 고용량 단독으로 투여한다", "ceftazidime-avibactam에 aztreonam을 추가하여 병용 투여한다"], "answer": 2, "explain": "KPC형 카바페넴분해효소를 생성하는 CRE 균혈증에서 국내 CRE 지침과 IDSA AMR guidance는 모두 ceftazidime-avibactam(또는 meropenem-vaborbactam, imipenem-relebactam) 단독요법을 1차로 권고한다. 이들 신약은 colistin 기반 병용요법에 비해 사망률과 신독성 측면에서 우월한 근거가 축적되어 있어 colistin+tigecycline(1)은 신약을 쓸 수 없을 때의 대안으로 밀려났다. meropenem MIC가 16 mg/L를 초과하므로 연장주입(3)으로도 목표 노출을 달성할 수 없다. aztreonam 병용(4)은 metallo-베타락탐분해효소 생성균에 필요한 전략이므로 KPC 단독 검출 시에는 불필요하다. 국내에서는 meropenem-vaborbactam의 공급이 제한적이어서 실제 선택은 ceftazidime-avibactam이 중심이 된다.", "level": 2}, {"id": "principles-v3", "topic": "principles", "tname": "감염치료 원칙", "src": "2024 카바페넴 내성 장내세균목(CRE) 감염증 항생제 사용 지침 (KDCA) · IDSA 2024 Guidance on Treatment of AMR Gram-negative Infections", "q": "52세 여성이 간이식 3주 후 담도 문합부 누출로 재수술을 받았고, 수술 후 발열 38.7도와 오한이 발생하였다. 혈액배양에서 Escherichia coli가 동정되었으며 meropenem MIC >16 mg/L, ceftazidime-avibactam MIC >64 mg/L(내성), aztreonam MIC >32 mg/L(내성), colistin MIC 0.5 mg/L였다. 카바페넴분해효소 유전자형 검사에서 blaNDM-5 양성이었다. SCr 0.8 mg/dL, CrCl 96 mL/min이며 본원에는 cefiderocol이 구비되어 있지 않다. 가장 적절한 항생제 요법은?", "choices": ["meropenem-vaborbactam 4 g q8h 단독요법을 시작한다", "imipenem-relebactam 1.25 g q6h 단독요법을 시작한다", "ceftazidime-avibactam 용량을 2배로 증량하여 단독 투여한다", "aztreonam과 ceftazidime-avibactam을 함께 병용 투여한다"], "answer": 4, "explain": "NDM은 metallo-베타락탐분해효소로 avibactam·vaborbactam·relebactam 어느 것으로도 억제되지 않으므로 이들 베타락탐/억제제 복합제의 단독요법(1·2·3)은 용량을 올려도 무효하다. aztreonam은 metallo-베타락탐분해효소에 가수분해되지 않아 이론적으로 유효하지만, 이 균주처럼 ESBL이나 AmpC를 함께 보유하면 단독으로는 내성을 보인다. 따라서 avibactam이 동반 효소를 억제해 aztreonam을 보호하도록 두 약제를 병용하는 것이 국내 CRE 지침과 IDSA AMR guidance가 제시하는 metallo-베타락탐분해효소 생성균의 표준 전략이다. cefiderocol도 대안이지만 본 사례에서는 사용할 수 없다. 미국에서는 aztreonam-avibactam 단일제제 사용이 확대되고 있으나 국내 도입은 아직 제한적이어서 두 약제를 각각 투여하는 방식이 현실적 선택이다.", "level": 3}, {"id": "principles-v4", "topic": "principles", "tname": "감염치료 원칙", "src": "IDSA 2024 Guidance on Treatment of AMR Gram-negative Infections · 감염치료의 원칙(감염원 조절)", "q": "68세 남성이 발열과 우상복부 통증으로 내원하였다. 체온 39.2도, 혈압 92/54 mmHg, 맥박 118회/분이었고 총빌리루빈 6.8 mg/dL, ALP와 GGT가 상승해 있었으며 WBC 19,200/uL였다. 복부 CT에서 14 mm로 확장된 총담관과 총담관 결석, 담관 주위 염증 소견이 확인되었다. 입원 즉시 piperacillin-tazobactam 4.5 g q6h를 시작하였고 혈액배양에서 Escherichia coli가 동정되었는데 투여 중인 약제에 감수성이었다. 그러나 48시간이 지난 현재도 체온 38.9도, WBC 18,600/uL로 호전이 없다. 가장 우선적으로 시행해야 할 조치는?", "choices": ["응급 내시경역행담췌관조영술(ERCP)을 시행하여 담즙을 배액한다", "piperacillin-tazobactam을 meropenem으로 상향 변경한다", "vancomycin을 추가하여 그람양성알균에 대한 커버리지를 보강한다", "fluconazole을 추가하여 칸디다에 대한 경험적 커버를 시작한다"], "answer": 1, "explain": "동정된 균이 투여 중인 항생제에 감수성인데도 48시간 이상 임상반응이 없다면 항생제 문제가 아니라 감염원 조절(source control) 실패를 먼저 의심해야 한다. 폐쇄성 담관염은 담즙 배액 없이 항생제만으로 해결되지 않으므로 응급 ERCP를 통한 배액이 최우선이며, 이는 국내 지침과 IDSA가 공통으로 강조하는 감염치료의 기본 원칙이다. 감수성이 확인된 상태에서 carbapenem으로 상향(2)하는 것은 스펙트럼만 넓힐 뿐 원인을 해결하지 못하고 내성 압력을 높인다. 담도 배액 전 그람양성균(3)을 추가로 커버할 근거가 없으며, 지역사회획득 담관염에서 경험적 항진균제(4)도 권고되지 않는다.", "level": 2}, {"id": "principles-v5", "topic": "principles", "tname": "감염치료 원칙", "src": "2024 카바페넴 내성 장내세균목(CRE) 감염증 항생제 사용 지침 (KDCA)", "q": "82세 여성이 요양병원에서 전원되었다. 3개월간 유치도뇨관을 유지해 왔으며 내원 시 체온 36.7도, 혈압 124/76 mmHg, 맥박 78회/분으로 안정적이고 WBC 6,800/uL, CRP 0.4 mg/dL였다. 배뇨통, 측복부 통증, 의식 변화, 오한 등 어떤 증상도 없다. 도뇨관에서 채취한 소변배양에서 Klebsiella pneumoniae가 10^5 CFU/mL 이상 자랐고 meropenem MIC 8 mg/L(내성), blaKPC 양성이었다. 혈액배양은 음성이다. 가장 적절한 조치는?", "choices": ["colistin 정맥주사를 시작하여 CRE를 조기에 제균한다", "항생제를 투여하지 않고 도뇨관 필요성을 재평가하며 접촉주의를 유지한다", "ceftazidime-avibactam을 7일간 투여하여 요로 내 균을 제거한다", "fosfomycin 경구요법으로 무증상 세균뇨를 치료하고 배양을 추적한다"], "answer": 2, "explain": "발열·배뇨증상·염증지표 상승이 모두 없는 도뇨관 관련 무증상 세균뇨는 원인균이 CRE라 하더라도 치료 대상이 아니다. 국내 CRE 지침은 집락(colonization)과 감염을 명확히 구분하고 무증상 보균자에게 항생제를 투여하지 않도록 권고하며, 이 상황의 표준 조치는 불필요한 유치도뇨관의 제거 검토와 접촉주의 등 감염관리이다. 불필요한 colistin(1)이나 ceftazidime-avibactam(3) 투여는 제균 효과 없이 신독성과 추가 내성 선택압만 유발한다. fosfomycin 경구요법(4) 역시 무증상 세균뇨의 치료 적응이 아니며, 임신부와 침습적 비뇨기 시술 예정자만 예외적으로 치료 대상이 된다.", "level": 1}, {"id": "tdm-v1", "topic": "tdm", "tname": "항생제 TDM", "src": "ASHP/IDSA/PIDS/SIDP Revised Consensus Guideline: Therapeutic Monitoring of Vancomycin (2020)", "q": "55세 남성(체중 72 kg)이 MRSA 균혈증으로 vancomycin 1 g q8h를 투여받고 있다. 혈액배양 2쌍에서 MRSA가 동정되었고 vancomycin MIC는 1 mg/L였다. 투여 4일째 SCr 0.9 mg/dL, CrCl 95 mL/min으로 신기능은 변화가 없다. 두 시점 채혈로 산출한 정상상태 AUC24는 480 mg·h/L, trough는 11.5 mg/L였다. 체온은 36.9도로 해열되었고 추적 혈액배양은 음전되었다. 담당의는 trough가 15 mg/L 미만이므로 증량하자고 요청하였다. 약사의 권고로 가장 적절한 것은?", "choices": ["AUC24/MIC가 목표 범위에 있으므로 현재 용량을 유지하고 모니터링을 지속한다", "trough 15~20 mg/L를 달성하기 위해 1.25 g q8h로 증량하고 재측정한다", "신독성 예방을 위해 1 g q12h로 감량하고 3일 후 다시 측정한다", "vancomycin을 중단하고 daptomycin 8 mg/kg q24h로 변경한다"], "answer": 1, "explain": "2020년 개정 합의지침은 MRSA 중증감염에서 vancomycin의 노출 목표를 AUC24/MIC 400~600(MIC 1 mg/L 가정)으로 제시하고, 기존의 trough 15~20 mg/L 목표는 더 이상 권고하지 않는다. 이 환자의 AUC24 480 mg·h/L는 목표 범위 안에 있으며 임상적·미생물학적 반응도 양호하므로 용량 변경이 필요하지 않다. trough 수치만 보고 증량하면(2) AUC가 600을 넘어 급성신손상 위험만 커지는데, 이것이 개정 지침이 trough 기반 모니터링을 폐기한 핵심 이유이다. AUC가 400 미만이 아니므로 감량(3)은 치료 실패를 초래할 수 있고, 배양 음전과 해열이 확인된 상태에서 daptomycin으로 전환(4)할 임상적 근거도 없다.", "level": 1}, {"id": "tdm-v2", "topic": "tdm", "tname": "항생제 TDM", "src": "ASHP/IDSA/PIDS/SIDP Revised Consensus Guideline: Therapeutic Monitoring of Vancomycin (2020)", "q": "45세 여성(실제체중 60 kg, 신장 160 cm)이 응급실에 내원하였다. 체온 39.4도, 혈압 82/48 mmHg로 승압제를 시작하였고 젖산 4.8 mmol/L였다. 흉부 X선에서 우하엽 침윤이 있고 객담 그람염색에서 그람양성알균이 다수 관찰되었다. 최근 혈액투석 도관 감염으로 치료받은 이력이 있어 MRSA 감염이 강력히 의심된다. SCr 1.0 mg/dL, CrCl 78 mL/min이며 즉시 vancomycin을 투여하려고 한다. 초기 투여 전략으로 가장 적절한 것은?", "choices": ["부하용량 없이 1 g q12h로 시작하고 4일째 trough를 측정한다", "이상체중 기준 15 mg/kg인 약 800 mg을 부하용량으로 투여한다", "실제체중 기준 25 mg/kg인 약 1,500 mg을 부하용량으로 투여한다", "실제체중 기준 40 mg/kg인 약 2,400 mg을 부하용량으로 투여한다"], "answer": 3, "explain": "2020년 개정 합의지침은 중증 MRSA 감염에서 목표 노출에 신속히 도달하기 위해 실제체중 기준 20~35 mg/kg(1회 최대 약 3,000 mg)의 부하용량을 권고한다. 실제체중 60 kg 환자에서 25 mg/kg는 약 1,500 mg으로 이 범위에 정확히 해당한다. 부하용량을 생략하면(1) 정상상태 도달까지 2~3일이 걸려 패혈증 쇼크 환자에서 초기 노출이 결정적으로 부족해지고, 4일째 trough 측정 역시 개정 지침이 권고하지 않는 모니터링 방식이다. vancomycin 용량은 이상체중이 아닌 실제체중으로 계산하므로 (2)는 과소용량이며, 권고 상한인 35 mg/kg를 크게 넘는 (4)는 초기 과다 노출로 신독성 위험만 높이므로 부적절하다.", "level": 2}, {"id": "tdm-v3", "topic": "tdm", "tname": "항생제 TDM", "src": "ASHP/IDSA/PIDS/SIDP Revised Consensus Guideline: Therapeutic Monitoring of Vancomycin (2020)", "q": "70세 남성(체중 65 kg)이 원내폐렴과 MRSA 균혈증으로 vancomycin 1 g q8h와 piperacillin-tazobactam 4.5 g q6h를 병용 투여받은 지 7일째이다. 입원 당시 SCr 1.0 mg/dL(CrCl 62 mL/min)였으나 현재 SCr 2.1 mg/dL로 상승했고 소변량이 0.4 mL/kg/h로 감소하였다. 베이지안 방법으로 추정한 AUC24는 740 mg·h/L였다. 발열은 없고 추적 혈액배양은 음전되었으나 객담에서 Pseudomonas aeruginosa가 지속 검출되어 녹농균 커버가 여전히 필요하다. 가장 적절한 조치는?", "choices": ["vancomycin 용량은 유지하고 piperacillin-tazobactam만 연장주입으로 변경한다", "vancomycin과 piperacillin-tazobactam을 모두 중단하고 신기능 회복을 기다린다", "vancomycin과 piperacillin-tazobactam 용량을 유지하며 trough만 주 2회 추적한다", "vancomycin은 감량하고 piperacillin-tazobactam은 cefepime으로 변경한다"], "answer": 4, "explain": "AUC24가 600 mg·h/L를 초과하면 급성신손상 위험이 뚜렷하게 증가하므로 개정 지침은 AUC24 400~600 유지를 위한 즉각적인 용량 조정을 권고하며, 본 환자는 740으로 명백한 과다 노출 상태이다. 또한 vancomycin과 piperacillin-tazobactam 병용은 신손상 위험을 상승시키는 조합으로 잘 알려져 있어, 녹농균 커버가 계속 필요하다면 cefepime 같은 대체 베타락탐으로 전환하는 것이 합리적이다. piperacillin-tazobactam을 연장주입으로 바꾸는 것(1)은 AUC 과다도 병용 신독성도 해결하지 못한다. MRSA 균혈증 치료 도중 항생제를 모두 중단하면(2) 재발 위험이 크고, trough만 추적하는 것(3)은 개정 지침이 권고하지 않는 방식이며 이미 신손상이 진행 중인 상황에 특히 부적절하다.", "level": 3}, {"id": "biostat-v1", "topic": "biostat", "tname": "의학통계·논문비평", "src": "약료정보학 (신일북스, 2021) Section III · Users' Guides to the Medical Literature, 3rd ed. (2015)", "q": "중증 지역사회획득 폐렴으로 입원한 성인 1,200명을 대상으로 표준치료에 corticosteroid를 추가한 군(n=600)과 위약군(n=600)을 비교한 이중맹검 무작위배정 임상시험이 발표되었다. 일차 결과변수인 28일 전체 사망률은 corticosteroid군 12.0%(72/600), 위약군 18.0%(108/600)였고 p=0.004였다. 이 결과의 해석으로 옳은 것은?", "choices": ["상대위험감소는 6.0%이고 필요치료수(NNT)는 약 6명이다", "절대위험감소는 6.0%이고 필요치료수(NNT)는 약 17명이다", "절대위험감소는 33.3%이고 필요치료수(NNT)는 약 3명이다", "상대위험감소는 6.0%이고 필요치료수(NNT)는 약 17명이다"], "answer": 2, "explain": "절대위험감소(ARR)는 두 군의 사건 발생률 차이인 18.0% 빼기 12.0% 즉 6.0%포인트이고, 필요치료수(NNT)는 1/ARR = 1/0.06 이므로 약 1 에 왔다. 병변은 직경 5 cm의 파동성 농양이며 주변으로 4 cm의 발적과 압통이 동반되어 있다. 체온 38.5도, 맥박 104회/분, 혈압 116/72 mmHg이고 백혈구 13,800/mm3이다. 응급실에서 절개배농을 시행해 다량의 농을 배출하였고 농 배양을 의뢰한 상태이다. 지역사회 연관 MRSA 분리 빈도가 낮지 않은 지역이며, 환자는 임신 중이 아니고 신기능은 정상이며 경구 복용이 가능하다. 이후 가장 적절한 처치는?", "choices": ["절개배농으로 치료가 완결되었으므로 추가 항생제 없이 경과만 관찰한다", "Cephalexin 500 mg을 하루 4회 경구로 추가 투여한다", "입원시켜 vancomycin 정주로 전환하고 14일간 투여한다", "Trimethoprim-sulfamethoxazole 또는 doxycycline을 경구로 추가 투여한다"], "answer": 4, "explain": "피부 농양 치료의 핵심은 절개배농이지만, 발열·빈맥 같은 전신 염증반응이 동반되거나 병변이 크고 봉와직염이 넓게 퍼진 중등도 이상에서는 국내 지침과 IDSA 지침 모두 배농에 더해 MRSA를 표적하는 항생제 병용을 권고한다. 경구 선택지로는 trimethoprim-sulfamethoxazole, doxycycline, clindamycin이 대표적이다. 1번은 전신 증상이 있는 환자에서 불충분하고, 2번의 cephalexin은 MRSA에 활성이 없다. 활력징후가 안정적이고 경구 복용이 가능하므로 3번처럼 입원 정주 치료로 시작할 필요는 없으며, 배양·감수성 결과가 나오면 좁은 스펙트럼으로 조정한다.", "level": 2}, {"id": "ssti-v3", "topic": "ssti", "tname": "피부·연조직감염", "src": "피부 연조직 감염 항생제 사용지침 (국내)", "q": "57세 남자가 하루 전 시작된 좌측 하지 통증으로 응급실에 왔다. 겉으로 보이는 홍반의 범위에 비해 통증이 지나치게 심하고, 지난 12시간 동안 병변이 무릎까지 급속히 확대되었으며 출혈성 수포와 병변 중심부의 감각저하, 촉진 시 염발음이 관찰된다. 혈압 82/50 mmHg, 맥박 128회/분, 체온 39.1도이고 백혈구 22,000/mm3, C반응단백 28 mg/dL, 크레아티닌 2.1 mg/dL, 젖산 4.5 mmol/L이다. 2형 당뇨 병력이 있다. 가장 적절한 처치는?", "choices": ["즉시 외과적 탐색과 변연절제를 시행하면서 piperacillin-tazobactam + vancomycin + clindamycin을 투여한다", "MRI로 근막 침범 범위를 먼저 확인한 뒤 수술 여부를 결정한다", "Cefazolin 정주로 시작하고 24시간 후 반응을 평가해 수술을 의뢰한다", "혈액배양 결과가 확인될 때까지 항생제를 보류하고 수액소생과 승압제만 시행한다"], "answer": 1, "explain": "소견에 비해 과도한 통증, 급속한 진행, 출혈성 수포, 피부 감각저하, 염발음, 저혈압과 젖산 상승은 괴사성 연조직감염을 강하게 시사하며, 이 질환의 예후를 좌우하는 것은 조기 외과적 탐색과 광범위 변연절제이다. 항생제는 그람양성·그람음성·혐기성균을 모두 포괄하는 광범위 요법(piperacillin-tazobactam 또는 카바페넴)에 MRSA 대비 vancomycin을 더하고, 사슬알균·클로스트리듐 외독소 생성을 억제하기 위해 clindamycin을 병용한다. 2번처럼 영상검사를 기다리면 수술이 지연되어 사망률이 올라가고, 3번의 좁은 스펙트럼 단독 요법과 관망은 부적절하다. 4번처럼 패혈성 쇼크 상태에서 항생제를 미루는 것은 금기이다.", "level": 3}, {"id": "ssti-v4", "topic": "ssti", "tname": "피부·연조직감염", "src": "피부 연조직 감염 항생제 사용지침 (국내) · IWGDF/IDSA Diabetes-related Foot Infections", "q": "62세 남자가 2형 당뇨를 12년째 앓고 있으며 우측 제1중족지 부위의 궤양 주변에 발적이 생겨 내원하였다. 발적은 궤양 가장자리에서 1.5 cm 범위이고 경도의 부종과 압통, 소량의 화농성 분비물이 있다. 체온 36.9도, 혈압 130/78 mmHg으로 전신 증상은 없고 백혈구 8,900/mm3, C반응단백 1.8 mg/dL이다. 탐침 검사에서 뼈가 만져지지 않고 단순촬영에서 골파괴 소견도 없다. 최근 3개월 내 항생제 사용력과 MRSA 배양력이 없으며 추정사구체여과율 78 mL/min, 발등동맥 박동은 잘 촉지된다. 가장 적절한 치료는?", "choices": ["입원시켜 piperacillin-tazobactam 정주 광범위 요법을 시작한다", "Cephalexin 또는 amoxicillin-clavulanate를 경구로 1–2주간 투여한다", "Vancomycin과 ciprofloxacin을 경험적으로 병용해 4주간 투여한다", "궤양 면봉배양에서 자란 모든 균을 표적으로 6주간 광범위 항생제를 투여한다"], "answer": 2, "explain": "발적 범위가 궤양 가장자리에서 2 cm 이내이고 전신 염증반응이 없으며 골이나 심부 조직 침범이 없는 경증 당뇨발 감염이다. 국내 지침과 IWGDF/IDSA 권고는 이런 경증 감염에서 최근 항생제 노출이나 MRSA 위험인자가 없다면 황색포도알균과 사슬알균을 표적하는 좁은 스펙트럼 경구 항생제를 1–2주간 투여하도록 한다. 1번과 3번은 스펙트럼과 투여경로가 과도하고 3번은 기간도 근거가 없다. 탐침 검사 음성과 정상 단순촬영으로 골수염 가능성이 낮으므로 4번의 6주 치료는 불필요하며, 면봉으로 채취한 표재 배양의 오염균까지 모두 표적하는 것은 권고되지 않는다. 창상 관리와 감압, 혈류 평가를 병행해야 한다.", "level": 1}, {"id": "ssti-v5", "topic": "ssti", "tname": "피부·연조직감염", "src": "피부 연조직 감염 항생제 사용지침 (국내) · IWGDF/IDSA Diabetes-related Foot Infections", "q": "68세 여자가 2형 당뇨로 치료 중이며 우측 제5중족골두 아래 궤양이 6주간 낫지 않아 입원하였다. 궤양 주위로 5 cm의 발적과 부종이 있고 체온 38.3도, 맥박 102회/분, 백혈구 15,000/mm3, C반응단백 12 mg/dL이다. 탐침 검사에서 뼈가 단단하게 만져지고 MRI에서 제5중족골 골수 신호변화와 피질 파괴가 확인되었다. 2년 전 MRSA 균혈증으로 치료받은 병력이 있다. 체중 60 kg, 추정사구체여과율 32 mL/min/1.73m2이며, 혈류가 양호해 절단이나 골 절제 없이 항생제로 치료하기로 하였다. 가장 적절한 치료 계획은?", "choices": ["Cefazolin 단독으로 2주간 정주한 뒤 치료를 종료한다", "Ciprofloxacin과 metronidazole을 경구로 10일간 투여한다", "Vancomycin을 최저농도 10–15 mcg/mL 목표로 조절해 2주간 투여한 뒤 중단한다", "Vancomycin을 목표 AUC 400–600으로 신기능에 맞춰 조절하고 그람음성균 커버를 병용해 총 6주간 치료한다"], "answer": 4, "explain": "탐침 검사 양성과 MRI 소견으로 당뇨발 골수염이 확진되었고, 감염 골을 절제하지 않고 항생제만으로 치료할 경우 국내 지침과 IWGDF/IDSA 권고는 최소 6주간의 치료를 제시한다(감염 골을 완전히 절제하면 2–5일, 잔존 감염 연부조직이 있으면 약 3주). 과거 MRSA 균혈증 병력이라는 뚜렷한 위험인자가 있고 중증 감염이므로 vancomycin을 포함하되, 추정사구체여과율 32 mL/min이므로 최저농도 15–20 대신 AUC 400–600 기반 용량조절로 신독성을 줄여야 한다. 1번은 MRSA를 놓치고 기간도 부족하며, 2번은 포도알균 활성이 부족한 경구 요법이다. 3번의 높은 최저농도 목표는 2020년 반코마이신 TDM 개정 합의지침에서 폐기되었고 2주 기간도 미달이다.", "level": 2}, {"id": "bonejoint-v1", "topic": "bonejoint", "tname": "골관절감염", "src": "국내 골관절감염 항균요법 권고안 · IDSA 2015 Native Vertebral Osteomyelitis", "q": "66세 남자가 4주간 점차 심해진 요통과 3일간의 발열로 입원하였다. 체온 38.4도, 혈압 128/76 mmHg이고 L3-4 부위에 국소 압통이 있으나 하지 근력저하나 배뇨장애는 없다. 요추 MRI에서 L3-4 추간판과 인접 척추체의 신호변화가 있고 경막외 농양이나 척수 압박은 없다. 입원 시 채취한 혈액배양 2세트 모두에서 Staphylococcus aureus가 자랐고 oxacillin 감수성이다. 크레아티닌 0.9 mg/dL이고 베타락탐 알레르기는 없으며 인공물이 삽입된 병력도 없다. 가장 적절한 다음 단계는?", "choices": ["CT 유도 척추 생검을 추가로 시행해 원인균을 재확인한 뒤 항생제를 시작한다", "혈액배양 결과에 근거해 cefazolin 2 g 정주 8시간마다로 6주간 치료한다", "Vancomycin을 6주간 투여하고 2주 후 MRI를 재촬영해 치료기간을 결정한다", "경구 ciprofloxacin과 rifampin 병용으로 12주간 치료한다"], "answer": 2, "explain": "MRI 소견이 합당하고 혈액배양에서 황색포도알균이 자란 자연 척추 골수염에서는 추가 척추 생검 없이 혈액배양 결과에 근거해 표적 치료를 시작할 수 있다는 것이 국내 권고안과 IDSA 2015 지침의 입장이다. 메티실린 감수성 균주에는 항포도알균 페니실린이 표준이나 국내에는 주사제가 없어 cefazolin 정주가 실질적 1차이며, 치료기간은 통상 6주이다. 3번의 vancomycin은 베타락탐을 쓸 수 있는 상황에서 열등하고, 임상 반응이 좋은 환자에서 추적 MRI로 기간을 정하는 것은 권고되지 않는다(영상 호전이 임상 호전보다 늦다). 4번의 rifampin 병용은 인공물이 있는 감염에서 의미가 있으며 인공물이 없는 자연 척추 골수염의 표준요법은 아니다.", "level": 2}, {"id": "bonejoint-v2", "topic": "bonejoint", "tname": "골관절감염", "src": "국내 골관절감염 항균요법 권고안 · IDSA 2015 Native Vertebral Osteomyelitis", "q": "58세 여자가 3주간의 요통과 미열로 전원되었다. 타 병원에서 5일 전부터 cefazolin을 투여받고 있었으며 전원 시 체온 37.6도, 혈압 124/74 mmHg으로 안정적이고 신경학적 결손은 없다. 흉요추 MRI에서 T11-12 척추체와 추간판을 침범한 척추염 소견이 뚜렷하다. 항생제 투여 후 채취한 혈액배양 2세트는 음성이었고, CT 유도 척추 생검에서도 세균 배양이 음성으로 나왔다. 염증수치는 소폭 감소했으나 통증은 지속된다. 가장 적절한 다음 단계는?", "choices": ["원인균 확인을 포기하고 경험적 광범위 항생제를 6주간 유지하며 경과를 관찰한다", "항산균 검사 없이 곧바로 경험적 항결핵제를 시작한다", "즉시 수술적 변연절제와 기기 고정술을 시행해 병소를 제거한다", "혈역학적으로 안정하므로 항생제를 1–2주 중단한 뒤 생검을 반복하고 결핵·브루셀라·진균 검사를 함께 시행한다"], "answer": 4, "explain": "첫 생검 배양이 음성이면서 환자가 혈역학적으로 안정되어 있다면, 국내 권고안과 IDSA 2015 지침은 선행 항생제의 영향을 줄이기 위해 가능하면 항생제를 일정 기간 중단한 뒤 생검을 반복하고, 이때 항산균·진균 배양과 결핵·브루셀라 관련 검사를 함께 보내도록 권고한다. 국내는 척추결핵 비중이 상대적으로 높아 항산균 검사와 조직병리 확인이 특히 중요하다. 1번처럼 원인균 없이 장기간 광범위 항생제를 쓰면 진단 기회를 잃고 부작용·내성만 늘고, 2번은 검사 없이 결핵으로 단정하는 것이어서 부적절하다. 신경학적 결손이나 척수 압박, 불안정성, 내과적 치료 실패가 없는 상태에서 3번처럼 즉시 수술을 하는 것은 적응증에 맞지 않는다.", "level": 3}, {"id": "bonejoint-v3", "topic": "bonejoint", "tname": "골관절감염", "src": "국내 골관절감염 항균요법 권고안 · IDSA Prosthetic Joint Infection (PJI)", "q": "69세 여자가 우측 고관절 전치환술을 받은 지 18일째에 수술 부위 발적과 장액혈성 배액, 38.5도 발열로 재입원하였다. 증상은 4일 전부터 시작되었다. 관절천자액은 백혈구 28,000/mm3(다형핵구 92%)이고 배양에서 메티실린 감수성 Staphylococcus aureus가 동정되었다. 단순촬영에서 임플란트 해리 소견이 없고 누공도 없으며 주변 연부조직 상태는 비교적 양호하다. 크레아티닌 0.8 mg/dL, 간기능 정상이고 rifampin과 상호작용하는 병용약은 없다. 가장 적절한 치료 전략은?", "choices": ["임플란트를 즉시 제거하고 항생제 시멘트 스페이서를 넣는 2단계 재치환술을 시행한다", "수술 없이 경구 항생제 억제요법을 시작해 평생 유지한다", "변연절제·세척과 교체 가능한 삽입물 교환으로 임플란트를 보존하고 cefazolin 정주에 이어 rifampin 병용 경구요법으로 총 3개월간 치료한다", "관절천자 배농만 반복하면서 vancomycin을 6주간 정주한다"], "answer": 3, "explain": "증상 발현 3주 이내, 수술 후 1개월 이내의 조기 인공관절 감염으로 임플란트가 안정적이고 연부조직 상태가 양호하며 누공이 없으므로, 국내 권고안과 IDSA PJI 지침은 임플란트를 보존하는 변연절제·세척 및 교체 가능한 부품 교환(DAIR)을 우선 고려한다. 포도알균 감염에서 임플란트를 남길 때는 생물막 투과성이 좋은 rifampin 병용이 핵심이며, 내성 발생을 막기 위해 반드시 다른 약제와 함께 사용하고 배농이 정리된 뒤 추가한다. 총 치료기간은 고관절에서 3개월, 슬관절에서는 6개월이 기준이다. 임플란트가 안정적인 조기 감염에서 1번의 즉시 제거는 과도하고, 2번의 억제요법은 수술이 불가능한 환자에 한정되며, 4번처럼 천자 배농만 반복하는 것은 생물막을 제거하지 못해 실패한다.", "level": 2}, {"id": "bonejoint-v4", "topic": "bonejoint", "tname": "골관절감염", "src": "국내 골관절감염 항균요법 권고안 · IDSA Prosthetic Joint Infection (PJI)", "q": "74세 남자가 좌측 슬관절 전치환술 3년 후 6개월간 지속된 무릎 통증으로 내원하였다. 최근 2개월간 피부 누공에서 간헐적으로 농이 배출되고 있으며, 단순촬영에서 대퇴 및 경골 삽입물 주위로 진행성 방사선 투과선과 해리 소견이 보인다. 체온 37.4도, 혈압 134/80 mmHg으로 전신 상태는 비교적 안정적이고 관절액 배양에서 메티실린내성 Staphylococcus aureus가 동정되었다. 심폐기능이 양호해 재수술을 견딜 수 있다고 평가되었다. 가장 적절한 치료 전략은?", "choices": ["변연절제·세척으로 임플란트를 보존하고 rifampin 병용요법을 3개월간 시행한다", "누공 부위 국소 소독만 시행하며 전신 항생제 없이 경과를 관찰한다", "임플란트를 제거하는 2단계 재치환술을 시행하고 표적 항생제를 정주한다", "경구 항생제 억제요법을 4주간만 시행한 뒤 종료한다"], "answer": 3, "explain": "증상이 3주를 훨씬 넘겨 지속되고 누공이 있으며 임플란트가 해리된 만성 인공관절 감염은 생물막이 성숙해 임플란트 보존 전략의 실패율이 매우 높으므로, 국내 권고안과 IDSA PJI 지침은 임플란트를 제거하는 2단계 재치환술을 표준으로 제시한다. 제거 후에는 균에 맞춘 항생제를 통상 4–6주간 정주하고 재삽입 전 감염 소실을 확인한다. 1번의 임플란트 보존은 누공과 해리가 있는 시점에서 금기에 가깝고, 4번의 억제요법은 수술이 불가능하거나 거부하는 환자에서 무기한 지속하는 방식이므로 4주 만에 끝내는 것은 근거가 없다. 2번처럼 전신 항생제 없이 국소 처치만 하는 것은 어떤 상황에서도 권고되지 않는다.", "level": 1}, {"id": "uti-v1", "topic": "uti", "tname": "요로감염", "src": "요로감염 항생제 사용지침 (국내, 대한감염학회·대한화학요법학회 2018)", "q": "24세 여성이 2일 전부터의 배뇨통, 빈뇨, 급박뇨로 내원하였다. 체온 36.9도, 혈압 116/72 mmHg이며 늑골척추각 압통과 오심·구토는 없다. 임신반응검사 음성이고 최근 6개월간 항생제 사용력이나 입원력이 없으며, 요로계 기저질환도 없다. 혈청 크레아티닌 0.7 mg/dL, 요검사에서 농뇨와 아질산염 양성이다. 이 환자의 경험적 항생제로 국내 지침상 가장 적절한 것은?", "choices": ["Fosfomycin trometamol 3 g 경구 단회 투여", "Ciprofloxacin 500 mg 1일 2회 7일 경구 투여", "TMP-SMX 160/800 mg 1일 2회 3일 경구 투여", "Ceftriaxone 1 g 정주 1일 1회 7일 투여"], "answer": 1, "explain": "임신·기저 요로질환·최근 항생제 노출이 없는 전형적 급성 단순 방광염으로, 국내 지침은 1차 경험적 요법으로 fosfomycin trometamol 3 g 단회(또는 nitrofurantoin, pivmecillinam)를 권고한다. 국내 지역사회 대장균의 fluoroquinolone 및 TMP-SMX 내성률이 모두 20%를 넘어 두 약제 모두 경험적 1차 선택으로는 부적합하다. 특히 fluoroquinolone은 대체 약제가 있는 단순 방광염에서는 부작용과 내성 유발을 고려해 사용을 자제하도록 권고된다. 정주 3세대 세팔로스포린을 7일 투여하는 것은 단순 방광염에 과도한 광범위 치료다.", "level": 1}, {"id": "uti-v2", "topic": "uti", "tname": "요로감염", "src": "요로감염 항생제 사용지침 (국내, 대한감염학회·대한화학요법학회 2018)", "q": "32세 여성이 임신 26주 정기검진에서 시행한 소변배양에서 Escherichia coli가 두 차례 모두 10^5 CFU/mL 이상 검출되었다. 배뇨통, 빈뇨, 발열, 옆구리 통증은 전혀 없고 체온 36.8도, 혈압 110/68 mmHg이다. 혈청 크레아티닌 0.6 mg/dL이며 페니실린·세팔로스포린 알레르기는 없다. 분리균은 ampicillin 내성, cefuroxime·fosfomycin 감수성이다. 가장 적절한 처치는?", "choices": ["증상이 없으므로 항생제 없이 분만까지 경과를 관찰한다", "Ciprofloxacin 250 mg 1일 2회 3일 투여 후 경과를 관찰한다", "Cefuroxime axetil 250 mg 1일 2회 5~7일 투여 후 소변배양을 추적한다", "TMP-SMX 160/800 mg 1일 2회 3일 투여 후 소변배양을 추적한다"], "answer": 3, "explain": "무증상 세균뇨는 원칙적으로 치료 대상이 아니지만, 임신부와 점막 출혈이 예상되는 비뇨기계 시술 예정자는 선별과 치료가 권고되는 예외다. 임신부의 무증상 세균뇨를 방치하면 급성 신우신염 발생과 조산·저체중아 위험이 증가하므로 경과 관찰만 하는 것은 옳지 않다. 임신 중 fluoroquinolone은 태아 연골 독성 우려로 금기이고, TMP-SMX는 임신 초기 엽산길항에 따른 신경관결손과 만삭기 핵황달 위험 때문에 피한다. 베타락탐(cefuroxime, cephalexin, amoxicillin-clavulanate)이나 fosfomycin이 안전하며, 치료 후에는 소변배양으로 제균 여부를 확인해야 한다.", "level": 2}, {"id": "uti-v3", "topic": "uti", "tname": "요로감염", "src": "요로감염 항생제 사용지침 (국내, 2018)", "q": "32세 여성이 오한을 동반한 발열과 우측 옆구리 통증으로 응급실에 왔다. 체온 39.0도, 혈압 118/72 mmHg, 맥박 96회/분이며 우측 늑골척추각 압통이 뚜렷하다. 오심은 있으나 구토는 없고 경구 섭취가 가능하다. 임신은 아니며 요양시설 거주, 최근 3개월 내 입원이나 항생제 사용, 요로계 시술 병력이 모두 없다. 혈청 크레아티닌 0.7 mg/dL이고 요검사에서 농뇨와 백혈구 원주가 보인다. 소변·혈액배양을 시행한 뒤의 경험적 치료로 가장 적절한 것은?", "choices": ["경구 ciprofloxacin 500 mg 1일 2회 7일만으로 외래 치료를 시작한다", "Ceftriaxone 1 g 정주 1회 후 감수성 결과에 따라 경구 항생제로 전환한다", "Fosfomycin trometamol 3 g 경구 단회 투여로 치료를 종결한다", "Meropenem 1 g 정주 8시간마다 투여로 경험적 치료를 시작한다"], "answer": 2, "explain": "모든 급성 신우신염에서는 경험적 항생제 투여 전 소변배양이 필수이며, 국내 지침은 지역사회 대장균의 fluoroquinolone 내성률이 10%를 크게 상회하므로 경구 fluoroquinolone 단독으로 외래 치료를 시작하지 말고 ceftriaxone이나 aminoglycoside 정주 1회를 선행한 뒤 감수성 결과에 따라 경구로 전환하도록 권고한다. Fosfomycin 단회 요법은 방광염 용법으로 조직 감염인 신우신염에는 부적절하다. ESBL 위험인자(최근 3개월 내 항생제 사용·입원, 요양시설 거주, 과거 ESBL 균 분리)가 없는 지역사회획득 사례에서 carbapenem을 경험적으로 쓰는 것은 과도하다. 미국 IDSA는 지역 fluoroquinolone 내성률이 10% 미만이면 경구 fluoroquinolone 단독 외래 치료를 허용하는 점이 국내 권고와 다르다.", "level": 2}, {"id": "uti-v4", "topic": "uti", "tname": "요로감염", "src": "요로감염 항생제 사용지침 (국내, 2018) / IDSA-ESCMID Complicated UTI Guideline", "q": "68세 남성이 발열과 오한으로 내원하였다. 3개월 전 요양병원 입원 중 광범위 항생제를 투여받았고 신경인성 방광으로 유치도뇨관을 6주째 유지 중이다. 체온 38.6도, 혈압 106/68 mmHg으로 승압제는 필요하지 않다. 백혈구 15,200/mm3, 혈청 크레아티닌 1.1 mg/dL(추정 크레아티닌청소율 60 mL/min)이다. 소변과 혈액배양 모두에서 ESBL 생성 E. coli가 자랐고 ertapenem·amikacin 감수성, ciprofloxacin 내성, piperacillin-tazobactam은 MIC 8 mg/L로 감수성 보고되었다. 가장 적절한 처치는?", "choices": ["Cefepime 2 g 정주 12시간마다 투여하고 도뇨관은 그대로 유지한다", "Piperacillin-tazobactam 4.5 g 정주 6시간마다 투여하고 도뇨관은 그대로 유지한다", "Ciprofloxacin 400 mg 정주 12시간마다 투여하고 도뇨관을 교체한다", "Ertapenem 1 g 정주 1일 1회 투여하고 도뇨관을 교체하거나 제거한다"], "answer": 4, "explain": "균혈증을 동반한 ESBL 생성 장내세균 복잡성 요로감염에서는 시험관 내 감수성이 보고되더라도 piperacillin-tazobactam과 cefepime은 접종효과 등으로 치료 실패와 사망률 증가가 보고되어(MERINO 연구 등) carbapenem이 우선된다. 패혈성 쇼크가 없고 카바페넴분해효소 생성균 위험이 낮으므로 녹농균 커버가 필요 없는 ertapenem 1 g 1일 1회로 충분하며, 불필요한 광범위 carbapenem 사용을 줄일 수 있다. Ciprofloxacin은 감수성 결과에서 이미 내성이므로 선택할 수 없다. 또한 장기 유치도뇨관은 바이오필름으로 인해 재발과 치료 실패의 원인이 되므로 감염원 조절 차원에서 치료 시작 시 교체하거나 제거해야 한다.", "level": 3}, {"id": "uti-v5", "topic": "uti", "tname": "요로감염", "src": "요로감염 항생제 사용지침 (국내, 2018)", "q": "48세 남성이 6개월간 반복되는 회음부·치골상부 불쾌감과 간헐적 배뇨통으로 내원하였다. 발열은 없었고 체온 36.7도, 혈압 124/78 mmHg이다. 직장수지검사에서 전립선은 부드럽고 경미한 압통만 있으며 급성 염증 소견은 없다. 전립선 마사지 후 채취한 소변배양에서 E. coli 10^4 CFU/mL가 자랐고 ciprofloxacin과 TMP-SMX에 감수성이다. 최근 항생제 사용력은 없고 혈청 크레아티닌 0.9 mg/dL이다. 가장 적절한 항생제 요법은?", "choices": ["Cefixime 200 mg 1일 2회 2주 경구 투여", "Fosfomycin trometamol 3 g 경구 단회 투여", "Ciprofloxacin 500 mg 1일 2회 4~6주 경구 투여", "Amoxicillin-clavulanate 625 mg 1일 3회 7일 경구 투여"], "answer": 3, "explain": "발열 없이 6개월간 반복된 경과와 전립선 마사지 후 소변에서의 균 분리는 만성 세균성 전립선염에 합당하며, 국내 지침은 전립선 조직 이행이 좋은 fluoroquinolone을 4~6주(TMP-SMX는 6~12주) 투여하도록 권고한다. 베타락탐계인 cefixime과 amoxicillin-clavulanate는 염증이 없는 전립선 조직으로의 이행이 나빠 만성 전립선염 치료에 부적합하다. Fosfomycin 3 g 단회는 급성 단순 방광염 용법으로 치료 기간이 절대적으로 부족하다. 급성 세균성 전립선염이라면 2~4주 요법으로 충분하지만 본 증례는 만성 경과이므로 장기 요법이 필요하다.", "level": 2}, {"id": "sti-v1", "topic": "sti", "tname": "성매개감염", "src": "성매개감염 진료지침 (2023) — 국내", "q": "24세 남성이 3일 전부터의 화농성 요도 분비물과 배뇨통으로 내원하였다. 2주 전 콘돔을 사용하지 않은 성접촉력이 있다. 체온 36.9도, 혈압 122/74 mmHg이며 부고환 압통이나 음낭 종창은 없다. 요도 분비물 핵산증폭검사에서 Neisseria gonorrhoeae 양성이 확인되었고 Chlamydia trachomatis 결과는 아직 확인되지 않았다. 체중 70 kg, 약물 알레르기는 없다. 가장 적절한 치료는?", "choices": ["Ceftriaxone 250 mg 근주 단회 + azithromycin 1 g 경구 단회", "Ceftriaxone 500 mg 근주 단회 + doxycycline 100 mg 1일 2회 7일", "Cefixime 400 mg 경구 단회 + azithromycin 2 g 경구 단회", "Doxycycline 100 mg 1일 2회 7일 + levofloxacin 500 mg 1일 1회 7일"], "answer": 2, "explain": "국내 2023 성매개감염 진료지침은 합병증 없는 임균 요도염에 ceftriaxone 500 mg 근주 단회(체중 150 kg 이상은 1 g)를 권고하고, 클라미디아 동시감염이 배제되지 않았다면 doxycycline 100 mg 1일 2회 7일을 병용하도록 한다. 과거 표준이던 ceftriaxone 250 mg에 azithromycin 1 g을 더하는 요법은 세프트리악손 감수성 저하와 azithromycin 내성 증가로 더 이상 1차 권고가 아니다. Cefixime 경구는 인두 임질 제균율이 낮아 세프트리악손을 사용할 수 없을 때의 대안일 뿐이다. Fluoroquinolone은 국내 임균의 내성률이 높아 감수성 확인 전 경험적 사용이 권장되지 않는다.", "level": 1}, {"id": "sti-v2", "topic": "sti", "tname": "성매개감염", "src": "성매개감염 진료지침 (2023) — 국내", "q": "32세 여성이 임신 22주 산전검사에서 RPR 1:32, TPHA 양성으로 매독이 처음 진단되었다. 성기 궤양이나 전신 발진, 편평콘딜로마 등 병변은 없고 두통·시력저하·난청 등 신경 상 투여한다", "Lamivudine 100 mg을 치료 시작 전부터 종료 후 12개월 이상 투여한다", "Tenofovir alafenamide 25 mg을 치료 시작 전부터 종료 후 12개월 이상 투여한다"], "answer": 4, "explain": "Rituximab은 B형간염 재활성화 고위험 약제로, HBsAg이 음성이라도 anti-HBc 양성이면 예방적 항바이러스제를 투여해야 하며 항암치료 시작 전부터 시작해 종료 후 12개월 이상 유지한다. 따라서 모니터링만 하는 전략은 고위험군에서 부적절하다. 국내 가이드라인은 예방요법으로 내성장벽이 높은 entecavir, tenofovir disoproxil fumarate, tenofovir alafenamide를 권고하며, lamivudine은 내성 발현 위험 때문에 장기 예방요법으로 권장되지 않는다. 이 환자는 사구체여과율 45 mL/min으로 신기능이 저하되어 있고 골다공증이 동반되어 신독성과 골밀도 감소 위험이 있는 tenofovir disoproxil fumarate보다 tenofovir alafenamide(또는 용량을 조절한 entecavir)가 적절하다.", "level": 3}, {"id": "fungal-v1", "topic": "fungal", "tname": "진균감염", "src": "IDSA 2016 Clinical Practice Guideline for the Management of Candidiasis (Clin Infect Dis 2016;62:e1)", "q": "58세 남성이 중증 급성췌장염으로 중환자실에서 치료 중이다. 입원 12일째 체온 38.6도, 혈압 112/70 mmHg, 맥박 96회/분이었고 호중구는 4,200/mm3로 정상이었다. 중심정맥관을 통해 총정맥영양을 투여받던 중 시행한 혈액배양 2쌍에서 Candida glabrata가 동정되었으며, 감수성 검사는 fluconazole MIC 32 ug/mL(내성), voriconazole MIC 2 ug/mL(비감수성), micafungin MIC 0.03 ug/mL(감수성)이었다. Micafungin 100 mg을 1일 1회 정맥투여하고 중심정맥관을 제거한 뒤 발열은 소실되었고, 치료 5일째 추적 혈액배양은 음전되었다. 안저검사에서 안내염 소견은 없었고 심초음파에서도 이상이 없었다. 이후 항진균 치료 계획으로 가장 적절한 것은?", "choices": ["Micafungin을 중단하고 fluconazole 800 mg을 1일 1회 경구로 전환하여 총 14일을 채운다", "Micafungin을 유지하여 첫 음전 혈액배양일로부터 총 14일간 치료를 완료한다", "Micafungin을 중단하고 voriconazole 200 mg을 1일 2회 경구로 전환하여 총 14일을 채운다", "혈액배양이 음전되었으므로 현 시점에서 항진균제를 중단하고 경과를 관찰한다"], "answer": 2, "explain": "IDSA 2016 칸디다증 지침은 비호중구감소 환자의 칸디다혈증 초기 치료로 echinocandin을 강하게 권고하고, fluconazole로의 step-down은 임상적으로 안정적이고 추적 혈액배양이 음전되었으며 분리균이 fluconazole 감수성일 때 모두 만족하는 경우로 제한한다. 본 증례는 fluconazole 내성 C. glabrata이므로 step-down 조건을 충족하지 못해 echinocandin을 유지해야 한다. C. glabrata는 azole 간 교차내성이 흔해 voriconazole도 감수성이 확인된 경우에만 대안이 되며, 이 환자는 voriconazole 비감수성이다. 전이 병소가 없는 칸디다혈증의 치료기간은 첫 음전 혈액배양일로부터 14일이므로 5일째 중단은 부적절하다.", "level": 3}, {"id": "fungal-v2", "topic": "fungal", "tname": "진균감염", "src": "IDSA 2016 Clinical Practice Guideline for the Management of Candidiasis (Clin Infect Dis 2016;62:e1)", "q": "73세 여성이 당뇨병성 신증(eGFR 18 mL/min/1.73m2, 투석은 시행하지 않음)으로 추적 중 담낭절제술을 받았다. 수술 후 7일째 체온 39.0도, 혈압 88/54 mmHg로 승압제를 시작하였고 호중구는 6,800/mm3로 정상이었다. 혈액배양 2쌍에서 효모양 진균이 자랐고 germ tube 검사 양성으로 Candida albicans가 추정되었다. 환자는 3주 전 중환자실 재원 중 fluconazole 예방요법을 2주간 투여받은 병력이 있다. 간기능은 정상이고 QT 간격도 정상이다. 초기 항진균제로 가장 적절한 것은?", "choices": ["Fluconazole 800 mg 부하 후 400 mg을 1일 1회 정맥투여한다", "Amphotericin B deoxycholate 0.7 mg/kg을 1일 1회 정맥투여한다", "Caspofungin 70 mg 부하 후 50 mg을 1일 1회 정맥투여한다", "Voriconazole 6 mg/kg 부하 후 4 mg/kg을 1일 2회 정맥투여한다"], "answer": 3, "explain": "IDSA 2016 지침은 칸디다혈증의 초기 치료로 echinocandin을 1차 권고하며, 혈역학적으로 불안정하거나 최근 azole에 노출된 환자에서는 특히 echinocandin을 우선하도록 한다. Caspofungin을 비롯한 echinocandin은 주로 간에서 대사·분해되어 신기능 저하 시 용량조절이 필요 없어 이 환자에게 적합하다. Fluconazole은 신배설 약물로 eGFR 50 미만에서 감량이 필요하고, 최근 azole 노출력이 있어 감수성 저하 가능성 때문에 1차로 부적절하다. Amphotericin B deoxycholate는 신독성이 커 신기능 저하 환자에서 회피하며, voriconazole 정맥주사제는 부형제 SBECD가 축적되어 CrCl 50 미만에서 권장되지 않고 칸디다혈증 초기 치료의 우선 선택도 아니다.", "level": 2}, {"id": "fungal-v3", "topic": "fungal", "tname": "진균감염", "src": "IDSA 2016 Practice Guidelines for the Diagnosis and Management of Aspergillosis (Clin Infect Dis 2016;63:e1)", "q": "45세 남성이 급성골수성백혈병 관해유도 항암치료 후 호중구 120/mm3 상태로 12일째 지속되고 있다. Cefepime을 5일간 투여했음에도 체온 38.8도의 발열이 지속되었다. 흉부 CT에서 우상엽에 주변 간유리음영을 동반한 결절(halo sign)이 관찰되었고, 혈청 galactomannan 지수는 1.4로 양성이었다. 간기능·신기능은 정상이며 심전도상 QTc 420 ms, 현재 rifampin 등 강력한 CYP 유도제는 복용하고 있지 않다. 침습성 폐아스페르길루스증을 강하게 의심할 때 1차 치료로 가장 적절한 것은?", "choices": ["Voriconazole 6 mg/kg 부하 후 4 mg/kg을 12시간마다 정맥투여한다", "Caspofungin 70 mg 부하 후 50 mg을 1일 1회 정맥투여한다", "Fluconazole 800 mg 부하 후 400 mg을 1일 1회 정맥투여한다", "Itraconazole 캡슐 200 mg을 1일 2회 경구로 투여한다"], "answer": 1, "explain": "IDSA 2016 아스페르길루스증 지침은 침습성 폐아스페르길루스증의 1차 치료로 voriconazole을 강하게 권고하며, 대안으로 liposomal amphotericin B나 isavuconazole을 제시한다. Echinocandin 단독요법은 1차 치료로 권고되지 않고 다른 약제를 쓸 수 없는 경우의 구제요법이나 병용요법에서만 고려된다. Fluconazole은 Aspergillus에 항진균 활성이 없어 사용할 수 없고, itraconazole 경구제는 흡수 변동이 커 중증 침습감염의 초기 치료로 부적절하다. Voriconazole은 CYP2C19 유전다형성과 약물상호작용의 영향이 커 TDM(정상 최저농도 1~5.5 ug/mL)을 병행하고, rifampin 등 강력한 유도제와는 병용 금기임을 함께 확인해야 한다.", "level": 1}, {"id": "fungal-v4", "topic": "fungal", "tname": "진균감염", "src": "IDSA Clinical Practice Guidelines for the Management of Cryptococcal Disease (2010) · 국내 HIV 감염인의 기회감염증 치료와 예방 지침", "q": "38세 남성 HIV 감염인이 2주간의 두통과 미열, 구역으로 내원하였다. 항레트로바이러스 치료는 받은 적이 없고 CD4+ T세포 32/mm3, HIV RNA 260,000 copies/mL였다. 진찰에서 경부강직이 있었고 뇌척수액 개방압은 320 mmH2O, 백혈구 25/mm3(림프구 우세), 당 32 mg/dL, 크립토코쿠스 항원 양성, 인디아잉크 염색 양성이었다. 혈청 크레아티닌 0.9 mg/dL(eGFR 95), 백혈구 5,600/mm3로 골수기능은 유지되고 있다. 유도요법으로 가장 적절한 것은?", "choices": ["Fluconazole 1,200 mg을 1일 1회 경구로 단독 투여하여 최소 2주간 유지한다", "Voriconazole 4 mg/kg 1일 2회와 flucytosine 100 mg/kg/일을 최소 2주간 병용한다", "Micafungin 150 mg 1일 1회와 fluconazole 800 mg 1일 1회를 최소 2주간 병용한다", "Liposomal amphotericin B와 flucytosine 100 mg/kg/일을 최소 2주간 병용한다"], "answer": 4, "explain": "HIV 감염인의 크립토코쿠스 수막염 표준 유도요법은 amphotericin B(신독성을 고려해 리포솜 제형 3~4 mg/kg/일 선호)와 flucytosine 100 mg/kg/일의 병용을 최소 2주간 시행하는 것이며, 이후 fluconazole 400 mg/일로 8주간 공고요법, 이어서 200 mg/일 유지요법을 시행한다. Fluconazole 단독 유도요법은 병용요법보다 살진균 속도와 생존율이 떨어져 amphotericin B를 쓸 수 없는 경우에만 고려한다. Echinocandin은 Cryptococcus에 활성이 없고, voriconazole은 유도요법의 표준 약제가 아니다. 개방압 250 mmH2O 이상인 두개내압 상승은 반복 요추천자로 감압해야 하며, 항레트로바이러스 치료는 면역재구성염증증후군 위험 때문에 항진균 치료 시작 2~10주 후 시작하도록 권고된다.", "level": 2}, {"id": "fungal-v5", "topic": "fungal", "tname": "진균감염", "src": "IDSA 2016 Clinical Practice Guideline for the Management of Candidiasis (Clin Infect Dis 2016;62:e1)", "q": "70세 여성이 뇌경색 후 요양병원에 입원 중이며 유치도뇨관을 3주째 유지하고 있다. 정기 검사에서 시행한 소변배양에서 Candida albicans가 10^5 CFU/mL 배양되었다. 체온 36.8도, 혈압 126/78 mmHg, 백혈구 7,200/mm3이고 배뇨통·측복부 통증·요실금 악화 등 증상은 없다. 호중구감소나 면역억제제 투여는 없으며 예정된 비뇨기계 시술도 없다. 혈액배양은 음성이다. 가장 적절한 조치는?", "choices": ["항진균제는 투여하지 않고 유치도뇨관을 제거하거나 교체한 뒤 경과를 관찰한다", "Fluconazole 200 mg을 1일 1회 14일간 경구투여하고 배양을 추적한다", "Amphotericin B 방광세척을 5일간 시행하고 소변배양을 추적한다", "Micafungin 100 mg을 1일 1회 7일간 정맥투여하고 배양을 추적한다"], "answer": 1, "explain": "IDSA 2016 지침은 무증상 캔 전환한다", "Primaquine 15 mg을 1일 1회 14일간 경구투여한다"], "answer": 2, "explain": "아프리카에서 유입된 열대열말라리아는 클로로퀸 내성이 광범위하게 퍼져 있어 artemisinin 병합요법(국내에서는 artemether/lumefantrine)이 1차 경구 치료다. 중증 말라리아 기준인 의식저하, 기생충혈증 5% 이상, 신부전, 대사성 산증, 저혈당, 쇼크, 반복 경련 등에 해당하지 않고 경구 복용이 가능하므로 정맥 artesunate는 필요하지 않다. Chloroquine은 국내 토착 삼일열말라리아에는 유효하지만 아프리카 유입 열대열말라리아에는 부적절하다. Primaquine 14일 요법은 P. vivax·P. ovale의 간 내 휴면소체를 제거하는 근치요법으로 열대열말라리아의 치료제가 아니다. 열대열말라리아는 급속히 악화될 수 있으므로 진단 즉시 입원하여 기생충혈증을 추적하고, 말라리아는 제3급 법정감염병으로 신고 대상이다.", "level": 2}, {"id": "travel-v2", "topic": "travel", "tname": "여행자·해외유입감염", "src": "뎅기열 관리지침 (질병관리청) · 해외유입 감염병 진료 안내 (질병관리청)", "q": "27세 여성이 필리핀 세부에서 7일간 휴가를 보내고 귀국한 지 3일째 39.5도의 발열과 심한 두통, 안와통, 근육통으로 내원하였다. 몸통에 반점구진성 발진이 있고 혈압 110/70 mmHg, 맥박 88회/분으로 안정적이다. 백혈구 2,900/mm3, 혈소판 82,000/mm3, AST 96 IU/L, ALT 78 IU/L, 헤마토크리트 39%였고 뎅기 NS1 항원 검사가 양성이었다. 지속적인 구토·복통·출혈·기면은 없고 경구 섭취가 가능하다. 가장 적절한 초기 처치는?", "choices": ["아스피린으로 해열하고 외래에서 경과를 관찰하며 자연 호전을 기다린다", "이부프로펜으로 해열하고 혈소판 감소에 대해 예방적 혈소판 수혈을 시행한다", "Doxycycline 100 mg을 1일 2회 7일간 투여하며 경과를 관찰한다", "아세트아미노펜으로 해열하고 수분을 공급하며 경고징후 발생 여부를 관찰한다"], "answer": 4, "explain": "뎅기열은 특이 항바이러스제가 없어 해열과 수액 보충을 중심으로 한 대증치료가 원칙이며, 해열제는 아세트아미노펜을 사용한다. 아스피린과 NSAID는 혈소판 기능 억제와 위장관 출혈 위험 때문에 금기이므로 선택지 1·2는 부적절하다. 혈소판 감소만을 이유로 한 예방적 수혈은 권고되지 않으며, 출혈이 동반되거나 매우 낮은 수치일 때 개별적으로 판단한다. 발열이 떨어지는 시기(critical phase)에 지속적 구토, 심한 복통, 점막 출혈, 기면, 간비대, 헤마토크리트 상승과 급격한 혈소판 감소 같은 경고징후가 나타나면 즉시 입원하여 수액치료를 해야 한다. Doxycycline은 리케차·쯔쯔가무시증 치료제로 뎅기열에는 효과가 없다.", "level": 1}, {"id": "travel-v3", "topic": "travel", "tname": "여행자·해외유입감염", "src": "장티푸스 관리지침 (질병관리청) · 급성 위장관계 감염 항생제 사용지침 (대한감염학회·대한화학요법학회)", "q": "25세 여성이 인도에서 3주간 배낭여행을 마치고 귀국한 뒤 8일간 계단식으로 상승하는 발열(최고 39.4도)과 두통, 복통, 변비로 내원하였다. 체온 39.2도에 맥박은 78회/분으로 상대적 서맥을 보였고 복부에 옅은 장미진이 관찰되었다. 백혈구 3,600/mm3, AST/ALT 경도 상승, CRP 8.2 mg/dL였다. 혈액배양에서 Salmonella enterica serovar Typhi가 동정되었으며 감수성 검사는 nalidixic acid 내성, ciprofloxacin 중간내성, ceftriaxone 감수성, azithromycin 감수성이었다. 임신은 아니며 약물 알레르기는 없다. 가장 적절한 치료는?", "choices": ["Ceftriaxone 2 g을 1일 1회 정맥투여하여 10~14일간 치료한다", "Ciprofloxacin 500 mg을 1일 2회 경구투여하여 7일간 치료한다", "Amoxicillin 1 g을 1일 3회 경구투여하여 7일간 치료한다", "Trimethoprim/sulfamethoxazole을 1일 2회 경구투여하여 5일간 치료한다"], "answer": 1, "explain": "남아시아·동남아시아에서 유입된 장티푸스는 nalidixic acid 내성으로 대표되는 fluoroquinolone 감수성 저하와 다제내성이 흔해, 국내 지침과 여행의학 권고 모두 3세대 세팔로스포린(ceftriaxone, cefixime) 또는 azithromycin을 1차 약제로 제시한다. Ciprofloxacin은 중간내성 균주에서 임상 실패와 재발이 잦아 이 환자에게 부적절하다. Amoxicillin과 trimethoprim/sulfamethoxazole은 감수성이 확인된 감수성 균주에서만 쓸 수 있는 대체 약제이며 해당 지역 분리주는 내성률이 높다. 치료기간은 통상 10~14일이고 해열까지 3~5일이 걸릴 수 있으므로 조기 실패로 판단하지 않도록 주의한다. 장티푸스는 제2급 법정감염병으로 즉시 신고해야 하며, 회복 후 만성 담낭 보균 가능성에 대한 추적도 필요하다.", "level": 2}, {"id": "travel-v4", "topic": "travel", "tname": "여행자·해외유입감염", "src": "급성 위장관계 감염 항생제 사용지침 (대한감염학회·대한화학요법학회) · IDSA 2017 Infectious Diarrhea Guideline", "q": "41세 남성이 인도 델리 출장 4일째부터 하루 6~7회의 수양성 설사와 경련성 복통이 발생하여 현지에서 전화 상담을 요청하였다. 체온 37.2도로 발열은 없고 혈변이나 점액변, 심한 탈수 징후도 없으나 회의 일정을 소화하기 어려울 정도로 증상이 잦다. 기저질환이나 최근 항생제 복용력은 없고 QT 연장 병력도 없다. 가장 적절한 권고는?", "choices": ["Ciprofloxacin 500 mg을 1일 2회 3일간 복용하게 하고 loperamide는 병용하지 않도록 한다", "Azithromycin 1 g 단회 또는 500 mg 1일 1회 3일간 복용과 함께 loperamide를 병용하도록 한다", "Rifaximin을 남은 여행 기간 내내 예방 목적으로 매일 복용하게 하고 지사제는 피하도록 한다", "항생제 없이 경구수액과 지사제만 사용하게 하고 2주 이상 지속되면 진료를 받도록 한다"], "answer": 2, "explain": "일상생활이 어려운 중등도 이상의 여행자 설사에서는 단기 항생제가 증상 기간을 하루 이상 단축시키며, 남아시아·동남아시아는 Campylobacter의 fluoroquinolone 내성률이 매우 높아 azithromycin이 1차 선택이다. 발열과 혈변이 없는 비침습성 설사에서는 loperamide를 항생제와 병용해 증상을 빠르게 조절할 수 있고, 고열이나 혈변을 동반한 이질성 설사에서는 loperamide 단독 사용을 피한다. Rifaximin은 비침습성 대장균 유래 설사의 치료나 제한된 고위험군의 예방에 쓰이며 일반 여행자에게 일률적인 예방투여는 권고되지 않는다. 경구수액 보충은 모든 경우의 기본이며, 증상이 지속되거나 혈변·고열이 발생하면 원충 감염과 침습성 세균감염을 감별하도록 안내해야 한다.", "level": 2}, {"id": "travel-v5", "topic": "travel", "tname": "여행자·해외유입감염", "src": "쯔쯔가무시증 관리지침 (질병관리청) · 진드기매개감염병 진료 안내 (질병관리청)", "q": "31세 여성이 임신 22주 상태에서 10월 말 밭일을 한 뒤 6일간 지속되는 38.9도의 발열과 심한 두통, 근육통으로 내원하였다. 진찰에서 우측 서혜부에 검은 딱지(가피)와 압통을 동반한 국소 림프절종대가 있었고 몸통에 반점구진성 발진이 퍼져 있었다. 백혈구 6,200/mm3, 혈소판 11만/mm3, AST 88 IU/L, e Fourth International Consensus Guidelines on the Management of CMV in Solid Organ Transplantation (2025) · KDIGO Kidney Transplant Recipients", "q": "55세 여성이 신장이식 4개월째에 CMV 위장관 질환으로 valganciclovir 900 mg 1일 2회 치료를 시작해 3주가 지났다. CMV DNA는 12,000 IU/mL에서 780 IU/mL로 감소했고 설사와 발열은 호전되었다. 그러나 오늘 ANC 620/mm³, Hb 10.2 g/dL, 혈소판 132,000/mm³로 호중구감소가 확인되었다. 병용약은 tacrolimus, mycophenolate mofetil 1,000 mg 1일 2회, prednisolone 5 mg, TMP-SMX 예방요법이며 CrCl은 68 mL/min이다. 가장 적절한 조치는?", "choices": ["Mycophenolate를 감량 또는 일시 중단하고 필요 시 G-CSF를 사용하면서 valganciclovir 치료용량은 유지한다", "Valganciclovir를 450 mg 1일 1회로 감량하고 mycophenolate와 나머지 약제는 그대로 유지한다", "Valganciclovir를 즉시 중단하고 foscarnet 정주로 전환한 뒤 CMV DNA를 재확인한다", "TMP-SMX 예방요법만 중단하고 valganciclovir와 mycophenolate는 조정 없이 그대로 유지한다"], "answer": 1, "explain": "CMV DNA가 15배 이상 감소하고 증상이 호전되었으므로 치료 반응은 양호하며, 신기능도 정상이라 valganciclovir를 감량할 근거가 없다. 치료용량 미만으로 임의 감량하면 불충분한 노출로 UL97 변이 등 항바이러스제 내성을 유발할 수 있으므로 피해야 한다. 호중구감소에는 valganciclovir·mycophenolate·TMP-SMX가 모두 기여하지만, 이식 환자에서는 항바이러스제를 유지한 채 mycophenolate를 먼저 감량 또는 중단하고 필요하면 G-CSF를 사용하는 것이 표준 접근이다. Foscarnet은 치료 실패나 확인된 내성에서 고려하는 약제로 신독성과 전해질 이상이 커서 반응이 좋은 이 환자에게는 적응이 되지 않는다.", "level": 2}, {"id": "transplant-v3", "topic": "transplant", "tname": "이식·면역저하 감염", "src": "The Fourth International Consensus Guidelines on the Management of CMV in Solid Organ Transplantation (2025)", "q": "62세 남성이 CMV D+/R− 신장이식 직후로, 보편적 예방요법을 valganciclovir 대신 letermovir 480 mg 1일 1회로 시작하려 한다. 면역억제는 tacrolimus 3 mg 1일 2회(목표 최저혈중농도 8~10 ng/mL), mycophenolate, prednisolone이며 cyclosporine은 사용하지 않는다. 병용약으로 atorvastatin 40 mg과 pantoprazole 40 mg을 복용 중이고 간·신기능은 정상이다. 약사의 권고로 가장 적절한 것은?", "choices": ["Letermovir는 CYP3A에 영향이 없으므로 tacrolimus와 atorvastatin 모두 용량 조정 없이 유지한다", "Letermovir를 240 mg 1일 1회로 감량하고 tacrolimus와 atorvastatin은 그대로 유지한다", "Tacrolimus 농도가 낮아질 것에 대비해 미리 증량하고 atorvastatin은 고용량으로 유지한다", "Tacrolimus 농도 상승이 예상되므로 감량과 조기 혈중농도 측정을 하고 atorvastatin은 감량 또는 대체를 검토한다"], "answer": 4, "explain": "Letermovir는 중등도 CYP3A 억제제로 tacrolimus 노     mode: hasWS?'claude':'local',
    async get(k){
      if(hasWS){return await window.storage.get(k);}
      try{const v=localStorage.getItem(k); return v!=null?{value:v}:null;}catch(e){return null;}
    },
    async set(k,v){
      if(hasWS){return await window.storage.set(k,v,false);}
      try{localStorage.setItem(k,v);}catch(e){}

  };
})();

    ? `<button class="drillbtn" data-topic="${t.id}">관련 ACCP 케이스 풀기 <span class="n">${t.accp.length}</span></button>`
    : '';
  const gqBtn = gqs.length
    ? `<button class="drillbtn" style="background:var(--kr)" data-gqtopic="${t.id}">가이드라인 자가점검 <span class="n">${gqs.length}</span></button>`

    </div>
    <div class="topic-body">
      <div class="statusbtns" data-statusfor="${t.id}">
        ${cells.map(s=>`<button data-s="${s}" class="${st.status===s?'sel':''}">${

function bindCurriculum(){
  document.querySelectorAll('[data-toggle]').forEach(h=>h.onclick=e=>{
    if(e.target.closest('a,button,textarea'))return;
    h.parentElement.classList.toggle('open');
  });
  document.querySelectorAll('[data-statusfor]').forEach(row=>{
    const tid=row.dataset.statusfor;
    row.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      S.topics[tid].status=b.dataset.s; save();
      row.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b));
      const card=row.closest('.topic');
      card.querySelector('.tstat').className='tstat '+b.dataset.s;
      // update review badge
      let meta=card.querySelector('.tmeta');
      let rev=meta.querySelector('.badge.rev');
      if(b.dataset.s==='review'&&!rev){const sp=document.createElement('span');sp.className='badge rev';sp.textContent='복습';meta.insertBefore(sp,meta.firstChild);}
      else if(b.dataset.s!=='review'&&rev)rev.remove();
    });
  });
  document.querySelectorAll('.gcheck').forEach(b=>b.onclick=()=>{
    const tid=b.dataset.t,gi=b.dataset.g, st=S.topics[tid];
    st.checks[gi]=!st.checks[gi]; save();
    b.classList.toggle('on',st.checks[gi]); b.textContent=st.checks[gi]?'✓':'';
  });
  document.querySelectorAll('[data-note]').forEach(ta=>{
    ta.oninput=()=>{S.topics[ta.dataset.note].note=ta.value;save();};
  });
  document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{
    const t=TOPIC_BY[b.dataset.topic];
    nav('drill'); startSession(t.accp.slice(),'['+t.name+'] ACCP 케이스','topic');
  });
  document.querySelectorAll('[data-gqtopic]').forEach(b=>b.onclick=()=>{
    const t=TOPIC_BY[b.dataset.gqtopic];
    const ids=(GQ_BY_TOPIC[t.id]||[]).map(g=>g.id);
    nav('drill'); startSession(ids,'['+t.name+'] 가이드라인 자가점검','guide');
  });
  document.querySelectorAll('[data-digtopic]').forEach(b=>b.onclick=()=>{
    renderDigest(b.dataset.digtopic);
  });
}

    btn.onclick=()=>startSession(ids,name,'sec'); sm.appendChild(btn);});
  $('#m-due').onclick=()=>{const ids=MODES.due();ids.length?startSession(ids,'오늘의 복습','due'):toast('오늘 복습할 문제가 없어요!');};

let picked=null,revealed=false;
function renderDstTable(tb){
  const cell=v=>{const t=String(v).trim();
    return (t==='S'||t==='R'||t==='I')?`<span class="dst-${t}">${t}</span>`:esc(t);};
  return `<div class="dsttable">${tb.title?`<div class="cap">${esc(tb.title)}</div>`:''}
    <table><thead><tr>${tb.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${tb.rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?esc(c):cell(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function renderQuestion(){
  picked=null;revealed=false;
  const id=SESS.ids[SESS.pos], it=curItem(id), s=curState(id);
  const total=SESS.ids.length;
  const cells=[1,2,3,4,5].map(i=>`<i class="${i<=s.box?(s.box===5?'full':'on'):''}"></i>`).join('');
  const stem = isGuide()? it.q : (it.stemKo || it.stem);
  const choiceList = isGuide()? it.choices : (it.choicesKo || it.choices);
  const enBlock = (!isGuide() && it.stemKo)
    ? `<details class="enorig"><summary>영문 원문 보기</summary>
        <p class="stem" style="margin:10px 0 8px">${esc(it.stem)}</p>
        <ol style="margin:0;padding-left:20px;font-size:13.5px;line-height:1.7;color:var(--muted)">${it.choices.map(c=>`<li>${esc(c)}</li>`).join('')}</ol>
       </details>` : '';
  const lvlBadge = (it.level&&LV[it.level])
    ? ` <span class="lvl" style="background:${LV[it.level].c}">난이도 ${LV[it.level].t}</span>` : '';
  const readout = isGuide()
    ? `<span class="id">지침</span><span class="d">·</span><span class="sect">${esc(it.tname)}</span>${lvlBadge}`
    : `<span class="id">CASE ${String(id).padStart(2,'0')}</span><span class="d">·</span><span class="sect">${esc(it.sectionKo)}</span>${lvlBadge}`;
  const panelHtml = (!isGuide()&&it.panel)
    ? `<div class="qpanel">${it.panel.map(r=>`<div class="row"><div class="k">${esc(r[0])}</div><div class="v">${esc(r[1])}</div></div>`).join('')}</div>` : '';
  const tablesHtml = (!isGuide()&&it.tables)
    ? it.tables.map(renderDstTable).join('') : '';
  const askHtml = (!isGuide()&&it.ask) ? `<p class="askline">${esc(it.ask)}</p>` : '';
  app().innerHTML=`
  <div class="card qwrap">
    <div class="readout">${readout}
      <span class="box"><span>BOX</span><span class="cells">${cells}</span></span></div>
    <div class="qbody">
      <div class="progress"><span class="ct">${esc(SESS.title)}</span>

        <span class="ct">${SESS.pos+1} / ${total}</span></div>
      <p class="stem">${esc(stem)}</p>
      ${panelHtml}${tablesHtml}${askHtml}${enBlock}
      <div class="choices" id="choices">${choiceList.map((c,i)=>`<button class="choice" data-i="${i+1}">
        <span class="k">${KO[i+1]}</span><span>${esc(c)}</span><span class="mark"></span></button>`).join('')}</div>
      <div id="reveal"></div>
      <div class="qfooter">
        <button class="flag ${s.flag?'on':''}" id="flagBtn">★ ${s.flag?'별표됨':'별표'}</button>
        <span class="spacer"></span>
        <button class="btn btn-ghost" id="quitBtn">그만</button>
        <button class="btn btn-primary" id="actBtn" disabled>채점</button></div>
      <div class="khint"><b>1-4</b> 선택 · <b>Enter</b> 채점/다음 · <b>F</b> 별표</div>
    </div></div>`;
  $('#choices').querySelectorAll('.choice').forEach(btn=>btn.onclick=()=>pick(+btn.dataset.i));
  $('#flagBtn').onclick=toggleFlag;
  $('#quitBtn').onclick=()=>renderDrillHome();
  $('#actBtn').onclick=()=>revealed?next():grade();
}
function pick(i){if(revealed)return;picked=i;
  $('#choices').querySelectorAll('.choice').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));
  $('#actBtn').disabled=false;}
function grade(){
  if(picked==null||revealed)return; revealed=true;
  const id=SESS.ids[SESS.pos], it=curItem(id), s=curState(id);
  const ok=picked===it.answer;
  s.seen++;
  if(ok){s.correct++;s.box=Math.min(5,(s.box||0)+1);s.last='c';}else{s.wrong++;s.box=1;s.last='x';}
  s.lastTs=Date.now(); S.meta.answered++; bumpStreak(); save();
  $('#choices').querySelectorAll('.choice').forEach(btn=>{const i=+btn.dataset.i;btn.disabled=true;btn.classList.remove('sel');
    if(i===it.answer){btn.classList.add('correct');btn.querySelector('.mark').textContent='정답';}
    else if(i===picked){btn.classList.add('wrong');btn.querySelector('.mark').textContent='내 선택';}});
  let body;
  if(isGuide()){
    body=`<div class="eyebrow" style="margin-bottom:4px">해설</div>
      <div class="rat c" style="border-top:1px solid var(--line)"><span class="rk">${KO[it.answer]}</span><span class="rt">${esc(it.explain)}</span></div>
      <div class="meta"><div class="rub" style="margin-top:10px">출처 · ${esc(it.src)}</div></div>`;
  }else{
    const ratList = it.rationalesKo || it.rationales;
    const rats=ratList.map((r,i)=>{const isC=(i+1)===it.answer;
      return `<div class="rat ${isC?'c':'x'}"><span class="rk">${KO[i+1]}</span><span class="rt">${esc(r)}</span></div>`;}).join('');
    const enRat = it.rationalesKo
      ? `<details class="enorig" style="margin-top:8px"><summary>해설 영문 원문 보기</summary>
          <div class="rationale">${it.rationales.map((r,i)=>`<div class="rat ${(i+1)===it.answer?'c':'x'}"><span class="rk">${KO[i+1]}</span><span class="rt">${esc(r)}</span></div>`).join('')}</div>
         </details>` : '';
    body=`<div class="eyebrow" style="margin-bottom:2px">보기별 해설 (rationale)</div>
      <div class="rationale">${rats}</div>${enRat}
      <div class="meta"><details><summary>레퍼런스 · 출제 도메인</summary>
        <div class="ref">${esc(it.ref)}</div><div class="rub">${esc(it.rubric)}</div></details></div>`;
  }
  $('#reveal').innerHTML=`
    <div class="verdict ${ok?'ok':'bad'}"><span class="pill">${ok?'정답':'오답'}</span>
      <span>${ok?'맞았어요. 박스가 한 단계 올라갔습니다.':`정답은 ${KO[it.answer]}. 이 문제는 Box 1로 돌아가 곧 다시 나옵니다.`}</span></div>
    ${body}`;
  const act=$('#actBtn'); act.textContent=SESS.pos+1>=SESS.ids.length?'세션 마치기':'다음 문제'; act.disabled=false;
  $('#reveal').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){
  const id=SESS.ids[SESS.pos];
  if(curState(id).last==='x'&&SESS.mode!=='due'&&!SESS.ids.slice(SESS.pos+1).includes(id))SESS.ids.push(id);
  SESS.pos++; if(SESS.pos>=SESS.ids.length){renderDone();return;} renderQuestion();
}
function toggleFlag(){const id=SESS?SESS.ids[SESS.pos]:null;if(id==null)return;
  const s=curState(id);s.flag=!s.flag;save();const fb=$('#flagBtn');fb.classList.toggle('on',s.flag);fb.textContent='★ '+(s.flag?'별표됨':'별표');}
function renderDone(){
  const ids=[...new Set(SESS.ids)], c=ids.filter(i=>curState(i).last==='c').length, dueLeft=MODES.due().length;
  app().innerHTML=`<div class="card done"><div class="eyebrow">${esc(SESS.title)} 완료</div>
    <div class="big">${c}/${ids.length}</div><div class="sub">이번 세션 정답 · 진도 저장됨</div>
    <div class="row">${(!isGuide()&&dueLeft)?`<button class="btn btn-primary" id="more">오늘 복습 이어서 (${dueLeft})</button>`:''}
      <button class="btn btn-ghost" id="back">드릴 홈</button>
      <button class="btn btn-ghost" id="home2">전체 홈</button></div></div>`;
  if(!isGuide()&&dueLeft)$('#more').onclick=()=>startSession(MODES.due(),'오늘의 복습','due');
  $('#back').onclick=()=>renderDrillHome(); $('#home2').onclick=()=>nav('home');
}

/* keyboard */
document.addEventListener('keydown',e=>{
  if(!SESS||VIEW!=='drill')return;
  if(e.key>='1'&&e.key<='4'){if(!revealed)pick(+e.key);}

  </div>

    <div class="dgsrc" style="margin-top:12px">⚠ ${esc(PLAN.note)}</div>

  app().querySelectorAll('.pchk input').forEach(cb=>cb.onchange=()=>{const id=cb.dataset.w;S.plan[id]=S.plan[id]||{done:false};S.plan[id].done=cb.checked;save();renderPlan();});
  app().querySelectorAll('.planlink').forEach(bt=>bt.onclick=()=>renderDigest(bt.dataset.t));

/* ================= CLOUD SYNC (Firebase) ================= */
const SYNC={on:false,db:null,ref:null,M:null,code:null,unsub:null,lastPush:0,applying:false,
  async connect(cfg,code){
    if(this.unsub){try{this.unsub();}catch(e){}this.unsub=null;}
    const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js');
    const M=await import('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js');
    this.M=M;
    const app=initializeApp(cfg,'hub-'+Date.now());
    this.db=M.getFirestore(app); this.code=code; this.ref=M.doc(this.db,'hub',code);
    this.unsub=M.onSnapshot(this.ref,snap=>{
      if(!snap.exists())return;
      const d=snap.data(); if(!d||!d.state)return;
      if(d.ts&&d.ts===this.lastPush)return;
      let remote; try{remote=JSON.parse(d.state);}catch(e){return;}
      const localTs=(S&&S._ts)||0;
      if((d.ts||0)>localTs){
        this.applying=true; S=remote; save();
        if(typeof VIEW!=='undefined'&&!(typeof SESS!=='undefined'&&SESS)){try{nav(VIEW);}catch(e){}}
        this.applying=false; toast('동기화됨 · 다른 기기의 최신 진도 반영');
      }
    },err=>{toast('동기화 오류: '+(err.code||err.message));});
    this.on=true;
    localStorage.setItem('idpc_fb_cfg',JSON.stringify(cfg));
    localStorage.setItem('idpc_fb_code',code);
    await this.push();
  },
  async push(){
    if(!this.ref||this.applying)return;
    try{ if(!S._ts)S._ts=Date.now(); this.lastPush=S._ts;
      await this.M.setDoc(this.ref,{state:JSON.stringify(S),ts:S._ts}); }catch(e){}
  },
  disconnect(){ if(this.unsub){try{this.unsub();}catch(e){}} this.unsub=null; this.on=false; this.ref=null;
    localStorage.removeItem('idpc_fb_cfg'); localStorage.removeItem('idpc_fb_code'); }
};

function renderSync(){
  const savedCode=localStorage.getItem('idpc_fb_code')||'';
  const savedCfg=localStorage.getItem('idpc_fb_cfg')||'';
  const status=SYNC.on
    ? `<span style="color:var(--ok);font-weight:700">● 연결됨</span> · 코드 <b>${esc(SYNC.code||savedCode)}</b>`
    : `<span style="color:var(--faint)">○ 연결 안 됨</span>`;
  app().innerHTML=`
  <div class="card" style="padding:20px 22px">
    <h2 style="margin:0 0 6px;font-size:20px">기기 간 실시간 동기화</h2>
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6">무료 Firebase를 연결하면 PC와 아이패드가 같은 진도를 실시간으로 공유합니다. 두 기기에 <b>같은 설정 + 같은 동기화 코드</b>를 넣고 연결하면 됩니다. 최초 1회만 설정하면 이후엔 자동이에요.</div>
    <div style="font-size:13px;margin-bottom:14px;font-weight:700">현재 상태: ${status}</div>
    <label style="font-size:12px;font-weight:700;color:var(--muted)">① Firebase 설정 (config의 { … } 붙여넣기)</label>
    <textarea id="fbcfg" rows="7" style="width:100%;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:10px;margin:4px 0 12px" placeholder='{ "apiKey": "AIza...", "authDomain": "xxx.firebaseapp.com", "projectId": "xxx", "storageBucket": "xxx.appspot.com", "messagingSenderId": "...", "appId": "1:..." }'></textarea>
    <label style="font-size:12px;font-weight:700;color:var(--muted)">② 동기화 코드 (아무 암호나 · 두 기기 동일하게 · 길게)</label>
    <input id="fbcode" style="width:100%;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:10px;margin:4px 0 14px" placeholder="예: injin-gamyeom-2026-x7q2">
    <div class="todo-actions">
      <button class="cta" id="fbConnect">연결하기</button>
      <button class="cta alt" id="fbDisc">연결 해제</button>
    </div>
    <button class="cta alt" id="fbShare" style="margin-top:10px;width:100%;${SYNC.on?'':'display:none'}">📋 다른 기기 연결용 링크 복사</button>
    <details class="dgmore" style="margin-top:16px"><summary>Firebase 설정 방법 (최초 1회, 약 5분)</summary><div class="dgmore-b" style="font-size:13px;line-height:1.75">
      1. <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a> 접속(구글 로그인) → <b>프로젝트 만들기</b> (이름 아무거나, 애널리틱스는 꺼도 됨).<br>
      2. 왼쪽 <b>빌드 → Firestore Database → 데이터베이스 만들기</b> → 위치 선택 → <b>테스트 모드로 시작</b>.<br>
      3. 상단 <b>⚙ → 프로젝트 설정</b> → 아래로 내려 <b>내 앱</b>에서 <b>웹(&lt;/&gt;)</b> 아이콘으로 앱 추가 → 앱 등록.<br>
      4. 표시되는 <b>firebaseConfig</b>의 중괄호 { … } 부분을 위 ① 칸에 붙여넣기.<br>
      5. ② 동기화 코드에 나만 아는 긴 문구를 넣고 <b>연결하기</b>. 아이패드에서도 같은 설정·같은 코드로 연결하면 끝.<br>
      <span style="color:var(--amber-d,#a15c00)">⚠ 테스트 모드는 약 30일 뒤 잠깁니다.</span> 계속 쓰려면 Firestore <b>규칙</b>에서 아래처럼 hub 컬렉션 접근을 허용하세요:<br>
      <code style="display:block;background:var(--paper);padding:8px;border-radius:6px;margin:6px 0;font-size:11.5px">match /databases/{db}/documents {<br>&nbsp;&nbsp;match /hub/{doc} { allow read, write: if true; }<br>}</code>
      진도 데이터라 민감정보는 아니지만, 코드를 아는 사람은 접근할 수 있으니 <b>임의의 긴 코드</b>를 쓰세요.
    </div></details>
  </div>`;
  if(savedCfg)$('#fbcfg').value=savedCfg;
  if(savedCode)$('#fbcode').value=savedCode;
  $('#fbConnect').onclick=async()=>{
    const raw=$('#fbcfg').value.trim(), code=$('#fbcode').value.trim();
    if(!raw||!code){toast('설정과 코드를 모두 입력하세요');return;}
    let cfg; try{ const m=raw.match(/\{[\s\S]*\}/); cfg=Function('return ('+m[0]+')')(); }catch(e){toast('설정 형식을 확인하세요');return;}
    toast('연결 중…');
    try{ await SYNC.connect(cfg,code); toast('연결됨! 이제 자동 동기화됩니다'); renderSync(); }
    catch(e){ toast('연결 실패: '+((e&&e.message)||e)); }
  };
  $('#fbDisc').onclick=()=>{ SYNC.disconnect(); toast('연결 해제됨'); renderSync(); };
  const _sh=$('#fbShare'); if(_sh)_sh.onclick=()=>{ try{ const cfg=JSON.parse(localStorage.getItem('idpc_fb_cfg')); const code=localStorage.getItem('idpc_fb_code'); if(!cfg||!code){toast('먼저 이 기기에서 연결하세요');return;} const link=location.href.split('#')[0]+'#sync='+btoa(encodeURIComponent(JSON.stringify({cfg,code}))); (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('링크 복사됨 · 아이패드 사파리에서 열면 자동 연결')).catch(()=>{prompt('아래 링크를 복사해 다른 기기에서 여세요',link);}); }catch(e){toast('복사 실패');} };
}

/* boot */
(async()=>{await load();try{const _h=(location.hash||'').match(/sync=([^&]+)/);if(_h){const _o=JSON.parse(decodeURIComponent(atob(_h[1])));if(_o&&_o.cfg&&_o.code){await SYNC.connect(_o.cfg,_o.code);history.replaceState(null,'',location.pathname+location.search);}}}catch(e){}if(!SYNC.on){const _c=localStorage.getItem('idpc_fb_cfg'),_k=localStorage.getItem('idpc_fb_code');if(_c&&_k){try{SYNC.connect(JSON.parse(_c),_k);}catch(e){}}}nav('home');})();
</script>
